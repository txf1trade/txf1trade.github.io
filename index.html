<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TXF Chip Live - 精簡平衡版</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
      background-color: #050505;
      color: #ffffff;
      margin: 0;
      padding: 10px;
    }

    /* 右上角倒數時鐘 */
    #clock {
      position: absolute;
      top: 15px;
      right: 20px;
      font-family: monospace;
      font-size: 18px;
      color: #00ff00;
      font-weight: bold;
    }

    header {
      text-align: center;
      margin-bottom: 5px;
    }

    h1 { font-size: 16px; margin: 5px 0; color: #ffffff; }
    #index-value { font-size: 26px; font-weight: 800; color: #fff; }
    #highlow-value { font-size: 15px; color: #f0f67c; margin-bottom: 10px; }

    /* 籌碼方塊排列 */
    #data-container {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 10px auto;
      width: 100%;
      max-width: 900px;
    }

    .category-box {
      flex: 1;
      max-width: 125px;
      background-color: #151515;
      border-radius: 6px;
      padding: 10px 5px;
      text-align: center;
      border: 1px solid #333;
    }

    .category-title { display: block; font-size: 14px; color: #ffffff; margin-bottom: 4px; }
    .category-value {
      display: block;
      font-size: 18px;
      font-weight: bold;
      padding: 3px 0;
      border-radius: 4px;
    }

    /* 圖表容器高度縮小 */
    #chart-container {
      width: 100%; 
      max-width: 900px;
      margin: 10px auto;
      background-color: #0e0e0e;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #222;
      box-sizing: border-box;
      height: 300px; 
      position: relative;
    }

    canvas { width: 100% !important; height: 100% !important; }

    .footer-links { text-align: center; margin-top: 20px; padding-bottom: 20px; }
    .data-source-btn { color: #555; text-decoration: none; font-size: 11px; border: 1px solid #222; padding: 4px 12px; border-radius: 20px; }
  </style>
</head>
<body>

  <div id="clock">00:00:00</div>

  <header>
    <h1>台指籌碼即時監控</h1>
    <div id="index-value">TXF --</div>
    <div id="highlow-value">-- | -- | --</div>
  </header>

  <div id="data-container">
    <div class="category-box"><span class="category-title">坦克</span><span id="tx_bvav" class="category-value">0</span></div>
    <div class="category-box"><span class="category-title">炮灰</span><span id="mtx_tbta" class="category-value">0</span></div>
    <div class="category-box"><span class="category-title">游擊</span><span id="mtx_bvav" class="category-value">0</span></div>
    <div class="category-box"><span class="category-title">力道</span><span id="mtx_p" class="category-value">0</span></div>
  </div>

  <div id="chart-container">
    <canvas id="barChart"></canvas>
  </div>

  <div class="footer-links">
    <a href="https://docs.google.com/spreadsheets/d/1QLAqKWyrpG0uRTN3lwBkQaiXNGivEvRZdM_Er-qg3ZY/edit" target="_blank" class="data-source-btn">數據源 Google Sheets</a>
  </div>

<script>
let chartInstance = null;

function movingAverage(arr, period) {
    const result = [];
    for (let i = 0; i < arr.length; i++) {
        if (i < period - 1) result.push(null);
        else {
            const sum = arr.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0);
            result.push(sum / period);
        }
    }
    return result;
}

async function fetchAndRenderChart() {
    try {
        const response = await fetch("https://opensheet.elk.sh/1QLAqKWyrpG0uRTN3lwBkQaiXNGivEvRZdM_Er-qg3ZY/Sheet1");
        const data = await response.json();

        const maxLength = 60; // 💡 維持你覺得剛剛好的柱體筆數
        const sliced = (arr) => arr.slice(-maxLength);

        const tx_bvav_raw = data.map(row => Number(row.tx_bvav));
        const mtx_bvav_raw = data.map(row => Number(row.mtx_bvav));
        const mtx_tbta_raw = data.map(row => Number(row.mtx_tbta));
        const timestamps = data.map(row => row.timestamp.includes(' ') ? row.timestamp.split(' ')[1] : row.timestamp);
        const mtx_bvav_ma23_raw = movingAverage(mtx_bvav_raw, 23);

        const labels = sliced(timestamps);
        const tx_bvav = sliced(tx_bvav_raw);
        const mtx_bvav = sliced(mtx_bvav_raw);
        const mtx_tbta = sliced(mtx_tbta_raw);
        const mtx_bvav_ma23 = sliced(mtx_bvav_ma23_raw);

        const ctx = document.getElementById("barChart").getContext("2d");

        if (chartInstance) {
            chartInstance.data.labels = labels;
            chartInstance.data.datasets[0].data = tx_bvav;
            chartInstance.data.datasets[1].data = mtx_tbta;
            chartInstance.data.datasets[2].data = mtx_bvav;
            chartInstance.data.datasets[3].data = mtx_bvav_ma23;
            chartInstance.update('none');
        } else {
            chartInstance = new Chart(ctx, {
                data: {
                    labels: labels,
                    datasets: [
                        { label: "坦", data: tx_bvav, backgroundColor: "rgba(180, 180, 180, 0.3)", type: "bar", grouped: false, order: 4 },
                        { label: "炮", data: mtx_tbta, backgroundColor: "rgba(255, 60, 60, 0.4)", type: "bar", grouped: false, order: 3 },
                        { label: "游", data: mtx_bvav, borderColor: "#00a8ff", borderWidth: 2, type: "line", pointRadius: 0, tension: 0.4, order: 2 },
                        { label: "均", data: mtx_bvav_ma23, borderColor: "#f1c40f", borderWidth: 2, type: "line", pointRadius: 0, tension: 0.4, order: 1 }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: { 
                            ticks: { color: '#ffffff', font: { size: 10 }, maxTicksLimit: 8 },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        y: {
                            position: 'right',
                            ticks: { color: '#ffffff', font: { size: 10 } },
                            grid: {
                                color: (ctx) => ctx.tick.value === 0 ? 'rgba(255, 255, 255, 0.5)' : 'rgba(255, 255, 255, 0.05)',
                                drawBorder: false
                            }
                        }
                    },
                    plugins: { 
                        legend: { 
                            display: true, 
                            position: 'top',
                            align: 'end',
                            labels: { color: '#ffffff', boxWidth: 10, font: { size: 11 } }
                        } 
                    }
                }
            });
        }
    } catch (e) { console.error("Update Failed"); }
}

async function fetchIndexValues() {
  try {
    const res = await fetch('https://histock.tw/stock/module/function.aspx?m=stocktop2017&no=FITX');
    const text = await res.text();
    const doc = new DOMParser().parseFromString(text, 'text/html');
    let idx = "", chg = "", op = "", hi = "", lo = "";
    doc.querySelectorAll('ul > li').forEach(li => {
      const t = li.querySelector('.ci_title')?.textContent;
      const v = li.querySelector('.ci_value span')?.textContent;
      if (t === '指數') idx = v;
      if (t === '漲跌') chg = v;
      if (t === '開盤') op = v;
      if (t === '最高') hi = v;
      if (t === '最低') lo = v;
    });
    const color = chg.includes('-') ? '#66a43a' : '#cc393b';
    document.getElementById('index-value').innerHTML = `${idx} <span style="font-size:16px; color:${color}">${chg}</span>`;
    document.getElementById('highlow-value').textContent = `開盤 ${op} | 最高 ${hi} | 最低 ${lo}`;
  } catch (e) {}
}

async function fetchRealtimeValues() {
  try {
    const res = await fetch('https://market-data-api.futures-ai.com/chip960_tradeinfo/');
    const data = await res.json();
    const { tx_bvav, mtx_tbta, mtx_bvav: mtx_b } = data;
    updateBox('tx_bvav', tx_bvav, false);
    updateBox('mtx_tbta', mtx_tbta, true); 
    updateBox('mtx_bvav', mtx_b, false);
    updateBox('mtx_p', tx_bvav + mtx_b, false);
  } catch (e) {}
}

function updateBox(id, val, isInverse) {
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = (val > 0 ? '+' : '') + val;
  const isUp = isInverse ? val < 0 : val > 0;
  el.style.backgroundColor = isUp ? '#cc393b' : '#66a43a';
  el.parentElement.style.backgroundColor = isUp ? '#2a1212' : '#121a12';
}

function updateClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString('zh-Hant', { hour12: false });
}

setInterval(fetchIndexValues, 3000);
setInterval(fetchRealtimeValues, 2000);
setInterval(updateClock, 1000);
setInterval(fetchAndRenderChart, 2000);
fetchAndRenderChart();
</script>
</body>
</html>
