<!DOCTYPE html>
<html lang="zh-TW">
<head>

    <!-- 引入 TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* 定義佈景主題變數 */
        :root {
            --bg-color: #d8dcde;          /* 護眼沈穩灰底 */
            --container-bg: #e6eaed;      /* 柔和淺灰面板色 */
            --text-color: #2c3e50;        /* 舒適深藍灰色字體 */
            --text-muted: #576574;        /* 次要文字色 */
            --border-color: #b0bac5;      /* 邊框色 */
            --table-th-bg: #ccd3d9;       /* 表頭底色 */
            --box-bg: #d4dadf;          /* 小框底色 */
            --chart-bg: #e6eaed;          /* 圖表區底色 */
            --chart-grid: #d0d7de;        /* 圖表網格線 */
            --chart-text: #4b6584;        /* 圖表文字色 */
            --pro-blue-bg: #2b4c7e;
            --pro-blue-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #f0f0f0;
            --text-muted: #cccccc;
            --border-color: #3a3f4b;
            --table-th-bg: #252833;
            --box-bg: #252525;
            --chart-bg: #1e1e1e;
            --chart-grid: #2a2e39;
            --chart-text: #d1d4dc;
            --pro-blue-bg: #325a96;
            --pro-blue-text: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 6px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            transition: background-color 0.3s;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        h2 {
            font-size: 17px;
            margin: 0;
        }
        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .timer-badge {
            font-size: 12px;
            font-weight: 600;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 3px 6px;
            border-radius: 12px;
        }
        .action-btn {
            background: var(--pro-blue-bg);
            color: var(--pro-blue-text);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;

            transition: opacity 0.2s;
        }
        .action-btn:hover {
            opacity: 0.85;
        }
        .theme-btn {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .section-title {
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
            color: var(--text-muted);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
            margin-bottom: 8px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
        }
        th {
            background-color: var(--table-th-bg);
            color: var(--text-color);
            font-weight: bold;
            font-size: 14px;
        }
        
        .cell-yellow { background-color: #ffe600 !important; color: #000 !important; font-weight: bold; }
        .cell-blue { background-color: var(--pro-blue-bg) !important; color: var(--pro-blue-text) !important; font-weight: bold; }
        .cell-red { background-color: #cc0000 !important; color: #fff !important; font-weight: bold; }
        .cell-white { background-color: var(--container-bg); color: var(--text-color); }
        
        input.calc-input {
            width: 90%;
            padding: 6px 4px;
            font-size: 15px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--container-bg);
            color: var(--text-color);
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }
        input.calc-input:focus {
            border-color: var(--pro-blue-bg);
            box-shadow: 0 0 4px rgba(43, 76, 126, 0.4);
        }

        .cell-blue-input-container {
            background-color: var(--pro-blue-bg) !important;
            padding: 4px !important;
        }
        input.calc-input-twn {
            width: 90%;
            padding: 6px 4px;
            font-size: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            background: var(--container-bg);
            color: var(--text-color);
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }
        input.calc-input-twn:focus {
            border-color: #ffe600;
            box-shadow: 0 0 5px rgba(255, 230, 0, 0.6);
        }

        .charts-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        @media (min-width: 768px) {
            body { padding: 15px; }
            .container { padding: 15px 20px; }
            table { font-size: 15px; }
            th, td { padding: 8px; }
            .charts-wrapper { 
                grid-template-columns: repeat(2, minmax(0, 1fr)); 
            }
            .chart-box:nth-child(3) {
                grid-column: 1 / -1;
            }
        }

        .chart-box {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            background: var(--chart-bg);
            min-width: 0;
            position: relative;
        }
        .chart-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .chart-title {
            font-weight: bold;
            font-size: 13px;
        }
        .reset-zoom-btn {
            background: var(--table-th-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .reset-zoom-btn:hover {
            opacity: 0.8;
        }
        .main-chart {
            width: 100%;
            height: 200px;
            position: relative;
        }
        .floating-tooltip {
            position: absolute;
            display: none;
            padding: 6px 10px;
            box-sizing: border-box;
            font-size: 12px;
            line-height: 1.4;
            text-align: left;
            z-index: 1000;
            pointer-events: none;
            background: rgba(20, 20, 20, 0.88);
            color: #ffffff;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }
    </style>
</head>
<body data-theme="dark">

<div class="container">
    <div class="header-row">
        <h2>富時台轉換成台指期</h2>
        <div class="header-controls">
            <div id="timer" class="timer-badge">8秒後更新</div>
            <button class="action-btn" id="refresh-btn">推新行情</button>

        </div>
    </div>

    <table>
        <tr>
            <th style="width: 32%;">最近成交時間</th>

    <div class="section-title">台指期 / 富時台 換算器</div>

    <table>
        <tr>

            <th class="cell-yellow">輸入富時台指數</th>

    <div class="charts-wrapper">

        </div>

            <div class="chart-header-bar">
                <div class="chart-title">📊 台指全 (TX-1) 15K</div>
                <button class="reset-zoom-btn" id="btn-reset-txall">回最新 K</button>
            </div>
            <div id="tooltip-txall" class="floating-tooltip"></div>
            <div id="chart-txall-main" class="main-chart"></div>
        </div>
        <div class="chart-box">
            <div class="chart-header-bar">
                <div class="chart-title">📊 台指期日 (TXAM-1) 15K</div>
                <button class="reset-zoom-btn" id="btn-reset-tx">回最新 K</button>
            </div>
            <div id="tooltip-tx" class="floating-tooltip"></div>

<script>
    let regressionModel = { a: 1, b: 0 };
    let txLastClose = 0;
    let countdown = 8;
    let timerInterval = null;
    let chartViewers = [];
    let lastFallbackTwn = 0;

    function getChartThemeOptions() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        return {
            layout: { 
                background: { color: isDark ? '#1e1e1e' : '#e6eaed' }, 
                textColor: isDark ? '#d1d4dc' : '#4b6584' 
            },
            grid: { 
                vertLines: { color: isDark ? '#2a2e39' : '#d0d7de' }, 
                horzLines: { color: isDark ? '#2a2e39' : '#d0d7de' } 
            },
            timeScale: { 
                timeVisible: true, 
                secondsVisible: false,
                rightOffset: 5,
                barSpacing: 8
            },
        };
    }

    function calculateEMA(data, period) {
        let results = [];
        let multiplier = 2 / (period + 1);
        let prevEMA = null;
        for (let i = 0; i < data.length; i++) {
            let close = data[i].close;
            if (i === 0) {
                prevEMA = close;
            } else {
                prevEMA = (close - prevEMA) * multiplier + prevEMA;
            }
            results.push({ time: data[i].time, value: prevEMA });
        }
        return results;
    }

    function calculateCrossovers(bars, fastEMAData, slowEMAData) {
        let markers = [];
        for (let i = 1; i < bars.length; i++) {
            let prevFast = fastEMAData[i - 1].value;
            let prevSlow = slowEMAData[i - 1].value;
            let currFast = fastEMAData[i].value;
            let currSlow = slowEMAData[i].value;
            let time = bars[i].time;

            if (prevFast <= prevSlow && currFast > currSlow) {
                markers.push({ time: time, position: 'belowBar', color: '#26a69a', shape: 'arrowUp', text: '金叉' });
            } else if (prevFast >= prevSlow && currFast < currSlow) {
                markers.push({ time: time, position: 'aboveBar', color: '#ef5350', shape: 'arrowDown', text: '死叉' });
            }
        }
        return markers;
    }

    function createChartInstance(mainId, tooltipId, resetBtnId, fastEMA, slowEMA, tickSize) {
        const mainContainer = document.getElementById(mainId);
        const tooltipEl = document.getElementById(tooltipId);
        const resetBtn = document.getElementById(resetBtnId);

        const baseOpts = getChartThemeOptions();

        const mainChart = LightweightCharts.createChart(mainContainer, {
            ...baseOpts,
            timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 5, barSpacing: 8 }
        });

        const decimals = tickSize < 1 ? 2 : 0;

        const candleSeries = mainChart.addCandlestickSeries({
            upColor: '#ef5350', downColor: '#26a69a', borderVisible: false,
            wickUpColor: '#ef5350', wickDownColor: '#26a69a',
            priceFormat: {
                type: 'price',
                precision: decimals,
                minMove: tickSize,
            }
        });
        const emaFastSeries = mainChart.addLineSeries({ 
            color: '#ffcc66', lineWidth: 2, priceLineVisible: false, lastValueVisible: false,
            priceFormat: { type: 'price', precision: decimals, minMove: tickSize }
        });
        const emaSlowSeries = mainChart.addLineSeries({ 
            color: '#00e1ff', lineWidth: 2, priceLineVisible: false, lastValueVisible: false,
            priceFormat: { type: 'price', precision: decimals, minMove: tickSize }
        });

        // 點擊按鈕或圖表時，立即滾動回最新 K 線
        const scrollToRealTime = () => {
            mainChart.timeScale().scrollToRealTime();
        };

        resetBtn.addEventListener('click', scrollToRealTime);
        mainContainer.addEventListener('dblclick', scrollToRealTime);

        mainChart.subscribeCrosshairMove(param => {
            if (!param.time || param.point === undefined || param.point.x < 0 || param.point.x > mainContainer.clientWidth || param.point.y < 0 || param.point.y > mainContainer.clientHeight) {
                tooltipEl.style.display = 'none';
                return;
            }
            const data = param.seriesData.get(candleSeries);
            if (data) {
                const dateObj = new Date(param.time * 1000);
                const timeStr = dateObj.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
                const o = data.open.toFixed(decimals);
                const h = data.high.toFixed(decimals);
                const l = data.low.toFixed(decimals);
                const c = data.close.toFixed(decimals);
                
                tooltipEl.style.display = 'block';
                tooltipEl.innerHTML = `時間: ${timeStr}<br>開盤: ${o}<br>最高: ${h}<br>最低: ${l}<br>收盤: ${c}`;

                let x = param.point.x + 15;
                let y = param.point.y + 15;
                if (x + 110 > mainContainer.clientWidth) {
                    x = param.point.x - 120;
                }
                if (y + 105 > mainContainer.clientHeight) {
                    y = param.point.y - 110;
                }
                tooltipEl.style.left = x + 'px';
                tooltipEl.style.top = y + 'px';
            }
        });

        const ro = new ResizeObserver(entries => {
            for (let entry of entries) {
                mainChart.applyOptions({ width: entry.contentRect.width });
            }
        });
        ro.observe(mainContainer);

        const viewer = {
            mainChart,
            setData(bars) {
                candleSeries.setData(bars);
                const fastData = calculateEMA(bars, fastEMA);
                const slowData = calculateEMA(bars, slowEMA);

                emaFastSeries.setData(fastData);
                emaSlowSeries.setData(slowData);

                const markers = calculateCrossovers(bars, fastData, slowData);
                candleSeries.setMarkers(markers);

                if (bars.length > 0) {
                    mainChart.timeScale().scrollToRealTime();
                }
            }
        };

        chartViewers.push(viewer);
        return viewer;
    }

    const twnViewer = createChartInstance('chart-twn-main', 'tooltip-twn', 'btn-reset-twn', 80, 400, 0.25);
    const txAllViewer = createChartInstance('chart-txall-main', 'tooltip-txall', 'btn-reset-txall', 76, 380, 1);
    const txViewer = createChartInstance('chart-tx-main', 'tooltip-tx', 'btn-reset-tx', 76, 380, 1);

    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('theme-btn');
        if (body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
            btn.textContent = '☀️ 模式';
        } else {
            body.setAttribute('data-theme', 'light');
            btn.textContent = '🌙 模式';
        }
        const opts = getChartThemeOptions();
        chartViewers.forEach(v => {
            v.mainChart.applyOptions(opts);
        });
    }

    const twnHistoryUrl = "https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=TWN-1&resolution=15&from=1791077149&to=1791563149&ws=true&metaData=true";
    const txAllUrl = "https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=TX-1&resolution=15&from=1788836942&to=1791563582&ws=true&metaData=true";
    const txUrl = "https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=TXAM-1&resolution=15&from=1788836942&to=1791563582&ws=true&metaData=true";
    const twnRealtimeUrl = "https://realtime-quote-signalr-v2.futures-op.com/quote?symbol=TWN-1";

    async function initDashboard() {
        document.getElementById('td-time').textContent = "更新中...";
        try {
            const [twnRes, txAllRes, txRes] = await Promise.all([
                fetch(twnHistoryUrl).then(r => r.json()),
                fetch(txAllUrl).then(r => r.json()),
                fetch(txUrl).then(r => r.json())
            ]);

            const twnBars = twnRes.bars || [];
            const txAllBars = txAllRes.bars || [];
            const txBars = txRes.bars || [];

            const normalizeTime = t => t > 1e10 ? Math.floor(t / 1000) : t;

            const formatData = bars => bars.map(i => ({
                time: normalizeTime(i.time),
                open: i.open, high: i.high, low: i.low, close: i.close
            })).sort((a,b) => a.time - b.time);

            const formattedTwnBars = formatData(twnBars);
            const formattedTxAllBars = formatData(txAllBars);
            const formattedTxBars = formatData(txBars);

            if (formattedTwnBars.length > 0) {
                lastFallbackTwn = formattedTwnBars[formattedTwnBars.length - 1].close;
            }

            twnViewer.setData(formattedTwnBars);
            txAllViewer.setData(formattedTxAllBars);
            txViewer.setData(formattedTxBars);

            if (txBars.length > 0) {
                const lastTxBar = txBars[txBars.length - 1];
                txLastClose = lastTxBar.close;
                
                const d = new Date(normalizeTime(lastTxBar.time) * 1000);
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                
                document.getElementById('td-tx-label').textContent = `${mm}/${dd} ${hh}:${min} 期收`;
                document.getElementById('td-tx-close').textContent = txLastClose;
            }

            const twnMap = new Map(formattedTwnBars.map(i => [i.time, i.close]));
            const txMap = new Map(formattedTxBars.map(i => [i.time, i.close]));

            let allPairs = [];
            txMap.forEach((txClose, time) => {
                if (twnMap.has(time)) {
                    allPairs.push({ time, twn: twnMap.get(time), tx: txClose });
                }
            });

            if (allPairs.length > 0) {
                const lastTime = allPairs[allPairs.length - 1].time;
                const lastDateObj = new Date(lastTime * 1000);
                const lastDateStr = lastDateObj.toISOString().slice(0, 10);

                let set1 = [], set2 = [], set3 = [];

                allPairs.forEach(p => {
                    let d = new Date(p.time * 1000);
                    let hour = d.getHours();
                    let min = d.getMinutes();
                    let timeVal = hour * 60 + min;
                    let isLastDay = (d.toISOString().slice(0, 10) === lastDateStr);

                    let isNightSession = (hour >= 15 || hour < 4 || (hour === 4 && min <= 45));
                    let isDaySession = (timeVal >= (8 * 60 + 45) && timeVal <= (13 * 60 + 45));

                    if (isLastDay && isNightSession) set1.push(p);
                    if (isLastDay && (isDaySession || isNightSession)) set2.push(p);
                    if (isNightSession || isDaySession) set3.push(p);
                });

                let result1 = evaluateSubset(set1, "(1) 最後夜盤");
                let result2 = evaluateSubset(set2, "(2) 最後一日日夜盤");
                let result3 = evaluateSubset(set3, "(3) 全時段綜合");

                let models = [result1, result2, result3].filter(m => m.n > 1);
                models.sort((A, B) => B.r2 - A.r2);

                if (models.length > 0) {
                    let best = models[0];
                    regressionModel = { a: best.a, b: best.b };
                }
            }

            await fetchAndApplyRealtimeQuote();
            startTimer();

        } catch (e) {
            console.error("初始化資料失敗:", e);
            document.getElementById('td-time').textContent = "讀取失敗";
        }
    }

    function evaluateSubset(pairs, name) {
        let x = pairs.map(p => p.twn);
        let y = pairs.map(p => p.tx);
        let n = x.length;
        if (n <= 1) return { name, a: 1, b: 0, r2: 0, n };

        let sumX = x.reduce((a, b) => a + b, 0);
        let sumY = y.reduce((a, b) => a + b, 0);
        let sumXY = x.reduce((acc, val, i) => acc + val * y[i], 0);
        let sumXX = x.reduce((acc, val) => acc + val * val, 0);

        let denominator = (n * sumXX - sumX * sumX);
        if (denominator === 0) return { name, a: 1, b: 0, r2: 0, n };

        let a = (n * sumXY - sumX * sumY) / denominator;
        let b = (sumY - a * sumX) / n;

        let meanY = sumY / n;
        let ssTot = y.reduce((acc, val) => acc + Math.pow(val - meanY, 2), 0);
        let ssRes = x.reduce((acc, val, i) => acc + Math.pow(y[i] - (a * val + b), 2), 0);
        let r2 = ssTot === 0 ? 0 : (1 - (ssRes / ssTot));

        return { name, a, b, r2, n };
    }

    async function fetchAndApplyRealtimeQuote() {
        let currentTwn = 0;
        try {
            const res = await fetch(twnRealtimeUrl);
            const data = await res.json();
            const quote = Array.isArray(data) ? data[0] : data;

            if (quote && quote.close) {
                currentTwn = quote.close;
                if (quote.datetime) {
                    const dateObj = new Date(quote.datetime);
                    document.getElementById('td-time').textContent = dateObj.toLocaleTimeString('zh-TW', { hour12: false });
                }
            }
        } catch (err) {
            console.warn("即時行情 API 暫時無法取得，使用歷史收盤價替代:", err);
        }

        if (currentTwn === 0 && lastFallbackTwn > 0) {
            currentTwn = lastFallbackTwn;
            document.getElementById('td-time').textContent = "休市中(歷史收盤)";
        }

        if (currentTwn > 0) {
            document.getElementById('td-twn').textContent = currentTwn.toFixed(2);

            if (regressionModel.a !== 0) {
                let estimatedY = regressionModel.a * currentTwn + regressionModel.b;
                document.getElementById('td-est').textContent = estimatedY.toFixed(0);

                if (txLastClose > 0) {
                    let diff = Math.round(estimatedY - txLastClose);
                    let diffEl = document.getElementById('td-diff');
                    diffEl.textContent = (diff >= 0 ? "+" : "") + diff;
                }
            }
        }
    }

    document.getElementById('input-twn').addEventListener('input', (e) => {
        let valStr = e.target.value.trim();
        if (valStr === '' || isNaN(parseFloat(valStr))) {
            document.getElementById('output-tx').textContent = '-';
            return;
        }
        let val = parseFloat(valStr);
        if (regressionModel.a !== 0) {
            let txVal = regressionModel.a * val + regressionModel.b;
            document.getElementById('output-tx').textContent = txVal.toFixed(0);
        }
    });

    document.getElementById('input-tx').addEventListener('input', (e) => {
        let valStr = e.target.value.trim();
        if (valStr === '' || isNaN(parseFloat(valStr))) {
            document.getElementById('output-twn').textContent = '-';
            return;
        }
        let val = parseFloat(valStr);
        if (regressionModel.a !== 0) {
            let twnVal = (val - regressionModel.b) / regressionModel.a;
            document.getElementById('output-twn').textContent = twnVal.toFixed(2);
        }
    });

    function startTimer() {
        countdown = 8;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            countdown--;
            if (countdown < 0) {
                fetchAndApplyRealtimeQuote();
                countdown = 8;
            }
            document.getElementById('timer').textContent = `${countdown}秒後更新`;
        }, 1000);
    }

    document.getElementById('refresh-btn').addEventListener('click', () => {
        initDashboard();
    });

    document.getElementById('theme-btn').addEventListener('click', toggleTheme);

    initDashboard();
</script>
