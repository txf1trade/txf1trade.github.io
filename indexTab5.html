<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>股期監控-緊湊終極版</title>
    <style>
        :root {
            --bg-black: #121212;
            --text-main: #e0e0e0;
            --text-dim: #f3e859; 
            --up-red: #ff3b30;
            --down-green: #34c759;
            --accent: #64ffda;
            --strong-blue: #00e5ff;
            --ai-gold: #ffcc00;
            --aistock-gold: #ff0098;
            --surface: #1e1e1e;
            --fav-star: #ffcc00;
        }

        html, body {
            background-color: var(--bg-black);
            margin: 0; padding: 0;
            height: 100%;
            overflow: hidden;
            color: var(--text-main);
            font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
        }

        .app-wrapper { 
            width: 100%; max-width: 550px; 
            height: 100vh;
            margin: 0 auto;
            display: flex; flex-direction: column;
            background: var(--bg-black);
        }

        /* 頂部固定區 */
        .sticky-top {
            flex-shrink: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px); z-index: 1000; padding: 2px;
            border-bottom: 1px solid #333;
        }

        .mode-header { display: flex; gap: 2px; margin-bottom: 2px; }
        .mode-btn {
            flex: 1; padding: 8px 1px; text-align: center; font-size: 10px;
            font-weight: bold; border-radius: 4px; border: 1px solid #333;
            cursor: pointer; background: #111; color: var(--text-dim);
            white-space: nowrap;
        }
        .mode-btn.active[data-mode="all"] { border-color: var(--accent); color: var(--accent); background: rgba(100, 255, 218, 0.1); }
        .mode-btn.active[data-mode="up"] { border-color: var(--up-red); color: var(--up-red); background: rgba(255, 59, 48, 0.1); }
        .mode-btn.active[data-mode="down"] { border-color: var(--down-green); color: var(--down-green); background: rgba(52, 199, 89, 0.1); }
        .mode-btn.active[data-mode="strong_buy"] { border-color: var(--strong-blue); color: var(--strong-blue); background: rgba(0, 229, 255, 0.1); }
        .mode-btn.active[data-mode="ai_long"] { border-color: var(--ai-gold); color: var(--ai-gold); background: rgba(255, 204, 0, 0.1); }
        .mode-btn.active[data-mode="fav"] { border-color: var(--fav-star); color: var(--fav-star); background: rgba(255, 204, 0, 0.1); }

        .search-row { padding: 2px; position: relative; display: flex; align-items: center; }
        #search-input {
            width: 100%; background: #222; border: 1px solid #444; border-radius: 4px;
            padding: 6px; padding-right: 30px; color: #fff; font-size: 14px; 
            box-sizing: border-box; outline: none;
        }
        #clear-search {
            position: absolute; right: 10px; color: #888; cursor: pointer; 
            display: none; font-size: 18px;
        }

        .controls-row { display: flex; align-items: center; gap: 2px; background: var(--surface); padding: 4px; border-radius: 4px; position: relative; overflow: hidden; }
        .filter-toggle { display: flex; align-items: center; gap: 1px; font-size: 10px; color: var(--accent); white-space: nowrap; cursor: pointer; }
        .slider-box { flex: 1; display: flex; align-items: center; gap: 4px; margin: 0 4px; }
        input[type=range] { width: 100%; height: 3px; accent-color: var(--accent); }
        #rank-val { color: #fff; min-width: 35px; font-size: 10px; font-weight: bold; }
        #timer-display { font-family: monospace; color: var(--accent); font-size: 9px; margin-left: auto; }
        #refresh-bar { position: absolute; bottom: 0; left: 0; height: 1.5px; background: var(--accent); width: 0%; }

        /* 熱力圖 */
        .heatmap-container { flex-shrink: 0; margin: 4px 0; padding: 0 2px; }
        .heatmap-header {
            font-size: 12px; color: var(--ai-gold); background: #252525;
            padding: 6px 10px; border-radius: 6px; display: flex;
            justify-content: space-between; align-items: center;
            cursor: pointer; border: 1px solid #333;
        }
        .heatmap-grid {
            display: none; grid-template-columns: repeat(5, 1fr);
            gap: 2px; margin-top: 4px; padding: 2px;
        }
        .heatmap-container.open .heatmap-grid { display: grid; }
        .hm-box {
            height: 34px; border-radius: 3px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .hm-name { font-size: 9px; color: #fff; font-weight: bold; }
        .hm-score { font-size: 9px; color: #fff; opacity: 0.9; }

        /* 滑動區域 */
        .main-scroll-area {
            flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch;
        }
        .main-scroll-area::-webkit-scrollbar { width: 0px; height: 0px; }

        .table-wrapper { width: 100%; overflow-x: auto; position: relative; }
        .table-wrapper::-webkit-scrollbar { width: 0px; height: 0px; }

        table { 
            width: 100%; 
            min-width: 480px; /* 緊湊顯示，減少最小寬度 */
            border-collapse: separate; 
            border-spacing: 0;
            table-layout: fixed; 
        }

        /* 欄位寬度極致優化 */
        th:nth-child(1), td:nth-child(1) { width: 105px; } /* 名稱 */
        th:nth-child(2), td:nth-child(2) { width: 68px; }  /* 現貨 */
        th:nth-child(3), td:nth-child(3) { width: 68px; }  /* 股期 */
        th:nth-child(4), td:nth-child(4) { width: 42px; }  /* 近月 */
        th:nth-child(5), td:nth-child(5) { width: 42px; }  /* 遠月 */
        th:nth-child(6), td:nth-child(6) { width: 62px; }  /* 總分 */
        th:nth-child(7), td:nth-child(7) { width: 45px; }  /* 強弱 */

        thead th { 
            position: sticky; top: 0; background: #1a1a1a; 
            color: var(--text-dim); font-size: 10px; padding: 8px 1px; 
            border-bottom: 1px solid #333; z-index: 200;
        }

        .sticky-col {
            position: sticky; left: 0; background: var(--bg-black) !important;
            z-index: 150; border-right: 1px solid #222;
        }

        td { padding: 6px 1px; border-bottom: 1px solid #1a1a1a; text-align: right; vertical-align: middle; }
        
        /* 價格與幅度字體一致 */
        .price-val, .fut-price-val { font-weight: bold; font-family: monospace; font-size: 11px; line-height: 1.1; }
        .chg-val, .fut-chg-val { font-size: 10px; font-family: monospace; font-weight: bold; line-height: 1.1; }

        .name-col { text-align: left; }
        .name-stack { display: flex; flex-direction: column; line-height: 1.1; padding-left: 2px; }
        .name-top { display: flex; align-items: center; gap: 2px; margin-bottom: 1px; }
        .fav-star-btn { cursor: pointer; font-size: 14px; color: #444; user-select: none; margin-right: 2px; }
        .fav-star-btn.active { color: var(--fav-star); }

        .stock-num { font-size: 10px; color: var(--text-dim); font-family: monospace; }
        .stock-name { font-weight: 500; font-size: 13px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .stock-id-tag { font-size: 8px; color: var(--accent); background: #222; padding: 0 1px; border-radius: 2px; }
        
        .mkt-tag { font-size: 7px; padding: 0 1px; border-radius: 2px; font-weight: bold; }
        .tag-tse { color: #fff; border: 1px solid #555; }
        .tag-otc { color: #ff7fe5; border: 1px solid #ff7fe5; }

        .score-val { font-weight: 700; font-family: monospace; font-size: 11px; }
        .score-bar-bg { width: 100%; height: 2px; background: #222; margin-top: 1px; }
        .rank-strength-container { width: 35px; height: 6px; background: #000; border-radius: 3px; overflow: hidden; border: 1px solid #333; margin-left: auto; }
        .rank-strength-fill { height: 100%; }

        .section-divider { background: #333; color: #aaa; font-size: 10px; padding: 4px 6px; text-align: left; }

        #ai-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 3000; justify-content: center; align-items: center;
        }
        .modal-content { background: var(--surface); width: 80%; max-width: 320px; padding: 15px; border-radius: 12px; border: 1px solid var(--ai-gold); }
    </style>
</head>
<body>

<div id="ai-modal" onclick="closeAI()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 id="ai-title" style="color:var(--ai-gold); margin: 0 0 15px 0; text-align: center; font-size: 16px;">🤖 標題檢索</h3>
        <div style="display: flex; gap: 8px;">
            <a id="link-news" href="#" target="_blank" style="flex:1; padding:10px; text-align:center; border-radius:6px; background:#4285f4; color:#fff; text-decoration:none; font-size:13px; font-weight:bold;">題材新聞</a>
            <a id="link-wantgoo" href="#" target="_blank" style="flex:1; padding:10px; text-align:center; border-radius:6px; background:#d32f2f; color:#fff; text-decoration:none; font-size:13px; font-weight:bold;">主力籌碼</a>
        </div>
    </div>
</div>

<div class="app-wrapper">
    <div class="sticky-top">
        <div class="mode-header" id="mode-selector">
            <div class="mode-btn" data-mode="all">全部</div>
            <div class="mode-btn" data-mode="up">多頭</div>
            <div class="mode-btn" data-mode="down">空頭</div>
            <div class="mode-btn" data-mode="strong_buy">🔥強勢</div>
            <div class="mode-btn active" data-mode="ai_long">💎AI潛力</div>
            <div class="mode-btn" data-mode="fav">★自選股</div>
        </div>
        
        <div class="search-row">
            <input type="text" id="search-input" placeholder="🔍 搜尋代碼、名稱、股期...">
            <span id="clear-search">&times;</span>
        </div>

        <div class="controls-row">
            <label class="filter-toggle"><input type="checkbox" id="show-tse" checked> 市</label>
            <label class="filter-toggle"><input type="checkbox" id="show-otc" checked> 櫃</label>
            <label class="filter-toggle"><input type="checkbox" id="mini-only"> 小</label>
            <label class="filter-toggle"><input type="checkbox" id="show-etf"> ETF</label>
            <label class="filter-toggle" style="border-right: 1px solid #444; padding-right: 4px;"><input type="checkbox" id="sort-by-id"> 排</label>
            <div class="slider-box">
                <span id="rank-val">10 名</span>
                <input type="range" id="rank-slider" min="10" max="240" step="10" value="10">
            </div>
            <span id="timer-display">5.0s</span>
            <div id="refresh-bar"></div>
        </div>
    </div>

    <div class="main-scroll-area">
        <div class="heatmap-container" id="hm-container">
            <div class="heatmap-header" id="hm-header">
                <span>🔥 熱力圖 <small id="hm-count" style="color: var(--text-dim);"></small></span>
                <span>▼</span>
            </div>
            <div id="heatmap-grid" class="heatmap-grid"></div>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="sticky-col">名稱</th>
                        <th id="th-chg">現貨/幅</th>
                        <th id="th-fut">股期/幅</th> 
                        <th>近</th> <th>遠</th> 
                        <th id="th-total">總分 ▼</th>
                        <th>強弱</th>
                    </tr>
                </thead>
                <tbody id="main-table"></tbody>
            </table>
        </div>
    </div>
</div>

    let cachedData = [];
    let favList = JSON.parse(localStorage.getItem('my_stkfut_favs') || '[]');
    let currentRankLimit = 10; 
    let currentMode = 'ai_long'; 
    let sortOrder = 'desc'; 
    let sortKey = 'total';
    let isFetching = false;
    let refreshTimer = 0;
    const REFRESH_INTERVAL = 5000;

    const dom = {
        table: document.getElementById('main-table'),
        hmGrid: document.getElementById('heatmap-grid'),
        hmCount: document.getElementById('hm-count'),
        hmContainer: document.getElementById('hm-container'),
        rankVal: document.getElementById('rank-val'),
        timer: document.getElementById('timer-display'),
        refreshBar: document.getElementById('refresh-bar'),
        searchInput: document.getElementById('search-input'),

        thTotal: document.getElementById('th-total'),
        thChg: document.getElementById('th-chg'),
        thFut: document.getElementById('th-fut')
    };

    async function fetchData() {
        if (isFetching) return;
        isFetching = true;
        try {
            const response = await fetch('https://market-data-api.futures-ai.com/stkfut_tradeinfo/');
            const scoreData = await response.json();
            
            if (scoreData) {
                let baseList = Object.keys(scoreData).filter(k => stockMap[k]).map(k => {
                    const [stockNum, name, market] = stockMap[k];
                    const near = scoreData[k].near_month;
                    const far = scoreData[k].next_month;
                    const total = near + far;
                    const old = cachedData.find(o => o.id === k);
                    return { 
                        id: k, stockNum, name, market, near, far, total,
                        isLong: total >= 15 && near >= 5 && far >= 0,
                        price: old ? old.price : '--', 
                        chg: old ? old.chg : '--',
                        futPrice: old ? old.futPrice : '--',
                        futChg: old ? old.futChg : '--'
                    };
                });
                cachedData = baseList;
                render(); 
                refreshTimer = 0;
                let priceTargets = baseList.sort((a,b) => b.total - a.total).slice(0, 300);
                await Promise.all(priceTargets.map(async (item) => {
                    try {
                        const hRes = await fetch(`https://tvapi.futures-op.com/v2/history?agent=futuresai&product=web&symbol=${item.stockNum}&resolution=1m`);
                        const hData = await hRes.json();
                        const fRes = await fetch(`https://tvapi.futures-op.com/v2/history?agent=futuresai&product=web&symbol=${item.id}-1&resolution=1m`);
                        const fData = await fRes.json();
                        if(hData.s === "ok" && hData.c.length > 0) {
                            const last = hData.c[hData.c.length - 1];
                            const open = hData.o[0];
                            item.price = last;
                            item.chg = ((last - open) / open * 100).toFixed(2) + '%';
                        }
                        if(fData.s === "ok" && fData.c.length > 0) {
                            const fLast = fData.c[fData.c.length - 1];
                            const fOpen = fData.o[0];
                            item.futPrice = fLast;
                            item.futChg = ((fLast - fOpen) / fOpen * 100).toFixed(2) + '%';
                        }
                        updateRowPrice(item);
                    } catch(e) {}
                }));
            }
        } catch (e) { console.error(e); } finally { isFetching = false; }
    }

    function updateRowPrice(item) {
        const row = dom.table.querySelector(`tr[data-id="${item.id}"]`);
        if (row) {
            const priceEl = row.querySelector('.price-val');
            const chgEl = row.querySelector('.chg-val');
            const fPriceEl = row.querySelector('.fut-price-val');
            const fChgEl = row.querySelector('.fut-chg-val');
            const val = parseFloat(item.chg);
            const fVal = parseFloat(item.futChg);
            if (priceEl) priceEl.innerText = item.price;
            if (chgEl) {
                chgEl.innerText = item.chg;
                const bgAlpha = Math.min(Math.abs(val) / 8, 0.85);
                chgEl.closest('td').style.background = val > 0 ? `rgba(255,59,48,${bgAlpha})` : (val < 0 ? `rgba(52,199,89,${bgAlpha})` : 'transparent');
                chgEl.style.color = isNaN(val) ? '#888' : (Math.abs(val) > 0.5 ? '#fff' : (val > 0 ? 'var(--up-red)' : 'var(--down-green)'));
            }
            if (fPriceEl) fPriceEl.innerText = item.futPrice;
            if (fChgEl) {
                fChgEl.innerText = item.futChg;
                const fBgAlpha = Math.min(Math.abs(fVal) / 8, 0.85);
                fChgEl.closest('td').style.background = fVal > 0 ? `rgba(255,59,48,${fBgAlpha})` : (fVal < 0 ? `rgba(52,199,89,${fBgAlpha})` : 'transparent');
                fChgEl.style.color = isNaN(fVal) ? '#888' : (Math.abs(fVal) > 0.5 ? '#fff' : (fVal > 0 ? 'var(--up-red)' : 'var(--down-green)'));
            }
        }
    }

    function render() {
        const searchQuery = dom.searchInput.value.toLowerCase().trim();
        const isMiniOnly = document.getElementById('mini-only').checked;
        const isShowEtf = document.getElementById('show-etf').checked;
        const isShowTse = document.getElementById('show-tse').checked;
        const isShowOtc = document.getElementById('show-otc').checked;
        const isSortById = document.getElementById('sort-by-id').checked;

        dom.clearSearch.style.display = searchQuery ? 'block' : 'none';

        let list = cachedData.filter(i => {
            if (i.market === '市' && !isShowTse) return false;
            if (i.market === '櫃' && !isShowOtc) return false;
            if (!isShowEtf && i.stockNum.startsWith('00')) return false;
            if (isMiniOnly && !i.name.includes('小型')) return false;
            if (searchQuery) return i.stockNum.includes(searchQuery) || i.name.includes(searchQuery) || i.id.toLowerCase().includes(searchQuery);
            return true;
        });

        const effectiveSortOrder = (currentMode === 'down' && sortKey === 'total') ? 'asc' : sortOrder;
        const sortFn = (a, b) => {
            if (isSortById) return a.stockNum.localeCompare(b.stockNum);
            if (sortKey === 'chg') return (parseFloat(b.chg)||0) - (parseFloat(a.chg)||0);
            if (sortKey === 'fut') return (parseFloat(b.futChg)||0) - (parseFloat(a.futChg)||0);
            return effectiveSortOrder === 'desc' ? b.total - a.total : a.total - b.total;
        };

        if (!searchQuery) {
            if (currentMode === 'ai_long') list = list.filter(i => i.isLong);
            else if (currentMode === 'strong_buy') list = list.filter(i => i.total >= 10);
            else if (currentMode === 'up') list = list.filter(i => i.total > 0);
            else if (currentMode === 'down') list = list.filter(i => i.total < 0);
            else if (currentMode === 'fav') list = list.filter(i => favList.includes(i.id));
        }
        
        list.sort(sortFn);
        const finalDisplayList = searchQuery ? list : list.slice(0, currentRankLimit);

        renderHeatmap(list);
        renderTable(finalDisplayList);
        dom.thTotal.innerText = `分 ${effectiveSortOrder === 'desc' ? '▼' : '▲'}`;
    }

    function renderHeatmap(baseList) {
        let hmShowList = baseList.sort((a,b)=>Math.abs(b.total)-Math.abs(a.total)).slice(0, 20);
        dom.hmCount.innerText = `(${hmShowList.length})`;
        dom.hmGrid.innerHTML = hmShowList.map(item => {
            const intensity = Math.min(Math.abs(item.total) / 35, 1);
            const color = item.total >= 0 ? `255, 59, 48` : `52, 199, 89`;
            return `<div class="hm-box" style="background: rgba(${color}, ${0.2 + intensity * 0.8}); border: ${item.isLong ? '1.5px solid var(--ai-gold)' : 'none'}" onclick="showAI('${item.stockNum}', '${item.name}')">
                <div class="hm-name">${item.name.replace('期','').replace('小型','小')}</div>
                <div class="hm-score">${Math.round(item.total)}</div>
            </div>`;
        }).join('');
    }

    function renderTable(list) {
        const currentMax = cachedData.length > 0 ? Math.max(...cachedData.map(i => Math.abs(i.total))) : 1;
        dom.table.innerHTML = list.map(item => {
            if (item.isDivider) return `<tr><td colspan="7" class="section-divider">${item.text}</td></tr>`;
            const isFaved = favList.includes(item.id);
            const themeColor = item.total >= 0 ? 'var(--up-red)' : 'var(--down-green)';
            const cVal = parseFloat(item.chg);
            const fVal = parseFloat(item.futChg);
            return `<tr data-id="${item.id}">
                <td class="sticky-col name-col">
                    <div style="display:flex; align-items:center;">
                        <span class="fav-star-btn ${isFaved?'active':''}" onclick="toggleFav('${item.id}', event)">${isFaved?'★':'☆'}</span>
                        <div class="name-stack">
                            <div class="name-top">
                                <span class="stock-num">${item.stockNum}</span>
                                <span class="stock-id-tag">${item.id}</span>
                            </div>
                            <span class="stock-name" style="color:${item.isLong ? 'var(--aistock-gold)' : '#fff'};" onclick="showAI('${item.stockNum}', '${item.name}')">${item.name}</span>
                        </div>
                    </div>
                </td>
                <td style="background:${cVal>0?`rgba(255,59,48,${Math.min(Math.abs(cVal)/8,0.85)})`:cVal<0?`rgba(52,199,89,${Math.min(Math.abs(cVal)/8,0.85)})`:'transparent'}">
                    <div class="price-val">${item.price}</div>
                    <div class="chg-val" style="color:${Math.abs(cVal)>0.5?'#fff':cVal>0?'var(--up-red)':cVal<0?'var(--down-green)':'#888'}">${item.chg}</div>
                </td>
                <td style="background:${fVal>0?`rgba(255,59,48,${Math.min(Math.abs(fVal)/8,0.85)})`:fVal<0?`rgba(52,199,89,${Math.min(Math.abs(fVal)/8,0.85)})`:'transparent'}">
                    <div class="fut-price-val">${item.futPrice}</div>
                    <div class="fut-chg-val" style="color:${Math.abs(fVal)>0.5?'#fff':fVal>0?'var(--up-red)':fVal<0?'var(--down-green)':'#888'}">${item.futChg}</div>
                </td>
                <td><span class="score-val" style="color:${item.near>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(item.near)}</span></td> 
                <td><span class="score-val" style="color:${item.far>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(item.far)}</span></td> 
                <td>
                    <span class="score-val" style="color:${themeColor}">${Math.round(item.total)}</span>
                    <div class="score-bar-bg"><div style="height:100%; width:${Math.min((Math.abs(item.total)/30)*100, 100)}%; background:${themeColor}"></div></div>
                </td>
                <td><div class="rank-strength-container"><div class="rank-strength-fill" style="width:${(Math.abs(item.total)/currentMax)*100}%; background:${themeColor};"></div></div></td>
            </tr>`;
        }).join('');
    }

    function setMode(mode) { 
        currentMode = mode; sortKey = 'total'; sortOrder = (mode === 'down') ? 'asc' : 'desc';
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
        render(); 
    }

    function toggleFav(id, e) {
        e.stopPropagation();
        const idx = favList.indexOf(id);
        idx > -1 ? favList.splice(idx, 1) : favList.push(id);
        localStorage.setItem('my_stkfut_favs', JSON.stringify(favList));
        render();
    }

    function showAI(num, name) {
        const pure = name.replace('期','').replace('小型','').trim();
        document.getElementById('ai-title').innerText = `🤖 ${pure}`;
        document.getElementById('link-news').href = `https://www.google.com/search?q=${num}+${pure}+題材+新聞`;
        document.getElementById('link-wantgoo').href = `https://www.wantgoo.com/stock/${num}`;
        document.getElementById('ai-modal').style.display = 'flex';
    }
    function closeAI() { document.getElementById('ai-modal').style.display = 'none'; }

    document.getElementById('mode-selector').onclick = e => { if (e.target.dataset.mode) setMode(e.target.dataset.mode); };
    dom.searchInput.oninput = render;
    dom.clearSearch.onclick = () => { dom.searchInput.value = ''; render(); };
    document.getElementById('hm-header').onclick = () => dom.hmContainer.classList.toggle('open');
    document.getElementById('rank-slider').oninput = function() {
        currentRankLimit = parseInt(this.value);
        dom.rankVal.innerText = this.value + ' 名';
        render();
    };

    dom.thTotal.onclick = () => { sortKey = 'total'; sortOrder = (sortOrder === 'desc') ? 'asc' : 'desc'; render(); };
    dom.thChg.onclick = () => { sortKey = 'chg'; render(); };
    dom.thFut.onclick = () => { sortKey = 'fut'; render(); };
    document.querySelectorAll('input[type=checkbox]').forEach(el => el.onchange = render);

    setInterval(() => { 
        refreshTimer += 100; 
        dom.timer.innerText = ((REFRESH_INTERVAL - refreshTimer)/1000).toFixed(1) + 's'; 
        dom.refreshBar.style.width = (refreshTimer/REFRESH_INTERVAL)*100 + '%'; 
        if (refreshTimer >= REFRESH_INTERVAL) fetchData(); 
    }, 100);

    fetchData();
</script>
</body>
</html>
