<!DOCTYPE html>
<html lang="zh-TW">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI期權戰情室-散戶動能版</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --blue: #58a6ff;
            --red: #ff7b72; --green: #7ee787; --border: #30363d;
            --risk-bg: #490e0e; --header: #21262d; --gold: #f1e05a;
        }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: #c9d1d9; margin: 0; padding: 4px; line-height: 1.1; }
        .container { max-width: 550px; margin: auto; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 5px; font-size: 11px; background: var(--card); border-radius: 4px; overflow: hidden; }
        th { background: var(--header); color: #8b949e; padding: 5px 2px; border: 1px solid var(--border); font-size: 10px; }
        td { padding: 6px 2px; border: 1px solid var(--border); text-align: center; }
        
        .section-title { font-size: 13px; font-weight: bold; margin: 8px 0 4px 2px; color: var(--blue); border-left: 3px solid var(--blue); padding-left: 6px; display: flex; align-items: center; }
        .num-cell { font-family: "Consolas", monospace; font-weight: bold; }
        .pos { color: var(--red); } .neg { color: var(--green); }
        
        /* 散戶行視覺強化 */
        .retail-row { background: rgba(241, 224, 90, 0.08) !important; }
        .retail-text { color: var(--gold); font-weight: bold; }
        .retail-highlight { 
            border: 1.5px solid var(--gold) !important; 
            background: rgba(241, 224, 90, 0.15);
            font-size: 13px; 
            color: var(--gold) !important;
        }

        .risk-active { background-color: var(--risk-bg) !important; }
        .risk-text { color: var(--gold); font-weight: 900; }
        .normal-text { color: #8b949e; font-size: 10px; }
        .group-label { background: #010409 !important; font-size: 10px; text-align: left !important; padding-left: 8px !important; color: #8b949e; height: 18px; }

        .ai-box { background: linear-gradient(145deg, #1c2128, #161b22); border: 1px solid var(--blue); border-radius: 8px; padding: 10px; margin-top: 5px; }
        .trend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
        .trend-val { font-size: 20px; font-weight: 900; }
        
        .battle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 6px; }
        .battle-card { background: #0d1117; padding: 6px; border-radius: 4px; border-top: 2px solid var(--border); }
        .card-title { font-size: 10px; color: #8b949e; margin-bottom: 3px; }
        .card-val { font-size: 11px; font-weight: bold; line-height: 1.4; }
        
        .strategy-box { background: rgba(88, 166, 255, 0.05); padding: 8px; border-radius: 4px; border: 1px dashed var(--blue); font-size: 11px; line-height: 1.6; color: #ffffff; }

        .settlement-warning { 
            color: var(--gold); border: 1px solid var(--gold); padding: 0px 5px; border-radius: 3px; font-size: 10px; 
            margin-left: auto; animation: breathe 2s ease-in-out infinite;
        }
        @keyframes breathe { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

<div class="container">
    <div class="section-title">📊 台指期沖銷動能 (大台+小台)</div>
    <div id="tx-table-container">讀取中...</div>

    <div class="section-title">
        📜 選擇權法人佈局
        <span id="settlement-ui"></span>
    </div>
    <div id="opt-data-table">讀取中...</div>

    <div class="ai-box">
        <div class="trend-header">
            <span style="font-size: 11px; color: #8b949e; font-weight: bold;">AI 籌碼戰略評估</span>
            <span id="trend-indicator" class="trend-val">--</span>
        </div>

        <div class="battle-grid">
            <div class="battle-card" style="border-color: #bc8cff;">
                <div class="card-title">自營商 (莊家佈局)</div>
                <div id="d-action" class="card-val">分析中...</div>
            </div>
            <div class="battle-card" style="border-color: var(--blue);">
                <div class="card-title">外資 (主幹動向)</div>
                <div id="f-action" class="card-val">分析中...</div>
            </div>
        </div>

        <div class="strategy-box">
            <div id="strategy-desc">正在計算數據與散戶偏向...</div>
        </div>
    </div>
</div>

<script>
    const apiUrl = 'https://script.google.com/macros/s/AKfycbzTozA6iH5iLBS_4EM3vQxpjzb1pWBEQcahpvLwmQ98N-RmY5jhAF0iI8bc3H8RB9Wu/exec';

    // 結算日提醒
    const today = new Date();
    const dayOfWeek = today.getDay(); 
    const isSettlement = (dayOfWeek >= 1 && dayOfWeek <= 3); 
    if(isSettlement) {
        const days = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
        document.getElementById('settlement-ui').innerHTML = `<span class="settlement-warning">⚡ ${days[dayOfWeek]}結算期</span>`;
    }

    async function fetchAllData() {
        try {
            const [txRes, optRes] = await Promise.all([
                fetch(`${apiUrl}?type=tx`),
                fetch(apiUrl)
            ]);
            const txData = await txRes.json();
            const optData = await optRes.json();

            // 抓取分析用關鍵數值
            let fTX = 0;
            let retailMTX = 0;
            
            txData.forEach(r => {
                if(r[0] === '外資') fTX = parseFloat(String(r[1]).replace(/,/g,'')) || 0;
                if(r[0].includes('散戶')) retailMTX = parseFloat(String(r[3]).replace(/,/g,'')) || 0;
            });

            renderTX(txData);
            renderOption(optData, fTX, retailMTX);
        } catch (e) {
            document.getElementById('strategy-desc').innerText = "連線失敗，請檢查 API 網址是否正確。";
        }
    }

    function renderTX(data) {
        let html = `<table><thead><tr>
            <th style="width:18%">身份</th>
            <th style="width:27%">大台淨額</th>
            <th style="width:28%">成本關鍵價</th>
            <th style="width:27%">小台淨額</th>
        </tr></thead><tbody>`;

        data.slice(1).forEach(r => {
            const name = r[0];
            const txVal = parseFloat(String(r[1]).replace(/,/g,'')) || 0;
            const cost = Math.round(parseFloat(String(r[2]).replace(/,/g,''))) || 0;
            const mtxVal = parseFloat(String(r[3]).replace(/,/g,'')) || 0;
            const isRetail = name.includes('散戶');

            html += `<tr class="${isRetail ? 'retail-row' : ''}">
                <td class="${isRetail ? 'retail-text' : ''}">${name}</td>
                <td class="num-cell ${txVal >= 0 ? 'pos' : 'neg'}">${isRetail ? '--' : txVal.toLocaleString()}</td>
                <td class="num-cell">${(isRetail || cost === 0) ? '--' : cost.toLocaleString()}</td>
                <td class="num-cell ${mtxVal >= 0 ? 'pos' : 'neg'} ${isRetail ? 'retail-highlight' : ''}">
                    ${mtxVal.toLocaleString()}
                </td>
            </tr>`;
        });
        document.getElementById('tx-table-container').innerHTML = html + "</tbody></table>";
    }

    function renderOption(data, fTX, retailMTX) {
        let s = { dc: 0, dp: 0, fc: 0, fp: 0 };
        let rows = { "自營商": "", "外資": "" };
        let lastT = "";

        data.slice(1).forEach(r => {
            let [t, id, diff, oi] = r;
            if (t && t.trim() !== "") lastT = t; else t = lastT;
            const oiV = parseFloat(String(oi).replace(/,/g, '')) || 0;
            const diffV = parseFloat(String(diff).replace(/,/g, '')) || 0;
            const isC = t.includes('買');
            const isRisk = oiV < 0; 
            const actLabel = isC ? (isRisk ? "SC" : "BC") : (isRisk ? "SP" : "BP");

            const row = `<tr class="${isRisk ? 'risk-active' : ''}">
                <td style="color:${isC ? 'var(--red)' : 'var(--green)'}">${t.replace('臺指選擇權','')}</td>
                <td class="num-cell ${diffV >= 0 ? 'pos' : 'neg'}">${diff}</td>
                <td class="num-cell ${oiV >= 0 ? 'pos' : 'neg'}">${oi}</td>
                <td style="font-size:10px">
                    <span class="${isRisk ? 'risk-text' : 'normal-text'}">${isRisk ? '⚠️ 曝險' : '正常'}</span>
                    <span style="color:#8b949e">(${actLabel})</span>
                </td>
            </tr>`;

            if(rows[id] !== undefined) {
                rows[id] += row;
                if(id === "自營商") { if(isC) s.dc=oiV; else s.dp=oiV; }
                else { if(isC) s.fc=oiV; else s.fp=oiV; }
            }
        });

        document.getElementById('opt-data-table').innerHTML = `<table>
            <thead><tr><th>權別</th><th>差額</th><th>未平倉OI</th><th>狀態</th></tr></thead>
            <tbody>
                <tr><td colspan="4" class="group-label">🟣 自營商</td></tr>${rows["自營商"]}
                <tr><td colspan="4" class="group-label">🔵 外資</td></tr>${rows["外資"]}
            </tbody></table>`;
        
        enhancedAnalyze(s, fTX, retailMTX);
    }

    function enhancedAnalyze(s, fTX, retailMTX) {
        let score = 0;
        let dMsg = [], fMsg = [];
        
        // 外資大台判斷
        if (fTX > 2000) { score += 2; fMsg.push("大台多單進攻"); }
        else if (fTX < -2000) { score -= 2; fMsg.push("大台空單壓制"); }

        // 散戶小台 (最重要的反向指標)
        if (retailMTX > 3000) { 
            score -= 2; 
            fMsg.push("⚠️ 散戶多單過熱 (接刀)"); 
        } else if (retailMTX < -3000) { 
            score += 2; 
            fMsg.push("🔥 散戶空單過多 (軋空預備)"); 
        }

        // 自營賣方
        if (s.dp < 0) { score += 1; dMsg.push("SP 築底支撐"); }
        if (s.dc < 0) { score -= 1; dMsg.push("SC 封頂壓力"); }

        let trend = "", strat = "", color = "";
        if (score >= 4) { trend = "🚀 強勢看多"; color = "var(--red)"; strat = "外資多單且散戶看空，盤勢極佳。"; }
        else if (score >= 1) { trend = "↗️ 偏多整理"; color = "var(--red)"; strat = "籌碼微幅領先，回測不破關鍵價可試多。"; }
        else if (score <= -4) { trend = "📉 強勢看空"; color = "var(--green)"; strat = "外資壓盤且散戶接多，極度危險。"; }
        else if (score <= -1) { trend = "↘️ 偏空整理"; color = "var(--green)"; strat = "反彈無力，散戶多單未退。"; }
        else { trend = "↔️ 中性觀望"; color = "var(--blue)"; strat = "多空陷入拉鋸，靜待結算前表態。"; }

        let detail = "";
        if (retailMTX > 4000 && fTX < -3000) {
            detail = "🚨 <b>警報：</b>外資正在殺盤，但散戶在小台瘋狂接多，這是最容易崩盤的結構！";
        } else if (retailMTX < -4000 && fTX > 3000) {
            detail = "🚀 <b>軋空：</b>外資進攻大台，散戶瘋狂放空小台，大盤容易出現不回頭的噴漲。";
        } else if (isSettlement) {
            detail = "⚖️ <b>結算防區：</b>留意自營商 SC/SP 區間，通常會結算在讓莊家獲利最大化的位置。";
        } else {
            detail = "目前籌碼分布尚算正常，以大波段趨勢操作為主。";
        }

        document.getElementById('trend-indicator').innerText = trend;
        document.getElementById('trend-indicator').style.color = color;
        document.getElementById('d-action').innerHTML = dMsg.join("<br>") || "中性";
        document.getElementById('f-action').innerHTML = fMsg.join("<br>") || "方向不明";
        document.getElementById('strategy-desc').innerHTML = `💡 <b>策略評估：</b>${strat}<br>${detail}`;
    }

    fetchAllData();
</script>
</body>
</html>
