<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mini指視圖</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lightweight Charts v4 CDN -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    /* ============ 商品 / 週期 / 必來點 設定中心（原 indicators/trend-wave.js，已整合進本頁） ============
       timeframes   : K 線週期按鈕，例如 [5, 15] 只顯示 5、15；可用 1 5 15 60 'D' 'W'，順序即按鈕順序
       tickSize     : 最小跳動點 → 決定 K 線與報價的小數位數（K線、報價依跳動點；均價、指標數值一律取整數）
       zoneSessions : 多空必來點各商品的「交易日時段」，沒列出的商品用日盤 08:45 起算
         tz 時區｜start 交易日起算(當地分鐘 525=08:45、900=15:00、1080=18:00)｜evening 夜盤歸入隔一個交易日
         weekend 週末也是交易日｜day [起,迄] 日盤範圍(供「僅日盤」統計)｜closeAt 'day' 以日盤收盤為前收(預設整個時段)｜label 說明
       zone         : 必來點預設參數（網頁設定選單修改後以選單為準）
       indGroups    : 指標群組（點群組鈕＝載入該組：ids 內的指標開、其餘關）。name 群組名稱｜ids 要開啟的指標 id（＝指標檔裡的 id，必來點是 'zone'）；ids 省略＝全部開
       indGroupsVersion : 改了上面的 indGroups 後把這個數字 +1，使用者瀏覽器裡舊的自訂設定就會被程式碼的新設定取代 */
    const APP_CFG = (function () {
      const TICKS = { 'TX-1': 1, 'TXAM-1': 1, 'TWN-1': 0.05, 'NQ-1': 0.25, 'GC-1': 0.1, 'NK-1': 5, 'BTCUSDT': 0.01, 'TSEA': 0.01, 'OTCA': 0.01, 'TAIWANVIX': 0.01 };
      return {
        timeframes: [1, 5, 15, 60, 'D', 'W'],
        tickSize(code, price) {
          const c = String(code || '').toUpperCase();
          if (c in TICKS) return TICKS[c];
          const p = price || 0;                                // 個股 / 股期：台股升降單位
          return p < 10 ? 0.01 : p < 50 ? 0.05 : p < 100 ? 0.1 : p < 500 ? 0.5 : p < 1000 ? 1 : 5;
        },
        zoneSessions: {
          'TX-1':    { tz: 'Asia/Taipei',      start: 900,  evening: true,  day: [525, 825], label: '全日盤 15:00~13:45' },
          'TXAM-1':  { tz: 'Asia/Taipei',      start: 525,  evening: false,                  label: '日盤 08:45~13:45' },
          'TWN-1':   { tz: 'Asia/Taipei',      start: 525,  evening: false, day: [525, 825], label: '全日盤 08:45~次日05:15' },
          'NQ-1':    { tz: 'America/New_York', start: 1080, evening: true,                   label: 'CME 美東18:00~17:00' },
          'GC-1':    { tz: 'America/New_York', start: 1080, evening: true,                   label: 'COMEX 美東18:00~17:00' },
          'NK-1':    { tz: 'Asia/Tokyo',       start: 990,  evening: true,  day: [525, 945], label: '全日盤 夜盤+日盤' },
          'BTCUSDT': { tz: 'UTC',              start: 0,    evening: false, weekend: true,    label: '24H（UTC 00:00 換日）' }
        },
        /* ---- 目前可用的指標 id（ids 要填的值）----
           'zone'     必來點（內建）
           'chip'     籌碼（副圖）
           'mcdx'     MCDX（副圖）
           'volume'   成交量（副圖）
           'wave'     波段（副圖）
           'filter'   過濾線（主圖，EMA12，filter.js）
           以下 6 個我沒看到原始檔，id 是依檔名推測，請對照各檔 TVInd.register 裡的 id 確認：
           'atr'      ATR            （atr.js）
           'dayweek'  日週           （dayweek.js）
           'duotou'   多頭           （duotou.js）
           'vegas'    Vegas          （vegas.js）
           'vwap'     VWAP           （vwap.js）
           'week'     周成本（週 VWAP，week_vwap.js）← 已確認 id 是 week，不是 week_vwap
           新增指標檔後，它的 id 也可以直接填進來。 */
        indGroupsVersion: 2,
        indGroups: [
          { name: '當沖', ids: ['zone', 'atr', 'vwap', 'filter']},
          { name: '籌碼', ids: ['mcdx', 'chip', 'wave', 'filter']},
		  { name: '週關', ids: ['filter', 'week', 'mcdx', 'chip', 'wave']},
		  { name: '簡單', ids: ['filter', 'volume']},
		  { name: '多頭', ids: ['filter', 'duotou', 'volume']},
        ],
        zone: { sessMode: 'auto', baseMode: 'prev', lookback: 20, shortN: 5, wLong: 0.5, wShort: 0.3, wLast: 0.2, linear: true, kTarget: 0.25, kRange: 0.5 }
      };
    })();
  </script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tvBg: '#131722',
            tvPanel: '#1e222d',
            tvHover: '#2a2e39',
            tvBorder: '#2a2e39',
            tvText: '#d1d4dc',
            tvTextMuted: '#787b86',
            tvUp: '#089981',
            tvDown: '#f23645',
            tvAccent: '#2962ff'
          }
        }
      }
    }
  </script>
  <style>
    /* 鎖定頁面與滾動行為，防止手機下拉橡皮筋回彈與上方空白 */
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: #131722; }
    ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }

    .compact-table-row { font-size: 11px; }

    /* 柔和舒適的呼吸燈動畫 */
    @keyframes softPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    .soft-breathing {
      animation: softPulse 2.5s infinite ease-in-out;
    }

    /* 桌面版收合樣式 */
    #watchlist-wrapper {
      width: 410px;
      height: 100%;
      background-color: #1e222d;
      border-left: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease, border-left 0.2s ease;
      position: relative;
      z-index: 10;
      overflow: hidden;
      flex-shrink: 0;
    }

    #watchlist-wrapper.collapsed {
      width: 0px;
      border-left: none;
    }

    /* 手機版抽屜覆蓋模式 */
    @media (max-width: 767px) {
      #watchlist-wrapper {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 360px;
        z-index: 50;
        transform: translateX(100%);
        transition: transform 0.25s ease-in-out;
        box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      }
      #watchlist-wrapper.open {
        transform: translateX(0);
      }
    }

    /* 最右側圖示側邊欄 */
    #sidebar-icons {
      width: 48px;
      height: 100%;
      background-color: #131722;
      border-left: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      gap: 12px;
      z-index: 12;
      flex-shrink: 0;
    }

    .sidebar-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #787b86;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sidebar-btn:hover {
      background-color: #2a2e39;
      color: #f0f3fa;
    }

    .sidebar-btn.active {
      color: #2962ff;
      background-color: rgba(41, 98, 255, 0.15);
    }

    /* 手機遮罩層 */
    #drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
    }
    #drawer-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    @media (min-width: 768px) {
      #drawer-backdrop { display: none !important; }
    }

    /* 指標「名稱 / 數值」顯示開關（設定選單控制 body 的 class） */
    body.hide-val .lg-val, body.hide-val .lg-sep { display: none !important; }
    body.hide-name .lg-name { display: none !important; }

    .wl-sort { cursor: pointer; user-select: none; }
    .wl-sort:hover { color: #fff; }
    /* 群組 Tab 按鈕樣式 */
    .group-tab-btn {
      position: relative;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #787b86;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .group-tab-btn:hover {
      color: #d1d4dc;
    }
    .group-tab-btn.active {
      color: #ffffff;
    }
    .group-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px 2px 0 0;
    }

    /* 右下角走勢圖 Canvas 容器 */
    .vix-mini-canvas-container {
      width: 100%;
      height: 140px;
      position: relative;
      background: #131722;
      border-radius: 6px;
      border: 1px solid #2a2e39;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* 上下拖曳霸樣式與觸控專用觸發點 */
    #bottom-resizer {
      touch-action: none;
      user-select: none;
    }

    /* ===== TradingView 風格擴充 ===== */
    #draw-toolbar { width: 44px; background:#131722; border-right:1px solid #2a2e39; display:flex; flex-direction:column; align-items:center; padding:6px 0; gap:2px; flex-shrink:0; overflow-y:auto; z-index:20; }
    #draw-toolbar .sidebar-btn { width:34px; height:34px; }
    #draw-toolbar .sep { width:24px; height:1px; background:#2a2e39; margin:4px 0; }
    #dt-color { width:22px; height:22px; padding:0; border:1px solid #2a2e39; border-radius:4px; background:none; cursor:pointer; }
    .tool-active #chart-container, .tool-active #chart-container * { cursor: crosshair !important; }
    .scale-btn { font-size:11px; padding:2px 8px; border-radius:4px; color:#787b86; border:1px solid transparent; }
    .scale-btn:hover { background:#2a2e39; color:#fff; }
    #axis-scale-btns .scale-btn { font-size:10px; padding:1px 5px; }
    .scale-btn.on { color:#2962ff; background:rgba(41,98,255,.15); }
    /* 底部列：預設只有 群組 + 眼睛；點群組展開 走勢圖 / 設定（手機） */
    #btn-ind-group { width:auto; max-width:92px; padding:0 8px; gap:4px; font-size:12px; white-space:nowrap; }
    #btn-ind-group span { overflow:hidden; text-overflow:ellipsis; }
    @media (max-width: 767px) { #bottom-bar:not(.bar-expanded) .exp-only { display:none !important; } }
    /* 清單編輯模式：每列常駐顯示 編輯 / 刪除 */
    #watchlist-wrapper.editing .wl-act { display:flex !important; }
    .tb-icon { width:28px; height:28px; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#b2b5be; }
    .tb-icon:hover { background:#2a2e39; color:#fff; }
    #watchlist-wrapper.collapsed { width: 0 !important; min-width: 0 !important; border-left: none !important; }
    @media (max-width: 767px) { #watchlist-wrapper { width: 100% !important; } }
    .mini-chip { cursor:pointer; padding:1px 4px; border-radius:3px; } .mini-chip:hover { background:#2a2e39; } .mini-chip.off { opacity:.35; text-decoration:line-through; }
    #ohlc-bar { display:flex; flex-wrap:wrap; gap:0 8px; }

    /* ===== 版面：手機＝K線 + (走勢 / 清單 切換) + 底部工具列；電腦＝左K線、右清單+走勢 ===== */
    #left-col, #right-col { display: contents; }
    #chart-section { order: 1; flex: 1 1 0; min-height: 0; }
    #bottom-resizer { order: 2; display: none !important; }
    #symbol-detail-card { order: 3; flex: 1 1 0; height: auto; min-height: 190px; max-height: none; }
    #watchlist-wrapper { order: 3; position: relative !important; left: auto !important; right: auto !important; top: auto !important; bottom: auto !important;
      transform: none !important; width: 100% !important; max-width: none !important; border: none !important; border-top: 1px solid #2a2e39 !important;
      box-shadow: none !important; border-radius: 0 !important; display: none !important; height: auto !important; flex: 1 1 0; min-height: 200px; z-index: auto; }
    #bottom-bar { order: 4; }
    body.show-list #watchlist-wrapper { display: flex !important; }
    body.show-list #symbol-detail-card, body.show-list #bottom-resizer { display: none !important; }
    .mob-only { display: flex; }
    #drawer-backdrop, #btn-close-drawer { display: none !important; }
    #settings-dropdown { position: fixed !important; left: 8px; right: auto !important; top: auto !important; bottom: calc(56px + env(safe-area-inset-bottom,0px) + 8px); z-index: 61; max-height: 70dvh; overflow-y: auto; }
    #bottom-bar > div::-webkit-scrollbar { display: none; }
    /* 隱藏指標：收起底部指標列，並隱藏圖上的指標名稱 / 參數 / 數值與圖例 */
    body.ind-hidden #ind-tabs-wrap { visibility: hidden; }
    body.ind-hidden .lg-name, body.ind-hidden .lg-val, body.ind-hidden .lg-sep { display: none !important; }
    /* 手機：走勢圖按鈕未點亮 → 隱藏走勢圖，K 線佔滿整個畫面 */
    @media (max-width: 767px) { body.hide-trend #symbol-detail-card { display: none !important; } }
    /* 副圖上緣可拖曳的高度調整把手 */
    @media (min-width: 768px) {
      .mob-only { display: none !important; }
      #app-main { flex-direction: row !important; }
      #left-col { display: flex; flex-direction: column; flex: 1; min-width: 0; min-height: 0; }
      #right-col { display: flex; flex-direction: column; width: 420px; flex-shrink: 0; min-height: 0; border-left: 1px solid #2a2e39; background: #1e222d; }
      #bottom-bar { order: 2; }
      #watchlist-wrapper { display: flex !important; flex: 1; height: auto !important; min-height: 0; order: 1; border-top: none !important; }
      #bottom-resizer { order: 2; display: flex !important; }
      #symbol-detail-card { order: 3; flex: none; height: 400px; min-height: 280px; max-height: 92%; display: flex !important; }
    }
  </style>
</head>
<body class="bg-tvBg text-tvText font-sans h-[100dvh] w-screen overflow-hidden flex flex-col select-none">

  <!-- Top Global Header -->
  <header class="h-11 bg-tvPanel border-b border-tvBorder flex items-center justify-between px-3 shrink-0 z-25 relative">
    <div class="flex items-center space-x-2 text-tvAccent font-bold text-base tracking-wider shrink-0">
      <i class="fa-solid fa-chart-line"></i>
      <span>Mini指視圖</span>
    </div>

    <!-- Right Global Status / Actions -->
    <div class="flex items-center space-x-2.5 text-xs shrink-0 font-mono">
      <div id="api-status-badge" class="flex items-center space-x-1.5 text-tvUp bg-tvUp/15 px-3 py-1.5 rounded-md border border-tvUp/50 shadow-[0_0_12px_rgba(8,153,129,0.25)] cursor-pointer hover:bg-tvUp/25 transition-all select-none group" title="點擊手動重新整理資料">
        <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-tvUp soft-breathing"></span>
        <i id="api-status-icon" class="fa-solid fa-rotate text-[10px] text-tvUp transition-transform"></i>
        <span id="api-status-text" class="text-[11px] font-bold tracking-wide">即時連線</span>
      </div>

      <div class="flex items-center space-x-1.5 text-white bg-tvHover px-2.5 py-1 rounded border border-tvBorder shadow-sm">
        <i class="fa-regular fa-clock text-[10px] text-tvTextMuted"></i>
        <span id="live-clock" class="text-[10px] font-bold tracking-wider">--:--:--</span>
      </div>
    </div>
  </header>

  <!-- Main Grid Content -->
  <div id="app-main" class="flex-1 flex flex-col overflow-hidden relative min-h-0">
  <div id="left-col">
    
    <!-- Left Section: Chart Area -->
    <div id="chart-section" class="flex-1 flex flex-col min-w-0 min-h-0 overflow-hidden bg-tvBg">
      <!-- Active Symbol Info Bar -->
      <div class="h-10 bg-tvPanel/50 border-b border-tvBorder flex items-center justify-between px-3 text-xs shrink-0">
        <div class="flex items-center space-x-2 truncate">
          <span id="active-symbol-title" class="font-bold text-white text-xs sm:text-sm truncate">台指期全 TX-1</span>
          <span id="active-symbol-exch" class="text-tvTextMuted text-[10px]">TAIFEX</span>
          
          <div class="h-4 w-px bg-tvBorder hidden sm:block mx-1"></div>

          <!-- Timeframe Selector -->
          <div id="timeframe-container" class="hidden sm:flex items-center space-x-1 text-xs font-mono">
          </div>
        </div>

        <div id="active-price-badge" class="flex items-center space-x-1.5 font-mono font-bold shrink-0">
          <span id="active-price" class="text-xs sm:text-sm">--</span>
          <span id="active-change" class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded">--</span>
        </div>
      </div>

      <!-- 手機版專屬第二行時框列 -->
      <div class="sm:hidden h-8 bg-tvPanel/30 border-b border-tvBorder flex items-center px-3 space-x-1 text-xs font-mono shrink-0 overflow-x-auto no-scrollbar" id="timeframe-container-m">
      </div>

      <div class="flex-1 flex min-h-0 min-w-0">
      <div id="draw-toolbar">
        <button class="sidebar-btn draw-tool active" data-tool="cursor" title="游標 (Esc)"><i class="fa-solid fa-arrow-pointer text-sm"></i></button>
        <div class="sep"></div>
        <button class="sidebar-btn draw-tool" data-tool="trend" title="趨勢線"><i class="fa-solid fa-slash text-sm"></i></button>
        <button class="sidebar-btn draw-tool" data-tool="hline" title="水平線"><i class="fa-solid fa-minus text-sm"></i></button>
        <button class="sidebar-btn draw-tool" data-tool="vline" title="垂直線"><i class="fa-solid fa-grip-lines-vertical text-sm"></i></button>
        <button class="sidebar-btn draw-tool" data-tool="rect" title="矩形"><i class="fa-regular fa-square text-sm"></i></button>
        <button class="sidebar-btn draw-tool" data-tool="fib" title="斐波那契回檔"><i class="fa-solid fa-bars-staggered text-sm"></i></button>
        <div class="sep"></div>
        <button class="sidebar-btn" id="dt-magnet" title="磁吸 K 棒 OHLC"><i class="fa-solid fa-magnet text-sm"></i></button>
        <button class="sidebar-btn" id="dt-eye" title="顯示/隱藏繪圖"><i class="fa-solid fa-eye text-sm"></i></button>
        <button class="sidebar-btn" id="dt-del" title="刪除選取（無選取＝清除全部）"><i class="fa-solid fa-trash-can text-sm"></i></button>
        <div class="sep"></div>
        <input type="color" id="dt-color" value="#2962ff" title="繪圖顏色">
      </div>
      <!-- Lightweight Chart Container & Legend -->
      <div class="flex-1 relative min-w-0 bg-tvBg flex flex-col min-h-0 overflow-hidden">
        <!-- 主圖左上角數值即時標籤 -->
        <div id="top-legends" class="absolute top-2 left-2 z-10 pointer-events-none flex flex-col gap-0.5 text-[11px] font-mono" style="max-width:calc(100% - 72px)">
          <div id="ohlc-bar" class="text-[11px] font-mono"></div>
          <div id="ind-legend" class="text-[11px] font-mono" style="display:flex;flex-wrap:wrap;gap:0 8px"></div>
        </div>

        <div id="chart-container" class="flex-1 w-full relative min-h-0 overflow-hidden"></div>
        <!-- 時間軸右側：% / log / 自動 -->
        <div id="axis-scale-btns" class="absolute bottom-0 right-0 z-10 flex items-center gap-0.5 pl-1 pr-0.5 bg-tvBg/90 font-mono" style="height:26px">
          <button data-sc="pct" class="scale-btn" title="百分比座標">%</button>
          <button data-sc="log" class="scale-btn" title="對數座標">log</button>
          <button data-sc="auto" class="scale-btn" title="自動縮放並回到最新">自動</button>
        </div>

      </div>
      </div>
    </div>

    <!-- 畫面最下方：清單 / 設定 / 指標列 -->
  <div id="bottom-bar" class="relative bg-tvPanel border-t border-tvBorder flex items-center shrink-0 z-[65] font-mono select-none" style="height:56px;box-sizing:content-box;padding-bottom:env(safe-area-inset-bottom,0px)">

  <!-- JavaScript Application Logic -->
  <script>
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
      const clockElem = document.getElementById('live-clock');
      if (clockElem) clockElem.textContent = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();


    /* 指標顯示：目前只保留「多空必來點」 */
    let lineVisibility = { zone: true };
    /* 指標文字顯示偏好：數值預設開、參數預設關 */
    let uiPrefs = { showNames: true, showValues: true };


    /* ---- 價格顯示：K線/報價依商品跳動點決定小數位；均價與指標一律取整數 ---- */
    function curCode() { const it = getAllWatchlistItems().find(s => s.id === selectedSymbolId); return it ? it.code : 'TX-1'; }
    const tickOf = (code, price) => APP_CFG.tickSize(code, price);
    function decOf(code, price) { const t = tickOf(code, price); if (t >= 1) return 0; const s = String(t); return s.includes('.') ? s.split('.')[1].length : 0; }
    function priceOf(code) { const it = getAllWatchlistItems().find(s => s.code === code); return (it && it.price) || (currentCandles.length ? currentCandles[currentCandles.length - 1].close : 0); }
    function curDec() { const c = curCode(); return decOf(c, priceOf(c)); }
    function fmtPx(v, code) { if (v == null || isNaN(v)) return '--'; const d = decOf(code, v); return Number(v).toLocaleString('en-US', { minimumFractionDigits: d, maximumFractionDigits: d }); }
    const fmtInt = v => (v == null || isNaN(v)) ? '--' : Math.round(v).toLocaleString('en-US');
    const INT_FMT = { type: 'price', precision: 0, minMove: 1 };
    let _pxKey = '';
    function applyPxFormat() {
      try {
        const c = curCode(), p = priceOf(c), t = tickOf(c, p), k = c + '|' + t;
        if (k === _pxKey || !candlestickSeries) return; _pxKey = k;
        const f = { type: 'price', precision: decOf(c, p), minMove: t };
        candlestickSeries.applyOptions({ priceFormat: f });
        if (window.__altSeries) Object.values(window.__altSeries).forEach(s => s.applyOptions({ priceFormat: f }));
      } catch (e) {}
    }

    /* ================= 指標參數視窗：連點兩下底部指標名稱開啟 ================= */
    const IndParams = (function () {
      const specs = {};
      let overlay = null, curSpec = null;
      const cls = 'w-24 bg-tvBg border border-tvBorder rounded px-1.5 py-1 text-white text-right focus:outline-none focus:border-tvAccent disabled:opacity-40';

      function build() {
        overlay = document.createElement('div');
        overlay.className = 'fixed inset-0 bg-black/60 flex items-center justify-center hidden p-4';
        overlay.style.zIndex = '90';
        overlay.innerHTML =
          '<div class="bg-tvPanel border border-tvBorder rounded-lg shadow-2xl w-full max-w-xs text-xs">' +
            '<div class="flex items-center justify-between px-4 py-3 border-b border-tvBorder">' +
              '<span data-r="title" class="font-bold text-white text-sm"></span>' +
              '<button type="button" data-r="x" class="text-tvTextMuted hover:text-white"><i class="fa-solid fa-xmark"></i></button>' +
            '</div>' +
            '<div data-r="body" class="px-4 py-3 space-y-2.5"></div>' +
            '<div class="flex items-center justify-between px-4 py-3 border-t border-tvBorder">' +
              '<button type="button" data-r="reset" class="px-2.5 py-1.5 rounded bg-tvHover text-tvTextMuted hover:text-white">還原預設</button>' +
              '<div class="flex gap-2">' +
                '<button type="button" data-r="cancel" class="px-3 py-1.5 rounded bg-tvHover text-tvText hover:text-white">取消</button>' +
                '<button type="button" data-r="save" class="px-3 py-1.5 rounded bg-tvAccent text-white font-medium hover:bg-blue-600">儲存</button>' +
              '</div>' +
            '</div>' +
          '</div>';
        document.body.appendChild(overlay);
        const q = k => overlay.querySelector('[data-r="' + k + '"]');
        overlay.addEventListener('mousedown', e => { if (e.target === overlay) close(); });
        q('x').onclick = close; q('cancel').onclick = close;
        q('save').onclick = save;
        q('reset').onclick = () => { if (curSpec && curSpec.defaults) fill(curSpec.defaults()); };
        overlay.addEventListener('keydown', e => {
          if (e.key === 'Escape') close();
          else if (e.key === 'Enter' && e.target.tagName !== 'BUTTON') { e.preventDefault(); save(); }
        });
        overlay.q = q;
      }
      function close() { if (overlay) overlay.classList.add('hidden'); curSpec = null; }
      function fill(vals) {
        curSpec.fields.forEach(f => {
          const el = overlay.querySelector('[data-k="' + f.key + '"]');
          if (el && vals[f.key] !== undefined) el.value = vals[f.key];
        });
      }
      function save() {
        if (!curSpec) return;
        const out = {};
        curSpec.fields.forEach(f => {
          const el = overlay.querySelector('[data-k="' + f.key + '"]'); if (!el) return;
          let v = el.value;
          if (f.type === 'number') {
            const step = f.step || 1;
            v = step < 1 ? parseFloat(v) : parseInt(v, 10);
            const cur = curSpec.get()[f.key];
            if (isNaN(v)) v = cur;
            if (f.min != null) v = Math.max(f.min, v);
            if (f.max != null) v = Math.min(f.max, v);
            if (step < 1) v = Math.round(v / step) * step, v = +v.toFixed(4);
          }
          out[f.key] = v;
        });
        const spec = curSpec;
        close();
        try { spec.set(out); } catch (e) { console.error('指標參數套用失敗', e); }
      }
      function open(key) {
        if (!overlay) build();
        const q = overlay.q, spec = specs[key];
        const body = q('body');
        if (!spec) {
          curSpec = null;
          q('title').textContent = '指標參數';
          body.innerHTML = '<div class="text-tvTextMuted py-2">此指標沒有可調整的參數。</div>';
          q('reset').classList.add('hidden'); q('save').classList.add('hidden'); q('cancel').textContent = '關閉';
          overlay.classList.remove('hidden');
          return;
        }
        curSpec = spec;
        q('reset').classList.remove('hidden'); q('save').classList.remove('hidden'); q('cancel').textContent = '取消';
        q('title').textContent = typeof spec.title === 'function' ? spec.title() : spec.title;
        const vals = spec.get();
        let html = '';
        if (spec.note) { const n = typeof spec.note === 'function' ? spec.note() : spec.note; if (n) html += '<div class="text-[10px] text-[#ffcc66]">' + n + '</div>'; }
        spec.fields.forEach(f => {
          const dis = typeof f.disabled === 'function' ? f.disabled() : false;
          let input;
          if (f.type === 'select') {
            input = '<select data-k="' + f.key + '" class="' + cls + '"' + (dis ? ' disabled' : '') + '>' +
              (f.options || []).map(o => '<option value="' + o[0] + '">' + o[1] + '</option>').join('') + '</select>';
          } else {
            input = '<input data-k="' + f.key + '" type="number" inputmode="decimal" class="' + cls + '"' +
              (f.min != null ? ' min="' + f.min + '"' : '') + (f.max != null ? ' max="' + f.max + '"' : '') + ' step="' + (f.step || 1) + '"' + (dis ? ' disabled' : '') + '>';
          }
          html += '<div class="flex items-center justify-between gap-3"><span class="text-tvText">' + f.label + '</span>' + input + '</div>';
        });
        body.innerHTML = html;
        fill(vals);
        overlay.classList.remove('hidden');
        const first = body.querySelector('input:not([disabled]),select:not([disabled])');
        if (first) { first.focus(); if (first.select) try { first.select(); } catch (e) {} }
      }
      return { register(key, spec) { specs[key] = spec; }, open, close, has: k => !!specs[k] };
    })();

    /* 連點兩下底部指標名稱 → 開啟參數視窗（滑鼠雙擊 / 手機雙點皆可） */
    (function () {
      const wrap = document.getElementById('ind-tabs-wrap'); if (!wrap) return;
      let last = { el: null, t: 0 };
      const keyOf = b => b.dataset.ind || b.dataset.pid || (b.id || '').replace(/^tab-/, '');
      wrap.addEventListener('click', e => {
        const b = e.target.closest('button'); if (!b || !wrap.contains(b)) return;
        const now = Date.now();
        if (last.el === b && now - last.t < 400) { last = { el: null, t: 0 }; IndParams.open(keyOf(b)); }
        else last = { el: b, t: now };
      });

    const tfToRes = x => { const s = String(x).trim().toUpperCase(); return s === 'D' || s === '1D' ? '1D' : s === 'W' || s === '1W' ? 'W' : s; };

    const TF_LIST = APP_CFG.timeframes.map(tfToRes).filter(r => ['1', '5', '15', '60', '1D', 'W'].includes(r));
    if (!TF_LIST.length) TF_LIST.push('15');
    const isDayRes = r => r === '1D' || r === 'W';
    let currentResolution = TF_LIST.includes('15') ? '15' : TF_LIST[0];
    /* 日K → 週K（週一為一週開始，台北時間） */
    function toWeekly(days) {
      const out = []; let curKey = null, cur = null;
      days.forEach(b => {
        const d = Math.floor((b.time + 8 * 3600) / 86400), k = d - ((d + 3) % 7);
        if (k !== curKey) { curKey = k; cur = { time: b.time, open: b.open, high: b.high, low: b.low, close: b.close, volume: b.volume || 0 }; out.push(cur); }
        else { cur.high = Math.max(cur.high, b.high); cur.low = Math.min(cur.low, b.low); cur.close = b.close; cur.volume += b.volume || 0; }
      });
      return out;
    }
    let currentCandles = []; 
    let chart, candlestickSeries;


    /* ---- 指標偏好：第一次載入用預設值，之後記住使用者的選擇 ---- */
    const IND_PREF_KEY = 'tvIndPrefs_v1';
    function saveIndPrefs() {
      try { localStorage.setItem(IND_PREF_KEY, JSON.stringify({ lineVisibility: { zone: lineVisibility.zone }, uiPrefs })); } catch (e) {}
    }
    (function loadIndPrefs() {
      try {
        const st = JSON.parse(localStorage.getItem(IND_PREF_KEY) || 'null');
        if (st) { if (st.lineVisibility && 'zone' in st.lineVisibility) lineVisibility.zone = !!st.lineVisibility.zone; Object.assign(uiPrefs, st.uiPrefs); }
      } catch (e) {}
    })();
    function applyUiPrefs() {
      document.body.classList.toggle('hide-name', !uiPrefs.showNames);
      document.body.classList.toggle('hide-val', !uiPrefs.showValues);
    }
    /* 其他程式註冊「重新計算」函式，載入完成後統一跑一次 */
    window.__indRefreshers = [];
    window.runAllIndicators = function () {
      try { updateIndicatorDisplay(); } catch (e) { console.error(e); }
      window.__indRefreshers.forEach(f => { try { f(); } catch (e) { console.error(e); } });
    };

    let columnSettings = {
      change: true,
      percent: true,
      volume: true,
      volMode: 'auto'
    };

    let lastQuoteSuccessTime = Date.now();
    let isDataDelayed = false;

    function setConnectionStatus(status) {
      const badge = document.getElementById('api-status-badge');
      const dot = document.getElementById('api-status-dot');
      const text = document.getElementById('api-status-text');
      const icon = document.getElementById('api-status-icon');

      if (status === 'delayed') {
        isDataDelayed = true;
        badge.className = "flex items-center space-x-1.5 text-amber-400 bg-amber-400/15 px-3 py-1.5 rounded-md border border-amber-400/50 shadow-[0_0_12px_rgba(251,191,36,0.3)] cursor-pointer hover:bg-amber-400/25 transition-all select-none group";
        dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 soft-breathing";
        icon.className = "fa-solid fa-rotate text-[10px] text-amber-400";
        text.textContent = "連線延遲";
      } else if (status === 'refreshing') {
        icon.classList.add('fa-spin');
        text.textContent = "重新整理...";
      } else {
        isDataDelayed = false;
        badge.className = "flex items-center space-x-1.5 text-tvUp bg-tvUp/15 px-3 py-1.5 rounded-md border border-tvUp/50 shadow-[0_0_12px_rgba(8,153,129,0.25)] cursor-pointer hover:bg-tvUp/25 transition-all select-none group";
        dot.className = "w-2.5 h-2.5 rounded-full bg-tvUp soft-breathing";
        icon.className = "fa-solid fa-rotate text-[10px] text-tvUp";
        text.textContent = "即時連線";
      }
    }

    setInterval(() => {
      const now = Date.now();
      if (now - lastQuoteSuccessTime > 6000 && !isDataDelayed) {
        setConnectionStatus('delayed');
      }
    }, 1000);

    function getAllWatchlistItems() {
      let items = [];
      watchlistGroups.forEach(g => items.push(...g.items));
      return items;
    }

    function initChart() {
      const container = document.getElementById('chart-container');
      
      chart = LightweightCharts.createChart(container, {
        layout: {
          background: { type: 'solid', color: '#131722' },
          textColor: '#ffffff',
        },
        grid: {
          vertLines: { color: '#1e222d' },
          horzLines: { color: '#1e222d' },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { 
          borderColor: '#2a2e39', 
          textColor: '#ffffff', 
          autoScale: true,
          mode: LightweightCharts.PriceScaleMode.Normal,
          alignLabels: true,
        },
        timeScale: {
          borderColor: '#2a2e39',
          timeVisible: true,
          secondsVisible: false,
          textColor: '#ffffff',
          tickMarkFormatter: (time) => {
            const date = new Date(time * 1000);
            if (isDayRes(currentResolution)) return `${date.getMonth() + 1}/${date.getDate()}`;
            return date.toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit' });
          }
        },
        localization: {
          locale: 'zh-TW',
          timeFormatter: timestamp => {
            const date = new Date(timestamp * 1000);
            if (isDayRes(currentResolution)) return `${date.getMonth() + 1}/${date.getDate()}`;
            return date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
          }
        },
      });

      candlestickSeries = chart.addCandlestickSeries({
        upColor: '#f23645',
        downColor: '#089981',
        borderVisible: false,
        wickUpColor: '#f23645',
        wickDownColor: '#089981',
      });
      candlestickSeries.priceScale().applyOptions({
        scaleMargins: { top: 0.12, bottom: 0.15 },
        autoScale: true,
      });

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
      if (window.ResizeObserver) new ResizeObserver(() => chart.applyOptions({ width: container.clientWidth, height: container.clientHeight })).observe(container);
    }

    function updateIndicatorDisplay() {
      applyPxFormat();
    }

    function getResolutionSeconds(res) {
      if (res === '1') return 60;
      if (res === '5') return 300;
      if (res === '15') return 900;
      if (res === '60') return 3600;
      if (res === '1D') return 86400;
      if (res === 'W') return 604800;
      return 900;
    }

    /* 推到最新 K 棒（保留右側 8 根空位，與圖表 rightOffset 一致）並回復自動縮放 */
    let _pushTok = 0, _userMoved = 0;
    function pushToLatest() {
      try {
        const n = currentCandles.length; if (!n || !chart) return;
        chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, n - 80), to: n - 1 + 8 });
        chart.priceScale('right').applyOptions({ autoScale: true });
      } catch (e) {}
    }
    /* 切換週期 / 商品後，資料與副圖是分批載入的，所以在載入完成後再補推幾次；期間若使用者自己拖曳或縮放就停止 */
    function schedulePush() {
      const tok = ++_pushTok, u0 = _userMoved;
      [0, 350, 1000, 2200].forEach(d => setTimeout(() => { if (tok === _pushTok && u0 === _userMoved) pushToLatest(); }, d));
    }

    async function loadHistoryData(symbolCode, resolution) {
      currentCandles = []; 
      const toTime = Math.floor(Date.now() / 1000);
      const fetchRes = resolution === 'W' ? '1D' : resolution;
      const daysToSubtract = resolution === 'W' ? 365 * 5 : resolution === '1D' ? 365 : 60;
      const fromTime = toTime - (daysToSubtract * 24 * 60 * 60);
      const url = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=${encodeURIComponent(symbolCode)}&resolution=${fetchRes}&from=${fromTime}&to=${toTime}&ws=true&metaData=true`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        let candleData = [];
        const barsData = Array.isArray(data) ? data : (data.bars || []);
        const normalizeTime = t => t > 1e10 ? Math.floor(t / 1000) : t;

        if (Array.isArray(barsData) && barsData.length > 0) {
          barsData.forEach(item => {
            let rawTime = item.time || new Date(item.datetime).getTime();
            let time = normalizeTime(rawTime);
            if (fetchRes === '1D') time -= 86400; 
            const volume = item.volume !== undefined ? item.volume : (Math.floor(Math.random() * 20000 + 5000));
            candleData.push({ time, open: item.open, high: item.high, low: item.low, close: item.close, volume });
          });
        }

        if (candleData.length > 0) {
          candleData.sort((a, b) => a.time - b.time);
          if (resolution === 'W') candleData = toWeekly(candleData);
          currentCandles = candleData;
          candlestickSeries.setData(currentCandles);
          updateIndicatorDisplay();


          pushToLatest();
          return;
        }
        throw new Error('API 資料為空');
      } catch (err) {
        loadMockHistoryFallback(symbolCode);
      }
    }

    function loadMockHistoryFallback(symbolCode) {
      const now = Math.floor(Date.now() / 1000);
      let candleData = [];
      let basePrice = symbolCode === '2330' ? 980 : (symbolCode.includes('TX') ? 22600 : 250);
      const step = getResolutionSeconds(currentResolution);

      for (let i = 80; i >= 1; i--) {
        let time = now - (i * step);
        if (isDayRes(currentResolution)) time -= 86400;
        const open = basePrice + (Math.random() * 20 - 10);
        const high = open + Math.random() * 15;
        const low = open - Math.random() * 15;
        const close = (open + high + low) / 3;
        basePrice = close;
        const volume = Math.floor(Math.abs(high - low) * 1000 + 5000);
        candleData.push({ time, open, high, low, close, volume });
      }

      currentCandles = candleData;
      candlestickSeries.setData(currentCandles);
      updateIndicatorDisplay();


      pushToLatest();
    }

    async function fetchRealtimeQuotes() {
      const allItems = getAllWatchlistItems();
      if (allItems.length === 0 || currentCandles.length === 0) return;
      // 小群組(自選股/海期)每次都抓；大群組(股票/股期)只抓目前分頁；另外一定包含選取中的商品
      const wanted = new Set();
      watchlistGroups.forEach(g => { if (g.items.length <= 30 || g.groupName === activeTabGroup) g.items.forEach(i => wanted.add(i.code)); });
      const selItem = allItems.find(i => i.id === selectedSymbolId); if (selItem) wanted.add(selItem.code);
      const codes = [...wanted], QUOTE_CHUNK = 60, chunks = [];
      for (let i = 0; i < codes.length; i += QUOTE_CHUNK) chunks.push(codes.slice(i, i + QUOTE_CHUNK));

      try {
        const parts = await Promise.all(chunks.map(async ch => {
          const response = await fetch(`https://realtime-quote-signalr-v2.futures-op.com/quote?symbol=${encodeURIComponent(ch.join(','))}`);
          if (!response.ok) throw new Error('API Error');
          return response.json();
        }));
        const data = [].concat(...parts.filter(Array.isArray));

        if (Array.isArray(data)) {
          lastQuoteSuccessTime = Date.now();
          setConnectionStatus('normal');

          data.forEach(quote => {
            allItems.filter(i => i.code.toUpperCase() === String(quote.symbol).toUpperCase()).forEach(item => {
            {
              const newPrice = quote.close || item.price;
              item.price = newPrice;
              item.refPrice = quote.prevRef || quote.refRef || item.refRef || item.refPrice;
              item.volume = quote.volume || item.volume;
              item.high = quote.high || item.high;
              item.low = quote.low || item.low;

              if (item.id === selectedSymbolId && newPrice > 0 && candlestickSeries && currentCandles.length > 0) {
                const stepSeconds = getResolutionSeconds(currentResolution);
                const nowSec = Math.floor(Date.now() / 1000);
                const currentBarTime = currentResolution === 'W' ? currentCandles[currentCandles.length - 1].time   // 週K：只更新最後一根
                  : currentResolution === '1D' 
                  ? Math.floor(nowSec / 86400) * 86400 - 86400 
                  : Math.floor(nowSec / stepSeconds) * stepSeconds;

                let lastBar = currentCandles[currentCandles.length - 1];

                if (lastBar.time === currentBarTime) {
                  lastBar.high = Math.max(lastBar.high, newPrice);
                  lastBar.low = Math.min(lastBar.low, newPrice);
                  lastBar.close = newPrice;
                  candlestickSeries.update(lastBar);
                } else if (currentBarTime > lastBar.time) {
                  if (currentBarTime - lastBar.time === stepSeconds) {
                    const newBar = {
                      time: currentBarTime,
                      open: lastBar.close,
                      high: Math.max(lastBar.close, newPrice),
                      low: Math.min(lastBar.close, newPrice),
                      close: newPrice,
                      volume: item.volume || 1000
                    };
                    currentCandles.push(newBar);
                    candlestickSeries.update(newBar);
                  } else {
                    lastBar.high = Math.max(lastBar.high, newPrice);
                    lastBar.low = Math.min(lastBar.low, newPrice);
                    lastBar.close = newPrice;
                    candlestickSeries.update(lastBar);
                  }
                }

              }
            }
            });
          });

          renderWatchlist();
          const activeSymbol = allItems.find(s => s.id === selectedSymbolId);
          if (activeSymbol) {
            updateActivePriceDisplay(activeSymbol);
            updateDetailCard(activeSymbol);
          }
        }
      } catch (err) {
        console.error('Realtime quote error:', err);
        setConnectionStatus('delayed');
      }
    }

    document.getElementById('api-status-badge').addEventListener('click', async () => {
      setConnectionStatus('refreshing');
      const allItems = getAllWatchlistItems();
      const symbol = allItems.find(s => s.id === selectedSymbolId);
      if (symbol) {
        await loadHistoryData(symbol.code, currentResolution);
      }
      await fetchRealtimeQuotes();
      setTimeout(() => {
        const icon = document.getElementById('api-status-icon');
        if (icon) icon.classList.remove('fa-spin');
        if (!isDataDelayed) setConnectionStatus('normal');
      }, 700);
    });

    function formatSmartVolume(vol) {
      if (!vol || vol === 0) return '--';
      if (columnSettings.volMode === 'full') {
        return vol.toLocaleString();
      }
      if (vol >= 1000000000) {
        return (vol / 1000000000).toFixed(1) + 'G';
      } else if (vol >= 1000000) {
        return (vol / 1000000).toFixed(1) + 'M';
      } else if (vol >= 1000) {
        return (vol / 1000).toFixed(1) + 'k';
      }
      return vol.toLocaleString();
    }

    /* ---- 清單排序 / 低量過濾 ---- */
    const VOL_MIN = { '股票': 20000, '股期': 5000 };   // 成交量低於此值的標的不顯示
    let filterMode = 'vol';                              // vol=過濾成交量 / all=顯示全部 / etf=過濾ETF
    const FILTER_ORDER = ['vol', 'all', 'etf'];
    let sortState = { key: null, dir: 'desc' };         // key: price | change | pct | volume
    const SORT_VAL = {
      price:  it => it.price,
      change: it => it.refPrice > 0 ? it.price - it.refPrice : 0,
      pct:    it => it.refPrice > 0 ? (it.price - it.refPrice) / it.refPrice : 0,
      volume: it => it.volume || 0
    };
    function sortArrow(k) { return sortState.key === k ? (sortState.dir === 'desc' ? ' ▼' : ' ▲') : ''; }
    function applyWatchlistView(groupName, items) {
      let list = items;
      const min = VOL_MIN[groupName];
      if (min && filterMode === 'vol') list = list.filter(it => (it.volume || 0) >= min);
      else if (min && filterMode === 'etf') list = list.filter(it => !it.etf);
      if (sortState.key) {
        const f = SORT_VAL[sortState.key], sgn = sortState.dir === 'desc' ? -1 : 1;
        list = list.map((it, i) => ({ it, i }))
          .sort((a, b) => {
            const ea = !(a.it.price > 0), eb = !(b.it.price > 0);      // 無報價者固定排最後
            if (ea !== eb) return ea ? 1 : -1;
            return (f(a.it) - f(b.it)) * sgn || a.i - b.i;
          }).map(x => x.it);
      }
      return list;
    }
    function toggleSort(key) {
      if (sortState.key !== key) sortState = { key, dir: 'desc' };
      else if (sortState.dir === 'desc') sortState.dir = 'asc';
      else sortState = { key: null, dir: 'desc' };                      // 第三次點擊 = 取消排序
      renderWatchlist();
    }

    function renderWatchlist() {
      const headerContainer = document.getElementById('watchlist-header');
      const container = document.getElementById('watchlist-items');
      container.innerHTML = '';
      
      const currentGroup = watchlistGroups.find(g => g.groupName === activeTabGroup) || { items: [] };
      const allGroupItems = currentGroup.items;
      const items = applyWatchlistView(activeTabGroup, allGroupItems);
      document.getElementById('watchlist-count').textContent = watchlistGroups.reduce((n, g) => n + g.items.length, 0);

      let headerHTML = `
        <div class="w-[18%] text-left truncate pr-0.5">代號</div>
        <div class="w-[22%] text-left truncate px-0.5">名稱</div>
        <div data-sort="price" class="wl-sort w-[24%] text-right truncate px-0.5">成交價${sortArrow('price')}</div>
      `;
      if (columnSettings.change) headerHTML += `<div data-sort="change" class="wl-sort w-[18%] text-right truncate px-0.5">漲跌${sortArrow('change')}</div>`;
      if (columnSettings.percent) headerHTML += `<div data-sort="pct" class="wl-sort w-[18%] text-right truncate px-0.5">漲跌%${sortArrow('pct')}</div>`;
      if (columnSettings.volume) headerHTML += `<div data-sort="volume" class="wl-sort w-[20%] text-right truncate pl-0.5 pr-1">總量${sortArrow('volume')}</div>`;
      headerContainer.innerHTML = headerHTML;
      const minV = VOL_MIN[activeTabGroup];
      const fb = document.getElementById('vol-filter-btn');
      if (fb) {
        fb.classList.toggle('hidden', !minV);
        if (minV) {
          const hid = allGroupItems.length - items.length;
          fb.textContent = filterMode === 'vol' ? `過濾成交量<${minV.toLocaleString()}（隱藏 ${hid}）`
                         : filterMode === 'etf' ? `過濾ETF（隱藏 ${hid}）` : '顯示全部';
          fb.classList.toggle('text-white', filterMode !== 'all');
        }
      }

      if (items.length === 0) {
        container.innerHTML = `<div class="p-6 text-center text-tvTextMuted text-xs font-mono">${allGroupItems.length ? '無符合成交量門檻的商品<br>（尚未取得報價或皆低於門檻）' : '此分類暫無商品'}</div>`;
        return;
      }

      items.forEach(item => {
        const hasRef = item.refPrice > 0;
        const change = hasRef ? (item.price - item.refPrice) : 0;
        const changePercent = hasRef ? ((change / item.refPrice) * 100).toFixed(2) : '0.00';
        const isUp = change >= 0;
        
        const colorClass = isUp ? 'text-[#f23645]' : 'text-[#089981]';
        const isSelected = item.id === selectedSymbolId;

        const row = document.createElement('div');
        row.id = `watchlist-row-${item.id}`;
        row.className = `flex items-center px-2 py-2 compact-table-row cursor-pointer hover:bg-tvHover/70 transition-colors group relative w-full ${
          isSelected ? 'bg-tvHover/90 border-l-2 border-tvAccent' : ''
        }`;
        row.onclick = () => { if (row._lp) return; selectSymbol(item.id); };
        row.oncontextmenu = e => { e.preventDefault(); if (window.openEditSymbol) window.openEditSymbol(item.id); };   // 右鍵 → 編輯
        let lpT = null;                                                                                                 // 手機長按 → 編輯
        row.addEventListener('touchstart', () => { lpT = setTimeout(() => { row._lp = true; if (window.openEditSymbol) window.openEditSymbol(item.id); }, 600); }, { passive: true });
        ['touchmove', 'touchcancel'].forEach(ev => row.addEventListener(ev, () => clearTimeout(lpT), { passive: true }));
        row.addEventListener('touchend', () => { clearTimeout(lpT); setTimeout(() => { row._lp = false; }, 400); }, { passive: true });

        let rowHTML = `
          <div class="w-[18%] font-mono text-tvTextMuted text-[11px] truncate pr-0.5">${item.code}</div>
          <div class="w-[22%] font-bold text-white truncate px-0.5">${item.name}</div>
          <div class="w-[24%] text-right font-mono font-medium text-white truncate px-0.5">
            ${item.price > 0 ? fmtPx(item.price, item.code) : '--'}
          </div>
        `;
        if (columnSettings.change) {
          rowHTML += `
            <div class="w-[18%] text-right font-mono font-medium ${colorClass} truncate px-0.5">
              ${item.price > 0 ? `${isUp ? '+' : ''}${change.toFixed(decOf(item.code, item.price))}` : '--'}
            </div>
          `;
        }
        if (columnSettings.percent) {
          rowHTML += `
            <div class="w-[18%] text-right font-mono font-medium ${colorClass} truncate px-0.5">
              ${item.price > 0 ? `${isUp ? '+' : ''}${changePercent}%` : '--'}
            </div>
          `;
        }
        if (columnSettings.volume) {
          rowHTML += `
            <div class="w-[20%] text-right font-mono text-tvTextMuted text-[11px] truncate pl-0.5 pr-1">
              ${formatSmartVolume(item.volume)}
            </div>
          `;
        }

        row.innerHTML = rowHTML;
        const act = document.createElement('div');   // 滑鼠移到列上顯示：編輯 / 刪除
        act.className = 'wl-act absolute right-1 top-1/2 -translate-y-1/2 hidden items-center gap-1 bg-tvPanel rounded px-1 py-0.5 shadow z-10';
        act.innerHTML = '<button type="button" data-act="edit" title="編輯名稱／代號" class="text-tvTextMuted hover:text-white px-1"><i class="fa-solid fa-pen text-[10px]"></i></button>' +
                        '<button type="button" data-act="del" title="刪除標的" class="text-tvTextMuted hover:text-[#f23645] px-1"><i class="fa-solid fa-trash-can text-[10px]"></i></button>';
        act.onclick = e => { e.stopPropagation(); const b = e.target.closest('button'); if (!b) return; if (b.dataset.act === 'edit') window.openEditSymbol(item.id); else window.deleteSymbol(item.id); };
        row.appendChild(act);
        container.appendChild(row);
      });
    }

    document.getElementById('watchlist-header').addEventListener('click', e => {
      const t = e.target.closest('[data-sort]'); if (t) toggleSort(t.dataset.sort);
    });
    document.getElementById('vol-filter-btn').addEventListener('click', () => { filterMode = FILTER_ORDER[(FILTER_ORDER.indexOf(filterMode) + 1) % FILTER_ORDER.length]; renderWatchlist(); });

    function selectSymbol(id) {
      selectedSymbolId = id;
      currentCandles = [];
      const allItems = getAllWatchlistItems();
      const symbol = allItems.find(s => s.id === id);
      if (symbol) {
        renderWatchlist();
        document.getElementById('active-symbol-title').textContent = `${symbol.name} ${symbol.code}`;
        updateActivePriceDisplay(symbol);
        updateDetailCard(symbol);
        Promise.resolve(loadHistoryData(symbol.code, currentResolution)).catch(() => {}).then(schedulePush);
        fetchAndRenderMiniVix();
      }
    }

    function updateActivePriceDisplay(symbol) {
      const hasRef = symbol.refPrice > 0;
      const change = hasRef ? (symbol.price - symbol.refPrice) : 0;
      const changePercent = hasRef ? ((change / symbol.refPrice) * 100).toFixed(2) : '0.00';
      const isUp = change >= 0;

      const colorClass = isUp ? 'text-[#f23645]' : 'text-[#089981]';
      const bgClass = isUp ? 'bg-[#f23645]/20' : 'bg-[#089981]/20';

      const priceElem = document.getElementById('active-price');
      const changeElem = document.getElementById('active-change');

      priceElem.textContent = symbol.price > 0 ? fmtPx(symbol.price, symbol.code) : '--';
      priceElem.className = `text-sm ${colorClass}`;

      changeElem.textContent = symbol.price > 0 ? `${isUp ? '+' : ''}${change.toFixed(decOf(symbol.code, symbol.price))} (${isUp ? '+' : ''}${changePercent}%)` : '--';
      changeElem.className = `text-xs px-1.5 py-0.5 rounded ${bgClass} ${colorClass}`;
    }

    function updateDetailCard(symbol) {
      const hasRef = symbol.refPrice > 0;
      const change = hasRef ? (symbol.price - symbol.refPrice) : 0;
      const changePercent = hasRef ? ((change / symbol.refPrice) * 100).toFixed(2) : '0.00';
      const isUp = change >= 0;

      const colorClass = isUp ? 'text-[#f23645]' : 'text-[#089981]';
      const bgClass = isUp ? 'bg-[#f23645]/20' : 'bg-[#089981]/20';

      document.getElementById('card-name').textContent = symbol.name;
      document.getElementById('card-code').textContent = symbol.code;
      document.getElementById('card-price').textContent = symbol.price > 0 ? fmtPx(symbol.price, symbol.code) : '--';
      document.getElementById('card-high').textContent = symbol.high > 0 ? fmtPx(symbol.high, symbol.code) : '--';
      document.getElementById('card-low').textContent = symbol.low > 0 ? fmtPx(symbol.low, symbol.code) : '--';
      document.getElementById('card-ref').textContent = symbol.refPrice > 0 ? fmtPx(symbol.refPrice, symbol.code) : '--';
      document.getElementById('card-vol').textContent = symbol.volume > 0 ? symbol.volume.toLocaleString() : '--';

      const badge = document.getElementById('card-change-badge');
      badge.textContent = symbol.price > 0 ? `${isUp ? '+' : ''}${change.toFixed(decOf(symbol.code, symbol.price))} (${isUp ? '+' : ''}${changePercent}%)` : '--';
      badge.className = `font-mono text-right font-bold text-xs px-2 py-0.5 rounded ${bgClass} ${colorClass}`;
    }

    /* 繪製走勢圖：座標文字改為白色 (#ffffff) */
    /* ===================== 右下走勢小圖：資料 / 繪製 / 縮放 ===================== */
    let miniList = [], miniT = [], miniVw = [], miniCode = '', miniView = null, miniHoverX = null, miniExtT = null;
    /* 與主圖 K 線十字游標同步：
       主圖 → 走勢圖：window.__miniSync.set(毫秒時間 | null)
       走勢圖 → 主圖：window.__onMiniHover(毫秒時間 | null)  (由主圖端實作) */
    let miniExtRaf = 0;
    window.__miniSync = {
      set(ms) {
        if (miniHoverX != null) return;                 // 滑鼠正在走勢圖上時，以自己的游標為主
        if (miniExtT === ms) return;
        miniExtT = ms;
        if (miniExtRaf) return;
        miniExtRaf = requestAnimationFrame(() => { miniExtRaf = 0; renderMini(); });
      }
    };
    // 二分搜尋：找最接近 ms 的走勢資料索引
    function miniNearest(ms) {
      const n = miniT.length; if (!n) return -1;
      let lo = 0, hi = n - 1;
      while (lo < hi) { const m = (lo + hi) >> 1; if (miniT[m] < ms) lo = m + 1; else hi = m; }
      return (lo > 0 && Math.abs(miniT[lo - 1] - ms) <= Math.abs(miniT[lo] - ms)) ? lo - 1 : lo;
    }
    const miniShow = { vwap: true, cost: true };
    try { Object.assign(miniShow, JSON.parse(localStorage.getItem('miniShow') || '{}')); } catch (e) {}
    const MINI_GEO = { pl: 30, pr: 58, pt: 16, pb: 18 };
    const miniFmtT = ms => new Date(ms).toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit' });
    const miniNum = v => fmtPx(v, curCode());

    async function fetchAndRenderMiniVix() {
      const cur = getAllWatchlistItems().find(s => s.id === selectedSymbolId) || { code: 'TAIWANVIX', name: '' };
      document.getElementById('vix-canvas-title').textContent = `${cur.name} 走勢圖`;
      if (cur.code !== miniCode) { miniCode = cur.code; miniView = null; miniList = []; miniT = []; miniVw = []; }
      try {
        const resp = await fetch(`https://tv-signalr.futures-op.com/history?symbol=${encodeURIComponent(cur.code)}&resolution=1&ws=true&intraday=true`, { cache: 'no-cache' });
        if (resp.ok) {
          const json = await resp.json();
          const list = json && Array.isArray(json.bars) ? json.bars : [];
          if (list.length && cur.code === miniCode) {
            miniList = list;
            miniT = list.map(b => { const t = b.time || Date.now(); return t > 1e11 ? t : t * 1000; });
            // VWAP：無成交量時以典型價平均代替
            let cv = 0, cpv = 0, cn = 0, cp = 0;
            miniVw = list.map(b => {
              const h = b.high != null ? b.high : b.close, l = b.low != null ? b.low : b.close, tp = (h + l + b.close) / 3, v = b.volume > 0 ? b.volume : 0;
              cv += v; cpv += tp * v; cn++; cp += tp;
              return cv > 0 ? cpv / cv : cp / cn;
            });
          }
        }
      } catch (err) { console.error('Mini chart fetch error:', err); }
      renderMini();
    }

    function miniDayRange() {
      const cur = getAllWatchlistItems().find(s => s.id === selectedSymbolId) || {};
      let h = cur.high > 0 ? cur.high : -Infinity, l = cur.low > 0 ? cur.low : Infinity;
      if (!(h > 0 && l > 0)) { miniList.forEach(b => { h = Math.max(h, b.high != null ? b.high : b.close); l = Math.min(l, b.low != null ? b.low : b.close); }); }
      return { h, l, cost: (h + l) / 2 };
    }

    function renderMini() {
      const canvas = document.getElementById('miniVixCanvas');
      if (!canvas) return;
      const rect = canvas.parentNode.getBoundingClientRect();
      const W = rect.width, H = rect.height; if (W <= 0 || H <= 0) return;
      const dpr = window.devicePixelRatio || 1;
      if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);

      const n = miniList.length;
      const setChip = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v == null ? '--' : fmtInt(v); };
      if (!n) { setChip('card-vwap', null); setChip('card-cost', null); return; }

      const { pl, pr, pt, pb } = MINI_GEO, gw = W - pl - pr, gh = H - pt - pb;
      const full0 = miniT[0], full1 = miniT[n - 1], fullSpan = (full1 - full0) || 1;
      const v0 = miniView ? miniView.a : full0, v1 = miniView ? miniView.b : full1, span = (v1 - v0) || 1;
      const xOf = t => pl + (t - v0) / span * gw;
      const closes = miniList.map(b => b.close);
      const { cost } = miniDayRange();

      // 可視範圍內的資料索引 (含左右各多一根，線條才不會斷)
      let i0 = 0, i1 = n - 1;
      while (i0 < n - 1 && miniT[i0 + 1] < v0) i0++;
      while (i1 > 0 && miniT[i1 - 1] > v1) i1--;
      let minP = Infinity, maxP = -Infinity;
      for (let i = i0; i <= i1; i++) {
        minP = Math.min(minP, closes[i]); maxP = Math.max(maxP, closes[i]);
        if (miniShow.vwap) { minP = Math.min(minP, miniVw[i]); maxP = Math.max(maxP, miniVw[i]); }
      }
      if (miniShow.cost && !miniView) { minP = Math.min(minP, cost); maxP = Math.max(maxP, cost); }
      if (!isFinite(minP)) return;
      const padv = ((maxP - minP) || 1) * 0.06; minP -= padv; maxP += padv;
      const range = (maxP - minP) || 1;
      const yOf = v => pt + gh - ((v - minP) / range) * gh;
      const isUp = closes[n - 1] >= closes[0];
      const lineColor = isUp ? '#f23645' : '#089981';

      // 格線與 Y 刻度
      ctx.font = '9px monospace'; ctx.lineWidth = 1; ctx.textAlign = 'left';
      const ySteps = Math.max(3, Math.min(8, Math.floor(gh / 34)));
      for (let i = 0; i <= ySteps; i++) {
        const val = minP + range * (ySteps - i) / ySteps, y = pt + gh / ySteps * i;
        ctx.strokeStyle = '#2a2e39'; ctx.beginPath(); ctx.moveTo(pl, y); ctx.lineTo(pl + gw, y); ctx.stroke();
        ctx.fillStyle = '#d1d4dc'; ctx.fillText(val.toFixed(curDec()), pl + gw + 5, y + 3);
      }
      // X 時間刻度
      ctx.fillStyle = '#787b86'; ctx.textAlign = 'center';
      const xTicks = Math.max(2, Math.floor(gw / 70));
      for (let i = 0; i <= xTicks; i++) {
        const t = v0 + span * i / xTicks;
        ctx.fillText(miniFmtT(t), pl + gw * i / xTicks, H - 5);
      }

      // 以下內容限制在繪圖區內
      ctx.save(); ctx.beginPath(); ctx.rect(pl, pt - 2, gw, gh + 4); ctx.clip();
      const pts = []; for (let i = Math.max(0, i0); i <= i1; i++) pts.push({ x: xOf(miniT[i]), y: yOf(closes[i]), i });
      if (pts.length) {
        ctx.beginPath(); ctx.strokeStyle = lineColor; ctx.lineWidth = 1.5;
        pts.forEach((p, k) => k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
        ctx.lineTo(pts[pts.length - 1].x, pt + gh); ctx.lineTo(pts[0].x, pt + gh); ctx.closePath();
        const gr = ctx.createLinearGradient(0, pt, 0, pt + gh);
        gr.addColorStop(0, isUp ? 'rgba(242,54,69,.25)' : 'rgba(8,153,129,.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gr; ctx.fill();
      }
      if (miniShow.cost) {            // 0.5 成本線
        ctx.setLineDash([4, 3]); ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pl, yOf(cost)); ctx.lineTo(pl + gw, yOf(cost)); ctx.stroke(); ctx.setLineDash([]);
      }
      if (miniShow.vwap && pts.length) {   // VWAP
        ctx.strokeStyle = '#e040fb'; ctx.lineWidth = 1.3; ctx.beginPath();
        pts.forEach((p, k) => { const y = yOf(miniVw[p.i]); k ? ctx.lineTo(p.x, y) : ctx.moveTo(p.x, y); }); ctx.stroke();
      }
      // 十字線
      // 十字線：來源可能是本圖滑鼠，或主圖 K 線 (miniExtT)
      let hv = null, hx = 0, hy = 0;
      if (miniHoverX != null && miniHoverX >= pl && miniHoverX <= pl + gw) {
        hv = miniNearest(v0 + (miniHoverX - pl) / gw * span);
      } else if (miniHoverX == null && miniExtT != null) {
        const bi = miniNearest(miniExtT);
        if (bi >= 0 && miniT[bi] >= v0 && miniT[bi] <= v1) hv = bi;   // 不在可視範圍就不畫
      }
      if (hv != null) {
        hx = xOf(miniT[hv]); hy = yOf(closes[hv]);
        ctx.strokeStyle = '#758696'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(hx, pt); ctx.lineTo(hx, pt + gh); ctx.moveTo(pl, hy); ctx.lineTo(pl + gw, hy); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = lineColor; ctx.beginPath(); ctx.arc(hx, hy, 3, 0, 7); ctx.fill();
      }
      ctx.restore();
      if (hv != null) {               // 價格 / 時間標籤 (類似主圖十字線)
        ctx.font = '9px monospace'; ctx.fillStyle = '#2a2e39';
        const py = Math.max(pt + 6, Math.min(pt + gh - 6, hy));
        ctx.fillRect(pl + gw + 2, py - 6, pr - 3, 12);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(closes[hv].toFixed(curDec()), pl + gw + 4, py + 3);
        const tw = 36, tx = Math.max(pl, Math.min(pl + gw - tw, hx - tw / 2));
        ctx.fillStyle = '#2a2e39'; ctx.fillRect(tx, H - pb + 1, tw, 13);
        ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(miniFmtT(miniT[hv]), tx + tw / 2, H - 5);
      }

      // 十字游標資訊框：時間 / 價 / 相對昨收漲跌 / 均價 / 高低 / 量（滑鼠移動或手指按住時顯示）
      if (hv != null && miniList[hv]) {
        const b = miniList[hv], cur = getAllWatchlistItems().find(s => s.id === selectedSymbolId) || {}, ref = cur.refPrice, dec = curDec();
        const chg = ref > 0 ? closes[hv] - ref : null, sg = chg >= 0 ? '+' : '';
        const rows = [
          [miniFmtT(miniT[hv]), '#9aa0ad'],
          ['價 ' + closes[hv].toFixed(dec), '#ffffff'],
          chg != null ? ['漲跌 ' + sg + chg.toFixed(dec) + ' (' + sg + (chg / ref * 100).toFixed(2) + '%)', chg >= 0 ? '#f23645' : '#089981'] : null,
          miniShow.vwap ? ['均價 ' + fmtInt(miniVw[hv]), '#e040fb'] : null,
          b.high != null && b.low != null ? ['高 ' + b.high.toFixed(dec) + '  低 ' + b.low.toFixed(dec), '#d1d4dc'] : null,
          b.volume > 0 ? ['量 ' + Number(b.volume).toLocaleString(), '#d1d4dc'] : null
        ].filter(Boolean);
        ctx.font = '10px monospace';
        const bw = Math.max(...rows.map(r => ctx.measureText(r[0]).width)) + 14, bh = rows.length * 13 + 8;
        let tx = hx + 14; if (tx + bw > pl + gw) tx = hx - 14 - bw; tx = Math.max(pl + 2, tx);
        const ty = pt + 4;
        ctx.fillStyle = 'rgba(30,34,45,0.92)'; ctx.fillRect(tx, ty, bw, bh);
        ctx.strokeStyle = '#363a45'; ctx.lineWidth = 1; ctx.strokeRect(tx + 0.5, ty + 0.5, bw - 1, bh - 1);
        ctx.textAlign = 'left';
        rows.forEach((r, i) => { ctx.fillStyle = r[1]; ctx.fillText(r[0], tx + 7, ty + 15 + i * 13); });
      }

      // 右側價格標籤 (成本 / VWAP)
      const tag = (v, col) => {
        const y = Math.max(pt + 6, Math.min(pt + gh - 6, yOf(v))), x = pl + gw + 2;
        ctx.fillStyle = col; ctx.fillRect(x, y - 6, pr - 3, 12);
        ctx.fillStyle = '#fff'; ctx.font = '9px monospace'; ctx.textAlign = 'left'; ctx.fillText(fmtInt(v), x + 2, y + 3);
      };
      if (miniShow.cost) tag(cost, '#c27a1a');
      if (miniShow.vwap) tag(miniVw[n - 1], '#a21fb5');

      // 滑鼠懸停資訊（右上）
      ctx.font = '9px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#d1d4dc';
      const k = hv != null ? hv : n - 1;
      ctx.fillText(`${miniFmtT(miniT[k])}  ${miniNum(closes[k])}` + (miniShow.vwap ? `  VWAP ${fmtInt(miniVw[k])}` : ''), pl + gw, pt - 5);

      setChip('card-vwap', miniVw[n - 1]); setChip('card-cost', cost);
    }

    function initMiniChart() {
      const canvas = document.getElementById('miniVixCanvas'); if (!canvas) return;
      const box = canvas.parentNode; box.style.touchAction = 'none'; box.style.cursor = 'crosshair';
      const bounds = () => { const n = miniT.length; return { f0: miniT[0], f1: miniT[n - 1] }; };
      const gwOf = () => box.getBoundingClientRect().width - MINI_GEO.pl - MINI_GEO.pr;
      const curView = () => { const { f0, f1 } = bounds(); return miniView ? { a: miniView.a, b: miniView.b } : { a: f0, b: f1 }; };
      function setView(a, b) {
        if (!miniT.length) return;
        const { f0, f1 } = bounds(), full = (f1 - f0) || 1;
        const minSpan = Math.min(full, Math.max(full / 80, 3 * 60000));
        let span = Math.max(minSpan, Math.min(b - a, full));
        if (span >= full * 0.999) { miniView = null; renderMini(); return; }
        a = Math.max(f0, Math.min(a, f1 - span)); miniView = { a, b: a + span }; renderMini();
      }
      function zoomAt(x, factor) {
        const v = curView(), span = v.b - v.a, gw = gwOf(); if (gw <= 0) return;
        const ratio = Math.max(0, Math.min(1, (x - MINI_GEO.pl) / gw)), ft = v.a + span * ratio, ns = span * factor;
        setView(ft - ns * ratio, ft - ns * ratio + ns);
      }
      const relX = e => (e.touches ? e.touches[0].clientX : e.clientX) - box.getBoundingClientRect().left;
      // 通知主圖 K 線：游標目前對應的時間 (毫秒)，null = 離開
      const emitHover = () => {
        if (!window.__onMiniHover) return;
        let ms = null;
        const gw = gwOf();
        if (miniHoverX != null && miniT.length && miniHoverX >= MINI_GEO.pl && miniHoverX <= MINI_GEO.pl + gw) {
          const v = curView(); ms = miniT[miniNearest(v.a + (miniHoverX - MINI_GEO.pl) / gw * (v.b - v.a))];
        }
        try { window.__onMiniHover(ms); } catch (e) {}
      };

      box.addEventListener('wheel', e => { e.preventDefault(); zoomAt(relX(e), e.deltaY < 0 ? 0.8 : 1.25); }, { passive: false });
      let drag = null;
      box.addEventListener('mousedown', e => { if (e.target.closest('.mini-ctl')) return; drag = { x: e.clientX, v: curView() }; box.style.cursor = 'grabbing'; });
      window.addEventListener('mouseup', () => { drag = null; box.style.cursor = 'crosshair'; });
      window.addEventListener('mousemove', e => {
        if (drag) { const dt = -(e.clientX - drag.x) / gwOf() * (drag.v.b - drag.v.a); setView(drag.v.a + dt, drag.v.b + dt); }
      });
      box.addEventListener('mousemove', e => { miniHoverX = relX(e); if (!drag) { renderMini(); emitHover(); } });
      box.addEventListener('mouseleave', () => { miniHoverX = null; renderMini(); emitHover(); });
      box.addEventListener('dblclick', () => { miniView = null; renderMini(); });

      // 觸控：單指平移 / 雙指縮放
      let tch = null;
      const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
      box.addEventListener('touchstart', e => {
        const r = box.getBoundingClientRect();
        if (e.touches.length === 2) tch = { d: dist(e.touches), mid: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, v: curView() };
        else if (e.touches.length === 1) { tch = { x: e.touches[0].clientX, v: curView() }; miniHoverX = relX(e); emitHover(); }
      }, { passive: true });
      box.addEventListener('touchmove', e => {
        if (!tch) return; e.preventDefault();
        if (e.touches.length === 2 && tch.d) {
          const f = tch.d / dist(e.touches), v = tch.v, span = v.b - v.a, ratio = Math.max(0, Math.min(1, (tch.mid - MINI_GEO.pl) / gwOf())), ft = v.a + span * ratio, ns = span * f;
          setView(ft - ns * ratio, ft - ns * ratio + ns);
        } else if (e.touches.length === 1 && tch.x != null) {
          const dt = -(e.touches[0].clientX - tch.x) / gwOf() * (tch.v.b - tch.v.a); miniHoverX = relX(e); setView(tch.v.a + dt, tch.v.b + dt); emitHover();
        }
      }, { passive: false });
      box.addEventListener('touchend', () => { tch = null; miniHoverX = null; renderMini(); emitHover(); });

      // 按鈕：放大 / 縮小 / 重設
      const mid = () => MINI_GEO.pl + gwOf() / 2;
      document.getElementById('mini-zin').onclick = () => zoomAt(mid(), 0.7);
      document.getElementById('mini-zout').onclick = () => zoomAt(mid(), 1.4);
      document.getElementById('mini-zreset').onclick = () => { miniView = null; renderMini(); };

      // VWAP / 成本線 開關
      const syncChips = () => ['vwap', 'cost'].forEach(k => document.getElementById('chip-' + k).classList.toggle('off', !miniShow[k]));
      ['vwap', 'cost'].forEach(k => document.getElementById('chip-' + k).onclick = () => {
        miniShow[k] = !miniShow[k];
        try { localStorage.setItem('miniShow', JSON.stringify(miniShow)); } catch (e) {}
        syncChips(); renderMini();
      });
      syncChips();
      new ResizeObserver(renderMini).observe(box);
      setInterval(renderMini, 2000);                 // 報價更新 → 成本線跟著動
      setInterval(fetchAndRenderMiniVix, 15000);     // 定時更新走勢資料（縮放狀態保留）
    }
    document.addEventListener('DOMContentLoaded', initMiniChart);

    /* 左右面板寬度調整 (同時支援 Mouse 及 Touch) */
    function initPanelResizer() {
      const resizer = document.getElementById('panel-resizer');
      const panelWrapper = document.getElementById('watchlist-wrapper');
      if (!resizer) return;

      let isResizing = false;
      let startX = 0;
      let startWidth = 410;

      const onStart = (clientX) => {
        isResizing = true;
        startX = clientX;
        startWidth = panelWrapper.offsetWidth;
        document.body.style.cursor = 'ew-resize';
      };

      const onMove = (clientX) => {
        if (!isResizing) return;
        let newWidth = startWidth + (startX - clientX);
        newWidth = Math.max(300, Math.min(newWidth, 680));
        panelWrapper.style.width = `${newWidth}px`;
        if (chart) {
          const container = document.getElementById('chart-container');
          chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
        }
      };

      const onEnd = () => {
        if (!isResizing) return;
        isResizing = false;
        document.body.style.cursor = '';
      };

      resizer.addEventListener('mousedown', (e) => {
        onStart(e.clientX);
        const handleMouseMove = (e) => onMove(e.clientX);
        const handleMouseUp = () => {
          onEnd();
          document.removeEventListener('mousemove', handleMouseMove);
          document.removeEventListener('mouseup', handleMouseUp);
        };
        document.addEventListener('mousemove', handleMouseMove);
        document.addEventListener('mouseup', handleMouseUp);
      });
    }

    /* 下方詳細面板上下高度拖曳調整 (支援 Touch + Mouse，阻止畫面被拖動) */
    function initBottomResizer() {
      const resizer = document.getElementById('bottom-resizer');
      const detailCard = document.getElementById('symbol-detail-card');

  <!-- ============ 外掛指標載入器：讀取 indicators/ 目錄 ============ -->
  <script>
/* ===================== 外掛指標載入器（讀取 indicators/ 目錄） =====================

 * 底部指標列會自動多出對應分頁：點一下開/關，連點兩下開參數視窗；設定存在 localStorage。
 * 主圖指標(pane:'main')疊在 K 線上；副圖指標(pane:'sub')在主圖底部切出一塊獨立區域。
 * 本機(file://)與 GitHub Pages 皆可：用 <script> 載入，不使用 fetch，不受 file:// 限制。

window.TVInd = (function () {
  'use strict';
  const DIR = 'indicators/';
  const FALLBACK = ['filter.js', 'atr.js', 'dayweek.js', 'duotou.js', 'vegas.js', 'vwap.js', 'week_vwap.js', 'wave.js', 'mcdx.js', 'chip.js', 'volume.js'];
  const LS = 'tvIndPlug_v1';
  const TAB_ON = 'text-[#ffcc66] font-bold border-b-2 border-[#ffcc66] pb-1 transition-colors';

  /* ---------------- 技術指標函式（與 Pine 同語意；NaN 代表 na） ---------------- */
  const ta = {
    ema(src, len) { const a = 2 / (len + 1), o = new Array(src.length); let p = NA; for (let i = 0; i < src.length; i++) { const v = src[i]; if (isn(v)) { o[i] = NA; continue; } p = isn(p) ? v : a * v + (1 - a) * p; o[i] = p; } return o; },

    sma(src, len) { const o = new Array(src.length); let s = 0; for (let i = 0; i < src.length; i++) { s += src[i]; if (i >= len) s -= src[i - len]; o[i] = i >= len - 1 ? s / len : NA; } return o; },
    hi(src, i, len) { if (i - len + 1 < 0) return NA; let m = -Infinity; for (let k = i - len + 1; k <= i; k++) if (src[k] > m) m = src[k]; return m; },
    lo(src, i, len) { if (i - len + 1 < 0) return NA; let m = Infinity; for (let k = i - len + 1; k <= i; k++) if (src[k] < m) m = src[k]; return m; },
    highest(src, len) { return src.map((_, i) => ta.hi(src, i, len)); },
    lowest(src, len) { return src.map((_, i) => ta.lo(src, i, len)); },
    tr(cs) { return cs.map((b, i) => i === 0 ? b.high - b.low : Math.max(b.high - b.low, Math.abs(b.high - cs[i - 1].close), Math.abs(b.low - cs[i - 1].close))); },
    rsi(src, len) {

      const u = ta.rma(up, len), d = ta.rma(dn, len);

  /* ---------------- 交易日 / 週 key（與必來點相同的商品交易時段設定 APP_CFG.zoneSessions） ---------------- */
  const ZD = { tz: 'Asia/Taipei', start: 525, evening: false, weekend: false };
  const offC = {}, fmtC = {};

  /* ---------------- 版面：副圖在主圖底部依序往上堆疊 ---------------- */
