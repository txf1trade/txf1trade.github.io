<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>台指期籌碼</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#1a73e8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="台指期籌碼">
<script>
// 深淺模式：用上次選的；沒選過就預設深色。先在這裡決定好，畫面才不會閃一下
(function () {
  var t = null;
  try { t = localStorage.getItem("shellTheme"); } catch (e) {}
  if (t !== "light" && t !== "dark") {
    t = "dark";
    try { localStorage.setItem("shellTheme", t); } catch (e) {}   // 記下來，各頁面一開始就讀到深色，不會先閃一下淺色
  }
  document.documentElement.setAttribute("data-theme", t);
})();
</script>
<style>
  /* 選單、設定面板的顏色固定不變（一律深色）；深淺模式只改「畫面」(--pg) */
  :root { --bg:#161615; --fg:#ececea; --bar:#222221; --line:#3a3a38; --blue:#6aa8ff; --muted:#a3a39d; --bw:78px; --pg:#f6f6f4; }
  :root[data-theme="light"] { --pg:#f6f6f4; color-scheme:light; }
  :root[data-theme="dark"] { --pg:#161615; color-scheme:dark; }
  #tabs, #panel, #grip { color-scheme:dark; }
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:var(--pg); color:var(--fg); overscroll-behavior:none; touch-action:manipulation;
    font:14px/1.4 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  button { font:inherit; }

  /* ===== 內容區 ===== */
  #app { position:fixed; inset:0; }
  #views { position:absolute; inset:0; }
  #views iframe { position:absolute; inset:0; width:100%; height:100%; border:0; background:var(--pg); display:none; }
  #views iframe.on { display:block; }
  /* 固定顯示：內容讓出選單的寬度 */
  body[data-mode="fixed"][data-side="right"] #app { right:calc(var(--bw) + env(safe-area-inset-right)); }
  body[data-mode="fixed"][data-side="left"]  #app { left:calc(var(--bw) + env(safe-area-inset-left)); }

  /* ===== 選單 ===== */
  #tabs { position:fixed; z-index:12; display:flex; flex-direction:column; gap:2px; padding:6px; background:var(--bar);
    border:1px solid var(--line); width:var(--bw); }
  #tabs button { border:0; background:none; color:var(--muted); padding:6px 4px; font:inherit; cursor:pointer; width:100%; flex-shrink:0;
    border-radius:10px; display:flex; flex-direction:column; align-items:center; gap:2px; }
  #tabs .ic { font-size:22px; line-height:1.2; }
  #tabs .tx { font-size:12px; white-space:nowrap; }
  #tabs button.on { color:var(--blue); font-weight:700; background:rgba(128,128,128,.14); }
  /* 深淺模式切換鈕（選單最上方） */
  #tabs button.themeb { width:44px; height:40px; padding:0; align-self:center; justify-content:center; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg); }
  #tabs .sep { height:1px; background:var(--line); margin:4px 6px; flex-shrink:0; }
  #tabs .grow { flex:1; }

  /* 自動隱藏：浮動卡片，從邊緣滑出 */
  body[data-mode="auto"] #tabs { max-height:calc(100dvh - 20px); overflow-y:auto; top:var(--menu-top, 50%); box-shadow:0 0 16px rgba(0,0,0,.18); transition:transform .22s ease; }
  body[data-mode="auto"][data-side="right"] #tabs { right:0; border-right:0; border-radius:14px 0 0 14px;
    padding-right:calc(6px + env(safe-area-inset-right)); width:calc(var(--bw) + env(safe-area-inset-right)); transform:translate(105%, -50%); }
  body[data-mode="auto"][data-side="left"] #tabs { left:0; border-left:0; border-radius:0 14px 14px 0;
    padding-left:calc(6px + env(safe-area-inset-left)); width:calc(var(--bw) + env(safe-area-inset-left)); transform:translate(-105%, -50%); }
  body[data-mode="auto"] #tabs.on { transform:translate(0, -50%); }
  body[data-mode="auto"] #tabs .grow { display:none; }

  /* 固定顯示：貼邊的整條側欄 */
  body[data-mode="fixed"] #tabs { top:0; bottom:0; border-top:0; border-bottom:0; border-radius:0; overflow-y:auto;
    padding-top:calc(6px + env(safe-area-inset-top)); padding-bottom:calc(6px + env(safe-area-inset-bottom)); }
  body[data-mode="fixed"][data-side="right"] #tabs { right:0; border-right:0; padding-right:calc(6px + env(safe-area-inset-right)); width:calc(var(--bw) + env(safe-area-inset-right)); }
  body[data-mode="fixed"][data-side="left"]  #tabs { left:0; border-left:0; padding-left:calc(6px + env(safe-area-inset-left)); width:calc(var(--bw) + env(safe-area-inset-left)); }

  /* 把手與遮罩（只有自動隱藏用得到） */
  #mask { position:fixed; inset:0; z-index:10; display:none; background:rgba(0,0,0,.15); }
  #mask.on { display:block; }
  #grip { position:fixed; top:var(--menu-top, 50%); transform:translateY(-50%); z-index:11; width:14px; height:48px; padding:0; border:1px solid rgba(255,255,255,.22);
    background:rgba(34,34,33,.35); -webkit-backdrop-filter:blur(4px); backdrop-filter:blur(4px); color:rgba(255,255,255,.7); opacity:.45; cursor:pointer; font-size:12px; font-weight:700; line-height:1;
    -webkit-tap-highlight-color:transparent; box-shadow:none; transition:opacity .15s; }
  #grip::after { content:""; position:absolute; inset:-10px -14px -10px -6px; } /* 加大觸碰範圍，視覺仍然很小 */
  body[data-side="right"] #grip::after { inset:-10px -6px -10px -14px; }
  #grip:active { opacity:.95; }
  body[data-side="right"] #grip { right:0; border-right:0; border-radius:8px 0 0 8px; }
  body[data-side="left"]  #grip { left:0; border-left:0; border-radius:0 8px 8px 0; }
  #grip.hide, body[data-mode="fixed"] #grip, body[data-mode="fixed"] #mask { display:none; }

  /* ===== 設定面板 ===== */
  #smask { position:fixed; inset:0; z-index:20; display:none; background:rgba(0,0,0,.35); }
  #smask.on { display:flex; align-items:center; justify-content:center; }
  #panel { max-height:92dvh; overflow-y:auto; width:min(86vw, 320px); background:var(--bar); border:1px solid var(--line); border-radius:14px; padding:14px 16px 12px; box-shadow:0 8px 28px rgba(0,0,0,.3); }
  #panel h2 { margin:0 0 10px; font-size:16px; }
  #panel .row { margin:10px 0; }
  #panel .lb { font-size:13px; color:var(--muted); margin-bottom:4px; }
  .seg { display:flex; border:1px solid var(--line); border-radius:9px; overflow:hidden; }
  .seg button { flex:1; border:0; background:none; color:var(--fg); padding:8px 4px; font-size:14px; cursor:pointer; }
  .seg button + button { border-left:1px solid var(--line); }
  .seg button.on { background:var(--blue); color:#fff; }
  #selHome { width:100%; padding:8px 10px; font:inherit; font-size:14px; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:9px; }
  /* ===== 返回首頁小圓點（像 iPhone 的輔助小點） ===== */
  #dot { position:fixed; z-index:9; top:0; left:0; width:44px; height:44px; padding:0; border:0; border-radius:50%; display:none;
    background:rgba(60,60,60,.5); -webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px); opacity:.75; cursor:pointer;
    touch-action:none; -webkit-tap-highlight-color:transparent; box-shadow:0 0 0 1px rgba(255,255,255,.18) inset, 0 2px 8px rgba(0,0,0,.2); }
  #dot i { position:absolute; inset:10px; border-radius:50%; background:rgba(255,255,255,.2); box-shadow:0 0 0 2px rgba(255,255,255,.85) inset; }
  #dot i::after { content:""; position:absolute; inset:7px; border-radius:50%; background:rgba(255,255,255,.9); }
  #dot:active { opacity:1; }
  #panel .done { width:100%; margin-top:10px; padding:9px; border:0; border-radius:9px; background:var(--blue); color:#fff; font-size:15px; cursor:pointer; }

  /* ===== 提示訊息 ===== */
  #toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:30; max-width:86vw;
    background:rgba(30,30,30,.92); color:#fff; padding:10px 14px; border-radius:10px; font-size:14px; display:none; text-align:center; }
</style>
</head>
<body data-side="right" data-mode="auto">
<div id="app"><div id="views"></div></div>
<div id="mask"></div>
<button id="grip" aria-label="開啟選單"></button>
<button id="dot" aria-label="返回首頁"><i></i></button>
<nav id="tabs"></nav>

<div id="smask">
  <div id="panel">
    <h2>選單設定</h2>
    <div class="row"><div class="lb">選單位置</div>
      <div class="seg" id="segSide"><button data-v="left">靠左</button><button data-v="right">靠右</button></div></div>
    <div class="row"><div class="lb">顯示方式</div>
      <div class="seg" id="segMode"><button data-v="auto">自動隱藏</button><button data-v="fixed">固定顯示</button></div></div>
    <div class="row"><div class="lb">返回首頁小圓點（可拖曳位置）</div>
      <div class="seg" id="segDot"><button data-v="on">開啟</button><button data-v="off">關閉</button></div></div>
    <div class="row"><div class="lb">首頁（開啟時先顯示）</div>
      <select id="selHome"></select></div>
    <button class="done" id="sdone">完成</button>
  </div>
</div>
<div id="toast"></div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  設定區（要調整什麼，只改這一塊，下面的程式不用動）          ║
// ╚══════════════════════════════════════════════════════════════╝
const CONFIG = {

  // ── 1. 選單預設值 ───────────────────────────────────────────
  // 這裡只是「第一次開啟」的預設值。使用者在 ⚙️設定 裡改過之後，
  // 會以瀏覽器記住的為準（想讓大家重新套用新預設：把下面 version 加 1）。
  defaults: {
    side: "left",   // 選單位置：  "right" 靠右 ／ "left" 靠左
    mode: "auto",    // 顯示方式：  "auto" 自動隱藏（點把手滑出）／ "fixed" 固定顯示（貼邊整條側欄）
    dot: true,       // 返回首頁小圓點：true 開啟 ／ false 關閉（可在 ⚙️設定 切換；點一下回首頁，按住可拖曳）
  },
  version: 1,        // 預設值版本號：改了上面的 defaults 想強制套用到所有人，就把這個數字 +1

  // ── 1.5 首頁（開啟網頁時先顯示哪一個分頁）────────────────────
  home: "台指籌碼",      // 填下面分頁清單裡的 name（名稱要完全一樣）；找不到就開第一個
  rememberLast: false,   // false = 每次開啟都回首頁；true = 改成開啟上次看的分頁（首頁只在第一次用）
                         // （網址加 #3 之類可直接指定開哪一頁：#0 是第一個、#1 是第二個…，優先於以上設定）

  // ── 2. 選單外觀 ─────────────────────────────────────────────
  menuTop: "50%",        // 自動隱藏模式下，選單與小把手在畫面上的高度（"50%" 置中；"35%" 偏上；"65%" 偏下，建議 30%～70%）
  autoHideSeconds: 4,    // 自動隱藏模式下，選單打開後幾秒沒操作就收起來（填 0 = 不自動收，只能點旁邊收）
  appName: "台指期籌碼",   // 網頁標題（切換分頁時會被分頁名稱取代）

  // ── 3. 分頁清單（選單裡的項目，由上到下的順序就是選單順序）──
  // 【新增】複製任一行貼到想要的位置，改 name / icon / url 即可
  // 【刪除】把那一行刪掉（或在行首加 // 暫時停用）
  // 【排序】上下搬移整行
  // 【欄位說明】
  //   name : 選單上顯示的名稱（建議 2～4 個字，太長會被擠）
  //   icon : 圖示（任何 emoji）
  //   url  : 頁面檔案位置，相對於這個 index.html，例如 "page/xxx.html"
  //          （外部網站也可以，但對方若禁止被嵌入就會空白）
  //   live : 選填。true = 這頁會一直自動更新報價；切到別頁時會先關掉它
  //          （不再背景連線、省流量、避免限流），切回來再重新載入。
  //          有輸入欄位、怕被清空的頁面不要加。
  tabs: [
    { name: "關鍵價",   icon: "📈", url: "page/txf-key.html" },
    { name: "未平倉增量", icon: "📊", url: "page/txfoi.html" },
    { name: "盤後籌碼", icon: "🧾", url: "page/data.html" },
    { name: "鉅額交易", icon: "🐋", url: "page/block.html" },
    { name: "台指籌碼", icon: "🎯", url: "page/txfchip.html", live: true },
    { name: "股期",     icon: "📉", url: "page/gu7.html",     live: true },
    { name: "熱門股",   icon: "🔥", url: "page/dailyrank.html", live: true },
    { name: "指視圖",   icon: "🕯️", url: "page/miniTrade.html", live: true },
    { name: "波動率",   icon: "🌡️", url: "page/txfvix.html",    live: true },
    { name: "富台",     icon: "🔁", url: "page/tnntoweb.html",  live: true },
    { name: "海期",     icon: "🌏", url: "page/foreignf.html",  live: true },
    { name: "風險試算", icon: "🧮", url: "page/rratio.html" },
    { name: "處置股",   icon: "🚫", url: "page/disposal.html" },
  ],
};
// ═══════════════════════ 以下是程式，一般不用改 ═══════════════════════
const TABS = CONFIG.tabs;

const $ = (id) => document.getElementById(id);
const frames = [];
let cur = -1, hideTimer = null, deferredInstall = null;

// ---- 選單設定（記在瀏覽器） ----
const prefs = Object.assign({}, CONFIG.defaults, { home: CONFIG.home });
try {
  // 預設值版本號有變 → 忽略瀏覽器舊記憶，套用新預設
  if (Number(localStorage.getItem("shellPrefsVer")) === CONFIG.version)
    Object.assign(prefs, JSON.parse(localStorage.getItem("shellPrefs") || "{}"));
  localStorage.setItem("shellPrefsVer", CONFIG.version);
} catch (e) {}
if (prefs.side !== "left") prefs.side = "right";
if (prefs.mode !== "fixed") prefs.mode = "auto";
prefs.dot = prefs.dot !== false;
if (!TABS.some((t) => t.name === prefs.home)) prefs.home = CONFIG.home; // 記住的首頁已不在清單裡 → 回到預設首頁
document.documentElement.style.setProperty("--menu-top", CONFIG.menuTop);
document.title = CONFIG.appName;

function applyPrefs() {
  document.body.dataset.side = prefs.side;
  document.body.dataset.mode = prefs.mode;
  $("grip").textContent = prefs.side === "right" ? "‹" : "›";
  document.querySelectorAll("#segSide button").forEach((b) => b.classList.toggle("on", b.dataset.v === prefs.side));
  document.querySelectorAll("#segMode button").forEach((b) => b.classList.toggle("on", b.dataset.v === prefs.mode));
  $("selHome").value = prefs.home;
  document.querySelectorAll("#segDot button").forEach((b) => b.classList.toggle("on", (b.dataset.v === "on") === prefs.dot));
  $("dot").style.display = prefs.dot ? "block" : "none";
  placeDot();
  closeMenu();
  try { localStorage.setItem("shellPrefs", JSON.stringify(prefs)); } catch (e) {}
}

// ---- 自動隱藏選單 ----
function armTimer() { clearTimeout(hideTimer); if (CONFIG.autoHideSeconds > 0) hideTimer = setTimeout(closeMenu, CONFIG.autoHideSeconds * 1000); } // 幾秒沒操作自動隱藏
function openMenu() {
  if (prefs.mode === "fixed") return;
  $("tabs").classList.add("on"); $("mask").classList.add("on"); $("grip").classList.add("hide");
  armTimer();
}
function closeMenu() {
  clearTimeout(hideTimer);
  $("tabs").classList.remove("on"); $("mask").classList.remove("on"); $("grip").classList.remove("hide");
}
$("grip").onclick = openMenu;
$("mask").onclick = closeMenu;
$("tabs").addEventListener("pointerdown", () => { if (prefs.mode === "auto" && $("tabs").classList.contains("on")) armTimer(); });

// ---- 選單內容：分頁 + 下方「安裝APP／設定」 ----
const isStandalone = () => matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

function item(icon, text, cls) {
  const b = document.createElement("button");
  b.className = cls || "";
  b.innerHTML = '<span class="ic">' + icon + '</span><span class="tx">' + text + "</span>";
  return b;
}
// ---- 深淺模式：全部頁面統一由這裡控制（選單最上方的按鈕），選擇會記在瀏覽器 ----
const ICON_SUN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>';
const ICON_MOON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>';
let theme = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
function postTheme(win) { try { win.postMessage({ type: "shell-theme", theme: theme }, "*"); } catch (e) {} }
function applyTheme() {
  document.documentElement.setAttribute("data-theme", theme);
  $("themeBtn").innerHTML = theme === "dark" ? ICON_SUN : ICON_MOON;   // 深色時顯示太陽（點了變淺色），淺色時顯示月亮
  frames.forEach((f) => f && postTheme(f.contentWindow));
}
const tb = document.createElement("button");
tb.id = "themeBtn"; tb.className = "themeb"; tb.title = "切換深淺模式"; tb.setAttribute("aria-label", "切換深淺模式");
tb.onclick = () => {
  theme = theme === "dark" ? "light" : "dark";
  try { localStorage.setItem("shellTheme", theme); } catch (e) {}
  applyTheme();
};
$("tabs").appendChild(tb);
$("tabs").insertAdjacentHTML("beforeend", '<div class="sep"></div>');
applyTheme();

TABS.forEach((t, i) => {
  const b = item(t.icon, t.name, "tab");
  b.onclick = () => { show(i); if (prefs.mode === "auto") closeMenu(); };
  $("tabs").appendChild(b);
});
$("tabs").insertAdjacentHTML("beforeend", '<div class="grow"></div><div class="sep"></div>');
if (!isStandalone()) {
  const a = item("📲", "安裝APP", "tool");
  a.onclick = installApp;
  $("tabs").appendChild(a);
}
const s = item("⚙️", "設定", "tool");
s.onclick = () => { closeMenu(); $("smask").classList.add("on"); };
$("tabs").appendChild(s);

// ---- 安裝成 APP ----
addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferredInstall = e; });
addEventListener("appinstalled", () => { deferredInstall = null; toast("已安裝，可從主畫面開啟"); });
async function installApp() {
  if (prefs.mode === "auto") closeMenu();
  if (deferredInstall) {
    deferredInstall.prompt();
    try { await deferredInstall.userChoice; } catch (e) {}
    deferredInstall = null;
    return;
  }
  if (isIOS()) toast("請點瀏覽器下方的「分享」，再選「加入主畫面」", 6000);
  else toast("請從瀏覽器選單選「安裝應用程式」或「加到主畫面」", 6000);
}
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

let toastTimer = null;
function toast(msg, ms) {
  const t = $("toast");
  t.textContent = msg; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, ms || 3000);
}

// ---- 設定面板 ----
document.querySelectorAll("#segSide button").forEach((b) => (b.onclick = () => { prefs.side = b.dataset.v; applyPrefs(); }));
document.querySelectorAll("#segMode button").forEach((b) => (b.onclick = () => { prefs.mode = b.dataset.v; applyPrefs(); }));
TABS.forEach((t) => {
  const o = document.createElement("option");
  o.value = t.name; o.textContent = t.icon + " " + t.name;
  $("selHome").appendChild(o);
});
$("selHome").onchange = () => {
  prefs.home = $("selHome").value;
  try { localStorage.setItem("shellPrefs", JSON.stringify(prefs)); } catch (e) {}
  toast("首頁已設為「" + prefs.home + "」");
};
document.querySelectorAll("#segDot button").forEach((b) => (b.onclick = () => { prefs.dot = b.dataset.v === "on"; applyPrefs(); }));
$("sdone").onclick = () => $("smask").classList.remove("on");
$("smask").onclick = (e) => { if (e.target === $("smask")) $("smask").classList.remove("on"); };

// ---- 切換分頁 ----
function show(i) {
  if (i === cur || !TABS[i]) return;
  cur = i;
  // 第一次點到才載入（省流量、也避免一開網頁就同時打很多 API 被限流）；載入後保留，切換回來不會重載
  if (!frames[i]) {
    const f = document.createElement("iframe");
    f.src = TABS[i].url;
    f.title = TABS[i].name;
    f.addEventListener("load", () => postTheme(f.contentWindow));   // 頁面載入完成後，把目前的深淺模式告訴它
    $("views").appendChild(f);
    frames[i] = f;
  }
  frames.forEach((f, k) => {
    if (!f) return;
    if (k !== i && TABS[k].live) { f.remove(); frames[k] = null; return; } // 即時頁切走就關掉
    f.classList.toggle("on", k === i);
  });
  document.querySelectorAll("#tabs .tab").forEach((b, k) => b.classList.toggle("on", k === i));
  document.title = TABS[i].name;
  try { localStorage.setItem("lastTab", i); } catch (e) {}
}

// ---- 返回首頁小圓點：點一下回首頁、按住可拖曳（放開會吸到左右邊緣，位置會記住） ----
const DOT = 44, DOTM = 6;
let dotPos = null, drag = null;
try { dotPos = JSON.parse(localStorage.getItem("dotPos") || "null"); } catch (e) {}
function safeInsets() {
  const p = document.createElement("div");
  p.style.cssText = "position:fixed;visibility:hidden;padding:0 env(safe-area-inset-right,0px) 0 env(safe-area-inset-left,0px)";
  document.body.appendChild(p);
  const cs = getComputedStyle(p), r = { l: parseFloat(cs.paddingLeft) || 0, r: parseFloat(cs.paddingRight) || 0 };
  p.remove();
  return r;
}
function placeDot(animate) {
  const d = $("dot");
  // 沒拖曳過 → 預設放在選單的對面那一側，避免擋到選單
  const side = dotPos && (dotPos.s === "l" || dotPos.s === "r") ? dotPos.s : (prefs.side === "right" ? "l" : "r");
  const ratio = dotPos && isFinite(dotPos.y) ? dotPos.y : 0.78;
  const ins = safeInsets(), W = innerWidth, H = innerHeight;
  d.style.transition = animate ? "left .18s ease, top .18s ease" : "none";
  d.style.left = (side === "l" ? ins.l + DOTM : W - DOT - DOTM - ins.r) + "px";
  d.style.top = Math.min(Math.max(ratio * H - DOT / 2, 8), H - DOT - 8) + "px";
}
function goHome() {
  const i = TABS.findIndex((t) => t.name === prefs.home);
  show(i < 0 ? 0 : i);
}
$("dot").addEventListener("pointerdown", (e) => {
  const d = $("dot");
  drag = { id: e.pointerId, sx: e.clientX, sy: e.clientY, ox: parseFloat(d.style.left), oy: parseFloat(d.style.top), moved: false };
  d.setPointerCapture(e.pointerId);
});
$("dot").addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (!drag.moved && Math.hypot(dx, dy) < 6) return;   // 移動很小視為點擊
  drag.moved = true;
  const d = $("dot");
  d.style.transition = "none";
  d.style.left = Math.min(Math.max(drag.ox + dx, 0), innerWidth - DOT) + "px";
  d.style.top = Math.min(Math.max(drag.oy + dy, 8), innerHeight - DOT - 8) + "px";
});
$("dot").addEventListener("pointerup", (e) => {
  if (!drag || e.pointerId !== drag.id) return;
  const was = drag; drag = null;
  if (!was.moved) { goHome(); return; }
  const d = $("dot");
  dotPos = { s: parseFloat(d.style.left) + DOT / 2 < innerWidth / 2 ? "l" : "r", y: (parseFloat(d.style.top) + DOT / 2) / innerHeight };
  try { localStorage.setItem("dotPos", JSON.stringify(dotPos)); } catch (e2) {}
  placeDot(true);
});
$("dot").addEventListener("pointercancel", () => { drag = null; placeDot(true); });
addEventListener("resize", () => placeDot());

applyPrefs();
// 開啟時：網址 #1 優先，其次（若 rememberLast）上次看的分頁，最後是首頁（設定裡選的；沒選過則用 CONFIG.home）
const fromHash = parseInt(location.hash.slice(1), 10);
let homeIdx = TABS.findIndex((t) => t.name === prefs.home);
if (homeIdx < 0) homeIdx = 0;
let startIdx = homeIdx;
if (CONFIG.rememberLast) {
  try { const l = parseInt(localStorage.getItem("lastTab"), 10); if (TABS[l]) startIdx = l; } catch (e) {}
}
show(TABS[fromHash] ? fromHash : startIdx);
addEventListener("hashchange", () => { const n = parseInt(location.hash.slice(1), 10); if (!isNaN(n)) show(n); });
</script>
</body>
</html>
