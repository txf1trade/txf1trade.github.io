      const sum = others.reduce((a, id) => a + base[id], 0), f = sum ? Math.min(1, (cap - nh) / sum) : 1;
      st.heights = st.heights || {};
      ids.forEach(id => { st.heights[id] = id === r.def.id ? Math.round(nh) : Math.max(50, Math.round(base[id] * f)); });
      layout(); tick(true);
    });
    const end = () => { if (!drag) return; drag = false; saveSt(); };
    hl.addEventListener('pointerup', end); hl.addEventListener('pointercancel', end);
    hl.addEventListener('dblclick', e => { e.stopPropagation(); if (st.heights) delete st.heights[r.def.id]; saveSt(); layout(); tick(true); });
    r.hdl = hl; r.box.appendChild(hl);
  }
  function layout() {
    if (!ready || !chart) return;
    const H = paneH(), pw = psW();
    /* 副圖由上往下的順序：依群組 ids 的順序；不在群組裡的排在後面（維持原本順序） */
    const rk = d => { const k = subOrder.indexOf(d.id); return k >= 0 ? k : 1e6 + defs.indexOf(d); };
    const subs = defs.filter(d => d.pane === 'sub' && runs[d.id].on && runs[d.id].series.length).sort((a, b) => rk(a) - rk(b));
    const tot = subs.reduce((s, d) => s + hOf(d), 0), cap = H * 0.75, k = tot > cap ? cap / tot : 1;
    lastK = k; lastHH = H;
    let y = H;
    for (let i = subs.length - 1; i >= 0; i--) { const r = runs[subs[i].id], h = Math.round(hOf(subs[i]) * k); r.band = { top: y - h, h }; y -= h; }
    const mb = subs.length ? Math.min(0.85, (H - y) / H + 0.03) : 0.15;
    try { chart.priceScale('right').applyOptions({ scaleMargins: { top: 0.12, bottom: mb } }); } catch (e) {}
    subs.forEach(d => {
      const r = runs[d.id];
      try { chart.priceScale('ind_' + d.id).applyOptions({ scaleMargins: { top: (r.band.top + 16) / H, bottom: (H - r.band.top - r.band.h + 3) / H }, autoScale: true, visible: false }); } catch (e) {}
    });
    defs.forEach(d => {
      const r = runs[d.id]; if (!r.on || !r.box) return;
      const top = d.pane === 'sub' && r.band ? r.band.top : 0, h = d.pane === 'sub' && r.band ? r.band.h : H;
      r.box.style.cssText = `position:absolute;pointer-events:none;left:0;right:${pw}px;top:${top}px;height:${h}px;` + (d.pane === 'sub' ? 'border-top:1px solid #2a2e39;' : '');
    });
    lastH = box.clientHeight;
  }

  /* ---------------- 表格（對應 Pine table） ---------------- */
  function tableHtml(t) {
    return '<table style="border-collapse:collapse;font-size:11px;font-family:ui-monospace,Menlo,Consolas,monospace">' +
      t.rows.map(row => '<tr>' + row.map(c => `<td colspan="${c.span || 1}" style="background:${c.bg || 'rgba(54,58,69,.85)'};color:${c.fg || '#fff'};border:1px solid rgba(120,123,134,.55);padding:2px 8px;text-align:center;white-space:nowrap">${c.t}</td>`).join('') + '</tr>').join('') + '</table>';
  }
  function renderTable(r) {
    if (!r.tb) return;
    const t = r.out && r.out.table, html = t ? tableHtml(t) + '|' + (t.pos || '') : '';
    if (html === r.tbHtml) return; r.tbHtml = html;
    if (!t) { r.tb.innerHTML = ''; return; }
    const [v, h] = (t.pos || 'top_right').split('_'), sub = r.def.pane === 'sub';
    r.tb.style.cssText = 'position:absolute;' + (h === 'left' ? 'left:6px;' : 'right:6px;') + (v === 'top' ? `top:${sub ? 16 : 6}px;` : v === 'bottom' ? 'bottom:4px;' : 'top:50%;transform:translateY(-50%);');
    r.tb.innerHTML = tableHtml(t);
  }

  /* ---------------- 圖例（滑鼠移到哪根 K 棒就顯示那根的數值） ---------------- */
  const fmtV = (v, f) => f === 'x1' ? v.toFixed(1) : f === 'x2' ? v.toFixed(2) : f === 'pct' ? Math.round(v) + '%' : Math.round(v).toLocaleString('en-US');
  function legendFor(r, idx) {
    const o = r.out; if (!o) return '';
    let items;
    if (typeof o.legend === 'function') items = o.legend(idx) || [];
    else items = r.def.series.filter(sp => sp.legend).map(sp => { const s = o[sp.key]; if (!s) return null; const v = s.v[idx]; if (isn(v)) return null; return { n: sp.title, v: fmtV(v, sp.fmt), c: (s.c && s.c[idx]) || sp.color }; }).filter(Boolean);
    return items.map(it => `<span style="color:${it.c}"><span class="lg-name">${it.n}</span><span class="lg-val"> ${it.v}</span></span>`).join('');
  }
  function idxAt(t) {
    const cs = currentCandles, n = cs.length; if (!n) return -1; if (t == null) return n - 1;
    let lo = 0, hi = n - 1; while (lo < hi) { const m = (lo + hi + 1) >> 1; if (cs[m].time <= t) lo = m; else hi = m - 1; }
    return lo;
  }
  function renderLegends() {
    const idx = idxAt(hoverT); if (idx < 0) { if (legendEl) legendEl.innerHTML = ''; return; }
    let main = '';
    defs.forEach(d => {
      const r = runs[d.id]; if (!r.on) return;
      const warn = r.err ? `<span style="color:#ff9800" title="${r.err.replace(/"/g, '&quot;')}">⚠</span>` : '';
      const lg = legendFor(r, idx) + warn;
      if (d.pane === 'sub') { if (r.hd) { const h = `<span class="lg-name" style="color:#d1d4dc;font-weight:600">${d.name}</span>` + lg; if (r.hd._h !== h) { r.hd._h = h; r.hd.innerHTML = h; } } }
      else main += lg;
    });
    if (legendEl && legendEl._h !== main) { legendEl._h = main; legendEl.innerHTML = main; }
  }

  /* ---------------- 計算 / 推資料 ---------------- */
  function feed(r, i, arr) {
    const s = r.series[i], p = r.prev[i], n = arr.length;
    if (n && p && p.f === arr[0].time) {
      if (p.n === n && p.t === arr[n - 1].time) s.update(arr[n - 1]);
      else if (p.n + 1 === n && p.t === arr[n - 2].time) { s.update(arr[n - 2]); s.update(arr[n - 1]); }
      else s.setData(arr);
    } else s.setData(arr);
    r.prev[i] = n ? { n, t: arr[n - 1].time, f: arr[0].time } : null;
  }
  function push(r, out) {
    const cs = currentCandles, n = cs.length;
    r.def.series.forEach((sp, i) => {
      const o = out && out[sp.key];
      if (!o || !o.v) { r.series[i].setData([]); r.prev[i] = null; return; }
      const arr = new Array(n);
      for (let k = 0; k < n; k++) {
        const v = o.v[k], t = cs[k].time;
        arr[k] = isn(v) ? { time: t } : (o.c && o.c[k]) ? { time: t, value: v, color: o.c[k] } : { time: t, value: v };
      }
      feed(r, i, arr);
    });
  }
  let ctxKey = '', ctx0 = null;
  function baseCtx() {
    const cs = currentCandles, n = cs.length, l = cs[n - 1];
    const key = [curCode(), currentResolution, n, cs[0].time, l.time, l.close, l.high, l.low, l.volume].join('|');
    if (key === ctxKey && ctx0) return { key, ctx: ctx0 };
    ctxKey = key;
    ctx0 = {
      candles: cs, n, t: cs.map(b => b.time), o: cs.map(b => b.open), h: cs.map(b => b.high), l: cs.map(b => b.low), c: cs.map(b => b.close), v: cs.map(b => b.volume || 0),
      res: currentResolution, resMin: Number(currentResolution) || 0, resSec: getResolutionSeconds(currentResolution),
      isDay: currentResolution === '1D', isWeek: currentResolution === 'W', code: curCode(), ta,
      api: { getBars, sessKeyFn, weekKey, rgba, isn }
    };
    return { key, ctx: ctx0 };
  }
  function tick(force) {
    if (!ready || !chart) return;
    const on = defs.filter(d => runs[d.id].on && runs[d.id].series.length);
    if (!currentCandles.length) { on.forEach(d => { const r = runs[d.id]; if (r.out || r.prev.length) clearData(r); }); renderLegends(); return; }
    if (box.clientHeight !== lastH) layout();
    const { key, ctx } = baseCtx();
    let any = false;
    on.forEach(d => {
      const r = runs[d.id], sg = key + '|' + dataVer + '|' + JSON.stringify(r.p);
      if (!force && r.sig === sg) return;
      const pk = curCode() + '|' + currentResolution + '|' + dataVer;
      if (r.prevKey !== pk) { r.prev = []; r.prevKey = pk; }      // 換商品 / 週期 / 外部資料更新 → 整批重畫
      r.sig = sg; any = true;
      try { r.out = d.calc(Object.assign({}, ctx, { p: r.p })) || null; r.err = ''; }
      catch (e) { r.out = null; r.err = String(e && e.message || e); console.error('指標計算失敗：' + d.id, e); }
      try { push(r, r.out); renderTable(r); } catch (e) { console.error('指標繪製失敗：' + d.id, e); }
    });
    if (any || force) renderLegends();
  }

  /* ---------------- 初始化（圖表建立後由 initChart 呼叫） ---------------- */
  function init() {
    if (ready) return;
    box = $('chart-container'); legendEl = $('ind-legend');
    ovl = document.createElement('div'); ovl.style.cssText = 'position:absolute;inset:0;z-index:6;pointer-events:none;overflow:hidden'; box.appendChild(ovl);
    chart.subscribeCrosshairMove(p => { hoverT = (p && p.time) ? p.time : null; renderLegends(); });
    if (window.ResizeObserver) new ResizeObserver(() => layout()).observe(box);
    ready = true;
    defs.forEach(d => mount(runs[d.id]));
    window.__indRefreshers.push(() => tick(true));
    setInterval(() => tick(false), 500);
  }
  function showErrors() {
    if (!errors.length || !ready) return;
    const wrap = $('ind-tabs-wrap'); if (!wrap) return;
    if (!errBtn) { errBtn = document.createElement('button'); errBtn.className = 'text-[#ff9800] py-2 px-1'; errBtn.textContent = '⚠'; wrap.appendChild(errBtn); }
    errBtn.title = errors.join('\n'); errBtn.onclick = () => alert(errors.join('\n'));
  }

  /* ---------------- 載入 indicators/manifest.js 與各指標檔（依 manifest 順序） ---------------- */
  function loadScript(src) {
    return new Promise(res => {
      const s = document.createElement('script'); s.src = src; s.async = false;
      s.onload = () => res(true); s.onerror = () => { errors.push('載入失敗：' + src); res(false); };
      document.head.appendChild(s);
    });
  }
  async function boot() {
    const local = location.protocol === 'file:' || /^(localhost|127\.|192\.168\.|10\.)/.test(location.hostname);
    const bust = local ? '?_=' + Date.now() : '';
    const ok = await loadScript(DIR + 'manifest.js' + bust);
    let files = FALLBACK;
    if (ok && Array.isArray(window.INDICATOR_FILES)) files = window.INDICATOR_FILES;
    else errors.push('找不到 ' + DIR + 'manifest.js，改用內建清單');
    for (const f of files) await loadScript(DIR + f + bust);
    const t = setInterval(() => { if (ready) { clearInterval(t); showErrors(); } }, 200);
  }
  boot();

  const status = id => { const r = runs[id]; return r ? { on: r.on, err: r.err, empty: !r.out } : null; };
  const setOrder = ids => { subOrder = Array.isArray(ids) ? ids.slice() : []; try { layout(); } catch (e) {} };
  return { register, init, ta, rgba, getBars, refresh: () => tick(true), defs, errors, status, setOrder };
})();

/* 圖表建立後初始化外掛指標 */
(function () {
  const _ic = initChart;
  initChart = function () { _ic(); try { TVInd.init(); } catch (e) { console.error('外掛指標初始化失敗', e); } };
})();
  </script>

  <script>
  /* ===== 指標群組：點群組鈕＝載入該群組的指標（群組內的開、其餘全部關），指標列仍顯示全部指標 ===== */
  (function () {
    const KEY = 'tvIndGroups_v1';
    const VER = APP_CFG.indGroupsVersion || 1;
    const fromCode = () => ({ ver: VER, active: null, groups: (APP_CFG.indGroups || []).map((g, i) => ({ id: 'c' + i, name: g.name || ('群組' + (i + 1)), ids: Array.isArray(g.ids) ? g.ids.slice() : null })) });
    let S = fromCode();   // 預設＝程式碼裡 APP_CFG.indGroups；使用者在網頁上改過的會存起來並優先使用
    const ACT = 'tvIndGroupsActive_v1';
    /* 只有「在網頁編輯視窗改過群組」才會存起來並優先於程式碼；單純切換群組不會存群組內容，所以改程式碼立刻生效 */
    try { const o = JSON.parse(localStorage.getItem(KEY) || 'null'); if (o && o.edited && Array.isArray(o.groups) && o.ver === VER) S = o; } catch (e) {}
    try { const a = localStorage.getItem(ACT); if (a && S.groups.some(g => g.id === a)) S.active = a; } catch (e) {}
    const save = () => { try { S.ver = VER; S.edited = true; localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
    const saveActive = () => { try { S.active ? localStorage.setItem(ACT, S.active) : localStorage.removeItem(ACT); } catch (e) {} };
    const wrap = () => document.getElementById('ind-tabs-wrap');
    const tabs = () => [...wrap().querySelectorAll('button[id^="tab-"]')];
    const isOn = b => b.className.indexOf('border-b-2') >= 0;       // 與 TAB_ON 樣式一致
    const cur = () => S.groups.find(g => g.id === S.active) || null;
    const btn = document.getElementById('btn-ind-group');

    function label() {
      const g = cur();
      btn.querySelector('span').textContent = g ? g.name : '群組';
      btn.classList.toggle('active', !!g);
      TVInd.setOrder(g && g.ids ? g.ids : []);   // 副圖由上往下依群組 ids 順序排列
    }
    /* 載入群組：群組內的指標開、其餘關 */
    function load(g) {
      const have = tabs().map(b => b.id.slice(4));
      tabs().forEach(b => { const want = !g.ids || g.ids.includes(b.id.slice(4)); if (isOn(b) !== want) b.click(); });
      const miss = (g.ids || []).filter(id => !have.includes(id));
      if (miss.length) toast('找不到指標 id：' + miss.join('、') + '\n目前可用 id：' + have.join('、'));
      setTimeout(() => {       // 已開啟但沒有畫出東西的指標，說明原因
        const bad = (g.ids || have).filter(id => have.includes(id)).map(id => ({ id, st: TVInd.status(id) })).filter(x => x.st && x.st.on && (x.st.err || x.st.empty));
        if (bad.length) toast(bad.map(x => x.id + '：' + (x.st.err ? '計算錯誤 ' + x.st.err : '目前沒有輸出（週K不顯示／資料不足）')).join('\n'));
      }, 1200);
    }
    function toast(msg) {
      console.warn('[指標群組] ' + msg);
      const t = document.createElement('div');
      t.style.cssText = 'position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:120;background:#2a2e39;color:#ffcc66;border:1px solid #4a4f5c;border-radius:8px;padding:8px 10px;font-size:12px;white-space:pre-line;user-select:text';
      t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 7000);
    }
    label();

    /* 點擊＝切到下一個群組並載入；長按＝編輯 */
    let timer = null, longHit = false;
    btn.addEventListener('pointerdown', () => { longHit = false; timer = setTimeout(() => { longHit = true; openEditor(); }, 550); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => btn.addEventListener(ev, () => clearTimeout(timer)));
    btn.addEventListener('contextmenu', e => e.preventDefault());
    btn.addEventListener('click', () => {
      if (longHit) { longHit = false; return; }
      if (!S.groups.length) { openEditor(); return; }
      const i = S.groups.findIndex(g => g.id === S.active);
      const g = S.groups[(i + 1) % S.groups.length];
      S.active = g.id; saveActive(); load(g); label();
    });

    /* 設定選單裡也放一個入口 */
    const dd = document.getElementById('settings-dropdown');
    if (dd) {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = '編輯指標群組…';
      b.className = 'w-full text-left px-2 py-1.5 rounded bg-tvHover text-white hover:bg-tvBorder';
      b.onclick = () => { dd.classList.add('hidden'); openEditor(); };
      dd.appendChild(b);
    }

    function openEditor() {
      const old = document.getElementById('ind-group-editor'); if (old) old.remove();
      const ov = document.createElement('div'); ov.id = 'ind-group-editor';
      ov.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:center;justify-content:center;padding:12px';
      const panel = document.createElement('div');
      panel.style.cssText = 'background:#1e222d;border:1px solid #2a2e39;border-radius:8px;width:min(94vw,380px);max-height:82vh;display:flex;flex-direction:column;color:#d1d4dc;font-size:13px';
      ov.appendChild(panel);
      ov.addEventListener('click', e => { if (e.target === ov) close(); });
      const close = () => { ov.remove(); label(); };

      const head = document.createElement('div');
      head.style.cssText = 'padding:10px 12px;border-bottom:1px solid #2a2e39;font-weight:700;color:#fff';
      head.textContent = '指標群組（勾選＝切到此群組時開啟的指標）';
      const body = document.createElement('div'); body.style.cssText = 'padding:10px 12px;overflow-y:auto;flex:1';
      const foot = document.createElement('div'); foot.style.cssText = 'padding:10px 12px;border-top:1px solid #2a2e39;display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap';
      const mk = (txt, bg) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = txt; b.style.cssText = `padding:6px 12px;border-radius:6px;background:${bg};color:#fff`; return b; };
      const addB = mk('＋ 新增群組', '#2a2e39'), okB = mk('完成', '#2962ff'), rstB = mk('還原預設', '#2a2e39');
      rstB.title = '還原成程式碼裡 APP_CFG.indGroups 的設定';
      rstB.onclick = () => { try { localStorage.removeItem(KEY); localStorage.removeItem(ACT); } catch (e) {} S = fromCode(); label(); render(); };
      addB.onclick = () => { S.groups.push({ id: 'g' + Date.now(), name: '群組' + (S.groups.length + 1), ids: [] }); save(); render(); body.scrollTop = body.scrollHeight; };
      okB.onclick = close;
      foot.append(addB, rstB, okB); panel.append(head, body, foot);

      function render() {
        body.innerHTML = '';
        const all = tabs().map(b => ({ id: b.id.slice(4), label: b.textContent }));
        if (!S.groups.length) { const e = document.createElement('div'); e.style.color = '#787b86'; e.textContent = '尚無群組，請按「＋ 新增群組」。'; body.appendChild(e); }
        S.groups.forEach(g => {
          const box = document.createElement('div'); box.style.cssText = 'margin-bottom:14px';
          const row = document.createElement('div'); row.style.cssText = 'display:flex;gap:6px;margin-bottom:6px';
          const inp = document.createElement('input'); inp.value = g.name; inp.maxLength = 8;
          inp.style.cssText = 'flex:1;min-width:0;background:#131722;border:1px solid #2a2e39;border-radius:6px;padding:5px 8px;color:#fff;user-select:text';
          inp.oninput = () => { g.name = inp.value.trim() || '群組'; save(); label(); };
          const del = document.createElement('button'); del.type = 'button'; del.title = '刪除此群組';
          del.innerHTML = '<i class="fa-solid fa-trash-can"></i>'; del.style.cssText = 'padding:0 10px;color:#f23645;border-radius:6px;background:#131722;border:1px solid #2a2e39';
          del.onclick = () => { S.groups = S.groups.filter(x => x !== g); if (S.active === g.id) { S.active = null; saveActive(); } save(); label(); render(); };
          row.append(inp, del);
          const grid = document.createElement('div'); grid.style.cssText = 'display:flex;flex-wrap:wrap;gap:6px';
          all.forEach(it => {
            const on = !g.ids || g.ids.includes(it.id);
            const lab = document.createElement('label');
            lab.style.cssText = 'display:flex;align-items:center;gap:5px;padding:4px 8px;border-radius:6px;border:1px solid #2a2e39;cursor:pointer;background:' + (on ? 'rgba(41,98,255,.18)' : '#131722');
            const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = on;
            cb.onchange = () => {
              if (!g.ids) g.ids = all.map(x => x.id);
              g.ids = cb.checked ? g.ids.concat(it.id) : g.ids.filter(x => x !== it.id);
              lab.style.background = cb.checked ? 'rgba(41,98,255,.18)' : '#131722'; save();
            };
            const t = document.createElement('span'); t.textContent = it.label;
            lab.append(cb, t); grid.appendChild(lab);
          });
          box.append(row, grid); body.appendChild(box);
        });
      }
      render(); document.body.appendChild(ov);
    }
  })();
  </script>
