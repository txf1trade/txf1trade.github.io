<!DOCTYPE html>
<html lang="zh-TW">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI期權戰情室優化版</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --blue: #58a6ff;
            --red: #ff7b72; --green: #7ee787; --border: #30363d;
            --risk-bg: #490e0e; --header: #21262d; --gold: #f1e05a;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: #c9d1d9; margin: 0; padding: 8px; }
        .container { max-width: 550px; margin: auto; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 12px; background: var(--card); border-radius: 8px; overflow: hidden; }
        th { background: var(--header); color: #8b949e; padding: 10px 4px; border: 1px solid var(--border); font-size: 11px; }
        td { padding: 10px 4px; border: 1px solid var(--border); text-align: center; }
        
        .section-title { font-size: 15px; font-weight: bold; margin: 15px 0 10px 5px; color: var(--blue); border-left: 4px solid var(--blue); padding-left: 10px; }
        .num-cell { font-family: "Consolas", monospace; font-weight: bold; }
        .pos { color: var(--red); } .neg { color: var(--green); }
        .risk-active { background-color: var(--risk-bg) !important; color: #ffffff !important; font-weight: bold; }
        .settlement-warning { color: var(--gold); border: 1px solid var(--gold); padding: 2px 5px; border-radius: 4px; font-size: 10px; margin-left: 5px; animation: blink 2s infinite; }
        
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

        .group-label { background: #010409 !important; font-size: 11px; text-align: left !important; padding-left: 10px !important; color: #8b949e; height: 30px; }

        .ai-box { background: linear-gradient(145deg, #1c2128, #161b22); border: 1px solid var(--blue); border-radius: 12px; padding: 15px; margin-top: 10px; }
        .trend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .trend-val { font-size: 24px; font-weight: 900; }
        
        .battle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px; }
        .battle-card { background: #0d1117; padding: 10px; border-radius: 8px; border-top: 2px solid var(--border); }
        .card-title { font-size: 11px; color: #8b949e; margin-bottom: 5px; }
        .card-val { font-size: 13px; font-weight: bold; line-height: 1.4; }
        
        .strategy-box { background: rgba(88, 166, 255, 0.05); padding: 12px; border-radius: 8px; border: 1px dashed var(--blue); font-size: 13px; line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <div class="section-title">📊 台指期(TX) 當日沖銷動能</div>
    <div id="tx-table-container">載入中...</div>

    <div class="section-title">📜 選擇權(Option) 法人佈局<span id="day-tag"></span></div>
    <div id="opt-data-table">載入中...</div>

    <div class="ai-box">
        <div class="trend-header">
            <span style="font-size: 14px; color: #8b949e;">AI 綜合評估</span>
            <span id="trend-indicator" class="trend-val">--</span>
        </div>

        <div class="battle-grid">
            <div class="battle-card" style="border-color: #bc8cff;">
                <div class="card-title">自營商 (莊家風險)</div>
                <div id="d-action" class="card-val">分析中...</div>
            </div>
            <div class="battle-card" style="border-color: var(--blue);">
                <div class="card-title">外資 (趨勢方向)</div>
                <div id="f-action" class="card-val">分析中...</div>
            </div>
        </div>

        <div class="strategy-box">
            <div id="strategy-desc">正在計算結算週曝險權重...</div>
        </div>
    </div>
</div>

<script>
    const apiUrl = 'https://script.google.com/macros/s/AKfycbzTozA6iH5iLBS_4EM3vQxpjzb1pWBEQcahpvLwmQ98N-RmY5jhAF0iI8bc3H8RB9Wu/exec';

    const today = new Date();
    const dayOfWeek = today.getDay();
    const isSettlementPeriod = (dayOfWeek >= 1 && dayOfWeek <= 3); 
    const dayNames = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

    const dayTag = document.getElementById('day-tag');
    dayTag.innerText = `(${dayNames[dayOfWeek]})`;
    if(isSettlementPeriod) {
        dayTag.innerHTML += `<span class="settlement-warning">⚡ 結算敏感期</span>`;
    }

    async function fetchAllData() {
        try {
            const [txRes, optRes] = await Promise.all([
                fetch(`${apiUrl}?type=tx`),
                fetch(apiUrl)
            ]);
            const txData = await txRes.json();
            const optData = await optRes.json();

            let fTX = 0;
            txData.forEach(r => { if(r[0] === '外資') fTX = parseFloat(String(r[1]).replace(/,/g,'')) || 0; });

            renderTX(txData);
            renderOption(optData, fTX);
        } catch (e) {
            document.getElementById('strategy-desc').innerText = "連線失敗，請檢查網路";
        }
    }

    function renderTX(data) {
        let html = `<table><thead><tr><th>身份別</th><th>沖銷口數</th><th>成本關鍵價</th></tr></thead><tbody>`;
        data.slice(1).forEach(r => {
            const val = parseFloat(String(r[1]).replace(/,/g,'')) || 0;
            const cost = Math.round(parseFloat(String(r[2]).replace(/,/g,''))) || 0;
            html += `<tr>
                <td>${r[0]}</td>
                <td class="num-cell ${val >= 0 ? 'pos' : 'neg'}">${r[1]}</td>
                <td class="num-cell">${cost.toLocaleString()}</td>
            </tr>`;
        });
        document.getElementById('tx-table-container').innerHTML = html + "</tbody></table>";
    }

    function renderOption(data, fTX) {
        let s = { dc: 0, dp: 0, fc: 0, fp: 0 };
        let rows = { "自營商": "", "外資": "" };
        let lastT = "";

        data.slice(1).forEach(r => {
            let [t, id, diff, oi] = r;
            if (t && t.trim() !== "") lastT = t; else t = lastT;
            
            // 處理 OI 數值與正負號
            const oiV = parseFloat(String(oi).replace(/,/g, '')) || 0;
            const diffV = parseFloat(String(diff).replace(/,/g, '')) || 0;
            
            const isC = t.includes('買');
            const isRisk = oiV < 0; 
            const actLabel = isC ? (isRisk ? "SC" : "BC") : (isRisk ? "SP" : "BP");

            // 關鍵修改：OI 數值顏色判斷 (pos 為紅, neg 為綠)
            const row = `<tr class="${isRisk ? 'risk-active' : ''}">
                <td style="color:${isC ? 'var(--red)' : 'var(--green)'}">${t}</td>
                <td class="num-cell ${diffV >= 0 ? 'pos' : 'neg'}">${diff}</td>
                <td class="num-cell ${oiV >= 0 ? 'pos' : 'neg'}">${oi}</td>
                <td>${isRisk ? '⚠️ 曝險('+actLabel+')' : '正常('+actLabel+')'}</td>
            </tr>`;

            if(rows[id] !== undefined) {
                rows[id] += row;
                if(id === "自營商") { if(isC) s.dc=oiV; else s.dp=oiV; }
                else { if(isC) s.fc=oiV; else s.fp=oiV; }
            }
        });

        document.getElementById('opt-data-table').innerHTML = `<table>
            <thead><tr><th>權別</th><th>今日差額</th><th>未平倉OI</th><th>風險狀態</th></tr></thead>
            <tbody>
                <tr><td colspan="4" class="group-label">🟣 自營商</td></tr>${rows["自營商"]}
                <tr><td colspan="4" class="group-label">🔵 外資</td></tr>${rows["外資"]}
            </tbody></table>`;
        
        enhancedAnalyze(s, fTX);
    }

    function enhancedAnalyze(s, fTX) {
        let score = 0;
        let dMsg = [], fMsg = [];
        let settlementAlert = "";
        
        if (fTX > 1500) { score += 2; fMsg.push("期貨多單進攻"); }
        else if (fTX < -1500) { score -= 2; fMsg.push("期貨空單壓制"); }
        
        if (s.fc > 3000) { score += 2; fMsg.push("BC 加碼"); }
        if (s.fp > 3000) { score -= 2; fMsg.push("BP 加碼"); }

        const isSPSisk = s.dp < 0;
        const isSCRisk = s.dc < 0;

        if (isSPSisk) { 
            score += 1; 
            dMsg.push("SP 築底");
            if (isSettlementPeriod) settlementAlert += "需防結算前下殺取權利金或倒莊。";
        }
        if (isSCRisk) { 
            score -= 1; 
            dMsg.push("SC 封頂");
            if (isSettlementPeriod) settlementAlert += "需防結算前拉高軋空。";
        }

        let trend = "", strat = "", color = "";
        if (isSettlementPeriod) {
            if (score > 2) score += 1;
            if (score < -2) score -= 1;
        }

        if (score >= 4) { trend = "🚀 強力看多"; color = "var(--red)"; strat = "期權同步做多。"; }
        else if (score >= 1) { trend = "↗️ 偏多震盪"; color = "var(--red)"; strat = "多方佔優，逢回測支撐看多。"; }
        else if (score <= -4) { trend = "📉 強力看空"; color = "var(--green)"; strat = "空頭共振。嚴防急跌。"; }
        else if (score <= -1) { trend = "↘️ 偏空震盪"; color = "var(--green)"; strat = "反彈力道不足，保守操作。"; }
        else { trend = "↔️ 中性整理"; color = "var(--blue)"; strat = "多空平衡，缺乏方向。"; }

        if (isSettlementPeriod && (isSPSisk || isSCRisk)) {
            strat += ` <br><span style="color:var(--gold)">【結算警告】目前處於${dayNames[dayOfWeek]}，莊家部位曝險。${settlementAlert}</span>`;
        }

        document.getElementById('trend-indicator').innerText = trend;
        document.getElementById('trend-indicator').style.color = color;
        document.getElementById('d-action').innerHTML = dMsg.join("<br>") || "中性觀望";
        document.getElementById('f-action').innerHTML = fMsg.join("<br>") || "動能不明";
        document.getElementById('strategy-desc').innerHTML = "💡 AI 策略：" + strat;
    }

    fetchAllData();
</script>
</body>
</html>
