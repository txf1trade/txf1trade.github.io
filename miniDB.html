<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mini TradingDash</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lightweight Charts v4 CDN -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tvBg: '#131722',
            tvPanel: '#1e222d',
            tvHover: '#2a2e39',
            tvBorder: '#2a2e39',
            tvText: '#d1d4dc',
            tvTextMuted: '#787b86',
            tvUp: '#089981',
            tvDown: '#f23645',
            tvAccent: '#2962ff'
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: #131722; }
    ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }

    .compact-table-row { font-size: 11px; }

    @keyframes softPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    .soft-breathing {
      animation: softPulse 2.5s infinite ease-in-out;
    }

    #watchlist-wrapper {
      width: 410px;
      height: 100%;
      background-color: #1e222d;
      border-left: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease, border-left 0.2s ease;
      position: relative;
      z-index: 10;
      overflow: hidden;
      flex-shrink: 0;
    }

    #watchlist-wrapper.collapsed {
      width: 0px;
      border-left: none;
    }

    @media (max-width: 767px) {
      #watchlist-wrapper {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 360px;
        z-index: 50;
        transform: translateX(100%);
        transition: transform 0.25s ease-in-out;
        box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      }
      #watchlist-wrapper.open {
        transform: translateX(0);
      }
    }

    #sidebar-icons {
      width: 48px;
      height: 100%;
      background-color: #131722;
      border-left: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      gap: 12px;
      z-index: 12;
      flex-shrink: 0;
    }

    .sidebar-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #787b86;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sidebar-btn:hover {
      background-color: #2a2e39;
      color: #f0f3fa;
    }

    .sidebar-btn.active {
      color: #2962ff;
      background-color: rgba(41, 98, 255, 0.15);
    }

    #drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
    }
    #drawer-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    @media (min-width: 768px) {
      #drawer-backdrop { display: none !important; }
    }

    .legend-item {
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
      transition: all 0.15s ease;
      display: inline-block;
    }
    .legend-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .legend-item.disabled {
      opacity: 0.35;
      text-decoration: line-through;
    }

    /* 手繪線條 Canvas 遮罩 */
    #drawing-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 5;
    }
    #drawing-canvas.active {
      pointer-events: auto;
      cursor: crosshair;
    }
  </style>
</head>
<body class="bg-tvBg text-tvText font-sans h-[100dvh] w-screen overflow-hidden flex flex-col select-none">

  <!-- Top Global Header -->
  <header class="h-11 bg-tvPanel border-b border-tvBorder flex items-center justify-between px-3 shrink-0 z-25 relative">
    <div class="flex items-center space-x-2 text-tvAccent font-bold text-base tracking-wider shrink-0">
      <i class="fa-solid fa-chart-line"></i>
      <span>Mini TradingDash</span>
    </div>

    <!-- Right Global Status / Actions -->
    <div class="flex items-center space-x-2.5 text-xs shrink-0 font-mono">
      <div id="api-status-badge" class="flex items-center space-x-1.5 text-tvUp bg-tvUp/15 px-3 py-1.5 rounded-md border border-tvUp/50 shadow-[0_0_12px_rgba(8,153,129,0.25)] cursor-pointer hover:bg-tvUp/25 transition-all select-none group" title="點擊手動重新整理資料">
        <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-tvUp soft-breathing"></span>
        <i id="api-status-icon" class="fa-solid fa-rotate text-[10px] text-tvUp transition-transform"></i>
        <span id="api-status-text" class="text-[11px] font-bold tracking-wide">即時連線</span>
      </div>

      <div class="flex items-center space-x-1.5 text-white bg-tvHover px-2.5 py-1 rounded border border-tvBorder shadow-sm">
        <i class="fa-regular fa-clock text-[10px] text-tvTextMuted"></i>
        <span id="live-clock" class="text-[10px] font-bold tracking-wider">--:--:--</span>
      </div>
    </div>
  </header>

  <!-- Main Grid Content -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- Left Section: Chart Area -->
    <div class="flex-1 flex flex-col min-w-0 border-r border-tvBorder bg-tvBg max-h-[65vh] sm:max-h-none">
      <!-- Active Symbol Info Bar -->
      <div class="h-10 bg-tvPanel/50 border-b border-tvBorder flex items-center justify-between px-3 text-xs shrink-0">
        <div class="flex items-center space-x-2 truncate">
          <span id="active-symbol-title" class="font-bold text-white text-xs sm:text-sm truncate">台指期全 TX-1</span>
          <span id="active-symbol-exch" class="text-tvTextMuted text-[10px]">TAIFEX</span>
          
          <div class="h-4 w-px bg-tvBorder hidden sm:block mx-1"></div>

          <!-- Timeframe Selector -->
          <div id="timeframe-container" class="hidden sm:flex items-center space-x-1 text-xs font-mono">
            <button data-res="1" class="tf-btn px-2 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">1</button>
            <button data-res="5" class="tf-btn px-2 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">5</button>
            <button data-res="15" class="tf-btn px-2 py-0.5 rounded bg-tvHover text-white font-medium shadow">15</button>
            <button data-res="60" class="tf-btn px-2 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">60</button>
            <button data-res="1D" class="tf-btn px-2 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">D</button>
          </div>
        </div>

        <!-- 右側操作按鈕：畫線工具、清除畫線、另存圖片 -->
        <div class="flex items-center space-x-1.5 font-mono shrink-0">
          <button id="btn-draw-mode" class="px-2 py-1 bg-tvHover hover:bg-tvAccent text-tvText hover:text-white rounded text-[11px] transition-colors flex items-center space-x-1" title="切換畫線模式">
            <i class="fa-solid fa-pencil text-[10px]"></i><span>畫線工具</span>
          </button>
          <button id="btn-clear-drawings" class="px-2 py-1 bg-tvHover hover:bg-red-600 text-tvTextMuted hover:text-white rounded text-[11px] transition-colors" title="清除所有手繪線條">
            <i class="fa-solid fa-trash-can text-[10px]"></i>
          </button>
          <button id="btn-export-img" class="px-2 py-1 bg-tvAccent hover:bg-blue-600 text-white rounded text-[11px] font-medium transition-colors flex items-center space-x-1" title="另存圖表圖片">
            <i class="fa-solid fa-camera text-[10px]"></i><span>截圖</span>
          </button>
          
          <div class="h-4 w-px bg-tvBorder mx-1"></div>
          <span id="active-price" class="text-xs sm:text-sm font-bold">--</span>
          <span id="active-change" class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded">--</span>
        </div>
      </div>

      <!-- 手機版專屬第二行時框列 -->
      <div class="sm:hidden h-8 bg-tvPanel/30 border-b border-tvBorder flex items-center px-3 space-x-1 text-xs font-mono shrink-0 overflow-x-auto no-scrollbar">
        <button data-res="1" class="tf-btn px-2.5 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">1</button>
        <button data-res="5" class="tf-btn px-2.5 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">5</button>
        <button data-res="15" class="tf-btn px-2.5 py-0.5 rounded bg-tvHover text-white font-medium shadow">15</button>
        <button data-res="60" class="tf-btn px-2.5 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">60</button>
        <button data-res="1D" class="tf-btn px-2.5 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">D</button>
      </div>

      <!-- Lightweight Chart Container & Legend -->
      <div class="flex-1 relative w-full h-full bg-tvBg flex flex-col min-h-0">
        <!-- 主圖左上角數值即時標籤 -->
        <div id="chart-legend" class="absolute top-2 left-2 z-10 flex flex-col items-start gap-y-1 text-[10px] sm:text-xs font-mono bg-tvPanel/85 px-2.5 py-1.5 rounded border border-tvBorder shadow pointer-events-auto">
          <div id="legend-row-filter" class="flex items-center gap-x-2">
            <span id="legend-filter-group" data-line="filter12" class="legend-item text-[#df8028]" title="切換過濾線(EMA12)顯示"><span id="label-filter">EMA12</span>: <span id="legend-filter">--</span></span>
          </div>
          <div id="legend-row-ema" class="flex items-center gap-x-2">
            <span id="legend-ema20-group" data-line="ema20" class="legend-item text-[#ffcc66]" title="切換多頭線(EMA20)顯示"><span id="label-ema20">EMA20</span>: <span id="legend-ema20">--</span></span>
            <span id="legend-ema60-group" data-line="ema60" class="legend-item text-[#28c6ee]" title="切換多頭線(EMA60)顯示"><span id="label-ema60">EMA60</span>: <span id="legend-ema60">--</span></span>
          </div>
          <div id="legend-row-daily" class="flex items-center gap-x-2">
            <span id="legend-daily-group" data-line="daily" class="legend-item text-[#ee3b76]" title="切換日線(EMA76)顯示"><span id="label-daily">EMA76</span>: <span id="legend-dailyval">--</span></span>
            <span id="legend-weekly-group" data-line="weekly" class="legend-item text-[#2186c0]" title="切換週線(EMA380)顯示"><span id="label-weekly">EMA380</span>: <span id="legend-weeklyval">--</span></span>
          </div>
          <div id="legend-row-atr" class="flex items-center gap-x-2">
            <span id="legend-atr-group" data-line="atrTrend" class="legend-item text-[#00cbff]" title="切換 ATR 趨勢線顯示"><span id="label-atr">ATR趨勢</span>: <span id="legend-atrval">--</span></span>
          </div>
        </div>

        <div id="chart-container" class="flex-1 w-full relative">
          <!-- 手繪畫線用的 Canvas 覆蓋層 -->
          <canvas id="drawing-canvas"></canvas>
        </div>

        <!-- 畫面下方的底部指標切換列 -->
        <div class="h-14 bg-tvPanel border-t border-tvBorder flex items-center px-4 space-x-6 text-sm shrink-0 z-20 font-mono select-none">
          <button data-ind="filter" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">過濾線</button>
          <button data-ind="ema" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">多頭線</button>
          <button data-ind="daily" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">日週線</button>
          <button data-ind="atr" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">ATR趨勢</button>
          <button data-ind="vol" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">成交量</button>
        </div>
      </div>
    </div>

    <!-- Resizer Drag Handle Bar -->
    <div id="panel-resizer" class="hidden md:block w-1 bg-tvBorder hover:bg-tvAccent cursor-ew-resize shrink-0 transition-colors z-30 select-none relative group" title="拖曳調整面板寬度">
      <div class="absolute inset-y-0 -left-1 -right-1 cursor-ew-resize"></div>
    </div>

    <!-- 手機抽屜背景遮罩 -->
    <div id="drawer-backdrop"></div>

    <!-- 右側自選面板 Wrapper -->
    <div id="watchlist-wrapper">
      <div class="h-10 px-3 border-b border-tvBorder flex items-center justify-between shrink-0 relative">
        <div class="flex items-center space-x-2">
          <span class="font-bold text-sm text-white">自選商品群組</span>
          <span class="text-xs bg-tvHover px-2 py-0.5 rounded text-tvTextMuted font-mono" id="watchlist-count">0</span>
        </div>
        <div class="flex items-center space-x-1">
          <button id="btn-settings-3" class="p-1.5 hover:bg-tvHover rounded text-tvTextMuted hover:text-white relative" title="設定三：欄位與總量顯示設定">
            <i class="fa-solid fa-sliders text-xs"></i>
          </button>
          <button id="btn-open-modal" class="p-1.5 hover:bg-tvHover rounded text-tvText hover:text-white" title="新增自選商品">
            <i class="fa-solid fa-plus text-xs"></i>
          </button>
          <button id="btn-close-drawer" class="md:hidden p-1.5 hover:bg-tvHover rounded text-tvTextMuted hover:text-white">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <div id="settings-dropdown" class="absolute top-11 right-2 bg-tvPanel border border-tvBorder rounded shadow-xl p-3 z-50 hidden text-xs w-52 space-y-2.5">
          <div class="font-bold text-white border-b border-tvBorder pb-1 mb-1">顯示欄位設定</div>
          <label class="flex items-center space-x-2 cursor-pointer text-tvText hover:text-white">
            <input type="checkbox" id="col-change" checked class="rounded bg-tvBg border-tvBorder text-tvAccent focus:ring-0">
            <span>漲跌 (點數)</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer text-tvText hover:text-white">
            <input type="checkbox" id="col-percent" checked class="rounded bg-tvBg border-tvBorder text-tvAccent focus:ring-0">
            <span>漲跌幅 (%)</span>
          </label>
          <label class="flex items-center space-x-2 cursor-pointer text-tvText hover:text-white">
            <input type="checkbox" id="col-volume" checked class="rounded bg-tvBg border-tvBorder text-tvAccent focus:ring-0">
            <span>總量顯示</span>
          </label>
          <div class="border-t border-tvBorder pt-2 mt-1">
            <div class="text-tvTextMuted mb-1 text-[10px]">總量單位模式</div>
            <select id="vol-mode-select" class="w-full bg-tvBg border border-tvBorder rounded px-2 py-1 text-white focus:outline-none focus:border-tvAccent">
              <option value="auto">自動 (K/M 縮寫或完整)</option>
              <option value="full">完整顯示數字</option>
            </select>
          </div>
        </div>
      </div>

      <div id="watchlist-header" class="flex items-center px-2 py-2 text-[11px] text-tvTextMuted font-medium border-b border-tvBorder shrink-0 bg-tvBg/40 w-full"></div>
      <div id="watchlist-items" class="flex-1 overflow-y-auto divide-y divide-tvBorder/30 w-full"></div>

      <div id="symbol-detail-card" class="p-3 border-t border-tvBorder bg-tvBg/80 text-xs shrink-0">
        <div class="flex justify-between items-start mb-1.5">
          <div>
            <div id="card-name" class="font-bold text-white text-sm">--</div>
            <div id="card-code" class="text-tvTextMuted text-[10px] bg-tvHover px-1.5 py-0.5 rounded font-mono mt-0.5 inline-block">--</div>
          </div>
          <div id="card-change-badge" class="font-mono text-right font-bold text-xs px-2 py-0.5 rounded bg-tvHover">--</div>
        </div>
        <div class="flex items-baseline space-x-2 my-1">
          <span id="card-price" class="text-xl font-bold font-mono text-white">--</span>
          <span class="text-[10px] text-tvTextMuted">TWD</span>
        </div>
        <div class="grid grid-cols-2 gap-x-4 gap-y-1 mt-2 pt-2 border-t border-tvBorder/30 text-[11px] font-mono">
          <div class="flex justify-between"><span class="text-tvTextMuted">最高:</span> <span id="card-high" class="text-tvUp">--</span></div>
          <div class="flex justify-between"><span class="text-tvTextMuted">最低:</span> <span id="card-low" class="text-tvDown">--</span></div>
          <div class="flex justify-between"><span class="text-tvTextMuted">總量:</span> <span id="card-vol" class="text-white">--</span></div>
          <div class="flex justify-between"><span class="text-tvTextMuted">昨收:</span> <span id="card-ref" class="text-tvText">--</span></div>
        </div>
      </div>
    </div>

    <div id="sidebar-icons">
      <button class="sidebar-btn active" id="toggle-watchlist-btn" title="自選商品清單">
        <i class="fa-solid fa-bookmark text-sm"></i>
      </button>
    </div>
  </div>

  <!-- Add Symbol Modal -->
  <div id="add-symbol-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-tvPanel border border-tvBorder rounded-lg w-full max-w-sm p-4 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b border-tvBorder pb-2">
        <h3 class="text-sm font-bold text-white">新增自選商品</h3>
        <button id="btn-close-modal" class="text-tvTextMuted hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="add-symbol-form" class="space-y-3 text-xs">
        <div>
          <label class="block text-tvTextMuted mb-1">商品名稱</label>
          <input type="text" id="input-name" required placeholder="例如: 台積電" class="w-full bg-tvBg border border-tvBorder rounded px-3 py-2 text-white focus:outline-none focus:border-tvAccent">
        </div>
        <div>
          <label class="block text-tvTextMuted mb-1">商品代號</label>
          <input type="text" id="input-code" required placeholder="例如: 2330" class="w-full bg-tvBg border border-tvBorder rounded px-3 py-2 text-white focus:outline-none focus:border-tvAccent">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="btn-cancel-modal" class="px-3 py-1.5 rounded bg-tvHover text-tvText hover:text-white">取消</button>
          <button type="submit" class="px-3 py-1.5 rounded bg-tvAccent text-white font-medium hover:bg-blue-600">確定新增</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    function updateClock() {
      const now = new Date();
      const timeString = now.toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false });
      const clockElem = document.getElementById('live-clock');
      if (clockElem) clockElem.textContent = timeString;
    }
    setInterval(updateClock, 1000);
    updateClock();

    const defaultIndicatorSettings = {
      filter: true,
      ema: false,
      daily: true,
      atr: false,
      vol: false
    };

    let lineVisibility = {
      filter12: true,
      ema20: true,
      ema60: true,
      daily: true,
      weekly: true,
      atrTrend: true
    };

    const symbolLineConfigs = {
      'TX-1':   { filter: 12, ema20: 20, ema60: 60, daily: 76, weekly: 380 },                           
      'TXAM-1': { filter: 12, ema20: 20, ema60: 60, daily: 76, weekly: 380 },                         
      'TWN-1':  { filter: 12, ema20: 20, ema60: 60, daily: 80, weekly: 400 },                          
      'NQ-1':   { filter: 12, ema20: 20, ema60: 60, daily: 92, weekly: 460 },                           
      'GC-1':   { filter: 12, ema20: 20, ema60: 60, daily: 92, weekly: 460 },                           
      'NK-1':   { filter: 12, ema20: 20, ema60: 60, daily: 92, weekly: 460 },                           
      'DEFAULT':{ filter: 12, ema20: 20, ema60: 60, daily: 76, weekly: 380 }                         
    };

    function getLineParams(code) {
      const upper = (code || '').toUpperCase();
      return symbolLineConfigs[upper] || symbolLineConfigs['DEFAULT'];
    }

    let watchlistGroups = [
      {
        groupName: '台股指',
        items: [
          { id: '1', name: '台指期全', code: 'TX-1', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TAIFEX' },
          { id: '2', name: '台指期日', code: 'TXAM-1', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TAIFEX' },
          { id: '3', name: '加權指數', code: 'TSEA', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TWSE' },
          { id: '4', name: '櫃買指數', code: 'OTCA', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TPEX' },
          { id: '5', name: '台積電', code: '2330', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TWSE' },
          { id: '6', name: '聯發科', code: '2454', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TWSE' },
          { id: '7', name: '富台指', code: 'TWN-1', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TAIFEX' },
          { id: '8', name: '台灣VIX', code: 'TAIWANVIX', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TAIFEX' }
        ]
      },
      {

    function calculateEMA(data, period) {
      let results = [];
      if (period <= 0 || data.length === 0) return results;
      let multiplier = 2 / (period + 1);
      let prevEMA = null;
      for (let i = 0; i < data.length; i++) {
        let close = data[i].close;
        if (i === 0) {
          prevEMA = close;
        } else {
          prevEMA = (close - prevEMA) * multiplier + prevEMA;
        }
        results.push({ time: data[i].time, value: prevEMA });
      }
      return results;
    }

    function calculateAtrTrend(candles, length = 14, multi = 2.0, src_hl = true) {
      if (!candles || candles.length === 0) return [];

      let trs = [];
      for (let i = 0; i < candles.length; i++) {
        let c = candles[i];
        let prevClose = i > 0 ? candles[i - 1].close : c.open;
        let tr = Math.max(c.high - c.low, Math.abs(c.high - prevClose), Math.abs(c.low - prevClose));
        trs.push(tr);
      }

      let atrValues = [];
      let alpha = 2 / (length + 1);
      let prevEmaTr = trs[0];
      for (let i = 0; i < trs.length; i++) {
        if (i === 0) {
          prevEmaTr = trs[0];
        } else {
          prevEmaTr = (trs[i] - prevEmaTr) * alpha + prevEmaTr;
        }
        atrValues.push(prevEmaTr * multi);
      }

      let lowerAtr = [];
      let upperAtr = [];
      for (let i = 0; i < candles.length; i++) {
        let startIdx = Math.max(0, i - length + 1);
        let slice = candles.slice(startIdx, i + 1);
        if (src_hl) {
          let lowVal = Math.min(...slice.map(s => s.low));
          let highVal = Math.max(...slice.map(s => s.high));
          lowerAtr.push(lowVal);
          upperAtr.push(highVal);
        } else {
          let lowVal = Math.min(...slice.map(s => s.close));
          let highVal = Math.max(...slice.map(s => s.close));
          lowerAtr.push(lowVal);
          upperAtr.push(highVal);
        }
      }

      let trendLine = [];
      let prevTrend = 0;
      let upDownTrend = null;

      for (let i = 0; i < candles.length; i++) {
        let direction = 'neutral';
        if (i > 0) {
          if (upperAtr[i] > upperAtr[i - 1]) direction = 'up';
          else if (lowerAtr[i] < lowerAtr[i - 1]) direction = 'down';
        }

        let c = candles[i];
        let currentTrend = prevTrend;

        if (direction === 'up') {
          currentTrend = c.low - atrValues[i];
          if (i > 0 && currentTrend < prevTrend) currentTrend = prevTrend;
        } else if (direction === 'down') {
          currentTrend = c.high + atrValues[i];
          if (i > 0 && currentTrend > prevTrend) currentTrend = prevTrend;
        } else {
          currentTrend = prevTrend !== 0 ? prevTrend : (c.low - atrValues[i]);
        }

        if (i > 0) {
          if (currentTrend > prevTrend) upDownTrend = 'up';
          else if (currentTrend < prevTrend) upDownTrend = 'down';
        }

        let halfCandle = c.open + ((c.close - c.open) / 2);
        let lineColor = '#ff0099';
        if (halfCandle < currentTrend && upDownTrend !== 'down') {
          lineColor = '#ff4100';
        } else if (upDownTrend === 'up') {
          lineColor = '#00cbff';
        } else if (halfCandle > currentTrend) {
          lineColor = '#ff4101';
        }

        prevTrend = currentTrend;
        trendLine.push({ time: c.time, value: currentTrend, color: lineColor });
      }

      return trendLine;
    }

    function redrawDrawings() {
      const canvas = document.getElementById('drawing-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = '#00cbff';
      ctx.lineWidth = 2;

      drawings.forEach(line => {
        ctx.beginPath();
        ctx.moveTo(line.x1, line.y1);
        ctx.lineTo(line.x2, line.y2);
        ctx.stroke();
      });
    }

        redrawDrawings();
        const ctx = canvas.getContext('2d');
        ctx.strokeStyle = '#00cbff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        ctx.lineTo(currentX, currentY);
        ctx.stroke();
      });

        if (!isDrawing || !isDrawingMode) return;

        ema20Series.setData([]);
        ema60Series.setData([]);
        ema20Series.applyOptions({ visible: false });
        ema60Series.applyOptions({ visible: false });
        rowEma.style.display = 'none';
      }

      if (indicatorStates.daily && currentCandles.length > 0) {
        rowDaily.style.display = 'flex';
        if (lineVisibility.daily) {
          dailySeries.setData(calculateEMA(currentCandles, params.daily));
          dailySeries.applyOptions({ visible: true });
          dailyGroup.classList.remove('disabled');
        } else {
          dailySeries.setData([]);
          dailySeries.applyOptions({ visible: false });
          dailyGroup.classList.add('disabled');
        }
        if (lineVisibility.weekly) {
          weeklySeries.setData(calculateEMA(currentCandles, params.weekly));
          weeklySeries.applyOptions({ visible: true });
          weeklyGroup.classList.remove('disabled');
        } else {
          weeklySeries.setData([]);
          weeklySeries.applyOptions({ visible: false });
          weeklyGroup.classList.add('disabled');
        }
      } else {
        dailySeries.setData([]);
        weeklySeries.setData([]);
        dailySeries.applyOptions({ visible: false });
        weeklySeries.applyOptions({ visible: false });
        rowDaily.style.display = 'none';
      }

      if (indicatorStates.atr && currentCandles.length > 0) {
        rowAtr.style.display = 'flex';
        if (lineVisibility.atrTrend) {
          const atrData = calculateAtrTrend(currentCandles);
          atrTrendSeries.setData(atrData);
          atrTrendSeries.applyOptions({ visible: true });
          atrGroup.classList.remove('disabled');
        } else {
          atrTrendSeries.setData([]);
          atrTrendSeries.applyOptions({ visible: false });
          atrGroup.classList.add('disabled');
        }
      } else {
        atrTrendSeries.setData([]);
        atrTrendSeries.applyOptions({ visible: false });
        rowAtr.style.display = 'none';
      }

      const upCol = '#f23645';
      const downCol = '#089981';

      if (indicatorStates.vol && currentCandles.length > 0) {
        const volData = currentCandles.map(c => ({
          time: c.time,
          value: c.volume || 1000,
          color: c.close >= c.open ? upCol : downCol
        }));
        volumeSeries.setData(volData);
        volumeSeries.applyOptions({ visible: true });
        chart.priceScale('volume_pane').applyOptions({ visible: true });
      } else {
        volumeSeries.setData([]);
        volumeSeries.applyOptions({ visible: false });
        chart.priceScale('volume_pane').applyOptions({ visible: false });
      }

      const legend = document.getElementById('chart-legend');
      if (!indicatorStates.filter && !indicatorStates.ema && !indicatorStates.daily && !indicatorStates.atr) {
        legend.style.display = 'none';
      } else {
        legend.style.display = 'flex';
      }
    }

    function getResolutionSeconds(res) {
      if (res === '1') return 60;
      if (res === '5') return 300;
      if (res === '15') return 900;
      if (res === '60') return 3600;
      if (res === '1D') return 86400;
      return 900;
    }

    async function loadHistoryData(symbolCode, resolution) {
      currentCandles = []; 
      const toTime = Math.floor(Date.now() / 1000);
      const daysToSubtract = resolution === '1D' ? 365 : 60;
      const fromTime = toTime - (daysToSubtract * 24 * 60 * 60);
      const url = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=${encodeURIComponent(symbolCode)}&resolution=${resolution}&from=${fromTime}&to=${toTime}&ws=true&metaData=true`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        let candleData = [];
        const barsData = Array.isArray(data) ? data : (data.bars || []);
        const normalizeTime = t => t > 1e10 ? Math.floor(t / 1000) : t;

        if (Array.isArray(barsData) && barsData.length > 0) {
          barsData.forEach(item => {
            let rawTime = item.time || new Date(item.datetime).getTime();
            let time = normalizeTime(rawTime);
            if (resolution === '1D') time -= 86400; 
            const volume = item.volume !== undefined ? item.volume : (Math.floor(Math.random() * 20000 + 5000));
            candleData.push({ time, open: item.open, high: item.high, low: item.low, close: item.close, volume });
          });
        }

        if (candleData.length > 0) {
          candleData.sort((a, b) => a.time - b.time);
          currentCandles = candleData;
          candlestickSeries.setData(currentCandles);
          updateIndicatorDisplay();
          const barsCount = currentCandles.length;
          chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, barsCount - 80), to: barsCount - 1 });
          chart.priceScale('right').applyOptions({ autoScale: true });
          return;
        }
        throw new Error('API 資料為空');
      } catch (err) {
        loadMockHistoryFallback(symbolCode);
      }
    }

    function loadMockHistoryFallback(symbolCode) {
      const now = Math.floor(Date.now() / 1000);
      let candleData = [];
      let basePrice = symbolCode === '2330' ? 980 : (symbolCode.includes('TX') ? 22600 : 250);
      const step = getResolutionSeconds(currentResolution);

      for (let i = 80; i >= 1; i--) {
        let time = now - (i * step);
        if (currentResolution === '1D') time -= 86400;
        const open = basePrice + (Math.random() * 20 - 10);
        const high = open + Math.random() * 15;
        const low = open - Math.random() * 15;
        const close = (open + high + low) / 3;
        basePrice = close;
        const volume = Math.floor(Math.abs(high - low) * 1000 + 5000);
        candleData.push({ time, open, high, low, close, volume });
      }

      currentCandles = candleData;
      candlestickSeries.setData(currentCandles);
      updateIndicatorDisplay();
      const barsCount = currentCandles.length;
      chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, barsCount - 80), to: barsCount - 1 });
      chart.priceScale('right').applyOptions({ autoScale: true });
    }

    async function fetchRealtimeQuotes() {
      const allItems = getAllWatchlistItems();
      if (allItems.length === 0 || currentCandles.length === 0) return;
      const symbolsParam = allItems.map(item => item.code).join(',');
      const apiUrl = `https://realtime-quote-signalr-v2.futures-op.com/quote?symbol=${encodeURIComponent(symbolsParam)}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('API Error');
        const data = await response.json();

        if (Array.isArray(data)) {
          lastQuoteSuccessTime = Date.now();
          setConnectionStatus('normal');

          data.forEach(quote => {
            const item = allItems.find(i => i.code.toUpperCase() === quote.symbol.toUpperCase());
            if (item) {
              const newPrice = quote.close || item.price;
              item.price = newPrice;
              item.refPrice = quote.prevRef || quote.refRef || quote.refRef || item.refPrice;
              item.volume = quote.volume || item.volume;
              item.high = quote.high || item.high;
              item.low = quote.low || item.low;

              if (item.id === selectedSymbolId && newPrice > 0 && candlestickSeries && currentCandles.length > 0) {
                const stepSeconds = getResolutionSeconds(currentResolution);
                const nowSec = Math.floor(Date.now() / 1000);
                const currentBarTime = currentResolution === '1D' 
                  ? Math.floor(nowSec / 86400) * 86400 - 86400 
                  : Math.floor(nowSec / stepSeconds) * stepSeconds;

                let lastBar = currentCandles[currentCandles.length - 1];

                if (lastBar.time === currentBarTime) {
                  lastBar.high = Math.max(lastBar.high, newPrice);
                  lastBar.low = Math.min(lastBar.low, newPrice);
                  lastBar.close = newPrice;
                  candlestickSeries.update(lastBar);
                } else if (currentBarTime > lastBar.time) {
                  if (currentBarTime - lastBar.time === stepSeconds) {
                    const newBar = {
                      time: currentBarTime,
                      open: lastBar.close,
                      high: Math.max(lastBar.close, newPrice),
                      low: Math.min(lastBar.close, newPrice),
                      close: newPrice,
                      volume: item.volume || 1000
                    };
                    currentCandles.push(newBar);
                    candlestickSeries.update(newBar);
                  } else {
                    lastBar.high = Math.max(lastBar.high, newPrice);
                    lastBar.low = Math.min(lastBar.low, newPrice);
                    lastBar.close = newPrice;
                    candlestickSeries.update(lastBar);
                  }
                }
              }
            }
          });

          renderWatchlist();
          const activeSymbol = allItems.find(s => s.id === selectedSymbolId);
          if (activeSymbol) {
            updateActivePriceDisplay(activeSymbol);
            updateDetailCard(activeSymbol);
          }
        }
      } catch (err) {
        console.error('Realtime quote error:', err);
        setConnectionStatus('delayed');
      }
    }

    document.getElementById('api-status-badge').addEventListener('click', async () => {
      setConnectionStatus('refreshing');
      const allItems = getAllWatchlistItems();
      const symbol = allItems.find(s => s.id === selectedSymbolId);
      if (symbol) {
        await loadHistoryData(symbol.code, currentResolution);
      }
      await fetchRealtimeQuotes();
      setTimeout(() => {
        const icon = document.getElementById('api-status-icon');
        if (icon) icon.classList.remove('fa-spin');
        if (!isDataDelayed) setConnectionStatus('normal');
      }, 700);
    });

    function formatSmartVolume(vol) {
      if (!vol || vol === 0) return '--';
      if (columnSettings.volMode === 'full') {
        return vol.toLocaleString();
      }
      if (vol >= 1000000000) {
        return (vol / 1000000000).toFixed(1) + 'G';
      } else if (vol >= 1000000) {
        return (vol / 1000000).toFixed(1) + 'M';
      } else if (vol >= 1000) {
        return (vol / 1000).toFixed(1) + 'k';
      }
      return vol.toLocaleString();
    }

    function renderWatchlist() {
      const headerContainer = document.getElementById('watchlist-header');
      const container = document.getElementById('watchlist-items');
      container.innerHTML = '';
      const allItems = getAllWatchlistItems();
      document.getElementById('watchlist-count').textContent = allItems.length;

      let headerHTML = `
        <div class="w-[18%] text-left truncate pr-0.5">代號</div>
        <div class="w-[22%] text-left truncate px-0.5">名稱</div>
        <div class="w-[24%] text-right truncate px-0.5">成交價</div>
      `;
      if (columnSettings.change) headerHTML += `<div class="w-[18%] text-right truncate px-0.5">漲跌</div>`;
      if (columnSettings.percent) headerHTML += `<div class="w-[18%] text-right truncate px-0.5">漲跌%</div>`;
      if (columnSettings.volume) headerHTML += `<div class="w-[20%] text-right truncate pl-0.5 pr-1">總量</div>`;
      headerContainer.innerHTML = headerHTML;

      watchlistGroups.forEach(group => {
        const groupHeader = document.createElement('div');
        groupHeader.className = 'px-2 py-1.5 bg-tvBg/80 text-tvTextMuted font-bold text-[11px] border-b border-tvBorder tracking-wide uppercase flex items-center justify-between';
        groupHeader.innerHTML = `<span>${group.groupName}</span><i class="fa-solid fa-chevron-down text-[10px]"></i>`;
        container.appendChild(groupHeader);

        group.items.forEach(item => {
          const hasRef = item.refPrice > 0;
          const change = hasRef ? (item.price - item.refPrice) : 0;
          const changePercent = hasRef ? ((change / item.refPrice) * 100).toFixed(2) : '0.00';
          const isUp = change >= 0;
          
          const colorClass = isUp ? 'text-[#f23645]' : 'text-[#089981]';
          const isSelected = item.id === selectedSymbolId;

          const row = document.createElement('div');
          row.id = `watchlist-row-${item.id}`;
          row.className = `flex items-center px-2 py-2 compact-table-row cursor-pointer hover:bg-tvHover/70 transition-colors group relative w-full ${
            isSelected ? 'bg-tvHover/90 border-l-2 border-tvAccent' : ''
          }`;
          row.onclick = () => selectSymbol(item.id);

          let rowHTML = `
            <div class="w-[18%] font-mono text-tvTextMuted text-[11px] truncate pr-0.5">${item.code}</div>
            <div class="w-[22%] font-bold text-white truncate px-0.5">${item.name}</div>
            <div class="w-[24%] text-right font-mono font-medium text-white truncate px-0.5">
              ${item.price > 0 ? item.price.toLocaleString(undefined, { minimumFractionDigits: item.price < 1000 ? 2 : 0 }) : '--'}
            </div>
          `;
          if (columnSettings.change) {
            rowHTML += `
              <div class="w-[18%] text-right font-mono font-medium ${colorClass} truncate px-0.5">
                ${item.price > 0 ? `${isUp ? '+' : ''}${change.toFixed(1)}` : '--'}
              </div>
            `;
          }
          if (columnSettings.percent) {
            rowHTML += `
              <div class="w-[18%] text-right font-mono font-medium ${colorClass} truncate px-0.5">
                ${item.price > 0 ? `${isUp ? '+' : ''}${changePercent}%` : '--'}
              </div>
            `;
          }
          if (columnSettings.volume) {
            rowHTML += `
              <div class="w-[20%] text-right font-mono text-tvTextMuted text-[11px] truncate pl-0.5 pr-1">
                ${formatSmartVolume(item.volume)}
              </div>
            `;
          }

          row.innerHTML = rowHTML;
          container.appendChild(row);
        });
      });
    }

    function selectSymbol(id) {
      selectedSymbolId = id;
      currentCandles = [];
      const allItems = getAllWatchlistItems();
      const symbol = allItems.find(s => s.id === id);
      if (symbol) {
        renderWatchlist();
        document.getElementById('active-symbol-title').textContent = `${symbol.name} ${symbol.code}`;
        updateActivePriceDisplay(symbol);
        updateDetailCard(symbol);
        loadHistoryData(symbol.code, currentResolution);
      }
    }

    function updateActivePriceDisplay(symbol) {
      const hasRef = symbol.refPrice > 0;
      const change = hasRef ? (symbol.price - symbol.refPrice) : 0;
      const changePercent = hasRef ? ((change / symbol.refPrice) * 100).toFixed(2) : '0.00';
      const isUp = change >= 0;

      const colorClass = isUp ? 'text-[#f23645]' : 'text-[#089981]';
      const bgClass = isUp ? 'bg-[#f23645]/20' : 'bg-[#089981]/20';

      const priceElem = document.getElementById('active-price');
      const changeElem = document.getElementById('active-change');

      priceElem.textContent = symbol.price > 0 ? symbol.price.toLocaleString(undefined, { minimumFractionDigits: symbol.price < 1000 ? 2 : 0 }) : '--';
      priceElem.className = `text-sm ${colorClass}`;

      changeElem.textContent = symbol.price > 0 ? `${isUp ? '+' : ''}${change.toFixed(1)} (${isUp ? '+' : ''}${changePercent}%)` : '--';
      changeElem.className = `text-xs px-1.5 py-0.5 rounded ${bgClass} ${colorClass}`;
    }

    function updateDetailCard(symbol) {
      const hasRef = symbol.refPrice > 0;
      const change = hasRef ? (symbol.price - symbol.refPrice) : 0;
      const changePercent = hasRef ? ((change / symbol.refPrice) * 100).toFixed(2) : '0.00';
      const isUp = change >= 0;

      const colorClass = isUp ? 'text-[#f23645]' : 'text-[#089981]';
      const bgClass = isUp ? 'bg-[#f23645]/20' : 'bg-[#089981]/20';

      document.getElementById('card-name').textContent = symbol.name;
      document.getElementById('card-code').textContent = symbol.code;
      document.getElementById('card-price').textContent = symbol.price > 0 ? symbol.price.toLocaleString(undefined, { minimumFractionDigits: symbol.price < 1000 ? 2 : 0 }) : '--';
      document.getElementById('card-high').textContent = symbol.high > 0 ? symbol.high.toFixed(1) : '--';
      document.getElementById('card-low').textContent = symbol.low > 0 ? symbol.low.toFixed(1) : '--';
      document.getElementById('card-ref').textContent = symbol.refPrice > 0 ? symbol.refPrice.toFixed(1) : '--';
      document.getElementById('card-vol').textContent = symbol.volume > 0 ? symbol.volume.toLocaleString() : '--';

      const badge = document.getElementById('card-change-badge');
      badge.textContent = symbol.price > 0 ? `${isUp ? '+' : ''}${change.toFixed(1)} (${isUp ? '+' : ''}${changePercent}%)` : '--';
      badge.className = `font-mono text-right font-bold text-xs px-2 py-0.5 rounded ${bgClass} ${colorClass}`;
    }

    function initPanelResizer() {
      const resizer = document.getElementById('panel-resizer');
      const panelWrapper = document.getElementById('watchlist-wrapper');
      let isResizing = false;
      let startX = 0;
      let startWidth = 410;

      resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        startX = e.clientX;
        startWidth = panelWrapper.offsetWidth;
        document.body.style.cursor = 'ew-resize';

        const onMouseMove = (e) => {
          if (!isResizing) return;
          let newWidth = startWidth + (startX - e.clientX);
          newWidth = Math.max(300, Math.min(newWidth, 680));
          panelWrapper.style.width = `${newWidth}px`;
          if (chart) {
            const container = document.getElementById('chart-container');
            chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
            resizeDrawingCanvas();
          }
        };

        const onMouseUp = () => {
          isResizing = false;
          document.body.style.cursor = '';
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);
      });
    }
  </script>
