<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>股期監控-AI做多精選</title>
    <style>
        :root {
            --bg-black: #121212;
            --text-main: #e0e0e0;
            --text-dim: #777; 
            --up-red: #ff3b30;
            --down-green: #34c759;
            --accent: #64ffda;
            --ai-gold: #ffcc00;
            --surface: #1e1e1e;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: -apple-system, "PingFang TC", sans-serif;
            margin: 0; padding: 0;
            display: flex; justify-content: center;
        }

        .app-wrapper { width: 98%; max-width: 550px; background: var(--bg-black); min-height: 100vh; }

        .sticky-top {
            position: sticky; top: 0; background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px); z-index: 100; padding: 4px 2px;
            border-bottom: 1px solid #333;
        }

        .mode-header { display: flex; gap: 4px; margin-bottom: 4px; }
        .mode-btn {
            flex: 1; padding: 8px 2px; text-align: center; font-size: 13px;
            font-weight: bold; border-radius: 4px; border: 1px solid #333;
            cursor: pointer; background: #111; color: var(--text-dim);
        }
        .mode-btn.active[data-mode="strong"] { border-color: var(--accent); color: var(--accent); background: rgba(100, 255, 218, 0.1); }
        .mode-btn.active[data-mode="up"] { border-color: var(--up-red); color: var(--up-red); background: rgba(255, 59, 48, 0.1); }
        .mode-btn.active[data-mode="down"] { border-color: var(--down-green); color: var(--down-green); background: rgba(52, 199, 89, 0.1); }
        .mode-btn.active[data-mode="ai_long"] { border-color: var(--ai-gold); color: var(--ai-gold); background: rgba(255, 204, 0, 0.1); }

        .controls-row {
            display: flex; align-items: center; gap: 6px;
            background: var(--surface); padding: 4px 8px; border-radius: 4px;
            position: relative; overflow: hidden;
        }

        .filter-toggle { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--accent); white-space: nowrap; cursor: pointer; }
        .slider-box { flex-grow: 1; display: flex; align-items: center; gap: 4px; margin: 0 5px; }
        #rank-val { color: #fff; min-width: 45px; font-size: 11px; font-weight: bold; }
        #timer-display { font-family: monospace; color: var(--accent); font-size: 10px; margin-left: auto; }
        
        input[type=range] { flex-grow: 1; height: 3px; accent-color: var(--accent); }
        #refresh-bar { position: absolute; bottom: 0; left: 0; height: 1.5px; background: var(--accent); width: 0%; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 2px; }
        th { color: var(--text-dim); font-size: 10px; padding: 8px 2px; border-bottom: 1px solid #333; cursor: pointer; }
        th:nth-child(1) { text-align: left; width: 42%; } 
        th:nth-child(2), th:nth-child(3) { text-align: right; width: 11%; } 
        th:nth-child(4) { text-align: right; width: 17%; } 
        th:nth-child(5) { width: 19%; text-align: center; } 
        
        td { padding: 6px 2px; border-bottom: 1px solid #1a1a1a; text-align: right; }
        .name-col { text-align: left; overflow: hidden; white-space: nowrap; }
        .stock-name-row { display: flex; align-items: baseline; gap: 3px; }
        .stock-num { font-size: 11px; color: var(--accent); font-family: monospace; font-weight: bold; }
        .stock-name { font-weight: 500; color: #fff; font-size: 13px; cursor: pointer; text-decoration: underline dotted var(--text-dim); }
        .stock-name:hover { color: var(--ai-gold); }
        .stock-id { font-size: 10px; color: #f1adad; font-family: monospace; opacity: 0.7; }

        .score-val { font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .score-bar-bg { display: block; width: 100%; height: 2px; background: #222; border-radius: 1px; margin-top: 2px; overflow: hidden; }
        .score-bar-fill { height: 100%; transition: width 0.3s ease; }

        .rank-strength-container { width: 100%; height: 10px; background: #000; border-radius: 5px; position: relative; overflow: hidden; border: 1px solid #333; }
        .rank-strength-fill { height: 100%; transition: width 0.4s ease; border-radius: 5px; }

        .ai-badge { font-size: 9px; background: var(--ai-gold); color: #000; padding: 1px 3px; border-radius: 3px; margin-left: 4px; font-weight: bold; }

        /* AI Modal Styles */
        #ai-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center;
            backdrop-filter: blur(4px);
        }
        .modal-content {
            background: var(--surface); width: 90%; max-width: 400px; padding: 20px;
            border-radius: 12px; border: 1px solid var(--ai-gold); position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .close-btn { position: absolute; right: 15px; top: 10px; cursor: pointer; color: var(--text-dim); font-size: 20px; }
        .link-btn {
            flex: 1; padding: 10px 5px; text-align: center; border-radius: 6px;
            text-decoration: none; font-size: 12px; font-weight: bold; color: #fff;
            transition: opacity 0.2s;
        }
        .link-google { background: #4285f4; }
        .link-info { background: #f57c00; }
        .link-wantgoo { background: #d32f2f; }
    </style>
</head>

<div id="ai-modal">

            🤖 AI 標的分析

</div>

    async function fetchData() {
        if (isFetching) return;
        isFetching = true;
        try {
            const response = await fetch('https://market-data-api.futures-ai.com/stkfut_tradeinfo/');
            const data = await response.json();
            if (data) {
                cachedData = Object.keys(data).filter(k => stockMap[k]).map(k => {
                    const info = stockMap[k];
                    const near = data[k].near_month;
                    const far = data[k].next_month;
                    const total = near + far;
                    const isLongSignal = total >= CONFIG.longThreshold && near >= CONFIG.longNearMin && far >= 0;
                    return { 
                        id: k, stockNum: info[0], name: info[1], 
                        near: near, far: far, total: total,
                        isLong: isLongSignal
                    };
                });
                render();
                refreshTimer = 0; 
            }
        } catch (e) { console.error(e); } finally { isFetching = false; }
    }

                             </div>`;

        // 生成外部連結
        links.innerHTML = `

            <a href="https://www.wantgoo.com/stock/${stockNum}" target="_blank" class="link-btn link-wantgoo">主力籌碼</a>
        `;
    }

    function closeAI() {
        document.getElementById('ai-modal').style.display = 'none';
    }

    function setMode(mode) {
        currentMode = mode;
        updateUI();
        render();
    }

    function handleSortClick() {
        sortOrder = (sortOrder === 'desc') ? 'asc' : 'desc';
        updateUI();
        render();
    }

    function toggleIdSort() {
        const check = document.getElementById('sort-by-id');
        if (event.target.tagName !== 'INPUT') check.checked = !check.checked;
        render();
        updateUI();
    }

    function updateUI() {
        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.mode === currentMode);
        });
        const thTotal = document.getElementById('th-total');
        thTotal.innerText = `總分 ${sortOrder === 'desc' ? '▼' : '▲'}`;
    }

    document.getElementById('rank-slider').oninput = function() {
        currentRankLimit = parseInt(this.value);
        document.getElementById('rank-val').innerText = currentRankLimit >= 240 ? "全部" : `${currentRankLimit} 名`;
        render();
    };

    function render() {
        const tbody = document.getElementById('main-table');
        const isMiniOnly = document.getElementById('mini-only').checked;
        const isSortById = document.getElementById('sort-by-id').checked;
        const isHotEnabled = document.getElementById('hot-filter').checked;
        
        let list = [...cachedData];
        if (isMiniOnly) list = list.filter(item => item.name.includes('小型'));
        
        if (currentMode === 'ai_long') {
            list = list.filter(i => i.isLong); 
        } else if (currentMode === 'up') {
            list = list.filter(i => i.total > 0);
        } else if (currentMode === 'down') {
            list = list.filter(i => i.total < 0);
        }

        if (currentMode !== 'ai_long' && !isHotEnabled && list.length > (CONFIG.filterTop + CONFIG.filterBottom)) {
            list.sort((a, b) => b.total - a.total);
            let excludeIds = new Set();
            if (CONFIG.filterTop > 0) list.slice(0, CONFIG.filterTop).forEach(i => excludeIds.add(i.id));
            if (CONFIG.filterBottom > 0) list.slice(-CONFIG.filterBottom).forEach(i => excludeIds.add(i.id));
            list = list.filter(item => !excludeIds.has(item.id));
        }

        if (isSortById) {
            list.sort((a, b) => a.stockNum.localeCompare(b.stockNum));
        } else {
            list.sort((a, b) => sortOrder === 'desc' ? b.total - a.total : a.total - b.total);
        }

        if (currentRankLimit < 240) {
            list = list.slice(0, currentRankLimit);
        }
        
        const currentMax = list.length > 0 ? Math.max(...list.map(i => Math.abs(i.total))) : 1;

        tbody.innerHTML = list.map(item => {
            const themeColor = item.total >= 0 ? 'var(--up-red)' : 'var(--down-green)';
            const rankStrength = (Math.abs(item.total) / (currentMax || 1)) * 100;
            const badge = item.isLong ? `<span class="ai-badge">精選</span>` : '';
            
            return `
            <tr>
                <td class="name-col">
                    <div class="stock-name-row">
                        <span class="stock-num">${item.stockNum}</span>
                        <span class="stock-name" onclick="showAI('${item.stockNum}', '${item.name.replace('期','')}')">${item.name}${badge}</span>
                        <span class="stock-id">${item.id}</span>
                    </div>
                </td>
                <td><span class="score-val" style="color:${item.near >= 0 ? 'var(--up-red)' : 'var(--down-green)'}">${Math.round(item.near)}</span></td>
                <td><span class="score-val" style="color:${item.far >= 0 ? 'var(--up-red)' : 'var(--down-green)'}">${Math.round(item.far)}</span></td>
                <td>
                    <span class="score-val" style="color:${themeColor}">${Math.round(item.total)}</span>
                    <div class="score-bar-bg">
                        <div class="score-bar-fill" style="width:${Math.min((Math.abs(item.total)/30)*100, 100)}%; background:${themeColor}"></div>
                    </div>
                </td>
                <td>
                    <div class="rank-strength-container">
                        <div class="rank-strength-fill" style="width:${rankStrength}%; background:${themeColor};"></div>
                    </div>
                </td>
            </tr>`;
        }).join('');
    }

    function updateTimer() {
        refreshTimer += 100;
        const rem = Math.max(0, (REFRESH_INTERVAL - refreshTimer) / 1000);
        document.getElementById('timer-display').innerText = `${rem.toFixed(1)}s`;
        document.getElementById('refresh-bar').style.width = (refreshTimer/REFRESH_INTERVAL)*100 + '%';
        if (refreshTimer >= REFRESH_INTERVAL) fetchData();
    }

    initApp();
    setInterval(updateTimer, 100);
</script>
</body>
</html>

    async function fetchData() {
        if (isFetching) return;
        isFetching = true;
        try {
            const response = await fetch('https://market-data-api.futures-ai.com/stkfut_tradeinfo/');
            const data = await response.json();
            if (data) {
                cachedData = Object.keys(data).filter(k => stockMap[k]).map(k => {
                    const info = stockMap[k];
                    const near = data[k].near_month;
                    const far = data[k].next_month;
                    const total = near + far;
                    const isLongSignal = total >= CONFIG.longThreshold && near >= CONFIG.longNearMin && far >= 0;
                    return { 
                        id: k, stockNum: info[0], name: info[1], 
                        near: near, far: far, total: total,
                        isLong: isLongSignal
                    };
                });
                render();
                refreshTimer = 0; 
            }
        } catch (e) { console.error(e); } finally { isFetching = false; }
    }

    function render() {
        const tbody = document.getElementById('main-table');
        const isMiniOnly = document.getElementById('mini-only').checked;
        const isSortById = document.getElementById('sort-by-id').checked;
        const isHotEnabled = document.getElementById('hot-filter').checked;
        
        let list = [...cachedData];
        
        if (isMiniOnly) list = list.filter(item => item.name.includes('小型'));
        
        if (currentMode === 'ai_long') {
            list = list.filter(i => i.isLong); 
        } else if (currentMode === 'up') {
            list = list.filter(i => i.total > 0);
        } else if (currentMode === 'down') {
            list = list.filter(i => i.total < 0);
        }

        // 熱度過濾邏輯 (根據 CONFIG 隱藏極端值)
        if (currentMode !== 'ai_long' && !isHotEnabled && list.length > (CONFIG.filterTop + CONFIG.filterBottom)) {
            list.sort((a, b) => b.total - a.total);
            let excludeIds = new Set();
            if (CONFIG.filterTop > 0) list.slice(0, CONFIG.filterTop).forEach(i => excludeIds.add(i.id));
            if (CONFIG.filterBottom > 0) list.slice(-CONFIG.filterBottom).forEach(i => excludeIds.add(i.id));

        }

            list.sort((a, b) => a.stockNum.localeCompare(b.stockNum));

        }
