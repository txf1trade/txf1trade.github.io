<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 期權戰情室</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --blue: #58a6ff;
            --red: #ff7b72; --green: #7ee787; --border: #30363d;
            --risk-bg: #490e0e; /* 曝險警告背景色 */
        }
        body { 
            font-family: -apple-system, "Segoe UI", sans-serif; 
            background: var(--bg); color: #c9d1d9; margin: 0; padding: 8px; 
        }
        .container { max-width: 500px; margin: auto; }
        .header-title { font-size: 16px; color: var(--blue); text-align: center; margin-bottom: 8px; font-weight: bold; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 12px; }
        th { background: #21262d; color: #8b949e; padding: 5px 2px; border: 1px solid var(--border); font-size: 10px; }
        td { padding: 8px 2px; border: 1px solid var(--border); text-align: center; }
        
        .group-label { background: #010409 !important; font-weight: bold; color: #bc8cff; font-size: 11px; text-align: left !important; padding-left: 10px !important; }
        .group-foreign { color: var(--blue); }

        .num-cell { font-family: "Consolas", monospace; font-weight: bold; }
        .pos { color: var(--red); } .neg { color: var(--green); }
        .call-text { color: var(--red); font-weight: bold; }
        .put-text { color: var(--green); font-weight: bold; }
        
        /* --- 風險提示視覺強化 --- */
        .risk-active { 
            background-color: var(--risk-bg) !important; 
            color: #ffffff !important; 
            font-weight: bold;
            animation: pulse 2s infinite; /* 加入微弱閃爍效果 */
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.8; }
            100% { opacity: 1; }
        }
        .safe-tag { color: #8b949e; font-size: 10px; }

        .ai-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
        .trend-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border); }
        .trend-status { font-size: 20px; font-weight: 900; }
        .ai-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        .ai-card { background: #0d1117; padding: 6px; border-radius: 6px; border: 1px solid var(--border); }
        .card-label { font-size: 10px; color: #8b949e; margin-bottom: 2px; }
        .card-content { font-size: 12px; line-height: 1.4; }
        .strategy-box { padding: 8px; background: rgba(88, 166, 255, 0.08); border-radius: 6px; border-left: 3px solid var(--blue); }
        .strategy-desc { font-size: 13px; line-height: 1.5; color: #f0f6fc; }

        .color-bull { color: var(--red); }
        .color-bear { color: var(--green); }
        .color-neutral { color: var(--blue); }
    </style>
</head>
<body>

<div class="container">
    <div class="header-title">📊 期權籌碼行動戰情室</div>
    <div id="data-table">連線中...</div>

    <div class="ai-box">
        <div class="trend-row">
            <span style="font-size: 13px; color: #8b949e;">AI 趨勢分析</span>
            <span id="trend-indicator" class="trend-status color-neutral">--</span>
        </div>
        <div class="ai-grid">
            <div class="ai-card">
                <div class="card-label">自營商 (莊家)</div>
                <div id="dealer-txt" class="card-content">分析中...</div>
            </div>
            <div class="ai-card">
                <div class="card-label">外資 (大戶)</div>
                <div id="foreign-txt" class="card-content">分析中...</div>
            </div>
        </div>
        <div class="strategy-box">
            <div id="strategy-desc" class="strategy-desc">正在計算策略...</div>
        </div>
    </div>
</div>

<script>
    const apiUrl = 'https://script.google.com/macros/s/AKfycbxtnFuNANtdObDtCYbaHXxC-LGfiWRqMdhTjh0E1psdftmHPhVL3nNJhJxC5_WF0S0UtQ/exec';

    async function fetchData() {
        try {
            const response = await fetch(apiUrl);
            const data = await response.json();
            const startIndex = (data[0][0] === "權別") ? 1 : 0;
            
            let dealerRows = "";
            let foreignRows = "";
            let s = { dCall: 0, dPut: 0, fCall: 0, fPut: 0 };

            let lastType = ""; 
            for (let i = startIndex; i < data.length; i++) {
                let [type, id, diff, oi] = data[i];
                if (type && type.trim() !== "") lastType = type; else type = lastType;
                
                const oiVal = parseFloat(oi.replace(/,/g, '')) || 0;
                const isCall = type.includes('買權');
                const typeClass = isCall ? 'call-text' : 'put-text';
                
                // 判斷曝險狀態並決定樣式
                const isRisk = oiVal < 0;
                const riskCellClass = isRisk ? 'risk-active' : 'safe-tag';
                const riskText = isRisk ? '⚠️ 曝險' : '正常';

                const rowHtml = `<tr>
                    <td class="${typeClass}">${type}</td>
                    <td class="num-cell ${diff.includes('-')?'neg':'pos'}">${diff}</td>
                    <td class="num-cell ${oi.includes('-')?'neg':'pos'} ${isRisk ? 'risk-active':''}">${oi}</td>
                    <td class="${riskCellClass}">${riskText}</td>
                </tr>`;

                if (id === "自營商") {
                    dealerRows += rowHtml;
                    if (isCall) s.dCall = oiVal; else s.dPut = oiVal;
                } else if (id === "外資") {
                    foreignRows += rowHtml;
                    if (isCall) s.fCall = oiVal; else s.fPut = oiVal;
                }
            }

            let finalTable = `<table>
                <thead><tr><th style="width:25%">權別</th><th style="width:25%">差額</th><th style="width:30%">未平倉OI</th><th style="width:20%">狀態</th></tr></thead>
                <tbody>
                    <tr><td colspan="4" class="group-label">🟣 自營商</td></tr>
                    ${dealerRows}
                    <tr><td colspan="4" class="group-label group-foreign">🔵 外資</td></tr>
                    ${foreignRows}
                </tbody>
            </table>`;

            document.getElementById('data-table').innerHTML = finalTable;
            analyzeTrend(s);
        } catch (e) { document.getElementById('data-table').innerHTML = "讀取失敗"; }
    }

    function analyzeTrend(s) {
        let trend = "", color = "color-neutral", strategy = "";
        let score = 0;

        if (s.dPut < 0) score += 1;
        if (s.dCall < 0) score -= 1;
        if (s.fCall > 0) score += 2;
        if (s.fPut > 0) score -= 2;

        if (score >= 3) { trend = "📈 極度偏多"; color = "color-bull"; strategy = "多頭強勢。莊家撐盤且外資進攻，逢回即多。"; }
        else if (score >= 1) { trend = "↗️ 偏多震盪"; color = "color-bull"; strategy = "盤勢有撐。建議拉回支撐不破再佈局。"; }
        else if (score <= -3) { trend = "📉 極度偏空"; color = "color-bear"; strategy = "趨勢轉弱。外資空頭力道強，建議避險。"; }
        else if (score <= -1) { trend = "↘️ 偏空震盪"; color = "color-bear"; strategy = "壓力沉重。上方莊家壓頭，不宜追高。"; }
        else { trend = "↔️ 中性整理"; color = "color-neutral"; strategy = "多空對峙。適合區間操作，收權利金為主。"; }

        document.getElementById('trend-indicator').innerText = trend;
        document.getElementById('trend-indicator').className = "trend-status " + color;
        document.getElementById('dealer-txt').innerText = (s.dPut < 0 ? "下有撐" : "") + (s.dCall < 0 ? " 上有壓" : "") || "中性";
        document.getElementById('foreign-txt').innerText = (s.fCall > 0 ? "BC進攻" : "") + (s.fPut > 0 ? " BP避險" : "") || "觀望";
        document.getElementById('strategy-desc').innerText = "💡 策略：" + strategy;
    }
    fetchData();
</script>
</body>
</html>
