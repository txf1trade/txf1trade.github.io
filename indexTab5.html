        /* 暗色模式基礎設定 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            margin: 10px; 
            background-color: #121212; 
            color: #e0e0e0; 
            font-size: 13px; /* 縮小全體字體 */
        }

        /* 容器寬度控制 */
        .container { 
            max-width: 600px; /* 你可以在這裡調整寬度 */

        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;

        /* 表格緊湊化 */

        th {

            font-weight: 500;
            padding: 6px 8px; 
            text-align: left;
            border-bottom: 2px solid #333;
            position: sticky;
            top: 0;
        }

        td { 
            padding: 4px 8px; /* 極窄內距 */
            border-bottom: 1px solid #2a2a2a; 
            white-space: nowrap;
        }

        tr:hover { background-color: #252525; }

        /* 權重數字強調 */
        .weight { 
            font-family: "Cascadia Code", Consolas, monospace;
            font-weight: bold; 
            color: #ff6b6b; 
            text-align: right; 
        }

        .symbol { color: #888; font-size: 11px; }
        .loading { text-align: center; padding: 20px; color: #aaa; }
    </style>
</head>

    async function fetchData() {
        const url = 'https://market-data-api.futures-ai.com/stock_futures_weight/';
        const statusEl = document.getElementById('status');
        const tableEl = document.getElementById('data-table');
        const bodyEl = document.getElementById('data-body');

        try {
            const response = await fetch(url);
            const data = await response.json();
            
            // 排序：權重由大到小
            const sortedData = Object.entries(data).sort((a, b) => b[1].percentage - a[1].percentage);

            let html = '';
            sortedData.forEach(([key, val]) => {
                const info = stockMap[key] || ["-", "未知"];
                html += `
                    <tr>
                        <td style="color:#fff">${info[1].replace('期','')}</td>
                        <td class="symbol">${info[0]}</td>
                        <td class="symbol">${key}</td>
                        <td class="weight">${val.percentage.toFixed(3)}%</td>
                    </tr>
                `;
            });

            bodyEl.innerHTML = html;
            statusEl.style.display = 'none';
            tableEl.style.display = 'table';
        } catch (e) {
            statusEl.innerText = "Error Loading Data";
        }
    }

    // 搜尋功能
    function filterTable() {
        const input = document.getElementById("search").value.toUpperCase();
        const rows = document.getElementById("data-body").getElementsByTagName("tr");
        for (let row of rows) {
            row.style.display = row.innerText.toUpperCase().includes(input) ? "" : "none";
        }
    }

    window.onload = fetchData;
