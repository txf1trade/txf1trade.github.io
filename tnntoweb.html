<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>富時台轉換工具</title>
    <!-- 引入 TradingView Lightweight Charts -->
    <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
    <style>
        /* 定義佈景主題變數 */
        :root {
            --bg-color: #d8dcde;          /* 護眼沈穩灰底 */
            --container-bg: #e6eaed;      /* 柔和淺灰面板色 */
            --text-color: #2c3e50;        /* 舒適深藍灰色字體 */
            --text-muted: #576574;        /* 次要文字色 */
            --border-color: #b0bac5;      /* 邊框色 */
            --table-th-bg: #ccd3d9;       /* 表頭底色 */
            --box-bg: #d4dadf;          /* 小框底色 */
            --chart-bg: #e6eaed;          /* 圖表區底色 */
            --chart-grid: #d0d7de;        /* 圖表網格線 */
            --chart-text: #4b6584;        /* 圖表文字色 */
            --pro-blue-bg: #2b4c7e;
            --pro-blue-text: #ffffff;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #f0f0f0;
            --text-muted: #cccccc;
            --border-color: #3a3f4b;
            --table-th-bg: #252833;
            --box-bg: #252525;
            --chart-bg: #1e1e1e;
            --chart-grid: #2a2e39;
            --chart-text: #d1d4dc;
            --pro-blue-bg: #325a96;
            --pro-blue-text: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 6px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-size: 15px;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            max-width: 880px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 10px 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
            transition: background-color 0.3s;
        }
        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 6px;
            margin-bottom: 8px;
            position: relative;
        }
        h2 {
            font-size: 17px;
            margin: 0;
        }
        .header-controls {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .timer-badge {
            font-size: 12px;
            font-weight: 600;
            background: var(--box-bg);
            border: 1px solid var(--border-color);
            padding: 3px 6px;
            border-radius: 12px;
        }
        .action-btn {
            background: var(--pro-blue-bg);
            color: var(--pro-blue-text);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: opacity 0.2s;
        }
        .action-btn:hover {
            opacity: 0.85;
        }
        .theme-btn {
            background: var(--text-color);
            color: var(--bg-color);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
        }
        .menu-btn {
            background: var(--table-th-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .menu-btn:hover {
            opacity: 0.85;
        }

        /* 漢堡選單下拉面板 */
        .menu-dropdown {
            position: absolute;
            top: 45px;
            right: 0;
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.7);
            display: none;
            flex-direction: column;
            width: 270px;
            z-index: 101;
            padding: 12px;
            color: #d1d4dc;
        }
        .menu-dropdown.show {
            display: flex;
        }

        .menu-title-top {
            font-size: 11px;
            font-weight: bold;
            color: #787b86;
            text-align: center;
            margin-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
            padding-bottom: 6px;
        }

        .slider-group {
            margin-bottom: 10px;
            font-size: 13px;
        }
        .slider-group label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }
        .slider-group input[type="range"] {
            width: 100%;
            cursor: pointer;
            accent-color: #2196f3;
            margin-top: 2px;
        }
        .param-input {
            background: #131722;
            border: 1px solid #2a2e39;
            color: #ffffff;
            width: 55px;
            text-align: center;
            border-radius: 4px;
            font-size: 13px;
            padding: 3px;
            font-weight: bold;
        }

        .section-title {
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 4px;
            font-weight: bold;
            color: var(--text-muted);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
            font-size: 14px;
            margin-bottom: 8px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 6px 4px;
        }
        th {
            background-color: var(--table-th-bg);
            color: var(--text-color);
            font-weight: bold;
            font-size: 14px;
        }
        
        .cell-yellow { background-color: #ffe600 !important; color: #000 !important; font-weight: bold; }
        .cell-blue { background-color: var(--pro-blue-bg) !important; color: var(--pro-blue-text) !important; font-weight: bold; }
        .cell-red { background-color: #cc0000 !important; color: #fff !important; font-weight: bold; }
        .cell-white { background-color: var(--container-bg); color: var(--text-color); }
        
        input.calc-input {
            width: 90%;
            padding: 6px 4px;
            font-size: 15px;
            text-align: center;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            background: var(--container-bg);
            color: var(--text-color);
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }
        input.calc-input:focus {
            border-color: var(--pro-blue-bg);
            box-shadow: 0 0 4px rgba(43, 76, 126, 0.4);
        }

        .cell-blue-input-container {
            background-color: var(--pro-blue-bg) !important;
            padding: 4px !important;
        }
        input.calc-input-twn {
            width: 90%;
            padding: 6px 4px;
            font-size: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 4px;
            background: var(--container-bg);
            color: var(--text-color);
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
        }
        input.calc-input-twn:focus {
            border-color: #ffe600;
            box-shadow: 0 0 5px rgba(255, 230, 0, 0.6);
        }

        .charts-wrapper {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        @media (min-width: 768px) {
            body { padding: 15px; }
            .container { padding: 15px 20px; }
            table { font-size: 15px; }
            th, td { padding: 8px; }
            .charts-wrapper { 
                grid-template-columns: repeat(2, minmax(0, 1fr)); 
            }
            .chart-box:nth-child(3) {
                grid-column: 1 / -1;
            }
        }

        .chart-box {
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 6px;
            background: var(--chart-bg);
            min-width: 0;
            position: relative;
        }
        .chart-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2px;
        }
        .chart-title {
            font-weight: bold;
            font-size: 13px;
        }
        .reset-zoom-btn {
            background: var(--table-th-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 1px 6px;
            border-radius: 3px;
            font-size: 11px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }
        .reset-zoom-btn:hover {
            opacity: 0.8;
        }
        .main-chart {
            width: 100%;
            height: 200px;
            position: relative;
        }
        .floating-tooltip {
            position: absolute;
            display: none;
            padding: 6px 10px;
            box-sizing: border-box;
            font-size: 12px;
            line-height: 1.4;
            text-align: left;
            z-index: 1000;
            pointer-events: none;
            background: rgba(20, 20, 20, 0.88);
            color: #ffffff;
            border-radius: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            white-space: nowrap;
        }

        /* TradingView 風格色票彈出視窗 */
        .tv-color-palette {
            position: absolute;
            background: #1e222d;
            border: 1px solid #2a2e39;
            border-radius: 6px;
            padding: 8px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.7);
            display: none;
            z-index: 10000;
            width: 200px;
        }
        .tv-color-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 3px;
        }
        .tv-color-cell {
            width: 15px;
            height: 15px;
            border-radius: 2px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }
        .tv-color-cell:hover {
            transform: scale(1.3);
            z-index: 2;
            border-color: #fff;
        }
        .color-preview {
            display: inline-block;
            width: 16px;
            height: 14px;
            border-radius: 3px;
            vertical-align: middle;
            margin-left: 6px;
            cursor: pointer;
            border: 1px solid #2a2e39;
        }
        .chart-legend-overlay {
            position: absolute;
            top: 30px;
            left: 8px;
            z-index: 10;
            font-size: 11px;
            font-weight: bold;
            background: rgba(14, 14, 14, 0.75);
            padding: 2px 5px;
            border-radius: 3px;
            display: flex;
            gap: 6px;
            pointer-events: none;
        }
        .legend-item {
            cursor: pointer;
            user-select: none;
            pointer-events: auto;
        }
        .legend-item.hidden {
            opacity: 0.35;
            text-decoration: line-through;
        }
    </style>
</head>
<body data-theme="dark">

<!-- TradingView 風格色票彈出視窗 -->
<div id="tvColorPalette" class="tv-color-palette">
    <div class="tv-color-grid" id="tvColorGrid"></div>
</div>

<div class="container">
    <div class="header-row">
        <h2>富時台轉換工具</h2>
        <div class="header-controls">
            <div id="timer" class="timer-badge">8秒後更新</div>
            <button class="action-btn" id="refresh-btn">推新行情</button>
            <button class="theme-btn" id="theme-btn">淺色模式</button>
            <button class="menu-btn" id="menu-toggle-btn">☰</button>
        </div>

        <!-- 漢堡選單下拉面板 -->
        <div class="menu-dropdown" id="menuDropdown">
            <div class="menu-title-top">K線圖顯示設定</div>
            <div class="slider-group">
                <label><span>歷史天數 (天)</span><input type="number" id="input-days" class="param-input" min="5" max="365" value="60" oninput="updateDaysInput(this.value)" onchange="updateDaysInput(this.value)"></label>
                <input type="range" id="slider-days" min="5" max="365" value="60" oninput="updateDaysSlider(this.value)">
            </div>

            <div class="menu-title-top" style="margin-top: 6px;">⚙️ 均線參數與顏色</div>
            <div class="slider-group">
                <label style="cursor:pointer;">
                    <span>EMA 1 <span class="color-preview" id="preview-ema1" onclick="openColorPalette(1, event)"></span></span>
                    <input type="number" id="input-ema1" class="param-input" min="1" max="400" value="76" oninput="updateEmaInput('ema1', this.value)" onchange="updateEmaInput('ema1', this.value)">
                </label>
                <input type="range" id="slider-ema1" min="1" max="400" value="76" oninput="updateEmaSlider('ema1', this.value)">
            </div>
            <div class="slider-group" style="margin-top: 6px;">
                <label style="cursor:pointer;">
                    <span>EMA 2 <span class="color-preview" id="preview-ema2" onclick="openColorPalette(2, event)"></span></span>
                    <input type="number" id="input-ema2" class="param-input" min="1" max="400" value="380" oninput="updateEmaInput('ema2', this.value)" onchange="updateEmaInput('ema2', this.value)">
                </label>
                <input type="range" id="slider-ema2" min="1" max="400" value="380" oninput="updateEmaSlider('ema2', this.value)">
            </div>
        </div>
    </div>

    <table>
        <tr>
            <th style="width: 32%;">最近成交時間</th>
            <th style="width: 33%;">富時台成交價</th>
            <th style="width: 35%;">估計台指期</th>
        </tr>
        <tr>
            <td id="td-time" class="cell-yellow" style="font-size: 13px;">讀取中...</td>
            <td id="td-twn" class="cell-blue">-</td>
            <td id="td-est" class="cell-red">-</td>
        </tr>
        <tr>
            <td id="td-tx-label" class="cell-white" style="font-size: 13px;">台指期基準收盤</td>
            <td id="td-tx-close" class="cell-white">-</td>
            <td class="cell-white"></td>
        </tr>
        <tr>
            <td class="cell-white">目前 漲跌點數</td>
            <td id="td-diff" class="cell-red">-</td>
            <td class="cell-white" style="font-size: 12px;">誤差(+/-15)</td>
        </tr>
    </table>

    <div class="section-title">台指期 / 富時台 換算器</div>

    <table>
        <tr>
            <th style="width: 25%;">輸入台指期點數</th>
            <td style="width: 25%;" class="cell-white">
                <input type="number" id="input-tx" class="calc-input" placeholder="請輸入">
            </td>
            <th style="width: 25%;">對應富時台指數</th>
            <td id="output-twn" style="width: 25%;" class="cell-white">-</td>
        </tr>
        <tr>
            <th class="cell-yellow">輸入富時台指數</th>
            <td style="width: 25%;" class="cell-blue-input-container">
                <input type="number" id="input-twn" class="calc-input-twn" step="0.05" placeholder="請輸入">
            </td>
            <th class="cell-red">對應台指期點數</th>
            <td id="output-tx" style="width: 25%;" class="cell-white">-</td>
        </tr>
    </table>

    <div class="charts-wrapper">
        <div class="chart-box">
            <div class="chart-legend-overlay">
                <span class="legend-item" id="legend-twn-ema1" onclick="toggleChartEma('twn', 1)">EMA80: --</span>
                <span class="legend-item" id="legend-twn-ema2" onclick="toggleChartEma('twn', 2)">EMA400: --</span>
            </div>
            <div class="chart-header-bar">
                <div class="chart-title">📊 富台指 (TWN-1) 15K</div>
                <button class="reset-zoom-btn" id="btn-reset-twn">回最新 K</button>
            </div>
            <div id="tooltip-twn" class="floating-tooltip"></div>
            <div id="chart-twn-main" class="main-chart"></div>
        </div>
        <div class="chart-box">
            <div class="chart-legend-overlay">
                <span class="legend-item" id="legend-txall-ema1" onclick="toggleChartEma('txall', 1)">EMA76: --</span>
                <span class="legend-item" id="legend-txall-ema2" onclick="toggleChartEma('txall', 2)">EMA380: --</span>
            </div>
            <div class="chart-header-bar">
                <div class="chart-title">📊 台指全 (TX-1) 15K</div>
                <button class="reset-zoom-btn" id="btn-reset-txall">回最新 K</button>
            </div>
            <div id="tooltip-txall" class="floating-tooltip"></div>
            <div id="chart-txall-main" class="main-chart"></div>
        </div>
        <div class="chart-box">
            <div class="chart-legend-overlay">
                <span class="legend-item" id="legend-tx-ema1" onclick="toggleChartEma('tx', 1)">EMA76: --</span>
                <span class="legend-item" id="legend-tx-ema2" onclick="toggleChartEma('tx', 2)">EMA380: --</span>
            </div>
            <div class="chart-header-bar">
                <div class="chart-title">📊 台指期 (TXAM-1) 15K</div>
                <button class="reset-zoom-btn" id="btn-reset-tx">回最新 K</button>
            </div>
            <div id="tooltip-tx" class="floating-tooltip"></div>
            <div id="chart-tx-main" class="main-chart"></div>
        </div>
    </div>
</div>

<script>
    let regressionModel = { a: 1, b: 0 };
    let txLastClose = 0;
    let countdown = 8;
    let timerInterval = null;
    let chartViewers = [];
    let lastFallbackTwn = 0;

    let historyDays = 60; // 圖表顯示的歷史天數

    // 台指期 / 台指全自訂均線設定
    let ema1Period = 76;
    let ema2Period = 380;
    let ema1Color = '#ffcc66';
    let ema2Color = '#00e1ff';
    let activeColorEma = null;

    // 富台指固定均線設定
    let twnEma1Period = 80;
    let twnEma2Period = 400;
    let twnEma1Color = '#ffcc66';
    let twnEma2Color = '#00e1ff';

    // 漢堡選單開關控制
    const menuToggleBtn = document.getElementById('menu-toggle-btn');
    const menuDropdown = document.getElementById('menuDropdown');

    menuToggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuDropdown.classList.toggle('show');
    });

    menuDropdown.addEventListener('click', (e) => {
        e.stopPropagation();
    });

    window.addEventListener('click', () => {
        if (menuDropdown) menuDropdown.classList.remove('show');
        const palette = document.getElementById('tvColorPalette');
        if (palette) palette.style.display = 'none';
    });

    // TradingView 風格色票矩陣
    const tvColors = [
        "#ffffff", "#d9d9d9", "#b3b3b3", "#8c8c8c", "#666666", "#404040", "#262626", "#1a1a1a", "#0d0d0d", "#000000",
        "#f44336", "#e91e63", "#9c27b0", "#673ab7", "#3f51b5", "#2196f3", "#03a9f4", "#00bcd4", "#009688", "#4caf50",
        "#ff5722", "#ff9800", "#ffeb3b", "#cddc39", "#8bc34a", "#00e676", "#1de9b6", "#00e5ff", "#2979ff", "#651fff",
        "#ff8a80", "#ff80ab", "#ea80fc", "#b388ff", "#8c9eff", "#80d8ff", "#84ffff", "#a7ffeb", "#b9f6ca", "#f4ff81",
        "#ffe082", "#ffcc80", "#ffab91", "#bcaaa4", "#eeeeee", "#b0bec5", "#78909c", "#455a64", "#37474f", "#263238"
    ];

    function initColorPaletteGrid() {
        const grid = document.getElementById('tvColorGrid');
        grid.innerHTML = '';
        tvColors.forEach(hex => {
            const cell = document.createElement('div');
            cell.className = 'tv-color-cell';
            cell.style.backgroundColor = hex;
            cell.onclick = (e) => {
                e.stopPropagation();
                selectPaletteColor(hex);
            };
            grid.appendChild(cell);
        });
    }

    function openColorPalette(index, event) {
        event.stopPropagation();
        activeColorEma = index;
        const palette = document.getElementById('tvColorPalette');
        const rect = event.target.getBoundingClientRect();
        
        palette.style.display = 'block';
        palette.style.top = (rect.bottom + window.scrollY + 4) + 'px';
        palette.style.left = (rect.left + window.scrollX - 80) + 'px';
    }

    function selectPaletteColor(hex) {
        if (activeColorEma !== null) {
            updateEmaColor(activeColorEma, hex);
        }
        document.getElementById('tvColorPalette').style.display = 'none';
    }

    function updateEmaColor(index, color) {
        if (index === 1) {
            ema1Color = color;
            document.getElementById('preview-ema1').style.backgroundColor = color;
        } else if (index === 2) {
            ema2Color = color;
            document.getElementById('preview-ema2').style.backgroundColor = color;
        }
        chartViewers.forEach(v => {
            if (v.chartKey !== 'twn') v.updateColors();
        });
    }

    function updateEmaInput(type, val) {
        let num = parseInt(val);
        if (isNaN(num) || num < 1) num = 1;
        if (num > 400) num = 400;

        if (type === 'ema1') {
            ema1Period = num;
            document.getElementById('slider-ema1').value = num;
            document.getElementById('input-ema1').value = num;
        } else if (type === 'ema2') {
            ema2Period = num;
            document.getElementById('slider-ema2').value = num;
            document.getElementById('input-ema2').value = num;
        }
        chartViewers.forEach(v => {
            if (v.chartKey !== 'twn') v.redraw();
        });
    }

    function updateEmaSlider(type, val) {
        updateEmaInput(type, val);
    }

    function updateDaysInput(val) {
        let num = parseInt(val);
        if (isNaN(num) || num < 5) num = 5;
        if (num > 365) num = 365;
        historyDays = num;
        document.getElementById('slider-days').value = num;
        document.getElementById('input-days').value = num;
        
        reloadChartDisplay();
    }

    function updateDaysSlider(val) {
        updateDaysInput(val);
    }

    function toggleChartEma(chartKey, index) {
        const viewer = chartViewers.find(v => v.chartKey === chartKey);
        if (viewer) {
            viewer.toggleVisibility(index);
        }
    }

    function getChartThemeOptions() {
        const isDark = document.body.getAttribute('data-theme') === 'dark';
        return {
            layout: { 
                background: { color: isDark ? '#1e1e1e' : '#e6eaed' }, 
                textColor: isDark ? '#d1d4dc' : '#4b6584' 
            },
            grid: { 
                vertLines: { color: isDark ? '#2a2e39' : '#d0d7de' }, 
                horzLines: { color: isDark ? '#2a2e39' : '#d0d7de' } 
            },
            timeScale: { 
                timeVisible: true, 
                secondsVisible: false,
                rightOffset: 5,
                barSpacing: 12  // 放大 K 棒間距，使 K 線更寬敞清晰
            },
        };
    }

    function calculateEMA(data, period) {
        let results = [];
        if (period <= 0 || data.length === 0) return results;
        let multiplier = 2 / (period + 1);
        let prevEMA = null;
        for (let i = 0; i < data.length; i++) {
            let close = data[i].close;
            if (i === 0) {
                prevEMA = close;
            } else {
                prevEMA = (close - prevEMA) * multiplier + prevEMA;
            }
            results.push({ time: data[i].time, value: prevEMA });
        }
        return results;
    }

    function createChartInstance(mainId, tooltipId, resetBtnId, prefixTickSize, chartKey) {
        const mainContainer = document.getElementById(mainId);
        const tooltipEl = document.getElementById(tooltipId);
        const resetBtn = document.getElementById(resetBtnId);

        const baseOpts = getChartThemeOptions();

        const mainChart = LightweightCharts.createChart(mainContainer, {
            ...baseOpts,
            timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 5, barSpacing: 12 }
        });

        const decimals = prefixTickSize < 1 ? 2 : 0;

        const candleSeries = mainChart.addCandlestickSeries({
            upColor: '#ef5350', downColor: '#26a69a', borderVisible: false,
            wickUpColor: '#ef5350', wickDownColor: '#26a69a',
            priceFormat: {
                type: 'price',
                precision: decimals,
                minMove: prefixTickSize,
            }
        });
        const emaFastSeries = mainChart.addLineSeries({ 
            color: chartKey === 'twn' ? twnEma1Color : ema1Color, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, visible: true,
            priceFormat: { type: 'price', precision: decimals, minMove: prefixTickSize }
        });
        const emaSlowSeries = mainChart.addLineSeries({ 
            color: chartKey === 'twn' ? twnEma2Color : ema2Color, lineWidth: 2, priceLineVisible: false, lastValueVisible: false, visible: true,
            priceFormat: { type: 'price', precision: decimals, minMove: prefixTickSize }
        });

        let ema1Visible = true;
        let ema2Visible = true;

        const scrollToRealTime = () => {
            mainChart.timeScale().scrollToRealTime();
        };

        resetBtn.addEventListener('click', scrollToRealTime);
        mainContainer.addEventListener('dblclick', scrollToRealTime);

        mainChart.timeScale().subscribeVisibleLogicalRangeChange(() => {
            if (!viewer || viewer._currentBars.length === 0) return;
            const logicalRange = mainChart.timeScale().getVisibleLogicalRange();
            if (!logicalRange) return;

            const bars = viewer._currentBars;
            let minIdx = Math.max(0, Math.floor(logicalRange.from));
            let maxIdx = Math.min(bars.length - 1, Math.ceil(logicalRange.to));

            let highestPrice = -Infinity;
            let lowestPrice = Infinity;
            let highestTime = null;
            let lowestTime = null;

            for (let i = minIdx; i <= maxIdx; i++) {
                if (bars[i]) {
                    if (bars[i].high > highestPrice) {
                        highestPrice = bars[i].high;
                        highestTime = bars[i].time;
                    }
                    if (bars[i].low < lowestPrice) {
                        lowestPrice = bars[i].low;
                        lowestTime = bars[i].time;
                    }
                }
            }

            const isDark = document.body.getAttribute('data-theme') === 'dark';
            const markerColor = isDark ? '#ffeb3b' : '#000000'; // 深色模式黃色，淺色模式黑色

            const markers = [];
            if (highestTime !== null && highestPrice !== -Infinity) {
                markers.push({
                    time: highestTime,
                    position: 'aboveBar',
                    color: markerColor,
                    shape: 'arrowDown',
                    text: highestPrice.toFixed(decimals)
                });
            }
            if (lowestTime !== null && lowestPrice !== Infinity) {
                markers.push({
                    time: lowestTime,
                    position: 'belowBar',
                    color: markerColor,
                    shape: 'arrowUp',
                    text: lowestPrice.toFixed(decimals)
                });
            }
            candleSeries.setMarkers(markers);
        });

        mainChart.subscribeCrosshairMove(param => {
            if (!param.time || param.point === undefined || param.point.x < 0 || param.point.x > mainContainer.clientWidth || param.point.y < 0 || param.point.y > mainContainer.clientHeight) {
                tooltipEl.style.display = 'none';
                return;
            }
            const data = param.seriesData.get(candleSeries);
            const fastVal = param.seriesData.get(emaFastSeries);
            const slowVal = param.seriesData.get(emaSlowSeries);

            if (data) {
                const dateObj = new Date(param.time * 1000);
                const timeStr = dateObj.toLocaleTimeString('zh-TW', { hour12: false, hour: '2-digit', minute: '2-digit' });
                
                tooltipEl.style.display = 'block';
                tooltipEl.innerHTML = `時間: ${timeStr}<br>開: ${data.open.toFixed(decimals)} 高: ${data.high.toFixed(decimals)}<br>低: ${data.low.toFixed(decimals)} 收: ${data.close.toFixed(decimals)}`;

                let x = param.point.x + 15;
                let y = param.point.y + 15;
                if (x + 110 > mainContainer.clientWidth) x = param.point.x - 120;
                if (y + 85 > mainContainer.clientHeight) y = param.point.y - 90;
                tooltipEl.style.left = x + 'px';
                tooltipEl.style.top = y + 'px';
            }

            const fPeriod = (chartKey === 'twn') ? twnEma1Period : ema1Period;
            const sPeriod = (chartKey === 'twn') ? twnEma2Period : ema2Period;

            document.getElementById(`legend-${chartKey}-ema1`).textContent = `EMA${fPeriod}: ${fastVal && fastVal.value ? fastVal.value.toFixed(decimals) : '--'}`;
            document.getElementById(`legend-${chartKey}-ema2`).textContent = `EMA${sPeriod}: ${slowVal && slowVal.value ? slowVal.value.toFixed(decimals) : '--'}`;
        });

        const ro = new ResizeObserver(entries => {
            for (let entry of entries) {
                mainChart.applyOptions({ width: entry.contentRect.width });
            }
        });
        ro.observe(mainContainer);

        let cachedBars = [];

        const viewer = {
            mainChart,
            chartKey,
            _currentBars: [],
            setData(bars) {
                cachedBars = bars;
                this._currentBars = bars;
                candleSeries.setData(bars);
                this.redraw();
            },
            redraw() {
                if (cachedBars.length === 0) return;
                const fPeriod = (this.chartKey === 'twn') ? twnEma1Period : ema1Period;
                const sPeriod = (this.chartKey === 'twn') ? twnEma2Period : ema2Period;

                const fastData = calculateEMA(cachedBars, fPeriod);
                const slowData = calculateEMA(cachedBars, sPeriod);

                emaFastSeries.setData(fastData);
                emaSlowSeries.setData(slowData);

                document.getElementById(`legend-${this.chartKey}-ema1`).textContent = `EMA${fPeriod}: ${fastData.length > 0 ? fastData[fastData.length-1].value.toFixed(decimals) : '--'}`;
                document.getElementById(`legend-${this.chartKey}-ema2`).textContent = `EMA${sPeriod}: ${slowData.length > 0 ? slowData[slowData.length-1].value.toFixed(decimals) : '--'}`;
            },
            updateColors() {
                if (this.chartKey !== 'twn') {
                    emaFastSeries.applyOptions({ color: ema1Color });
                    emaSlowSeries.applyOptions({ color: ema2Color });
                }
                document.getElementById(`legend-${this.chartKey}-ema1`).style.color = (this.chartKey === 'twn') ? twnEma1Color : ema1Color;
                document.getElementById(`legend-${this.chartKey}-ema2`).style.color = (this.chartKey === 'twn') ? twnEma2Color : ema2Color;
            },
            toggleVisibility(index) {
                if (index === 1) {
                    ema1Visible = !ema1Visible;
                    emaFastSeries.applyOptions({ visible: ema1Visible });
                    document.getElementById(`legend-${this.chartKey}-ema1`).classList.toggle('hidden', !ema1Visible);
                } else if (index === 2) {
                    ema2Visible = !ema2Visible;
                    emaSlowSeries.applyOptions({ visible: ema2Visible });
                    document.getElementById(`legend-${this.chartKey}-ema2`).classList.toggle('hidden', !ema2Visible);
                }
            }
        };

        chartViewers.push(viewer);
        return viewer;
    }

    const twnViewer = createChartInstance('chart-twn-main', 'tooltip-twn', 'btn-reset-twn', 0.25, 'twn');
    const txAllViewer = createChartInstance('chart-txall-main', 'tooltip-txall', 'btn-reset-txall', 1, 'txall');
    const txViewer = createChartInstance('chart-tx-main', 'tooltip-tx', 'btn-reset-tx', 1, 'tx');

    function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById('theme-btn');
        if (body.getAttribute('data-theme') === 'light') {
            body.setAttribute('data-theme', 'dark');
            btn.textContent = '淺色模式';
        } else {
            body.setAttribute('data-theme', 'light');
            btn.textContent = '深色模式';
        }
        const opts = getChartThemeOptions();
        chartViewers.forEach(v => {
            v.mainChart.applyOptions(opts);
            v.setData(v._currentBars);
        });
    }

    let rawTwnBars = [];
    let rawTxAllBars = [];
    let rawTxBars = [];

    const twnRealtimeUrl = "https://realtime-quote-signalr-v2.futures-op.com/quote?symbol=TWN-1";

    async function initDashboard() {
        document.getElementById('td-time').textContent = "更新中...";
        try {
            const nowSec = Math.floor(Date.now() / 1000);
            const fromSec = nowSec - (120 * 24 * 60 * 60);

            const twnHistoryUrl = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=TWN-1&resolution=15&from=${fromSec}&to=${nowSec}&ws=true&metaData=true`;
            const txAllUrl = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=TX-1&resolution=15&from=${fromSec}&to=${nowSec}&ws=true&metaData=true`;
            const txUrl = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=TXAM-1&resolution=15&from=${fromSec}&to=${nowSec}&ws=true&metaData=true`;

            const [twnRes, txAllRes, txRes] = await Promise.all([
                fetch(twnHistoryUrl).then(r => r.json()),
                fetch(txAllUrl).then(r => r.json()),
                fetch(txUrl).then(r => r.json())
            ]);

            const twnBars = twnRes.bars || [];
            const txAllBars = txAllRes.bars || [];
            const txBars = txRes.bars || [];

            const normalizeTime = t => t > 1e10 ? Math.floor(t / 1000) : t;

            const formatData = bars => bars.map(i => ({
                time: normalizeTime(i.time),
                open: i.open, high: i.high, low: i.low, close: i.close
            })).sort((a,b) => a.time - b.time);

            rawTwnBars = formatData(twnBars);
            rawTxAllBars = formatData(txAllBars);
            rawTxBars = formatData(txBars);

            if (rawTwnBars.length > 0) {
                lastFallbackTwn = rawTwnBars[rawTwnBars.length - 1].close;
            }

            reloadChartDisplay();

            chartViewers.forEach(v => {
                v.updateColors();
            });
            initColorPaletteGrid();
            document.getElementById('preview-ema1').style.backgroundColor = ema1Color;
            document.getElementById('preview-ema2').style.backgroundColor = ema2Color;

            if (rawTxBars.length > 0) {
                const lastTxBar = rawTxBars[rawTxBars.length - 1];
                txLastClose = lastTxBar.close;
                
                const d = new Date(normalizeTime(lastTxBar.time) * 1000);
                const mm = String(d.getMonth() + 1).padStart(2, '0');
                const dd = String(d.getDate()).padStart(2, '0');
                const hh = String(d.getHours()).padStart(2, '0');
                const min = String(d.getMinutes()).padStart(2, '0');
                
                document.getElementById('td-tx-label').textContent = `${mm}/${dd} ${hh}:${min} 期收`;
                document.getElementById('td-tx-close').textContent = txLastClose;
            }

            const twnMap = new Map(rawTwnBars.map(i => [i.time, i.close]));
            const txMap = new Map(rawTxBars.map(i => [i.time, i.close]));

            let allPairs = [];
            txMap.forEach((txClose, time) => {
                if (twnMap.has(time)) {
                    allPairs.push({ time, twn: twnMap.get(time), tx: txClose });
                }
            });

            if (allPairs.length > 0) {
                const lastTime = allPairs[allPairs.length - 1].time;
                const lastDateObj = new Date(lastTime * 1000);
                const lastDateStr = lastDateObj.toISOString().slice(0, 10);

                let set1 = [], set2 = [], set3 = [];

                allPairs.forEach(p => {
                    let d = new Date(p.time * 1000);
                    let hour = d.getHours();
                    let min = d.getMinutes();
                    let timeVal = hour * 60 + min;
                    let isLastDay = (d.toISOString().slice(0, 10) === lastDateStr);

                    let isNightSession = (hour >= 15 || hour < 4 || (hour === 4 && min <= 45));
                    let isDaySession = (timeVal >= (8 * 60 + 45) && timeVal <= (13 * 60 + 45));

                    if (isLastDay && isNightSession) set1.push(p);
                    if (isLastDay && (isDaySession || isNightSession)) set2.push(p);
                    if (isNightSession || isDaySession) set3.push(p);
                });

                let result1 = evaluateSubset(set1, "(1) 最後夜盤");
                let result2 = evaluateSubset(set2, "(2) 最後一日日夜盤");
                let result3 = evaluateSubset(set3, "(3) 全時段綜合");

                let models = [result1, result2, result3].filter(m => m.n > 1);
                models.sort((A, B) => B.r2 - A.r2);

                if (models.length > 0) {
                    let best = models[0];
                    regressionModel = { a: best.a, b: best.b };
                }
            }

            await fetchAndApplyRealtimeQuote();
            startTimer();

        } catch (e) {
            console.error("初始化資料失敗:", e);
            document.getElementById('td-time').textContent = "讀取失敗";
        }
    }

    function reloadChartDisplay() {
        if (rawTwnBars.length === 0) return;
        const nowSec = Math.floor(Date.now() / 1000);
        const cutoffTime = nowSec - (historyDays * 24 * 60 * 60);

        const filteredTwn = rawTwnBars.filter(i => i.time >= cutoffTime);
        const filteredTxAll = rawTxAllBars.filter(i => i.time >= cutoffTime);
        const filteredTx = rawTxBars.filter(i => i.time >= cutoffTime);

        twnViewer.setData(filteredTwn);
        txAllViewer.setData(filteredTxAll);
        txViewer.setData(filteredTx);
    }

    function evaluateSubset(pairs, name) {
        let x = pairs.map(p => p.twn);
        let y = pairs.map(p => p.tx);
        let n = x.length;
        if (n <= 1) return { name, a: 1, b: 0, r2: 0, n };

        let sumX = x.reduce((a, b) => a + b, 0);
        let sumY = y.reduce((a, b) => a + b, 0);
        let sumXY = x.reduce((acc, val, i) => acc + val * y[i], 0);
        let sumXX = x.reduce((acc, val) => acc + val * val, 0);

        let denominator = (n * sumXX - sumX * sumX);
        if (denominator === 0) return { name, a: 1, b: 0, r2: 0, n };

        let a = (n * sumXY - sumX * sumY) / denominator;
        let b = (sumY - a * sumX) / n;

        let meanY = sumY / n;
        let ssTot = y.reduce((acc, val) => acc + Math.pow(val - meanY, 2), 0);
        let ssRes = x.reduce((acc, val, i) => acc + Math.pow(y[i] - (a * val + b), 2), 0);
        let r2 = ssTot === 0 ? 0 : (1 - (ssRes / ssTot));

        return { name, a, b, r2, n };
    }

    async function fetchAndApplyRealtimeQuote() {
        let currentTwn = 0;
        try {
            const res = await fetch(twnRealtimeUrl);
            const data = await res.json();
            const quote = Array.isArray(data) ? data[0] : data;

            if (quote && quote.close) {
                currentTwn = quote.close;
                if (quote.datetime) {
                    const dateObj = new Date(quote.datetime);
                    document.getElementById('td-time').textContent = dateObj.toLocaleTimeString('zh-TW', { hour12: false });
                }
            }
        } catch (err) {
            console.warn("即時行情 API 暫時無法取得，使用歷史收盤價替代:", err);
        }

        if (currentTwn === 0 && lastFallbackTwn > 0) {
            currentTwn = lastFallbackTwn;
            document.getElementById('td-time').textContent = "休市中(歷史收盤)";
        }

        if (currentTwn > 0) {
            document.getElementById('td-twn').textContent = currentTwn.toFixed(2);

            if (regressionModel.a !== 0) {
                let estimatedY = regressionModel.a * currentTwn + regressionModel.b;
                document.getElementById('td-est').textContent = estimatedY.toFixed(0);

                if (txLastClose > 0) {
                    let diff = Math.round(estimatedY - txLastClose);
                    let diffEl = document.getElementById('td-diff');
                    diffEl.textContent = (diff >= 0 ? "+" : "") + diff;
                }
            }
        }
    }

    document.getElementById('input-twn').addEventListener('input', (e) => {
        let valStr = e.target.value.trim();
        if (valStr === '' || isNaN(parseFloat(valStr))) {
            document.getElementById('output-tx').textContent = '-';
            return;
        }
        let val = parseFloat(valStr);
        if (regressionModel.a !== 0) {
            let txVal = regressionModel.a * val + regressionModel.b;
            document.getElementById('output-tx').textContent = txVal.toFixed(0);
        }
    });

    document.getElementById('input-tx').addEventListener('input', (e) => {
        let valStr = e.target.value.trim();
        if (valStr === '' || isNaN(parseFloat(valStr))) {
            document.getElementById('output-twn').textContent = '-';
            return;
        }
        let val = parseFloat(valStr);
        if (regressionModel.a !== 0) {
            let twnVal = (val - regressionModel.b) / regressionModel.a;
            document.getElementById('output-twn').textContent = twnVal.toFixed(2);
        }
    });

    function startTimer() {
        countdown = 8;
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            countdown--;
            if (countdown < 0) {
                fetchAndApplyRealtimeQuote();
                countdown = 8;
            }
            document.getElementById('timer').textContent = `${countdown}秒後更新`;
        }, 1000);
    }

    // 每 10 秒自動背景輪詢更新 K 棒資料，不需手動重整
    setInterval(async () => {
        try {
            const nowSec = Math.floor(Date.now() / 1000);
            const fromSec = nowSec - (120 * 24 * 60 * 60);

            const twnHistoryUrl = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=TWN-1&resolution=15&from=${fromSec}&to=${nowSec}&ws=true&metaData=true`;
            const txAllUrl = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=TX-1&resolution=15&from=${fromSec}&to=${nowSec}&ws=true&metaData=true`;
            const txUrl = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=TXAM-1&resolution=15&from=${fromSec}&to=${nowSec}&ws=true&metaData=true`;

            const [twnRes, txAllRes, txRes] = await Promise.all([
                fetch(twnHistoryUrl).then(r => r.json()),
                fetch(txAllUrl).then(r => r.json()),
                fetch(txUrl).then(r => r.json())
            ]);

            const normalizeTime = t => t > 1e10 ? Math.floor(t / 1000) : t;
            const formatData = bars => (bars || []).map(i => ({
                time: normalizeTime(i.time), open: i.open, high: i.high, low: i.low, close: i.close
            })).sort((a,b) => a.time - b.time);

            rawTwnBars = formatData(twnRes.bars);
            rawTxAllBars = formatData(txAllRes.bars);
            rawTxBars = formatData(txRes.bars);

            reloadChartDisplay();
        } catch (e) {
            console.warn("背景自動更新 K 棒失敗:", e);
        }
    }, 10000);

    document.getElementById('refresh-btn').addEventListener('click', () => {
        initDashboard();
    });

    document.getElementById('theme-btn').addEventListener('click', toggleTheme);

    initDashboard();
</script>
