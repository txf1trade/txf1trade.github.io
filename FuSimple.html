<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海期即時行情監控</title>
    <style>
        :root {
            --bg-color: #131722;
            --card-bg: #1e222d;
            --border-color: #2a2e39;
            --text-main: #d1d4dc;
            --text-sub: #9b9ef5;
            --text-muted: #848e9c;
            
            --red-color: #ff4d5a;
            --green-color: #26a69a;
            --flat-color: #b2b5be;
            --star-color: #f0b90b;

            --table-font-size: 13px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 10px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* 獨立第一層：標題欄 */
        .top-header {
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            font-weight: 600;
            color: #fff;
            font-size: 14px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        /* 獨立第二層：設定與搜尋工具列 */
        .top-bar {
            display: flex;
            justify-content: flex-between;
            align-items: center;
            background: var(--card-bg);
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            margin-bottom: 8px;
            gap: 12px;
            flex-shrink: 0;
        }

        .controls-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            gap: 10px;
        }

        /* 顯眼下拉選單樣式 */
        .select-style {
            background-color: var(--bg-color);
            background-image: url("data:image/svg+xml;utf8,<svg fill='%239b9ef5' height='12' viewBox='0 0 24 24' width='12' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 8px center;
            border: 1px solid #2962ff;
            color: var(--text-main);
            padding: 4px 26px 4px 10px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            transition: all 0.2s ease;
        }

        .select-style:hover {
            border-color: #5c8aff;
            background-color: #1a1e2c;
        }

        .search-input {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            width: 110px;
        }

        /* 頁籤與右上角選單按鈕 */
        .tabs-wrapper {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            position: relative;
            flex-shrink: 0;
        }

        .tabs {
            display: flex;
            gap: 4px;
            overflow-x: auto;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 5px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            white-space: nowrap;
            font-weight: 500;
        }

        .tab-btn:hover, .tab-btn.active {
            color: #ffffff;
            border-color: #2962ff;
            background: #2962ff;
        }

        .menu-btn {
            background: #2962ff;
            color: #fff;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }
        .menu-btn:hover { background: #1e53e5; }

        .drawer-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: transparent;
            z-index: 99;
            display: none;
        }
        .drawer-overlay.show { display: block; }

        /* 自訂欄位面板 */
        .drawer-panel {
            position: absolute;
            top: 36px; right: 0;
            width: 280px;
            background: #1e222d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            z-index: 100;
            padding: 14px;
            box-shadow: 0 6px 16px rgba(0, 0, 0, 0.6);
            display: none;
        }
        .drawer-panel.show { display: block; }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
            font-weight: bold;
            color: #fff;
        }

        .preset-group {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .preset-btn {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 4px 0;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            text-align: center;
        }
        .preset-btn:hover { border-color: #2962ff; color: #fff; }

        .font-slider-group {
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .font-slider-header {
            display: flex;
            justify-content: space-between;
            color: var(--text-sub);
            font-weight: bold;
            font-size: 12px;
        }
        .font-slider-group input[type="range"] {
            width: 100%;
            accent-color: #2962ff;
            cursor: pointer;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px 8px;
        }

        .checkbox-grid label {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            cursor: pointer;
            user-select: none;
        }

        /* 右下角浮動 AI 助理按鈕 */
        .ai-floating-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #181c27;
            border: 2px solid #2962ff;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.6), 0 0 10px rgba(41, 98, 255, 0.4);
            cursor: pointer;
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }
        .ai-floating-btn:hover {
            transform: scale(1.08);
        }
        .ai-floating-icon {
            font-size: 22px;
            line-height: 1;
        }
        .ai-floating-badge {
            font-size: 9px;
            font-weight: bold;
            color: #ffffff;
            background: #2962ff;
            padding: 1px 4px;
            border-radius: 3px;
            margin-top: 2px;
            letter-spacing: 0.5px;
        }

        /* 右下角 AI 彈出對話面板 (預設隱藏) */
        .ai-dialog-panel {
            position: fixed;
            bottom: 85px;
            right: 20px;
            width: 330px;
            max-height: 480px;
            background: #1e222d;
            border: 1px solid #2962ff;
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            z-index: 200;
            display: none;
            flex-direction: column;
        }
        .ai-dialog-panel.show { display: flex; }

        .ai-dialog-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 10px;
            font-weight: bold;
            color: #ffffff;
            font-size: 13px;
        }

        .ai-dialog-body {
            color: var(--text-main);
            font-size: 12px;
            line-height: 1.6;
            white-space: pre-line;
            overflow-y: auto;
            max-height: 390px;
            scrollbar-width: thin;
        }

        /* 報價表格容器 */
        .table-container {
            background: var(--card-bg);
            border-radius: 4px;
            border: 1px solid var(--border-color);
            flex: 1;
            overflow-y: auto;
            overflow-x: auto;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .table-container::-webkit-scrollbar {
            display: none;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }

        th, td {
            padding: 7px 10px;
            border-bottom: 1px solid var(--border-color);
            font-variant-numeric: tabular-nums;
            font-size: var(--table-font-size);
        }

        th {
            color: var(--text-muted);
            font-weight: 600;
            font-size: calc(var(--table-font-size) - 1px);
            background: #181c27;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        th:nth-child(1), td:nth-child(1),
        th:nth-child(2), td:nth-child(2),
        th:nth-child(3), td:nth-child(3) { text-align: left; }

        tr:hover { background-color: #2a2e39; }

        .star-btn {
            cursor: pointer;
            font-size: var(--table-font-size);
            color: var(--text-muted);
            user-select: none;
            transition: color 0.15s ease;
        }
        .star-btn.active { color: var(--star-color); }

        .symbol-code { font-weight: 700; color: #ffffff; }
        .symbol-name { color: var(--text-sub); }

        .change-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            min-width: 68px;
            text-align: right;
            font-size: var(--table-font-size);
        }

        .bs-b { color: var(--red-color); font-weight: bold; }
        .bs-s { color: var(--green-color); font-weight: bold; }

        .color-red { color: var(--red-color); }
        .color-green { color: var(--green-color); }
        .color-flat { color: var(--flat-color); }

        .bg-red { background: rgba(255, 77, 90, 0.22); color: var(--red-color); }
        .bg-green { background: rgba(38, 166, 154, 0.22); color: var(--green-color); }
        .bg-flat { background: rgba(178, 181, 190, 0.12); color: var(--flat-color); }

        /* 動態隱藏控制 */
        .hide-change .col-change,
        .hide-changePct .col-changePct,
        .hide-bid .col-bid, 
        .hide-ask .col-ask,
        .hide-high .col-high, 
        .hide-low .col-low,
        .hide-prevRef .col-prevRef, 
        .hide-qty .col-qty,
        .hide-volume .col-volume,
        .hide-datetime .col-datetime { display: none !important; }

        /* 隱藏右下角 AI 助理按鈕與對話窗 */
        .hide-ai-assistant #ai-floating-btn,
        .hide-ai-assistant #ai-dialog {
            display: none !important;
        }

        .flash-up { animation: flashGreen 0.4s ease-out; }
        .flash-down { animation: flashRed 0.4s ease-out; }

        @keyframes flashGreen { 0% { background-color: rgba(38, 166, 154, 0.4); } 100% { background-color: transparent; } }
        @keyframes flashRed { 0% { background-color: rgba(255, 77, 90, 0.4); } 100% { background-color: transparent; } }
    </style>
</head>
<body>

    <!-- 獨立第一層：標題欄 -->
    <div class="top-header">
        📊 即時行情監控面板
    </div>

    <!-- 獨立第二層：設定與搜尋工具列 -->
    <div class="top-bar">
        <div class="controls-group">
            <label style="color: var(--text-muted); font-size: 12px; display: flex; align-items: center; gap: 4px;">顯示風格：
                <select id="color-style" class="select-style" onchange="renderTable()">
                    <option value="RED_UP" selected>紅漲綠跌</option>
                    <option value="GREEN_UP">綠漲紅跌</option>
                </select>
            </label>
            <input type="text" id="search-box" class="search-input" placeholder="搜尋代碼/名稱..." oninput="renderTable()">
            <span id="update-time" style="color: var(--text-muted); font-size: 12px;">更新中...</span>
        </div>
    </div>

    <!-- 頁籤列 + 右上角選單按鈕 -->
    <div class="tabs-wrapper">
        <div class="tabs">
            <button class="tab-btn active" onclick="filterCategory('ALL')">全部 (39)</button>
            <button class="tab-btn" onclick="filterCategory('WATCHLIST')" id="tab-watchlist">自選 (0)</button>
            <button class="tab-btn" onclick="filterCategory('INDEX')">指數期</button>
            <button class="tab-btn" onclick="filterCategory('COMMODITY')">能源/金屬</button>
            <button class="tab-btn" onclick="filterCategory('FX')">外匯期</button>
            <button class="tab-btn" onclick="filterCategory('US_STOCK')">美股/ADR</button>
        </div>

        <button class="menu-btn" onclick="toggleDrawer(event)">☰</button>

        <!-- 自訂欄位彈出面板 -->
        <div id="drawer-panel" class="drawer-panel" onclick="event.stopPropagation()">
            <div class="drawer-header">
                <span>自訂欄位與功能</span>
                <span style="cursor:pointer;" onclick="closeDrawer()">✕</span>
            </div>

            <div class="preset-group">
                <button class="preset-btn" onclick="applyPreset('simple')">精簡</button>
                <button class="preset-btn" onclick="applyPreset('trading')">交易</button>
                <button class="preset-btn" onclick="applyPreset('full')">完整</button>
            </div>

            <div class="checkbox-grid">
                <label><input type="checkbox" id="chk-change" checked onchange="updateColumnVisibility()"> 漲跌</label>
                <label><input type="checkbox" id="chk-changePct" checked onchange="updateColumnVisibility()"> 漲跌幅</label>
                <label><input type="checkbox" id="chk-bid" onchange="updateColumnVisibility()"> 買價</label>
                <label><input type="checkbox" id="chk-ask" onchange="updateColumnVisibility()"> 賣價</label>
                <label><input type="checkbox" id="chk-high" onchange="updateColumnVisibility()"> 最高</label>
                <label><input type="checkbox" id="chk-low" onchange="updateColumnVisibility()"> 最低</label>
                <label><input type="checkbox" id="chk-qty" onchange="updateColumnVisibility()"> 單量/盤</label>
                <label><input type="checkbox" id="chk-volume" checked onchange="updateColumnVisibility()"> 總成交量</label>
                <label><input type="checkbox" id="chk-prevRef" checked onchange="updateColumnVisibility()"> 昨收</label>
                <label><input type="checkbox" id="chk-datetime" checked onchange="updateColumnVisibility()"> 時間</label>
            </div>

            <!-- 字體大小調整滑桿 -->
            <div class="font-slider-group">
                <div class="font-slider-header">
                    <span>🔤 表格字體大小</span>
                    <span id="font-size-val">13px</span>
                </div>
                <input type="range" id="font-size-range" min="10" max="18" value="13" oninput="changeFontSize(this.value)">
            </div>

            <div style="border-top: 1px solid var(--border-color); padding-top: 8px; margin-top: 8px;">
                <label style="color: var(--text-sub); font-weight: bold; font-size: 12px; cursor: pointer;">
                    <input type="checkbox" id="chk-ai" checked onchange="updateColumnVisibility()"> 🤖 AI 助理按鈕
                </label>
            </div>
        </div>
    </div>

    <div id="drawer-overlay" class="drawer-overlay" onclick="closeDrawer()"></div>

    <!-- 報價表格容器 -->
    <div class="table-container" id="table-container">
        <table>
            <thead>
                <tr>
                    <th style="width: 30px; text-align: center;">★</th>
                    <th>代碼</th>
                    <th>商品名稱</th>
                    <th>成交價</th>
                    <th class="col-change">漲跌</th>
                    <th class="col-changePct">漲跌幅</th>
                    <th class="col-bid">買價</th>
                    <th class="col-ask">賣價</th>
                    <th class="col-high">最高</th>
                    <th class="col-low">最低</th>
                    <th class="col-prevRef">昨收價</th>
                    <th class="col-qty">單量/盤</th>
                    <th class="col-volume">總成交量</th>
                    <th class="col-datetime">更新時間</th>
                </tr>
            </thead>
            <tbody id="quote-tbody">
                <tr><td colspan="14" style="text-align: center; color: var(--text-muted); padding: 20px;">資料載入中...</td></tr>
            </tbody>
        </table>
    </div>

    <!-- 右下角浮動 AI 助理按鈕 (BETA) -->
    <div class="ai-floating-btn" id="ai-floating-btn" onclick="toggleAIDialog()">
        <span class="ai-floating-icon">🤖</span>
        <span class="ai-floating-badge">BETA</span>
    </div>

    <!-- 右下角 AI 分析對話彈窗 (預設隱藏) -->
    <div id="ai-dialog" class="ai-dialog-panel">
        <div class="ai-dialog-header">
            <span id="ai-dialog-title">🤖 AI 總經智算面板</span>
            <span style="cursor:pointer;" onclick="toggleAIDialog(false)">✕</span>
        </div>
        <div id="ai-dialog-body" class="ai-dialog-body">讀取即時數據分析中...</div>
    </div>

    <script>
        const API_URL = "https://realtime-quote-signalr-v2.futures-op.com/quote?symbol=TX-1,TWN-1,NK-1,CN-1,HSI-1,HCEI-1,YM-1,NQ-1,ES-1,RTY-1,FDX-1,CL-1,NG-1,GC-1,PL-1,HG-1,SI-1,DX-1,JY-1,EC-1,BP-1,SF-1,AD-1,CD-1,NVDA,GOOGL,AAPL,MSFT,AMZN,META,TSLA,TSM,SPCX,AVGO,MU,INTC,AMD,ASML,ORCL";

        const SYMBOL_META = {
            "TX-1": { name: "台指期", category: "INDEX" },
            "TWN-1": { name: "富台指", category: "INDEX" },
            "NK-1": { name: "日經225", category: "INDEX" },
            "CN-1": { name: "中國A50", category: "INDEX" },
            "HSI-1": { name: "恆生期", category: "INDEX" },
            "HCEI-1": { name: "國企期", category: "INDEX" },
            "YM-1": { name: "道瓊期", category: "INDEX" },
            "NQ-1": { name: "納指期", category: "INDEX" },
            "ES-1": { name: "標普期", category: "INDEX" },
            "RTY-1": { name: "羅素期", category: "INDEX" },
            "FDX-1": { name: "德指期", category: "INDEX" },
            "CL-1": { name: "紐約原油", category: "COMMODITY" },
            "NG-1": { name: "天然氣", category: "COMMODITY" },
            "GC-1": { name: "黃金", category: "COMMODITY" },
            "SI-1": { name: "白銀", category: "COMMODITY" },
            "PL-1": { name: "鉑金", category: "COMMODITY" },
            "HG-1": { name: "銅期貨", category: "COMMODITY" },
            "DX-1": { name: "美元指數", category: "FX" },
            "JY-1": { name: "日圓", category: "FX" },
            "EC-1": { name: "歐元", category: "FX" },
            "BP-1": { name: "英鎊", category: "FX" },
            "SF-1": { name: "瑞郎", category: "FX" },
            "AD-1": { name: "澳幣", category: "FX" },
            "CD-1": { name: "加幣", category: "FX" },
            "NVDA": { name: "輝達", category: "US_STOCK" },
            "GOOGL": { name: "谷歌", category: "US_STOCK" },
            "AAPL": { name: "蘋果", category: "US_STOCK" },
            "MSFT": { name: "微軟", category: "US_STOCK" },
            "AMZN": { name: "亞馬遜", category: "US_STOCK" },
            "META": { name: "Meta", category: "US_STOCK" },
            "TSLA": { name: "特斯拉", category: "US_STOCK" },
            "TSM": { name: "台積電 ADR", category: "US_STOCK" },
            "SPCX": { name: "SPCX ETF", category: "US_STOCK" },
            "AVGO": { name: "博通", category: "US_STOCK" },
            "MU": { name: "美光", category: "US_STOCK" },
            "INTC": { name: "英特爾", category: "US_STOCK" },
            "AMD": { name: "超微", category: "US_STOCK" },
            "ASML": { name: "艾斯摩爾", category: "US_STOCK" },
            "ORCL": { name: "甲骨文", category: "US_STOCK" }
        };

        const quotesData = {};
        let currentCategory = "ALL";
        let watchlist = JSON.parse(localStorage.getItem("user_watchlist") || "[]");

        function saveWatchlist() {
            localStorage.setItem("user_watchlist", JSON.stringify(watchlist));
            updateWatchlistTabLabel();
        }

        function toggleWatchlist(symbol, event) {
            event.stopPropagation();
            const index = watchlist.indexOf(symbol);
            if (index > -1) {
                watchlist.splice(index, 1);
            } else {
                watchlist.push(symbol);
            }
            saveWatchlist();
            renderTable();
        }

        function updateWatchlistTabLabel() {
            document.getElementById("tab-watchlist").innerText = `自選 (${watchlist.length})`;
        }

        function fmt(n, dec = 2) {
            if (n === undefined || n === null) return "-";
            return Number(n).toLocaleString(undefined, { minimumFractionDigits: dec, maximumFractionDigits: dec });
        }

        function fmtTime(iso) {
            return iso ? iso.substring(11, 19) : "-";
        }

        function getColorStyles(diff) {
            if (diff === 0) return { cls: "color-flat", bgCls: "bg-flat", sign: "" };
            const mode = document.getElementById("color-style").value;
            const isUp = diff > 0;
            const useRed = (mode === "RED_UP") ? isUp : !isUp;
            return {
                cls: useRed ? "color-red" : "color-green",
                bgCls: useRed ? "bg-red" : "bg-green",
                sign: isUp ? "+" : ""
            };
        }

        // 動態調整表格字體大小
        function changeFontSize(val) {
            document.documentElement.style.setProperty('--table-font-size', `${val}px`);
            document.getElementById('font-size-val').innerText = `${val}px`;
            localStorage.setItem("user_table_font_size", val);
        }

        // 初始化載入已儲存字體大小
        function initFontSize() {
            const savedSize = localStorage.getItem("user_table_font_size") || 13;
            document.getElementById('font-size-range').value = savedSize;
            changeFontSize(savedSize);
        }

        // 切換右下角 AI 助理對話視窗
        function toggleAIDialog(forceState) {
            const dialog = document.getElementById("ai-dialog");
            const isShow = typeof forceState === "boolean" ? forceState : !dialog.classList.contains("show");
            dialog.classList.toggle("show", isShow);

            if (isShow) {
                runAIAnalysis();
            }
        }

        // 💡 無需 API Key 的即時市場邏輯智算引擎
        function runAIAnalysis() {
            const bodyEl = document.getElementById("ai-dialog-body");
            const titleEl = document.getElementById("ai-dialog-title");

            const now = new Date();
            const hour = now.getHours();
            const isNightSession = (hour >= 15 || hour < 5);

            titleEl.innerText = isNightSession ? "🌙 AI 夜盤總經智算" : "☀️ AI 日盤總經智算";

            // 取得標的數據輔助函式
            const getSymbolInfo = (sym) => {
                const q = quotesData[sym];
                if (!q) return { close: 0, prevRef: 0, diff: 0, pct: 0 };
                const diff = q.close - q.prevRef;
                const pct = q.prevRef ? (diff / q.prevRef) * 100 : 0;
                return { close: q.close, prevRef: q.prevRef, diff, pct };
            };

            const oil = getSymbolInfo("CL-1");
            const gold = getSymbolInfo("GC-1");
            const nq = getSymbolInfo("NQ-1");
            const tx = getSymbolInfo("TX-1");
            const tsm = getSymbolInfo("TSM");
            const nvda = getSymbolInfo("NVDA");

            // 地緣與避險狀態評估
            let statusTag = "";
            let riskAssessment = "";
            let actionSuggestion = "";

            if (oil.pct > 1.5 || gold.pct > 1.0) {
                statusTag = "⚠️ 地緣升溫 / 避險需求抬頭";
                riskAssessment = `紐約原油目前報 ${fmt(oil.close)}，高於昨收基準 ${fmt(oil.prevRef)}。地緣政治情緒推升能源與黃金避險買盤。`;
            } else if (oil.pct < -1.2) {
                statusTag = "📉 恐慌釋放 / 能源溢價回落";
                riskAssessment = `原油走弱至 ${fmt(oil.close)}（昨收 ${fmt(oil.prevRef)}），地緣政治利空對市場衝擊邊際遞減。`;
            } else {
                statusTag = "⚖️ 總經橫盤 / 避險資產狹幅震盪";
                riskAssessment = `紐約原油維持在昨收 ${fmt(oil.prevRef)} 附近整理，整體避險情緒持平。`;
            }

            // 盤別與科技/權值股動態邏輯
            if (isNightSession) {
                if (tsm.pct >= 0 || nq.pct >= 0) {
                    actionSuggestion = `台積電 ADR (昨收 ${fmt(tsm.prevRef)}) 與納指期 (昨收 ${fmt(nq.prevRef)}) 展現強勁防禦力。若油價不再創高，夜盤台指期容易開啟利空出盡型強烈反彈。`;
                } else {
                    actionSuggestion = `海外科技股偏弱，夜盤操作宜密切關注台指期昨收線 ${fmt(tx.prevRef)} 附近的支撐韌性。`;
                }
            } else {
                if (nq.pct > 0.3) {
                    actionSuggestion = `國際期貨電子盤氛圍偏多，日盤台指期可隨跨市場資金回流尋求反彈點。`;
                } else {
                    actionSuggestion = `日盤持續觀察原油與黃金昨收防線，等待短線情緒賣壓消化後的轉折訊號。`;
                }
            }

            // 組裝純文字內容
            let content = `📌 【關鍵昨收價格基準】\n` +
                `• 紐約原油 (CL-1)：${fmt(oil.prevRef)}\n` +
                `• 黃金 (GC-1)：${fmt(gold.prevRef)}\n` +
                `• 納指期 (NQ-1)：${fmt(nq.prevRef)}\n`;

            if (isNightSession) {
                content += `• 台積電 ADR (TSM)：${fmt(tsm.prevRef)}\n` +
                           `• 輝達 (NVDA)：${fmt(nvda.prevRef)}\n`;
            }

            content += `• 台指期 (TX-1)：${fmt(tx.prevRef)}\n\n` +
                `📊 【市場狀態評估】\n${statusTag}\n${riskAssessment}\n\n` +
                `💡 【跨市場轉折判斷】\n${actionSuggestion}`;

            bodyEl.innerText = content;
        }

        function toggleDrawer(e) {
            e.stopPropagation();
            const panel = document.getElementById("drawer-panel");
            const overlay = document.getElementById("drawer-overlay");
            const isShow = panel.classList.contains("show");
            
            if (isShow) {
                closeDrawer();
            } else {
                panel.classList.add("show");
                overlay.classList.add("show");
            }
        }

        function closeDrawer() {
            document.getElementById("drawer-panel").classList.remove("show");
            document.getElementById("drawer-overlay").classList.remove("show");
        }

        function applyPreset(type) {
            const keys = ["change", "changePct", "bid", "ask", "high", "low", "qty", "volume", "prevRef", "datetime"];
            const configs = {
                simple: ["change", "changePct", "volume", "prevRef", "datetime"],
                trading: ["change", "changePct", "bid", "ask", "qty", "volume", "prevRef"],
                full: keys
            };
            const activeKeys = configs[type] || [];

            keys.forEach(k => {
                document.getElementById(`chk-${k}`).checked = activeKeys.includes(k);
            });
            updateColumnVisibility();
        }

        // 控制表格欄位顯隱 & 右下角 AI 助理按鈕/面板整體顯隱
        function updateColumnVisibility() {
            const container = document.getElementById("table-container");
            const body = document.body;

            // 表格欄位控制
            const cols = ["change", "changePct", "bid", "ask", "high", "low", "qty", "volume", "prevRef", "datetime"];
            cols.forEach(col => {
                const isChecked = document.getElementById(`chk-${col}`).checked;
                container.classList.toggle(`hide-${col}`, !isChecked);
            });

            // AI 助理整體顯隱控制
            const isAIChecked = document.getElementById("chk-ai").checked;
            body.classList.toggle("hide-ai-assistant", !isAIChecked);
        }

        function renderTable() {
            const tbody = document.getElementById("quote-tbody");
            const filterKeyword = document.getElementById("search-box").value.toUpperCase();
            tbody.innerHTML = "";

            let visibleCount = 0;

            Object.keys(SYMBOL_META).forEach(symbol => {
                const meta = SYMBOL_META[symbol];
                const q = quotesData[symbol];

                if (currentCategory === "WATCHLIST" && !watchlist.includes(symbol)) return;
                if (currentCategory !== "ALL" && currentCategory !== "WATCHLIST" && meta.category !== currentCategory) return;
                if (filterKeyword && !symbol.includes(filterKeyword) && !meta.name.includes(filterKeyword)) return;
                if (!q) return;

                visibleCount++;
                const isStarred = watchlist.includes(symbol);
                const diff = q.close - q.prevRef;
                const pct = q.prevRef ? (diff / q.prevRef) * 100 : 0;
                const { cls, bgCls, sign } = getColorStyles(diff);
                const bsUpper = (q.bs || "").toUpperCase();

                const tr = document.createElement("tr");
                tr.id = `row-${symbol}`;
                tr.innerHTML = `
                    <td style="text-align: center;"><span class="star-btn ${isStarred ? 'active' : ''}" onclick="toggleWatchlist('${symbol}', event)">${isStarred ? '★' : '☆'}</span></td>
                    <td><span class="symbol-code">${q.symbol}</span></td>
                    <td><span class="symbol-name">${meta.name}</span></td>
                    <td class="${cls}" style="font-weight: 700;">${fmt(q.close)}</td>
                    <td class="col-change ${cls}">${sign}${fmt(diff)}</td>
                    <td class="col-changePct"><span class="change-badge ${bgCls}">${sign}${fmt(pct)}%</span></td>
                    <td class="col-bid">${fmt(q.bid)}</td>
                    <td class="col-ask">${fmt(q.ask)}</td>
                    <td class="col-high">${fmt(q.high)}</td>
                    <td class="col-low">${fmt(q.low)}</td>
                    <td class="col-prevRef">${fmt(q.prevRef)}</td>
                    <td class="col-qty">${q.qty ?? 0} <span class="bs-${q.bs}">${bsUpper}</span></td>
                    <td class="col-volume">${fmt(q.volume, 0)}</td>
                    <td class="col-datetime" style="color: var(--text-muted); font-size: 12px;">${fmtTime(q.datetime)}</td>
                `;
                tbody.appendChild(tr);
            });

            if (visibleCount === 0) {
                const msg = currentCategory === "WATCHLIST" ? "尚未加入任何自訂商品 (點擊 ☆ 即可加入)" : "無符合條件商品";
                tbody.innerHTML = `<tr><td colspan="14" style="text-align: center; color: var(--text-muted); padding: 30px;">${msg}</td></tr>`;
            }
        }

        function updateRow(item) {
            const old = quotesData[item.symbol];
            quotesData[item.symbol] = item;

            const row = document.getElementById(`row-${item.symbol}`);
            if (!row) { renderTable(); return; }

            const diff = item.close - item.prevRef;
            const pct = item.prevRef ? (diff / item.prevRef) * 100 : 0;
            const { cls, bgCls, sign } = getColorStyles(diff);
            const bsUpper = (item.bs || "").toUpperCase();

            if (old && item.close !== old.close) {
                row.classList.remove("flash-up", "flash-down");
                void row.offsetWidth;
                row.classList.add(item.close > old.close ? "flash-up" : "flash-down");
            }

            row.cells[3].className = cls; row.cells[3].innerText = fmt(item.close);
            row.cells[4].className = `col-change ${cls}`; row.cells[4].innerText = `${sign}${fmt(diff)}`;
            row.cells[5].innerHTML = `<span class="change-badge ${bgCls}">${sign}${fmt(pct)}%</span>`;
            row.cells[6].innerText = fmt(item.bid);
            row.cells[7].innerText = fmt(item.ask);
            row.cells[8].innerText = fmt(item.high);
            row.cells[9].innerText = fmt(item.low);
            row.cells[10].innerText = fmt(item.prevRef);
            row.cells[11].innerHTML = `${item.qty ?? 0} <span class="bs-${item.bs}">${bsUpper}</span>`;
            row.cells[12].innerText = fmt(item.volume, 0);
            row.cells[13].innerText = fmtTime(item.datetime);
        }

        async function fetchQuotes() {
            try {
                const res = await fetch(API_URL);
                if (!res.ok) return;
                const list = await res.json();
                if (Array.isArray(list)) {
                    list.forEach(updateRow);
                }
                // 🕒 使用 24 小時制更新時間顯示 (HH:mm:ss)
                document.getElementById("update-time").innerText = `更新於 ${new Date().toLocaleTimeString('zh-TW', { hour12: false })}`;
            } catch (e) {
                document.getElementById("update-time").innerText = "連線異常";
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderTable();
        }

        // 初始化
        initFontSize();
        updateWatchlistTabLabel();
        updateColumnVisibility();
        fetchQuotes();
        setInterval(fetchQuotes, 1000);
    </script>
</body>
</html>
