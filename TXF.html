<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台指期即時報價與波動率監控</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121318;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      gap: 16px;
    }

    .card {
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2a2e39;
      padding-bottom: 12px;
      margin-bottom: 12px;
    }

    .symbol-title {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .live-dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #22c55e;
    }

    .time-stamp {
      font-size: 13px;
      color: #22c55e;
      font-family: monospace;
      font-weight: bold;
    }

    /* 日/夜盤切換按鈕區 */
    .session-toggle {
      display: flex;
      background: #131722;
      border: 1px solid #2a2e39;
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 16px;
    }

    .toggle-btn {
      flex: 1;
      background: transparent;
      border: none;
      color: #787b86;
      padding: 6px 0;
      font-size: 12px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-btn.active {
      background: #2a2e39;
      color: #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    .price-main {
      padding: 4px 0;
    }

    .price-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .price-value {
      font-size: 48px;
      font-weight: 800;
      font-family: monospace;
      letter-spacing: -1px;
      line-height: 1;
    }

    .change-info {
      margin-top: 8px;
      font-size: 16px;
      font-weight: 700;
      font-family: monospace;
      text-align: center;
    }

    .metrics-box {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px dashed #2a2e39;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 13px;
      color: #787b86;
    }

    .metric-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .metric-value {
      font-family: monospace;
      font-weight: 600;
      color: #e0e0e0;
    }

    /* 波動率圖表卡片樣式 */
    .vix-card {
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    }

    .vix-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
    }

    .vix-title-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
    }

    .vix-stats-group {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: monospace;
      font-weight: 700;
      font-size: 13px;
    }

    .vix-content-area {
      width: 100%;
      height: 160px;
      position: relative;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* 緊湊型詳細行情資訊表格樣式 */
    .vix-details-view {
      display: none;
      width: 100%;
      height: 100%;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 4px;
      align-content: center;
    }

    .vix-details-view.active {
      display: grid;
    }

    .vix-canvas-wrap {
      width: 100%;
      height: 100%;
    }

    .vix-canvas-wrap.hidden {
      display: none;
    }

    .grid-cell {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 1px;
      background: #131722;
      padding: 4px 6px;
      border-radius: 4px;
      border: 1px solid #2a2e39;
    }

    .grid-label {
      font-size: 10px;
      color: #787b86;
      line-height: 1;
    }

    .grid-val {
      font-size: 14px;
      font-family: monospace;
      font-weight: bold;
      line-height: 1.2;
    }

    /* 觸發彈出面板的按鈕樣式 */
    .external-link-btn {
      display: block;
      width: 100%;
      max-width: 400px;
      background: #2a2e39;
      color: #b2b5be;
      text-decoration: none;
      padding: 10px 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s ease;
      text-align: center;
      border: 1px solid #363a45;
      cursor: pointer;
    }

    .external-link-btn:hover {
      background: #363a45;
      color: #ffffff;
    }

    /* 彈出面板 (Modal) 樣式 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.75);
      z-index: 999;
      justify-content: center;
      align-items: center;
      padding: 10px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background: #1e222d;
      border: 1px solid #2a2e39;
      border-radius: 12px;
      width: 100%;
      max-width: 880px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 15px 40px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #131722;
      border-bottom: 1px solid #2a2e39;
    }

    .modal-title {
      font-size: 15px;
      font-weight: bold;
      color: #ffffff;
    }

    .close-modal-btn {
      background: #2a2e39;
      color: #b2b5be;
      border: none;
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 13px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .close-modal-btn:hover {
      background: #f23645;
      color: #ffffff;
    }

    .modal-body {
      flex: 1;
      width: 100%;
      background: #121212;
    }

    .modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* 台股配色：紅色為上漲，綠色為下跌 */
    .up { color: #f23645; fill: #f23645; stroke: #f23645; }
    .down { color: #089981; fill: #089981; stroke: #089981; }
    .neutral { color: #e0e0e0; fill: #e0e0e0; stroke: #e0e0e0; }
  </style>
</head>
<body>

<!-- 台指期卡片 -->
<div class="card">
  <div class="header">
    <div class="symbol-title">
      <span class="live-dot"></span>
      台指期 (TX-1)
    </div>
    <div class="time-stamp" id="update-time">--:--:--</div>
  </div>

  <div class="session-toggle">
    <button class="toggle-btn active" id="btn-day" onclick="switchSession('day')">☀️日盤 (08:45)</button>
    <button class="toggle-btn" id="btn-night" onclick="switchSession('night')">🌙全日盤 (15:00)</button>
  </div>

  <div class="price-main">
    <div class="price-row">
      <svg id="k-candle" width="22" height="46" viewBox="0 0 22 46" style="display: none;">
        <line id="candle-wick" x1="11" y1="2" x2="11" y2="44" stroke-width="2" />
        <rect id="candle-body" x="5" width="12" rx="1" ry="1" />
      </svg>
      <div class="price-value neutral" id="close-price">-----</div>
    </div>
    <div class="change-info neutral" id="change-price">-- (--%)</div>
  </div>

  <div class="metrics-box">
    <div class="metric-row">
      <span id="open-label">日盤開盤價 (08:45)</span>
      <span class="metric-value" id="session-open">-----</span>
    </div>
    <div class="metric-row">
      <span>總成交量</span>
      <span class="metric-value" id="total-volume">----- 口</span>
    </div>
  </div>
</div>

<!-- 點擊圖表切換詳細資訊的台指波動率 (TAIWANVIX) 卡片 -->
<div class="vix-card">
  <div class="vix-card-header" onclick="toggleVixView()" title="點擊切換圖表與詳細資訊">
    <div class="vix-title-group">
      <svg id="vix-mini-candle" width="14" height="28" viewBox="0 0 22 46" style="display:none;">
        <line id="vix-wick" x1="11" y1="2" x2="11" y2="44" stroke-width="2" />
        <rect id="vix-body" x="5" width="12" rx="1" ry="1" />
      </svg>
      <span id="vix-card-title-text">台指波動率 VIX</span>
    </div>
    <div class="vix-stats-group">
      <span id="vix-current-val" class="neutral">--</span>
      <span id="vix-change-val" class="neutral">--</span>
      <span id="vix-pct-val" class="neutral">--%</span>
    </div>
  </div>

  <!-- 互動顯示區域：點擊可直接在「走勢圖」與「詳細數據表」之間切換 -->
  <div class="vix-content-area" onclick="toggleVixView()" title="點擊切換圖表與詳細資訊">
    
    <!-- 圖表視圖 -->
    <div class="vix-canvas-wrap" id="vixCanvasWrap">
      <canvas id="vixCanvas"></canvas>
    </div>

    <!-- 緊湊型詳細行情數據視圖 -->
    <div class="vix-details-view" id="vixDetailsView">
      <div class="grid-cell">
        <span class="grid-label">成交</span>
        <span class="grid-val neutral" id="back-close">--</span>
      </div>
      <div class="grid-cell">
        <span class="grid-label">開盤</span>
        <span class="grid-val neutral" id="back-open">--</span>
      </div>    
      <div class="grid-cell">
        <span class="grid-label">漲跌</span>
        <span class="grid-val neutral" id="back-change">--</span>
      </div>
      <div class="grid-cell">
        <span class="grid-label">昨收</span>
        <span class="grid-val neutral" id="back-prevref">--</span>
      </div>
      <div class="grid-cell">
        <span class="grid-label">最高</span>
        <span class="grid-val neutral" id="back-high">--</span>
      </div>
      <div class="grid-cell">
        <span class="grid-label">最低</span>
        <span class="grid-val neutral" id="back-low">--</span>
      </div>
      <div class="grid-cell">
        <span class="grid-label">漲跌幅</span>
        <span class="grid-val neutral" id="back-pct">--</span>
      </div>
      <div class="grid-cell">
        <span class="grid-label">成交量</span>
        <span class="grid-val neutral" id="back-vol">--</span>
      </div>
    </div>

  </div>
</div>

<!-- 觸發彈出面板的按鈕 -->
<button class="external-link-btn" onclick="openModal()">
  🔗 富台換算台指
</button>

<!-- 彈出面板結構 -->
<div class="modal-overlay" id="twnModal" onclick="handleOutsideClick(event)">
  <div class="modal-content">
    <div class="modal-header">
      <span class="modal-title">📊 富時台轉換成台指期</span>
      <button class="close-modal-btn" onclick="closeModal()">✕ 關閉</button>
    </div>
    <div class="modal-body">
      <iframe src="https://txf1trade.github.io/tnntoweb" id="twnIframe"></iframe>
    </div>
  </div>
</div>

<script>
  function openModal() {
    const modal = document.getElementById('twnModal');
    const iframe = document.getElementById('twnIframe');
    modal.classList.add('active');
    if (iframe) iframe.src = iframe.src;
  }

  function closeModal() {
    document.getElementById('twnModal').classList.remove('active');
  }

  function handleOutsideClick(event) {
    if (event.target.id === 'twnModal') closeModal();
  }

  let isDetailsView = false;

  function toggleVixView() {
    isDetailsView = !isDetailsView;
    const canvasWrap = document.getElementById('vixCanvasWrap');
    const detailsView = document.getElementById('vixDetailsView');
    const titleText = document.getElementById('vix-card-title-text');

    if (isDetailsView) {
      canvasWrap.classList.add('hidden');
      detailsView.classList.add('active');
      titleText.innerText = '台指波動率 VIX (詳細資訊)';
    } else {
      canvasWrap.classList.remove('hidden');
      detailsView.classList.remove('active');
      titleText.innerText = '台指波動率 VIX';
    }
  }

  let currentSession = 'day';

  function getApiUrl() {
    return currentSession === 'day'
      ? "https://tvapi.futures-op.com/history?symbol=TXAM-1&resolution=1&ws=true&intraday=true"
      : "https://tvapi.futures-op.com/history?symbol=TX-1&resolution=1&ws=true&intraday=true";
  }

  function switchSession(mode) {
    currentSession = mode;
    document.getElementById('btn-day').classList.toggle('active', mode === 'day');
    document.getElementById('btn-night').classList.toggle('active', mode === 'night');
    fetchQuoteData();
  }

  function updateLiveClock() {
    const now = new Date();
    document.getElementById('update-time').innerText = now.toLocaleTimeString('zh-TW', { hour12: false });
  }
  
  updateLiveClock();
  setInterval(updateLiveClock, 1000);

  function renderMicroCandle(wickEl, bodyEl, svgEl, open, high, low, close) {
    const maxP = Math.max(open, high, low, close);
    const minP = Math.min(open, high, low, close);
    const range = (maxP - minP) || 1;

    const svgHeight = 42; 
    const paddingTop = 2;
    const getY = (price) => paddingTop + (maxP - price) / range * svgHeight;

    const isCandleUp = close >= open;
    const colorHex = isCandleUp ? '#f23645' : '#089981';

    wickEl.setAttribute('y1', getY(high));
    wickEl.setAttribute('y2', getY(low));
    wickEl.setAttribute('stroke', colorHex);

    bodyEl.setAttribute('y', Math.min(getY(open), getY(close)));
    bodyEl.setAttribute('height', Math.max(Math.abs(getY(close) - getY(open)), 3));
    bodyEl.setAttribute('fill', colorHex);

    svgEl.style.display = 'block';
  }

  async function fetchQuoteData() {
    try {
      const response = await fetch(getApiUrl(), { cache: "no-cache" });
      if (!response.ok) return;
      
      const data = await response.json();
      if (!Array.isArray(data) || data.length === 0) return;

      const sessionOpenPrice = data[0].open;
      const latest = data[data.length - 1];
      const currentPrice = latest.close;

      let sessionHigh = -Infinity, sessionLow = Infinity, totalVolume = 0;
      data.forEach(item => {
        if (item.high > sessionHigh) sessionHigh = item.high;
        if (item.low < sessionLow) sessionLow = item.low;
        totalVolume += (item.volume || 0);
      });

      const changeVal = currentPrice - sessionOpenPrice;
      const changePercent = ((changeVal / sessionOpenPrice) * 100).toFixed(2);
      const isUp = changeVal > 0, isDown = changeVal < 0;
      const colorClass = isUp ? 'up' : (isDown ? 'down' : 'neutral');
      const sign = isUp ? '+' : '';

      const closeEl = document.getElementById('close-price');
      closeEl.innerText = currentPrice.toLocaleString();
      closeEl.className = `price-value ${colorClass}`;

      const changeEl = document.getElementById('change-price');
      changeEl.innerText = `${sign}${changeVal.toLocaleString()} (${sign}${changePercent}%)`;
      changeEl.className = `change-info ${colorClass}`;

      document.getElementById('open-label').innerText = currentSession === 'day' ? '日盤開盤價 (08:45)' : '夜盤開盤價 (15:00)';
      document.getElementById('session-open').innerText = sessionOpenPrice.toLocaleString();
      document.getElementById('total-volume').innerText = `${totalVolume.toLocaleString()} 口`;

      renderMicroCandle(
        document.getElementById('candle-wick'), 
        document.getElementById('candle-body'), 
        document.getElementById('k-candle'), 
        sessionOpenPrice, sessionHigh, sessionLow, currentPrice
      );
    } catch (err) {
      console.error("台指期報價更新失敗：", err);
    }
  }

  async function fetchAndRenderVIX() {
    try {
      const response = await fetch("https://tv-signalr.futures-op.com/history?symbol=TAIWANVIX&resolution=1&ws=true&intraday=true", { cache: "no-cache" });
      if (!response.ok) return;

      const json = await response.json();
      const list = json && Array.isArray(json.bars) ? json.bars : [];
      if (list.length === 0) return;

      const prevRef = json.prevRef !== undefined ? json.prevRef : 
                      (json.meta && json.meta.prevRef !== undefined ? json.meta.prevRef : 25.15);
      
      const latest = list[list.length - 1];
      const currentVal = latest.close;
      const openPrice = list[0].open;
      const totalVol = list.reduce((acc, item) => acc + (item.volume || 0), 0);

      let highVal = -Infinity, lowVal = Infinity;
      let highIdx = 0, lowIdx = 0;

      list.forEach((item, idx) => {
        if (item.high > highVal) {
          highVal = item.high;
          highIdx = idx;
        }
        if (item.low < lowVal) {
          lowVal = item.low;
          lowIdx = idx;
        }
      });

      const changeVal = currentVal - prevRef;
      const changePct = prevRef ? (changeVal / prevRef) * 100 : 0;
      const isUp = changeVal >= 0;
      const colorClass = isUp ? 'up' : 'down';
      const sign = changeVal > 0 ? '+' : '';

      // 1. 更新頂部數值與顏色
      document.getElementById('vix-current-val').innerText = currentVal.toFixed(2);
      document.getElementById('vix-current-val').className = colorClass;

      document.getElementById('vix-change-val').innerText = `${sign}${changeVal.toFixed(2)}`;
      document.getElementById('vix-change-val').className = colorClass;

      document.getElementById('vix-pct-val').innerText = `${sign}${changePct.toFixed(2)}%`;
      document.getElementById('vix-pct-val').className = colorClass;

      // 2. 更新詳細表格數據
      document.getElementById('back-close').innerText = currentVal.toFixed(2);
      document.getElementById('back-close').className = `grid-val ${colorClass}`;

      document.getElementById('back-change').innerText = `${sign}${changeVal.toFixed(2)}`;
      document.getElementById('back-change').className = `grid-val ${colorClass}`;

      document.getElementById('back-open').innerText = openPrice.toFixed(2);
      document.getElementById('back-open').className = 'grid-val neutral';

      document.getElementById('back-prevref').innerText = prevRef.toFixed(2);
      document.getElementById('back-prevref').className = 'grid-val neutral';

      document.getElementById('back-high').innerText = highVal.toFixed(2);
      document.getElementById('back-high').className = 'grid-val up';

      document.getElementById('back-low').innerText = lowVal.toFixed(2);
      document.getElementById('back-low').className = 'grid-val down';

      document.getElementById('back-pct').innerText = `${sign}${changePct.toFixed(2)}%`;
      document.getElementById('back-pct').className = `grid-val ${colorClass}`;

      document.getElementById('back-vol').innerText = totalVol > 0 ? totalVol.toLocaleString() : '0';
      document.getElementById('back-vol').className = 'grid-val neutral';

      // 3. 渲染微型 K 棒
      renderMicroCandle(
        document.getElementById('vix-wick'),
        document.getElementById('vix-body'),
        document.getElementById('vix-mini-candle'),
        openPrice, highVal, lowVal, currentVal
      );

      // 4. 繪製走勢圖 Canvas（僅在圖表顯示時渲染以效能最佳化）
      if (!isDetailsView) {
        const canvas = document.getElementById('vixCanvas');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const rect = canvas.getBoundingClientRect();
        canvas.width = rect.width * dpr;
        canvas.height = rect.height * dpr;
        ctx.scale(dpr, dpr);

        const width = rect.width;
        const height = rect.height;
        ctx.clearRect(0, 0, width, height);

        const prices = list.map(item => item.close);
        const minP = Math.min(...prices);
        const maxP = Math.max(...prices);
        const range = (maxP - minP) || 1;

        const paddingLeft = 35;
        const paddingRight = 55;
        const paddingTop = 20;
        const paddingBottom = 30;

        const graphWidth = width - paddingLeft - paddingRight;
        const graphHeight = height - paddingTop - paddingBottom;

        const lineColor = isUp ? '#f23645' : '#089981';

        // 繪製 Y 軸刻度與格線
        ctx.font = '10px monospace';
        ctx.fillStyle = '#ffffff';
        ctx.strokeStyle = '#2a2e39';
        ctx.lineWidth = 1;

        const ySteps = 4;
        for (let i = 0; i <= ySteps; i++) {
          const val = minP + (range * (ySteps - i) / ySteps);
          const y = paddingTop + (graphHeight / ySteps) * i;

          ctx.beginPath();
          ctx.moveTo(paddingLeft, y);
          ctx.lineTo(width - paddingRight, y);
          ctx.stroke();

          ctx.textAlign = 'left';
          ctx.fillText(val.toFixed(2), width - paddingRight + 8, y + 3);
        }

        // 繪製 X 軸時間標籤
        const startTimeMs = list[0].time ? list[0].time : Date.now();
        const endTimeMs = list[list.length - 1].time ? list[list.length - 1].time : Date.now();
        const totalDuration = endTimeMs - startTimeMs || 1;

        const xSteps = 4;
        for (let i = 0; i <= xSteps; i++) {
          const targetTimeMs = startTimeMs + (totalDuration * (i / xSteps));
          const targetDate = new Date(targetTimeMs);
          const timeStr = targetDate.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', hour12: false });
          const x = paddingLeft + (graphWidth / xSteps) * i;

          ctx.beginPath();
          ctx.moveTo(x, paddingTop);
          ctx.lineTo(x, paddingTop + graphHeight);
          ctx.stroke();

          ctx.textAlign = 'center';
          ctx.fillText(timeStr, x, height - 8);
        }

        // 計算點位座標
        const points = prices.map((val, idx) => {
          const itemTime = list[idx].time ? list[idx].time : startTimeMs;
          const ratio = totalDuration === 0 ? 0 : Math.max(0, Math.min(1, (itemTime - startTimeMs) / totalDuration));
          return {
            x: paddingLeft + ratio * graphWidth,
            y: paddingTop + graphHeight - ((val - minP) / range) * graphHeight
          };
        });

        // 繪製折線圖
        ctx.beginPath();
        ctx.strokeStyle = lineColor;
        ctx.lineWidth = 2;

        points.forEach((pt, idx) => {
          if (idx === 0) ctx.moveTo(pt.x, pt.y);
          else ctx.lineTo(pt.x, pt.y);
        });
        ctx.stroke();

        // 繪製漸層填滿
        const lastPt = points[points.length - 1];
        ctx.lineTo(lastPt.x, paddingTop + graphHeight);
        ctx.lineTo(points[0].x, paddingTop + graphHeight);
        ctx.closePath();

        const gradient = ctx.createLinearGradient(0, paddingTop, 0, paddingTop + graphHeight);
        const gradColor = isUp ? 'rgba(242, 54, 69, 0.2)' : 'rgba(8, 153, 129, 0.2)';
        gradient.addColorStop(0, gradColor);
        gradient.addColorStop(1, 'rgba(0, 0, 0, 0.0)');
        ctx.fillStyle = gradient;
        ctx.fill();

        // 最高點與最低點標記
        const highPt = points[highIdx];
        const lowPt = points[lowIdx];

        ctx.font = 'bold 11px monospace';

        ctx.fillStyle = '#f23645';
        ctx.textAlign = 'left';
        let highX = highPt.x + 6;
        let highY = highPt.y - 4;
        if (highX + 50 > width - paddingRight) highX = highPt.x - 55;
        ctx.fillText(`▼ ${highVal.toFixed(2)}`, highX, highY);

        ctx.fillStyle = '#089981';
        ctx.textAlign = 'left';
        let lowX = lowPt.x + 6;
        let lowY = lowPt.y + 14;
        if (lowX + 50 > width - paddingRight) lowX = lowPt.x - 55;
        if (lowY > paddingTop + graphHeight - 10) lowY = lowPt.y - 6;
        ctx.fillText(`▲ ${lowVal.toFixed(2)}`, lowX, lowY);
      }

    } catch (err) {
      console.error("VIX 資料載入失敗：", err);
    }
  }

  fetchQuoteData();
  fetchAndRenderVIX();
  setInterval(() => {
    fetchQuoteData();
    fetchAndRenderVIX();
  }, 1000);
</script>
