<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI 期權對戰分析 (含風險監控)</title>
    <style>
        :root {
            --bg: #0d1117; --card: #161b22; --blue: #58a6ff;
            --red: #ff7b72; --green: #7ee787; --border: #30363d;
            --risk-bg: #490e0e;
        }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: #c9d1d9; margin: 0; padding: 8px; }
        .container { max-width: 500px; margin: auto; }
        
        /* 表格優化 */
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 12px; }
        th { background: #21262d; color: #8b949e; padding: 6px 2px; border: 1px solid var(--border); font-size: 10px; }
        td { padding: 8px 2px; border: 1px solid var(--border); text-align: center; }
        
        .group-label { background: #010409 !important; font-weight: bold; font-size: 11px; text-align: left !important; padding-left: 10px !important; }
        .num-cell { font-family: "Consolas", monospace; font-weight: bold; }
        .pos { color: var(--red); } .neg { color: var(--green); }

        /* 風險與動作標籤 */
        .risk-active { background-color: var(--risk-bg) !important; color: #ffffff !important; font-weight: bold; }
        .act-tag { border-radius: 3px; padding: 2px 4px; font-size: 10px; font-weight: bold; }
        .bc-bp { background: #30363d; color: #f0f6fc; border: 1px solid #8b949e; }
        .sc-sp { background: #f85149; color: white; } /* 莊家位(曝險)高亮 */

        /* AI 策略區塊 */
        .ai-box { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; }
        .trend-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .trend-val { font-size: 22px; font-weight: 900; }
        .battle-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        .battle-card { background: #0d1117; padding: 8px; border-radius: 6px; border-left: 3px solid var(--blue); }
        .strategy-box { background: rgba(88, 166, 255, 0.1); padding: 10px; border-radius: 6px; border: 1px solid var(--blue); }
    </style>
</head>
<body>

<div class="container">
    <div id="data-table">載入中...</div>

    <div class="ai-box">
        <div class="trend-header">
            <span style="font-size: 13px; color: #8b949e;">AI 籌碼對抗傾向</span>
            <span id="trend-indicator" class="trend-val">--</span>
        </div>

        <div class="battle-grid">
            <div class="battle-card" style="border-color: #bc8cff;">
                <div style="font-size: 10px; color: #8b949e;">自營商動作</div>
                <div id="d-action" style="font-size: 13px; font-weight: bold;">--</div>
            </div>
            <div class="battle-card" style="border-color: var(--blue);">
                <div style="font-size: 10px; color: #8b949e;">外資動作</div>
                <div id="f-action" style="font-size: 13px; font-weight: bold;">--</div>
            </div>
        </div>
        
        <div class="strategy-box">
            <div id="strategy-desc" style="font-size: 13px; line-height: 1.5;">正在分析對戰狀況...</div>
        </div>
    </div>
</div>

<script>
    const apiUrl = 'https://script.google.com/macros/s/AKfycbxtnFuNANtdObDtCYbaHXxC-LGfiWRqMdhTjh0E1psdftmHPhVL3nNJhJxC5_WF0S0UtQ/exec';

    async function fetchData() {
        try {
            const res = await fetch(apiUrl);
            const data = await res.json();
            const start = (data[0][0] === "權別") ? 1 : 0;
            let s = { dc: 0, dp: 0, fc: 0, fp: 0 };
            let rows = { "自營商": "", "外資": "" };

            let lastT = ""; 
            for (let i = start; i < data.length; i++) {
                let [t, id, diff, oi] = data[i];
                if (t && t.trim() !== "") lastT = t; else t = lastT;
                const oiV = parseFloat(oi.replace(/,/g, '')) || 0;
                const isC = t.includes('買');
                
                // 判斷動作與曝險 (OI 為負即為莊家 Sell 方，具曝險風險)
                let actLabel = "";
                let isRisk = oiV < 0;
                if(isC) actLabel = isRisk ? "SC" : "BC";
                else actLabel = isRisk ? "SP" : "BP";

                const row = `<tr>
                    <td style="color:${isC?'var(--red)':'var(--green)'}">${t}</td>
                    <td class="num-cell ${diff.includes('-')?'neg':'pos'}">${diff}</td>
                    <td class="num-cell ${isRisk?'risk-active':'pos'}">${oi}</td>
                    <td class="${isRisk?'risk-active':''}">${isRisk ? '⚠️ 曝險('+actLabel+')' : '正常('+actLabel+')'}</td>
                </tr>`;

                if(rows[id] !== undefined) {
                    rows[id] += row;
                    if(id === "自營商") { if(isC) s.dc=oiV; else s.dp=oiV; }
                    else { if(isC) s.fc=oiV; else s.fp=oiV; }
                }
            }

            document.getElementById('data-table').innerHTML = `<table>
                <thead><tr><th style="width:22%">權別</th><th style="width:24%">今日差額</th><th style="width:28%">未平倉OI</th><th style="width:26%">風險狀態</th></tr></thead>
                <tbody>
                    <tr><td colspan="4" class="group-label" style="color:#bc8cff;">🟣 自營商 (主要莊家)</td></tr>${rows["自營商"]}
                    <tr><td colspan="4" class="group-label" style="color:var(--blue);">🔵 外資 (主要趨勢)</td></tr>${rows["外資"]}
                </tbody></table>`;
            
            analyze(s);
        } catch (e) { document.getElementById('data-table').innerText = "連線失敗"; }
    }

    function analyze(s) {
        let score = 0;
        let dAct = "", fAct = "", trend = "", strat = "", color = "";

        // 邏輯判定
        if (s.dp < 0) { dAct = "SP 護盤撐點"; score += 1; }
        if (s.dc < 0) { dAct += (dAct?"+":"") + "SC 佈壓收租"; score -= 1; }
        if (s.fc > 0) { fAct = "BC 多頭攻擊"; score += 2; }
        if (s.fp > 0) { fAct += (fAct?"+":"") + "BP 空頭避險"; score -= 2; }
        if (s.fp < 0) { fAct = "SP 協防看撐"; score += 1; }

        if (score >= 3) { 
            trend = "📈 極度偏多"; color = "#ff7b72";
            strat = "多頭強勢！外資 BC 進攻且莊家 SP 護盤，盤勢底部墊高，逢回補多，目標看壓力突破。";
        } else if (score >= 1) { 
            trend = "↗️ 偏多震盪"; color = "#ff7b72";
            strat = "盤勢有撐。外資偏向進攻但莊家上方有壓 (SC)，建議回測支撐不破再小量參與。";
        } else if (score <= -3) { 
            trend = "📉 極度偏空"; color = "#7ee787";
            strat = "趨勢轉弱！外資 BP 避險強且莊家撤退，不宜進場接刀，建議建立防守位或觀望。";
        } else if (score <= -1) { 
            trend = "↘️ 偏空震盪"; color = "#7ee787";
            strat = "壓力重重。上方莊家壓頭且外資意圖不明，反彈無力時應保持警覺，切勿追高。";
        } else { 
            trend = "↔️ 中性整理"; color = "#58a6ff";
            strat = "多空勢力均衡，法人正在雙向收權利金。適合 Sell Straddle 或等區間突破再入場。";
        }

        document.getElementById('trend-indicator').innerText = trend;
        document.getElementById('trend-indicator').style.color = color;
        document.getElementById('d-action').innerText = dAct || "中性佈局";
        document.getElementById('f-action').innerText = fAct || "觀望為主";
        document.getElementById('strategy-desc').innerText = "💡 AI 策略：" + strat;
    }
    fetchData();
</script>
</body>
</html>
