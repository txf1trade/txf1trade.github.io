<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期貨交易監控面板</title>
    <style>
        /* 基礎樣式重置 */
        * { box-sizing: border-box; }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* 防止主頁面出現捲軸 */
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #1a1a1a; /* 深色背景符合交易風格 */
        }

        /* 導覽列容器 */
        .nav-tabs {
            display: flex;
            background-color: #2c2c2c;
            padding: 8px 10px 0 10px;
            border-bottom: 2px solid #007bff;
        }

        /* 個別按鈕樣式 */
        .tab-btn {
            padding: 5px 15px; /* 分頁按鈕大小 */
            cursor: pointer;
            border: none;
            background: #444;
            color: #bbb;
            font-size: 16px;
            border-radius: 8px 8px 0 0;
            margin-right: 4px;
            transition: all 0.3s ease;
        }

        /* 滑鼠移過樣式 */
        .tab-btn:hover {
            background: #555;
            color: #fff;
        }

        /* 被選中的按鈕樣式 */
        .tab-btn.active {
            background: #007bff;
            color: white;
            font-weight: bold;
        }

        /* 內容區塊：填滿剩餘空間 */
        .content-wrapper {
            height: calc(100vh - 50px); /* 扣除導覽列高度 */
            width: 100%;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: none; /* 預設隱藏所有 iframe */
        }

        /* 顯示當前的 iframe */
        iframe.active {
            display: block;
        }
    </style>
</head>
<body>

    <div class="nav-tabs">
        <button class="tab-btn" onclick="location.hash='tab1'; showTab(0)">台指籌碼</button>
        <button class="tab-btn" onclick="location.hash='tab2'; showTab(1)">股期動能</button>
        <button class="tab-btn" onclick="location.hash='tab3'; showTab(2)">OP籌碼</button>
        <!-- <button class="tab-btn" onclick="location.hash='tab3'; showTab(3)">股期權重</button> -->
    </div>

    <div class="content-wrapper">
        <iframe src="https://txf1trade.github.io/indexTab1.html"></iframe>
        <iframe src="https://txf1trade.github.io/indexTab2.html"></iframe>
        <iframe src="https://txf1trade.github.io/indexTab3.html"></iframe>
        <!-- <iframe src="https://txf1trade.github.io/indexTab4.html"></iframe> -->
    </div>

    <script>
        function showTab(index) {
            const tabs = document.querySelectorAll('.tab-btn');
            const frames = document.querySelectorAll('iframe');

            // 清除所有 active 狀態
            tabs.forEach(tab => tab.classList.remove('active'));
            frames.forEach(frame => frame.classList.remove('active'));

            // 賦予點選的標籤 active 狀態
            if (tabs[index] && frames[index]) {
                tabs[index].classList.add('active');
                frames[index].classList.add('active');
            }
        }

        // 初始化檢查：根據網址 Hash 決定顯示哪個分頁
        function init() {
            if (window.location.hash === "#tab2") {
                showTab(1);
            } else if (window.location.hash === "#tab3") {
                showTab(2);
              else if (window.location.hash === "#tab4") {
                showTab(3);
            } else {
                showTab(0);
            }
        }

        // 頁面載入時執行
        window.onload = init;
        // 監聽網址變化（如果在頁面內切換網址）
        window.onhashchange = init;
    </script>

</body>
</html>
