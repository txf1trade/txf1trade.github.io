<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mini TradingDash</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lightweight Charts v4 CDN -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tvBg: '#131722',
            tvPanel: '#1e222d',
            tvHover: '#2a2e39',
            tvBorder: '#2a2e39',
            tvText: '#d1d4dc',
            tvTextMuted: '#787b86',
            tvUp: '#089981',
            tvDown: '#f23645',
            tvAccent: '#2962ff'
          }
        }
      }
    }
  </script>
  <style>
    /* 鎖定頁面與滾動行為，防止手機下拉橡皮筋回彈與上方空白 */
    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: #131722; }
    ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }

    .compact-table-row { font-size: 11px; }

    /* 柔和舒適的呼吸燈動畫 */
    @keyframes softPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.92); }
    }
    .soft-breathing {
      animation: softPulse 2.5s infinite ease-in-out;
    }

    /* 桌面版收合樣式 */
    #watchlist-wrapper {
      width: 410px;
      height: 100%;
      background-color: #1e222d;
      border-left: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
      transition: width 0.2s ease, border-left 0.2s ease;
      position: relative;
      z-index: 10;
      overflow: hidden;
      flex-shrink: 0;
    }

    #watchlist-wrapper.collapsed {
      width: 0px;
      border-left: none;
    }

    /* 手機版抽屜覆蓋模式 */
    @media (max-width: 767px) {
      #watchlist-wrapper {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        width: 100%;
        max-width: 360px;
        z-index: 50;
        transform: translateX(100%);
        transition: transform 0.25s ease-in-out;
        box-shadow: -5px 0 25px rgba(0,0,0,0.5);
      }
      #watchlist-wrapper.open {
        transform: translateX(0);
      }
    }

    /* 最右側圖示側邊欄 */
    #sidebar-icons {
      width: 48px;
      height: 100%;
      background-color: #131722;
      border-left: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 10px;
      gap: 12px;
      z-index: 12;
      flex-shrink: 0;
    }

    .sidebar-btn {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #787b86;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
    }

    .sidebar-btn:hover {
      background-color: #2a2e39;
      color: #f0f3fa;
    }

    .sidebar-btn.active {
      color: #2962ff;
      background-color: rgba(41, 98, 255, 0.15);
    }

    /* 手機遮罩層 */
    #drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
    }
    #drawer-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    @media (min-width: 768px) {
      #drawer-backdrop { display: none !important; }
    }

    .legend-item {
      cursor: pointer;
      padding: 1px 4px;
      border-radius: 3px;
      transition: all 0.15s ease;
      display: inline-block;
    }
    .legend-item:hover {
      background-color: rgba(255, 255, 255, 0.1);
    }
    .legend-item.disabled {
      opacity: 0.35;
      text-decoration: line-through;
    }

    /* 群組 Tab 按鈕樣式 */
    .group-tab-btn {
      position: relative;
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #787b86;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: color 0.2s;
    }
    .group-tab-btn:hover {
      color: #d1d4dc;
    }
    .group-tab-btn.active {
      color: #ffffff;
    }
    .group-tab-btn.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 15%;
      width: 70%;
      height: 3px;
      background-color: #ffffff;
      border-radius: 2px 2px 0 0;
    }

    /* 右下角走勢圖 Canvas 容器 */
    .vix-mini-canvas-container {
      width: 100%;
      height: 140px;
      position: relative;
      background: #131722;
      border-radius: 6px;
      border: 1px solid #2a2e39;
      overflow: hidden;
      flex-shrink: 0;
    }

    /* 上下拖曳霸樣式與觸控專用觸發點 */
    #bottom-resizer {
      touch-action: none;
      user-select: none;
    }

    /* ===== TradingView 風格擴充 ===== */
    #draw-toolbar { width: 44px; background:#131722; border-right:1px solid #2a2e39; display:flex; flex-direction:column; align-items:center; padding:6px 0; gap:2px; flex-shrink:0; overflow-y:auto; z-index:20; }
    #draw-toolbar .sidebar-btn { width:34px; height:34px; }
    #draw-toolbar .sep { width:24px; height:1px; background:#2a2e39; margin:4px 0; }
    #dt-color { width:22px; height:22px; padding:0; border:1px solid #2a2e39; border-radius:4px; background:none; cursor:pointer; }
    .tool-active #chart-container, .tool-active #chart-container * { cursor: crosshair !important; }
    .scale-btn { font-size:11px; padding:2px 8px; border-radius:4px; color:#787b86; border:1px solid transparent; }
    .scale-btn:hover { background:#2a2e39; color:#fff; }
    .scale-btn.on { color:#2962ff; background:rgba(41,98,255,.15); }
    .tb-icon { width:28px; height:28px; border-radius:4px; display:flex; align-items:center; justify-content:center; color:#b2b5be; }
    .tb-icon:hover { background:#2a2e39; color:#fff; }
    #watchlist-wrapper.collapsed { width: 0 !important; min-width: 0 !important; border-left: none !important; }\n    @media (max-width: 767px) { #watchlist-wrapper { width: 100% !important; } }\n    #mcdx-table table { border-collapse:collapse; font-size:10px; font-family:monospace; text-align:center; opacity:.92; }\n    #mcdx-table td { padding:1px 6px; color:#000; border:1px solid rgba(128,128,128,.35); min-width:34px; }\n    #mcdx-table td.h { background:#363a45; color:#fff; }\n    #mcdx-table td.s { color:#787b86; border:none; padding:0 4px; }\n    .mini-chip { cursor:pointer; padding:1px 4px; border-radius:3px; } .mini-chip:hover { background:#2a2e39; } .mini-chip.off { opacity:.35; text-decoration:line-through; }\n    #ohlc-bar { display:flex; flex-wrap:wrap; gap:0 8px; }
  </style>
</head>
<body class="bg-tvBg text-tvText font-sans h-[100dvh] w-screen overflow-hidden flex flex-col select-none">

  <!-- Top Global Header -->
  <header class="h-11 bg-tvPanel border-b border-tvBorder flex items-center justify-between px-3 shrink-0 z-25 relative">
    <div class="flex items-center space-x-2 text-tvAccent font-bold text-base tracking-wider shrink-0">
      <i class="fa-solid fa-chart-line"></i>
      <span>Mini TradingDash</span>
    </div>

    <!-- Right Global Status / Actions -->
    <div class="flex items-center space-x-2.5 text-xs shrink-0 font-mono">
      <div id="api-status-badge" class="flex items-center space-x-1.5 text-tvUp bg-tvUp/15 px-3 py-1.5 rounded-md border border-tvUp/50 shadow-[0_0_12px_rgba(8,153,129,0.25)] cursor-pointer hover:bg-tvUp/25 transition-all select-none group" title="點擊手動重新整理資料">
        <span id="api-status-dot" class="w-2.5 h-2.5 rounded-full bg-tvUp soft-breathing"></span>
        <i id="api-status-icon" class="fa-solid fa-rotate text-[10px] text-tvUp transition-transform"></i>
        <span id="api-status-text" class="text-[11px] font-bold tracking-wide">即時連線</span>
      </div>

      <div class="flex items-center space-x-1.5 text-white bg-tvHover px-2.5 py-1 rounded border border-tvBorder shadow-sm">
        <i class="fa-regular fa-clock text-[10px] text-tvTextMuted"></i>
        <span id="live-clock" class="text-[10px] font-bold tracking-wider">--:--:--</span>
      </div>
    </div>
  </header>

  <!-- Main Grid Content -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- Left Section: Chart Area -->
    <div class="flex-1 flex flex-col min-w-0 min-h-0 overflow-hidden border-r border-tvBorder bg-tvBg max-h-[65vh] sm:max-h-none">
      <!-- Active Symbol Info Bar -->
      <div class="h-10 bg-tvPanel/50 border-b border-tvBorder flex items-center justify-between px-3 text-xs shrink-0">
        <div class="flex items-center space-x-2 truncate">
          <span id="active-symbol-title" class="font-bold text-white text-xs sm:text-sm truncate">台指期全 TX-1</span>
          <span id="active-symbol-exch" class="text-tvTextMuted text-[10px]">TAIFEX</span>
          
          <div class="h-4 w-px bg-tvBorder hidden sm:block mx-1"></div>

          <!-- Timeframe Selector -->
          <div id="timeframe-container" class="hidden sm:flex items-center space-x-1 text-xs font-mono">
            <button data-res="1" class="tf-btn px-2 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">1</button>
            <button data-res="5" class="tf-btn px-2 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">5</button>
            <button data-res="15" class="tf-btn px-2 py-0.5 rounded bg-tvHover text-white font-medium shadow">15</button>
            <button data-res="60" class="tf-btn px-2 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">60</button>
            <button data-res="1D" class="tf-btn px-2 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">D</button>
          </div>
        </div>

        <div class="flex items-center gap-0.5 mr-2 shrink-0 relative">
          <button id="ct-btn" class="tb-icon" title="圖表類型"><i id="ct-icon" class="fa-solid fa-chart-simple text-sm"></i></button>
          <div id="ct-menu" class="hidden absolute top-8 left-0 bg-tvPanel border border-tvBorder rounded shadow-xl py-1 z-50 w-28 text-xs">
            <div class="ct-item px-3 py-1.5 hover:bg-tvHover cursor-pointer text-white" data-type="candle"><i class="fa-solid fa-chart-simple w-4"></i> K線</div>
            <div class="ct-item px-3 py-1.5 hover:bg-tvHover cursor-pointer text-tvTextMuted" data-type="bar"><i class="fa-solid fa-bars-progress w-4"></i> 美國線</div>
            <div class="ct-item px-3 py-1.5 hover:bg-tvHover cursor-pointer text-tvTextMuted" data-type="line"><i class="fa-solid fa-chart-line w-4"></i> 折線</div>
            <div class="ct-item px-3 py-1.5 hover:bg-tvHover cursor-pointer text-tvTextMuted" data-type="area"><i class="fa-solid fa-chart-area w-4"></i> 面積</div>
          </div>
          <button id="btn-shot" class="tb-icon" title="截圖"><i class="fa-solid fa-camera text-sm"></i></button>
          <button id="btn-full" class="tb-icon" title="全螢幕"><i class="fa-solid fa-expand text-sm"></i></button>
        </div>

        <div id="active-price-badge" class="flex items-center space-x-1.5 font-mono font-bold shrink-0">
          <span id="active-price" class="text-xs sm:text-sm">--</span>
          <span id="active-change" class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded">--</span>
        </div>
      </div>

      <!-- 手機版專屬第二行時框列 -->
      <div class="sm:hidden h-8 bg-tvPanel/30 border-b border-tvBorder flex items-center px-3 space-x-1 text-xs font-mono shrink-0 overflow-x-auto no-scrollbar">
        <button data-res="1" class="tf-btn px-2.5 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">1</button>
        <button data-res="5" class="tf-btn px-2.5 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">5</button>
        <button data-res="15" class="tf-btn px-2.5 py-0.5 rounded bg-tvHover text-white font-medium shadow">15</button>
        <button data-res="60" class="tf-btn px-2.5 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">60</button>
        <button data-res="1D" class="tf-btn px-2.5 py-0.5 rounded hover:bg-tvHover text-tvTextMuted transition-colors">D</button>
      </div>

      <div class="flex-1 flex min-h-0 min-w-0">
      <div id="draw-toolbar">
        <button class="sidebar-btn draw-tool active" data-tool="cursor" title="游標 (Esc)"><i class="fa-solid fa-arrow-pointer text-sm"></i></button>
        <div class="sep"></div>
        <button class="sidebar-btn draw-tool" data-tool="trend" title="趨勢線"><i class="fa-solid fa-slash text-sm"></i></button>
        <button class="sidebar-btn draw-tool" data-tool="hline" title="水平線"><i class="fa-solid fa-minus text-sm"></i></button>
        <button class="sidebar-btn draw-tool" data-tool="vline" title="垂直線"><i class="fa-solid fa-grip-lines-vertical text-sm"></i></button>
        <button class="sidebar-btn draw-tool" data-tool="rect" title="矩形"><i class="fa-regular fa-square text-sm"></i></button>
        <button class="sidebar-btn draw-tool" data-tool="fib" title="斐波那契回檔"><i class="fa-solid fa-bars-staggered text-sm"></i></button>
        <div class="sep"></div>
        <button class="sidebar-btn" id="dt-magnet" title="磁吸 K 棒 OHLC"><i class="fa-solid fa-magnet text-sm"></i></button>
        <button class="sidebar-btn" id="dt-eye" title="顯示/隱藏繪圖"><i class="fa-solid fa-eye text-sm"></i></button>
        <button class="sidebar-btn" id="dt-del" title="刪除選取（無選取＝清除全部）"><i class="fa-solid fa-trash-can text-sm"></i></button>
        <div class="sep"></div>
        <input type="color" id="dt-color" value="#2962ff" title="繪圖顏色">
      </div>
      <!-- Lightweight Chart Container & Legend -->
      <div class="flex-1 relative min-w-0 bg-tvBg flex flex-col min-h-0 overflow-hidden">
        <!-- 主圖左上角數值即時標籤 -->
        <div id="ohlc-bar" class="absolute top-2 left-2 z-10 text-[11px] font-mono pointer-events-none"></div>
        <div id="chart-legend" class="absolute top-8 left-2 z-10 flex flex-col items-start gap-y-1 text-[10px] sm:text-xs font-mono bg-tvPanel/85 px-2.5 py-1.5 rounded border border-tvBorder shadow pointer-events-auto">
          <div id="legend-row-filter" class="flex items-center gap-x-2">
            <span id="legend-filter-group" data-line="filter12" class="legend-item text-[#df8028]" title="切換過濾線(EMA12)顯示"><span id="label-filter">EMA12</span>: <span id="legend-filter">--</span></span>
          </div>
          <div id="legend-row-ema" class="flex items-center gap-x-2">
            <span id="legend-ema20-group" data-line="ema20" class="legend-item text-[#ffcc66]" title="切換多頭線(EMA20)顯示"><span id="label-ema20">EMA20</span>: <span id="legend-ema20">--</span></span>
            <span id="legend-ema60-group" data-line="ema60" class="legend-item text-[#28c6ee]" title="切換多頭線(EMA60)顯示"><span id="label-ema60">60</span>: <span id="legend-ema60">--</span></span>
          </div>
          <div id="legend-row-daily" class="flex items-center gap-x-2">
            <span id="legend-daily-group" data-line="daily" class="legend-item text-[#ee3b76]" title="點擊切換日線(EMA76)顯示"><span id="label-daily">EMA76</span>: <span id="legend-dailyval">--</span></span>
            <span id="legend-weekly-group" data-line="weekly" class="legend-item text-[#2186c0]" title="點擊切換週線(EMA380)顯示"><span id="label-weekly">EMA380</span>: <span id="legend-weeklyval">--</span></span>
          </div>
          <div id="legend-row-atr" class="flex items-center gap-x-2">
            <span id="legend-atr-group" data-line="atrTrend" class="legend-item text-[#00cbff]" title="點擊切換 ATR 趨勢線顯示"><span id="label-atr">ATR趨勢</span>: <span id="legend-atrval">--</span></span>
          </div>
        </div>

        <div id="chart-container" class="flex-1 w-full relative min-h-0 overflow-hidden"></div>
        <div id="vol-pane" class="hidden relative border-t border-tvBorder shrink-0" style="height:22%;min-height:90px;max-height:35%">
          <div class="absolute top-1 left-2 z-10 text-[11px] text-tvTextMuted pointer-events-none">成交量</div>
          <div id="vol-container" class="w-full h-full overflow-hidden"></div>
        </div>
        <div id="mcdx-pane" class="hidden relative border-t border-tvBorder shrink-0" style="height:30%;min-height:130px;max-height:42%">
          <div class="absolute top-1 left-2 right-2 z-10 flex items-center gap-2 text-[11px] font-mono">
            <span class="text-white font-bold pointer-events-none">MCDX</span>
            <select id="mcdx-len" class="bg-tvBg border border-tvBorder rounded text-[10px] text-tvText px-1 py-0 focus:outline-none">
              <option value="auto">自動</option><option value="50">50</option><option value="100">100</option></select>
            <span id="mcdx-legend" class="pointer-events-none"></span>
            <button id="mcdx-tbl-btn" class="ml-auto text-tvTextMuted hover:text-white text-[10px] border border-tvBorder rounded px-1.5" title="顯示/隱藏多週期表格">表格</button>
          </div>
          <div id="mcdx-table" class="absolute left-2 top-7 z-10 pointer-events-none"></div>
          <div id="mcdx-container" class="w-full h-full overflow-hidden"></div>
        </div>

        <!-- 畫面下方的底部指標切換列 -->
        <div class="h-14 bg-tvPanel border-t border-tvBorder flex items-center px-4 space-x-6 text-sm shrink-0 z-20 font-mono select-none overflow-x-auto whitespace-nowrap">
          <button data-ind="filter" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">過濾線</button>
          <button data-ind="ema" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">多頭線</button>
          <button data-ind="daily" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">日週線</button>
          <button data-ind="atr" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">ATR</button>
          <button data-ind="vol" class="ind-tab text-tvTextMuted hover:text-white transition-colors py-2 px-1" data-active="false">成交量</button>
          <button id="tab-vwap" class="py-2 px-1" title="VWAP（依交易日重置，日K為累積）">VWAP</button>
          <button id="tab-mcdx" class="py-2 px-1" title="MCDX 籌碼副圖">MCDX</button>
          <div class="ml-auto flex items-center gap-1 text-xs">
            <button id="sc-pct" class="scale-btn" title="百分比座標">%</button>
            <button id="sc-log" class="scale-btn" title="對數座標">log</button>
            <button id="sc-auto" class="scale-btn" title="自動縮放並回到最新">自動</button>
          </div>
        </div>
      </div>
      </div>
    </div>

    <!-- Resizer Drag Handle Bar -->
    <div id="panel-resizer" class="hidden md:block w-1 bg-tvBorder hover:bg-tvAccent cursor-ew-resize shrink-0 transition-colors z-30 select-none relative group" title="拖曳調整面板寬度">
      <div class="absolute inset-y-0 -left-1 -right-1 cursor-ew-resize"></div>
    </div>

    <!-- 手機抽屜背景遮罩 -->
    <div id="drawer-backdrop"></div>

    <!-- 右側自選面板 Wrapper -->
    <div id="watchlist-wrapper">
      <!-- Watchlist Header -->
      <div class="h-10 px-3 border-b border-tvBorder flex items-center justify-between shrink-0 relative">
        <div class="flex items-center space-x-2">
          <span class="font-bold text-sm text-white">自選商品群組</span>
          <span class="text-xs bg-tvHover px-2 py-0.5 rounded text-tvTextMuted font-mono" id="watchlist-count">0</span>
        </div>
        <div class="flex items-center space-x-1">
          <button id="btn-settings-3" class="p-1.5 hover:bg-tvHover rounded text-tvTextMuted hover:text-white relative" title="設定三：欄位與總量顯示設定">
            <i class="fa-solid fa-sliders text-xs"></i>
          </button>
          <button id="btn-open-modal" class="p-1.5 hover:bg-tvHover rounded text-tvText hover:text-white" title="新增自選商品">
            <i class="fa-solid fa-plus text-xs"></i>
          </button>
          <button id="btn-close-drawer" class="md:hidden p-1.5 hover:bg-tvHover rounded text-tvTextMuted hover:text-white">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>

        <!-- 設定三：下拉選單 -->
        <div id="settings-dropdown" class="absolute top-11 right-2 bg-tvPanel border border-tvBorder rounded shadow-xl p-3 z-50 hidden text-xs w-52 space-y-2.5">
          <div class="font-bold text-white border-b border-tvBorder pb-1 mb-1">顯示欄位設定</div>
          <label class="flex items-center space-x-2 cursor-pointer text-tvText hover:text-white">
            <input type="checkbox" id="col-change" checked class="rounded bg-tvBg border-tvBorder text-tvAccent focus:ring-0">
            <span>漲跌 (點數)</span>
          </label>

    function getAllWatchlistItems() {

    function calculateEMA(data, period) {
      let results = [];
      if (period <= 0 || data.length === 0) return results;
      let multiplier = 2 / (period + 1);
      let prevEMA = null;
      for (let i = 0; i < data.length; i++) {
        let close = data[i].close;
        if (i === 0) {
          prevEMA = close;
        } else {
          prevEMA = (close - prevEMA) * multiplier + prevEMA;
        }
        results.push({ time: data[i].time, value: prevEMA });
      }
      return results;
    }

    function calculateAtrTrend(candles, length = 14, multi = 2.0, src_hl = true) {
      if (!candles || candles.length === 0) return [];

      let trs = [];
      for (let i = 0; i < candles.length; i++) {
        let c = candles[i];
        let prevClose = i > 0 ? candles[i - 1].close : c.open;
        let tr = Math.max(c.high - c.low, Math.abs(c.high - prevClose), Math.abs(c.low - prevClose));
        trs.push(tr);
      }

      let atrValues = [];
      let alpha = 2 / (length + 1);
      let prevEmaTr = trs[0];
      for (let i = 0; i < trs.length; i++) {
        if (i === 0) {
          prevEmaTr = trs[0];
        } else {
          prevEmaTr = (trs[i] - prevEmaTr) * alpha + prevEmaTr;
        }
        atrValues.push(prevEmaTr * multi);
      }

      let lowerAtr = [];
      let upperAtr = [];
      for (let i = 0; i < candles.length; i++) {
        let startIdx = Math.max(0, i - length + 1);
        let slice = candles.slice(startIdx, i + 1);
        if (src_hl) {
          let lowVal = Math.min(...slice.map(s => s.low));
          let highVal = Math.max(...slice.map(s => s.high));
          lowerAtr.push(lowVal);
          upperAtr.push(highVal);
        } else {
          let lowVal = Math.min(...slice.map(s => s.close));
          let highVal = Math.max(...slice.map(s => s.close));
          lowerAtr.push(lowVal);
          upperAtr.push(highVal);
        }
      }

      let trendLine = [];
      let prevTrend = 0;
      let upDownTrend = null;

      for (let i = 0; i < candles.length; i++) {
        let direction = 'neutral';
        if (i > 0) {
          if (upperAtr[i] > upperAtr[i - 1]) direction = 'up';
          else if (lowerAtr[i] < lowerAtr[i - 1]) direction = 'down';
        }

        let c = candles[i];
        let currentTrend = prevTrend;

        if (direction === 'up') {
          currentTrend = c.low - atrValues[i];
          if (i > 0 && currentTrend < prevTrend) currentTrend = prevTrend;
        } else if (direction === 'down') {
          currentTrend = c.high + atrValues[i];
          if (i > 0 && currentTrend > prevTrend) currentTrend = prevTrend;
        } else {
          currentTrend = prevTrend !== 0 ? prevTrend : (c.low - atrValues[i]);
        }

        if (i > 0) {
          if (currentTrend > prevTrend) upDownTrend = 'up';
          else if (currentTrend < prevTrend) upDownTrend = 'down';
        }

        let halfCandle = c.open + ((c.close - c.open) / 2);
        let lineColor = '#ff0099';
        if (halfCandle < currentTrend && upDownTrend !== 'down') {
          lineColor = '#ff4100';
        } else if (upDownTrend === 'up') {
          lineColor = '#00cbff';
        } else if (halfCandle > currentTrend) {
          lineColor = '#ff4101';
        }

        prevTrend = currentTrend;
        trendLine.push({ time: c.time, value: currentTrend, color: lineColor });
      }

      return trendLine;
    }

    function initChart() {
      const container = document.getElementById('chart-container');
      
      chart = LightweightCharts.createChart(container, {
        layout: {
          background: { type: 'solid', color: '#131722' },
          textColor: '#ffffff',
        },
        grid: {
          vertLines: { color: '#1e222d' },
          horzLines: { color: '#1e222d' },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { 
          borderColor: '#2a2e39', 
          textColor: '#ffffff', 
          autoScale: true,
          mode: LightweightCharts.PriceScaleMode.Normal,
          alignLabels: true,
        },
        timeScale: {
          borderColor: '#2a2e39',
          timeVisible: true,
          secondsVisible: false,
          textColor: '#ffffff',
          tickMarkFormatter: (time) => {
            const date = new Date(time * 1000);
            if (currentResolution === '1D') return `${date.getMonth() + 1}/${date.getDate()}`;
            return date.toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit' });
          }
        },
        localization: {
          locale: 'zh-TW',
          timeFormatter: timestamp => {
            const date = new Date(timestamp * 1000);
            if (currentResolution === '1D') return `${date.getMonth() + 1}/${date.getDate()}`;
            return date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
          }
        },
      });

      candlestickSeries = chart.addCandlestickSeries({
        upColor: '#f23645',
        downColor: '#089981',
        borderVisible: false,
        wickUpColor: '#f23645',
        wickDownColor: '#089981',
      });
      candlestickSeries.priceScale().applyOptions({
        scaleMargins: { top: 0.12, bottom: 0.15 },
        autoScale: true,
      });

      filter12Series = chart.addLineSeries({
        color: '#df8028',
        lineWidth: 1.5,
        priceLineVisible: false,
        lastValueVisible: true,
      });

      ema20Series = chart.addLineSeries({
        color: '#ffcc66',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
      });

      ema60Series = chart.addLineSeries({
        color: '#28c6ee',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
      });

      dailySeries = chart.addLineSeries({
        color: '#ee3b76',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
      });

      weeklySeries = chart.addLineSeries({
        color: '#2186c0',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
      });

      atrTrendSeries = chart.addLineSeries({
        color: '#00cbff',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
      });

      volumeSeries = chart.addHistogramSeries({
        color: '#26a69a',
        priceFormat: { type: 'volume' },
        priceScaleId: 'volume_pane',
      });

      chart.priceScale('volume_pane').applyOptions({
        scaleMargins: { top: 0.75, bottom: 0 },
        visible: false,
      });

      chart.subscribeCrosshairMove(param => {
        if (!param || !param.time || !currentCandles.length) return;
        const time = param.time;
        const allItems = getAllWatchlistItems();
        const currentSymbol = allItems.find(s => s.id === selectedSymbolId) || { code: 'TX-1' };
        const params = getLineParams(currentSymbol.code);

        const filterData = calculateEMA(currentCandles, params.filter);
        const e20Data = calculateEMA(currentCandles, params.ema20);
        const e60Data = calculateEMA(currentCandles, params.ema60);
        const dailyData = calculateEMA(currentCandles, params.daily);
        const weeklyData = calculateEMA(currentCandles, params.weekly);
        const atrData = calculateAtrTrend(currentCandles);

        const matchFilter = filterData.find(d => d.time === time);
        const match20 = e20Data.find(d => d.time === time);
        const match60 = e60Data.find(d => d.time === time);
        const matchDaily = dailyData.find(d => d.time === time);
        const matchWeekly = weeklyData.find(d => d.time === time);
        const matchAtr = atrData.find(d => d.time === time);

        if (indicatorStates.filter) {
          document.getElementById('legend-filter').textContent = matchFilter ? matchFilter.value.toFixed(2) : '--';
        }
        if (indicatorStates.ema) {
          document.getElementById('legend-ema20').textContent = match20 ? match20.value.toFixed(2) : '--';
          document.getElementById('legend-ema60').textContent = match60 ? match60.value.toFixed(2) : '--';
        }
        if (indicatorStates.daily) {
          document.getElementById('legend-dailyval').textContent = matchDaily ? matchDaily.value.toFixed(2) : '--';
          document.getElementById('legend-weeklyval').textContent = matchWeekly ? matchWeekly.value.toFixed(2) : '--';
        }
        if (indicatorStates.atr) {
          document.getElementById('legend-atrval').textContent = matchAtr ? matchAtr.value.toFixed(2) : '--';
        }
      });

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
    }

    function updateIndicatorDisplay() {
      const allItems = getAllWatchlistItems();
      const currentSymbol = allItems.find(s => s.id === selectedSymbolId) || { code: 'TX-1' };
      const params = getLineParams(currentSymbol.code);

      document.getElementById('label-filter').textContent = `EMA${params.filter}`;
      document.getElementById('label-ema20').textContent = `EMA${params.ema20}`;
      document.getElementById('label-ema60').textContent = `EMA${params.ema60}`;
      document.getElementById('label-daily').textContent = `EMA${params.daily}`;
      document.getElementById('label-weekly').textContent = `EMA${params.weekly}`;

      const rowFilter = document.getElementById('legend-row-filter');
      const rowEma = document.getElementById('legend-row-ema');
      const rowDaily = document.getElementById('legend-row-daily');
      const rowAtr = document.getElementById('legend-row-atr');

    function getResolutionSeconds(res) {
      if (res === '1') return 60;
      if (res === '5') return 300;
      if (res === '15') return 900;
      if (res === '60') return 3600;
      if (res === '1D') return 86400;
      return 900;
    }

    async function loadHistoryData(symbolCode, resolution) {
      currentCandles = []; 
      const toTime = Math.floor(Date.now() / 1000);
      const daysToSubtract = resolution === '1D' ? 365 : 60;
      const fromTime = toTime - (daysToSubtract * 24 * 60 * 60);
      const url = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=${encodeURIComponent(symbolCode)}&resolution=${resolution}&from=${fromTime}&to=${toTime}&ws=true&metaData=true`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        let candleData = [];
        const barsData = Array.isArray(data) ? data : (data.bars || []);
        const normalizeTime = t => t > 1e10 ? Math.floor(t / 1000) : t;

        if (Array.isArray(barsData) && barsData.length > 0) {
          barsData.forEach(item => {
            let rawTime = item.time || new Date(item.datetime).getTime();
            let time = normalizeTime(rawTime);
            if (resolution === '1D') time -= 86400; 
            const volume = item.volume !== undefined ? item.volume : (Math.floor(Math.random() * 20000 + 5000));
            candleData.push({ time, open: item.open, high: item.high, low: item.low, close: item.close, volume });
          });
        }

        if (candleData.length > 0) {
          candleData.sort((a, b) => a.time - b.time);
          currentCandles = candleData;
          candlestickSeries.setData(currentCandles);
          updateIndicatorDisplay();

          if (currentCandles.length > 0) {
            const allItems = getAllWatchlistItems();
            const currentSymbol = allItems.find(s => s.id === selectedSymbolId) || { code: symbolCode };
            const params = getLineParams(currentSymbol.code);

            const lastFilter = calculateEMA(currentCandles, params.filter);
            const last20 = calculateEMA(currentCandles, params.ema20);
            const last60 = calculateEMA(currentCandles, params.ema60);
            const lastDaily = calculateEMA(currentCandles, params.daily);
            const lastWeekly = calculateEMA(currentCandles, params.weekly);
            const lastAtr = calculateAtrTrend(currentCandles);

            if (indicatorStates.filter && lastFilter.length > 0) {
              document.getElementById('legend-filter').textContent = lastFilter[lastFilter.length - 1].value.toFixed(2);
            }
            if (indicatorStates.ema && last20.length > 0) {
              document.getElementById('legend-ema20').textContent = last20[last20.length - 1].value.toFixed(2);
              document.getElementById('legend-ema60').textContent = last60[last60.length - 1].value.toFixed(2);
            }
            if (indicatorStates.daily && lastDaily.length > 0) {
              document.getElementById('legend-dailyval').textContent = lastDaily[lastDaily.length - 1].value.toFixed(2);
              document.getElementById('legend-weeklyval').textContent = lastWeekly[lastWeekly.length - 1].value.toFixed(2);
            }
            if (indicatorStates.atr && lastAtr.length > 0) {
              document.getElementById('legend-atrval').textContent = lastAtr[lastAtr.length - 1].value.toFixed(2);
            }
          }

          const barsCount = currentCandles.length;
          chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, barsCount - 80), to: barsCount - 1 });
          chart.priceScale('right').applyOptions({ autoScale: true });
          return;
        }
        throw new Error('API 資料為空');
      } catch (err) {
        loadMockHistoryFallback(symbolCode);
      }
    }

    function loadMockHistoryFallback(symbolCode) {
      const now = Math.floor(Date.now() / 1000);
      let candleData = [];
      let basePrice = symbolCode === '2330' ? 980 : (symbolCode.includes('TX') ? 22600 : 250);
      const step = getResolutionSeconds(currentResolution);

      for (let i = 80; i >= 1; i--) {
        let time = now - (i * step);
        if (currentResolution === '1D') time -= 86400;
        const open = basePrice + (Math.random() * 20 - 10);
        const high = open + Math.random() * 15;
        const low = open - Math.random() * 15;
        const close = (open + high + low) / 3;
        basePrice = close;
        const volume = Math.floor(Math.abs(high - low) * 1000 + 5000);
        candleData.push({ time, open, high, low, close, volume });
      }

      currentCandles = candleData;
      candlestickSeries.setData(currentCandles);
      updateIndicatorDisplay();

      if (currentCandles.length > 0) {
        const params = getLineParams(symbolCode);
        const lastFilter = calculateEMA(currentCandles, params.filter);
        const last20 = calculateEMA(currentCandles, params.ema20);
        const last60 = calculateEMA(currentCandles, params.ema60);
        const lastDaily = calculateEMA(currentCandles, params.daily);
        const lastWeekly = calculateEMA(currentCandles, params.weekly);
        const lastAtr = calculateAtrTrend(currentCandles);

        if (indicatorStates.filter && lastFilter.length > 0) {
          document.getElementById('legend-filter').textContent = lastFilter[lastFilter.length - 1].value.toFixed(2);
        }
        if (indicatorStates.ema && last20.length > 0) {
          document.getElementById('legend-ema20').textContent = last20[last20.length - 1].value.toFixed(2);
          document.getElementById('legend-ema60').textContent = last60[last60.length - 1].value.toFixed(2);
        }
        if (indicatorStates.daily && lastDaily.length > 0) {
          document.getElementById('legend-dailyval').textContent = lastDaily[lastDaily.length - 1].value.toFixed(2);
          document.getElementById('legend-weeklyval').textContent = lastWeekly[lastWeekly.length - 1].value.toFixed(2);
        }
        if (indicatorStates.atr && lastAtr.length > 0) {
          document.getElementById('legend-atrval').textContent = lastAtr[lastAtr.length - 1].value.toFixed(2);
        }
      }

      const barsCount = currentCandles.length;
      chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, barsCount - 80), to: barsCount - 1 });
      chart.priceScale('right').applyOptions({ autoScale: true });
    }

    async function fetchRealtimeQuotes() {
      const allItems = getAllWatchlistItems();
      if (allItems.length === 0 || currentCandles.length === 0) return;
      const symbolsParam = allItems.map(item => item.code).join(',');
      const apiUrl = `https://realtime-quote-signalr-v2.futures-op.com/quote?symbol=${encodeURIComponent(symbolsParam)}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('API Error');
        const data = await response.json();

        if (Array.isArray(data)) {
          lastQuoteSuccessTime = Date.now();
          setConnectionStatus('normal');

          data.forEach(quote => {
            const item = allItems.find(i => i.code.toUpperCase() === quote.symbol.toUpperCase());
            if (item) {
              const newPrice = quote.close || item.price;
              item.price = newPrice;
              item.refPrice = quote.prevRef || quote.refRef || item.refRef || item.refPrice;
              item.volume = quote.volume || item.volume;
              item.high = quote.high || item.high;
              item.low = quote.low || item.low;

              if (item.id === selectedSymbolId && newPrice > 0 && candlestickSeries && currentCandles.length > 0) {
                const stepSeconds = getResolutionSeconds(currentResolution);
                const nowSec = Math.floor(Date.now() / 1000);
                const currentBarTime = currentResolution === '1D' 
                  ? Math.floor(nowSec / 86400) * 86400 - 86400 
                  : Math.floor(nowSec / stepSeconds) * stepSeconds;

                let lastBar = currentCandles[currentCandles.length - 1];

                if (lastBar.time === currentBarTime) {
                  lastBar.high = Math.max(lastBar.high, newPrice);
                  lastBar.low = Math.min(lastBar.low, newPrice);
                  lastBar.close = newPrice;
                  candlestickSeries.update(lastBar);
                } else if (currentBarTime > lastBar.time) {
                  if (currentBarTime - lastBar.time === stepSeconds) {
                    const newBar = {
                      time: currentBarTime,
                      open: lastBar.close,
                      high: Math.max(lastBar.close, newPrice),
                      low: Math.min(lastBar.close, newPrice),
                      close: newPrice,
                      volume: item.volume || 1000
                    };
                    currentCandles.push(newBar);
                    candlestickSeries.update(newBar);
                  } else {
                    lastBar.high = Math.max(lastBar.high, newPrice);
                    lastBar.low = Math.min(lastBar.low, newPrice);
                    lastBar.close = newPrice;
                    candlestickSeries.update(lastBar);
                  }
                }

                const params = getLineParams(item.code);
                if (indicatorStates.filter && lineVisibility.filter12) {
                  const filterData = calculateEMA(currentCandles, params.filter);
                  if (filterData.length > 0) {
                    filter12Series.update(filterData[filterData.length - 1]);
                    document.getElementById('legend-filter').textContent = filterData[filterData.length - 1].value.toFixed(2);
                  }
                }
                if (indicatorStates.ema) {
                  if (lineVisibility.ema20) {
                    const e20Data = calculateEMA(currentCandles, params.ema20);
                    if (e20Data.length > 0) {
                      ema20Series.update(e20Data[e20Data.length - 1]);
                      document.getElementById('legend-ema20').textContent = e20Data[e20Data.length - 1].value.toFixed(2);
                    }
                  }
                  if (lineVisibility.ema60) {
                    const e60Data = calculateEMA(currentCandles, params.ema60);
                    if (e60Data.length > 0) {
                      ema60Series.update(e60Data[e60Data.length - 1]);
                      document.getElementById('legend-ema60').textContent = e60Data[e60Data.length - 1].value.toFixed(2);
                    }
                  }
                }
                if (indicatorStates.daily) {
                  if (lineVisibility.daily) {
                    const dailyData = calculateEMA(currentCandles, params.daily);
                    if (dailyData.length > 0) {
                      dailySeries.update(dailyData[dailyData.length - 1]);
                      document.getElementById('legend-dailyval').textContent = dailyData[dailyData.length - 1].value.toFixed(2);
                    }
                  }
                  if (lineVisibility.weekly) {
                    const weeklyData = calculateEMA(currentCandles, params.weekly);
                    if (weeklyData.length > 0) {
                      weeklySeries.update(weeklyData[weeklyData.length - 1]);
                      document.getElementById('legend-weeklyval').textContent = weeklyData[weeklyData.length - 1].value.toFixed(2);
                    }
                  }
                }
                if (indicatorStates.atr && lineVisibility.atrTrend) {
                  const atrData = calculateAtrTrend(currentCandles);
                  if (atrData.length > 0) {
                    atrTrendSeries.update(atrData[atrData.length - 1]);
                    document.getElementById('legend-atrval').textContent = atrData[atrData.length - 1].value.toFixed(2);
                  }
                }
              }
            }
          });

          renderWatchlist();
          const activeSymbol = allItems.find(s => s.id === selectedSymbolId);
          if (activeSymbol) {
            updateActivePriceDisplay(activeSymbol);
            updateDetailCard(activeSymbol);
          }
        }
      } catch (err) {
        console.error('Realtime quote error:', err);
        setConnectionStatus('delayed');
      }
    }

    function formatSmartVolume(vol) {
      if (!vol || vol === 0) return '--';
      if (columnSettings.volMode === 'full') {
        return vol.toLocaleString();
      }
      if (vol >= 1000000000) {
        return (vol / 1000000000).toFixed(1) + 'G';
      } else if (vol >= 1000000) {
        return (vol / 1000000).toFixed(1) + 'M';
      } else if (vol >= 1000) {
        return (vol / 1000).toFixed(1) + 'k';
      }
      return vol.toLocaleString();
    }

    async function fetchAndRenderMiniVix() {
      const cur = getAllWatchlistItems().find(s => s.id === selectedSymbolId) || { code: 'TAIWANVIX', name: '' };
      document.getElementById('vix-canvas-title').textContent = `${cur.name} 走勢圖`;
      if (cur.code !== miniCode) { miniCode = cur.code; miniView = null; miniList = []; miniT = []; miniVw = []; }
      try {
        const resp = await fetch(`https://tv-signalr.futures-op.com/history?symbol=${encodeURIComponent(cur.code)}&resolution=1&ws=true&intraday=true`, { cache: 'no-cache' });
        if (resp.ok) {
          const json = await resp.json();
          const list = json && Array.isArray(json.bars) ? json.bars : [];
          if (list.length && cur.code === miniCode) {
            miniList = list;
            miniT = list.map(b => { const t = b.time || Date.now(); return t > 1e11 ? t : t * 1000; });
            // VWAP：無成交量時以典型價平均代替

              const h = b.high != null ? b.high : b.close, l = b.low != null ? b.low : b.close, tp = (h + l + b.close) / 3, v = b.volume > 0 ? b.volume : 0;
              cv += v; cpv += tp * v; cn++; cp += tp;
              return cv > 0 ? cpv / cv : cp / cn;
            });
          }
        }
      } catch (err) { console.error('Mini chart fetch error:', err); }
      renderMini();
    }

    function miniDayRange() {
      const cur = getAllWatchlistItems().find(s => s.id === selectedSymbolId) || {};
      let h = cur.high > 0 ? cur.high : -Infinity, l = cur.low > 0 ? cur.low : Infinity;
      if (!(h > 0 && l > 0)) { miniList.forEach(b => { h = Math.max(h, b.high != null ? b.high : b.close); l = Math.min(l, b.low != null ? b.low : b.close); }); }
      return { h, l, cost: (h + l) / 2 };
    }

    function renderMini() {
      const canvas = document.getElementById('miniVixCanvas');
      if (!canvas) return;
      const rect = canvas.parentNode.getBoundingClientRect();
      const W = rect.width, H = rect.height; if (W <= 0 || H <= 0) return;
      const dpr = window.devicePixelRatio || 1;
      if (canvas.width !== Math.round(W * dpr) || canvas.height !== Math.round(H * dpr)) { canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr); }
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);

      const n = miniList.length;
      const setChip = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v == null ? '--' : miniNum(v); };
      if (!n) { setChip('card-vwap', null); setChip('card-cost', null); return; }

      const { pl, pr, pt, pb } = MINI_GEO, gw = W - pl - pr, gh = H - pt - pb;
      const full0 = miniT[0], full1 = miniT[n - 1], fullSpan = (full1 - full0) || 1;
      const v0 = miniView ? miniView.a : full0, v1 = miniView ? miniView.b : full1, span = (v1 - v0) || 1;
      const xOf = t => pl + (t - v0) / span * gw;
      const closes = miniList.map(b => b.close);
      const { cost } = miniDayRange();

      // 可視範圍內的資料索引 (含左右各多一根，線條才不會斷)
      let i0 = 0, i1 = n - 1;
      while (i0 < n - 1 && miniT[i0 + 1] < v0) i0++;
      while (i1 > 0 && miniT[i1 - 1] > v1) i1--;
      let minP = Infinity, maxP = -Infinity;
      for (let i = i0; i <= i1; i++) {
        minP = Math.min(minP, closes[i]); maxP = Math.max(maxP, closes[i]);
        if (miniShow.vwap) { minP = Math.min(minP, miniVw[i]); maxP = Math.max(maxP, miniVw[i]); }
      }
      if (miniShow.cost && !miniView) { minP = Math.min(minP, cost); maxP = Math.max(maxP, cost); }
      if (!isFinite(minP)) return;
      const padv = ((maxP - minP) || 1) * 0.06; minP -= padv; maxP += padv;
      const range = (maxP - minP) || 1;
      const yOf = v => pt + gh - ((v - minP) / range) * gh;
      const isUp = closes[n - 1] >= closes[0];
      const lineColor = isUp ? '#f23645' : '#089981';

      // 格線與 Y 刻度
      ctx.font = '9px monospace'; ctx.lineWidth = 1; ctx.textAlign = 'left';
      const ySteps = Math.max(3, Math.min(8, Math.floor(gh / 34)));
      for (let i = 0; i <= ySteps; i++) {
        const val = minP + range * (ySteps - i) / ySteps, y = pt + gh / ySteps * i;
        ctx.strokeStyle = '#2a2e39'; ctx.beginPath(); ctx.moveTo(pl, y); ctx.lineTo(pl + gw, y); ctx.stroke();
        ctx.fillStyle = '#d1d4dc'; ctx.fillText(val.toFixed(2), pl + gw + 5, y + 3);
      }
      // X 時間刻度
      ctx.fillStyle = '#787b86'; ctx.textAlign = 'center';
      const xTicks = Math.max(2, Math.floor(gw / 70));
      for (let i = 0; i <= xTicks; i++) {
        const t = v0 + span * i / xTicks;
        ctx.fillText(miniFmtT(t), pl + gw * i / xTicks, H - 5);
      }

      // 以下內容限制在繪圖區內
      ctx.save(); ctx.beginPath(); ctx.rect(pl, pt - 2, gw, gh + 4); ctx.clip();
      const pts = []; for (let i = Math.max(0, i0); i <= i1; i++) pts.push({ x: xOf(miniT[i]), y: yOf(closes[i]), i });
      if (pts.length) {
        ctx.beginPath(); ctx.strokeStyle = lineColor; ctx.lineWidth = 1.5;
        pts.forEach((p, k) => k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke();
        ctx.lineTo(pts[pts.length - 1].x, pt + gh); ctx.lineTo(pts[0].x, pt + gh); ctx.closePath();
        const gr = ctx.createLinearGradient(0, pt, 0, pt + gh);
        gr.addColorStop(0, isUp ? 'rgba(242,54,69,.25)' : 'rgba(8,153,129,.25)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = gr; ctx.fill();
      }
      if (miniShow.cost) {            // 0.5 成本線
        ctx.setLineDash([4, 3]); ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(pl, yOf(cost)); ctx.lineTo(pl + gw, yOf(cost)); ctx.stroke(); ctx.setLineDash([]);
      }
      if (miniShow.vwap && pts.length) {   // VWAP
        ctx.strokeStyle = '#e040fb'; ctx.lineWidth = 1.3; ctx.beginPath();
        pts.forEach((p, k) => { const y = yOf(miniVw[p.i]); k ? ctx.lineTo(p.x, y) : ctx.moveTo(p.x, y); }); ctx.stroke();
      }
      // 十字線
      let hv = null;
      if (miniHoverX != null && miniHoverX >= pl && miniHoverX <= pl + gw) {
        const ht = v0 + (miniHoverX - pl) / gw * span; let bi = i0;
        for (let i = i0; i <= i1; i++) if (Math.abs(miniT[i] - ht) < Math.abs(miniT[bi] - ht)) bi = i;
        hv = bi; const hx = xOf(miniT[bi]);
        ctx.strokeStyle = '#758696'; ctx.setLineDash([3, 3]); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(hx, pt); ctx.lineTo(hx, pt + gh); ctx.stroke(); ctx.setLineDash([]);
        ctx.fillStyle = lineColor; ctx.beginPath(); ctx.arc(hx, yOf(closes[bi]), 3, 0, 7); ctx.fill();
      }
      ctx.restore();

      // 右側價格標籤 (成本 / VWAP)
      const tag = (v, col) => {
        const y = Math.max(pt + 6, Math.min(pt + gh - 6, yOf(v))), x = pl + gw + 2;
        ctx.fillStyle = col; ctx.fillRect(x, y - 6, pr - 3, 12);
        ctx.fillStyle = '#fff'; ctx.font = '9px monospace'; ctx.textAlign = 'left'; ctx.fillText(v.toFixed(2), x + 2, y + 3);
      };
      if (miniShow.cost) tag(cost, '#c27a1a');
      if (miniShow.vwap) tag(miniVw[n - 1], '#a21fb5');

      // 滑鼠懸停資訊（右上）
      ctx.font = '9px monospace'; ctx.textAlign = 'right'; ctx.fillStyle = '#d1d4dc';
      const k = hv != null ? hv : n - 1;
      ctx.fillText(`${miniFmtT(miniT[k])}  ${miniNum(closes[k])}` + (miniShow.vwap ? `  VWAP ${miniNum(miniVw[k])}` : ''), pl + gw, pt - 5);

      setChip('card-vwap', miniVw[n - 1]); setChip('card-cost', cost);
    }

    function initMiniChart() {
      const canvas = document.getElementById('miniVixCanvas'); if (!canvas) return;
      const box = canvas.parentNode; box.style.touchAction = 'none'; box.style.cursor = 'crosshair';
      const bounds = () => { const n = miniT.length; return { f0: miniT[0], f1: miniT[n - 1] }; };
      const gwOf = () => box.getBoundingClientRect().width - MINI_GEO.pl - MINI_GEO.pr;
      const curView = () => { const { f0, f1 } = bounds(); return miniView ? { a: miniView.a, b: miniView.b } : { a: f0, b: f1 }; };
      function setView(a, b) {
        if (!miniT.length) return;
        const { f0, f1 } = bounds(), full = (f1 - f0) || 1;
        const minSpan = Math.min(full, Math.max(full / 80, 3 * 60000));
        let span = Math.max(minSpan, Math.min(b - a, full));
        if (span >= full * 0.999) { miniView = null; renderMini(); return; }
        a = Math.max(f0, Math.min(a, f1 - span)); miniView = { a, b: a + span }; renderMini();
      }
      function zoomAt(x, factor) {
        const v = curView(), span = v.b - v.a, gw = gwOf(); if (gw <= 0) return;
        const ratio = Math.max(0, Math.min(1, (x - MINI_GEO.pl) / gw)), ft = v.a + span * ratio, ns = span * factor;
        setView(ft - ns * ratio, ft - ns * ratio + ns);
      }
      const relX = e => (e.touches ? e.touches[0].clientX : e.clientX) - box.getBoundingClientRect().left;

      box.addEventListener('wheel', e => { e.preventDefault(); zoomAt(relX(e), e.deltaY < 0 ? 0.8 : 1.25); }, { passive: false });
      let drag = null;
      box.addEventListener('mousedown', e => { if (e.target.closest('.mini-ctl')) return; drag = { x: e.clientX, v: curView() }; box.style.cursor = 'grabbing'; });
      window.addEventListener('mouseup', () => { drag = null; box.style.cursor = 'crosshair'; });
      window.addEventListener('mousemove', e => {
        if (drag) { const dt = -(e.clientX - drag.x) / gwOf() * (drag.v.b - drag.v.a); setView(drag.v.a + dt, drag.v.b + dt); }
      });
      box.addEventListener('mousemove', e => { miniHoverX = relX(e); if (!drag) renderMini(); });
      box.addEventListener('mouseleave', () => { miniHoverX = null; renderMini(); });
      box.addEventListener('dblclick', () => { miniView = null; renderMini(); });

      // 觸控：單指平移 / 雙指縮放
      let tch = null;
      const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
      box.addEventListener('touchstart', e => {
        const r = box.getBoundingClientRect();
        if (e.touches.length === 2) tch = { d: dist(e.touches), mid: (e.touches[0].clientX + e.touches[1].clientX) / 2 - r.left, v: curView() };
        else if (e.touches.length === 1) { tch = { x: e.touches[0].clientX, v: curView() }; miniHoverX = relX(e); }
      }, { passive: true });
      box.addEventListener('touchmove', e => {
        if (!tch) return; e.preventDefault();
        if (e.touches.length === 2 && tch.d) {
          const f = tch.d / dist(e.touches), v = tch.v, span = v.b - v.a, ratio = Math.max(0, Math.min(1, (tch.mid - MINI_GEO.pl) / gwOf())), ft = v.a + span * ratio, ns = span * f;
          setView(ft - ns * ratio, ft - ns * ratio + ns);
        } else if (e.touches.length === 1 && tch.x != null) {
          const dt = -(e.touches[0].clientX - tch.x) / gwOf() * (tch.v.b - tch.v.a); miniHoverX = relX(e); setView(tch.v.a + dt, tch.v.b + dt);

      }, { passive: false });
      box.addEventListener('touchend', () => { tch = null; miniHoverX = null; renderMini(); });

      // 按鈕：放大 / 縮小 / 重設
      const mid = () => MINI_GEO.pl + gwOf() / 2;
      document.getElementById('mini-zin').onclick = () => zoomAt(mid(), 0.7);
      document.getElementById('mini-zout').onclick = () => zoomAt(mid(), 1.4);
      document.getElementById('mini-zreset').onclick = () => { miniView = null; renderMini(); };

      // VWAP / 成本線 開關
      const syncChips = () => ['vwap', 'cost'].forEach(k => document.getElementById('chip-' + k).classList.toggle('off', !miniShow[k]));
      ['vwap', 'cost'].forEach(k => document.getElementById('chip-' + k).onclick = () => {
        miniShow[k] = !miniShow[k];
        try { localStorage.setItem('miniShow', JSON.stringify(miniShow)); } catch (e) {}
        syncChips(); renderMini();
      });
      syncChips();
      new ResizeObserver(renderMini).observe(box);
      setInterval(renderMini, 2000);                 // 報價更新 → 成本線跟著動
      setInterval(fetchAndRenderMiniVix, 15000);     // 定時更新走勢資料（縮放狀態保留）
    }
    document.addEventListener('DOMContentLoaded', initMiniChart);

    /* 左右面板寬度調整 (同時支援 Mouse 及 Touch) */
    function initPanelResizer() {
      const resizer = document.getElementById('panel-resizer');
      const panelWrapper = document.getElementById('watchlist-wrapper');
      if (!resizer) return;

      let isResizing = false;
      let startX = 0;

      const onStart = (clientX) => {
        isResizing = true;
        startX = clientX;

      const onMove = (clientX) => {

        if (chart) {

      };

      const onEnd = () => {
        if (!isResizing) return;

        document.body.style.cursor = '';
      };

      resizer.addEventListener('mousedown', (e) => {

        const handleMouseUp = () => {
          onEnd();

    /* 下方詳細面板上下高度拖曳調整 (支援 Touch + Mouse，阻止畫面被拖動) */

      const handleEnd = () => {
        if (!isResizing) return;

      // Mouse 事件
      resizer.addEventListener('mousedown', (e) => {
        e.preventDefault();

        const onMouseMove = (e) => handleMove(e.clientY);
        const onMouseUp = () => {
          handleEnd();
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);

        document.addEventListener('mousemove', onMouseMove);
        document.addEventListener('mouseup', onMouseUp);

      // Touch 觸控事件 (手機版專用，徹底阻擋穿透與頁面滾動)
      resizer.addEventListener('touchstart', (e) => {

          e.stopPropagation();

          e.preventDefault();

          handleMove(e.touches[0].clientY);

    }

/* ===================== TradingView 風格擴充 =====================
