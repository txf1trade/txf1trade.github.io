<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>股期監控-吸附懸浮版</title>
    <style>
        :root {
            --bg-black: #121212;
            --text-main: #e0e0e0;
            --text-dim: #f3e859; 
            --up-red: #ff3b30;
            --down-green: #34c759;
            --accent: #64ffda;
            --ai-gold: #ffcc00;
            --aistock-gold: #ff0098;
            --surface: #1e1e1e;
            --fav-star: #ffcc00;
            --section-bg: #252525;
        }

        html, body { background-color: var(--bg-black); margin: 0; padding: 0; color: var(--text-main); font-family: -apple-system, "PingFang TC", sans-serif; overflow-x: hidden; width: 100%; height: 100%; }
        .app-wrapper { width: 100%; max-width: 600px; margin: 0 auto; min-height: 100vh; padding-bottom: 60px; }

        /* 頂部導覽 */
        .sticky-top { position: sticky; top: 0; background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px); z-index: 100; padding: 4px; border-bottom: 1px solid #333; }
        .mode-header { display: flex; gap: 2px; margin-bottom: 4px; }
        .mode-btn { flex: 1; padding: 10px 0; text-align: center; font-size: 11px; font-weight: bold; border-radius: 4px; border: 1px solid #333; cursor: pointer; background: #111; color: var(--text-dim); }
        .mode-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(100, 255, 218, 0.1); }
        #search-input { width: 100%; background: #222; border: 1px solid #444; border-radius: 4px; padding: 10px; color: #fff; font-size: 15px; outline: none; box-sizing: border-box; }

        /* 吸附式懸浮按鈕 */
        #fab-ball { 
            position: fixed; bottom: 100px; right: 10px; width: 48px; height: 48px; 
            background: var(--accent); color: #000; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; font-size: 24px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.6); cursor: pointer; z-index: 1000;
            touch-action: none; transition: transform 0.1s;
        }
        
        /* 過濾視窗 - 靠邊彈出 */
        .filter-popup { 
            position: fixed; background: var(--surface); 
            border: 1px solid #444; border-radius: 12px; padding: 15px; width: 200px;
            display: none; flex-direction: column; gap: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.9);
            z-index: 1001; pointer-events: auto;
        }
        .filter-popup.show { display: flex; }
        .filter-item { display: flex; align-items: center; justify-content: space-between; font-size: 15px; }
        .filter-item input[type=checkbox] { width: 20px; height: 20px; accent-color: var(--accent); }

        /* 表格樣式 (保持一致) */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { color: var(--text-dim); font-size: 10px; padding: 10px 2px; border-bottom: 1px solid #333; text-align: right; cursor: pointer; }
        th:nth-child(1) { text-align: left; width: 30%; padding-left: 8px; } 
        .section-header { background: var(--section-bg); color: var(--accent); font-size: 11px; font-weight: bold; padding: 6px 10px; text-align: left; border-left: 3px solid var(--accent); }
        td { padding: 8px 2px; border-bottom: 1px solid #1a1a1a; text-align: right; vertical-align: middle; }
        .name-col { text-align: left; padding-left: 8px; }
        .row-id { display: flex; align-items: center; gap: 4px; line-height: 1.1; }
        .fav-star { cursor: pointer; font-size: 14px; color: #444; }
        .fav-star.active { color: var(--fav-star); }
        .stock-num { font-size: 12px; color: #fff; font-weight: bold; font-family: monospace; }
        .stock-id-tag { font-size: 9px; color: var(--accent); background: #222; padding: 0 2px; border-radius: 2px; }
        .stock-name { font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 90px; }
        .mkt-tag { font-size: 9px; padding: 0 2px; border-radius: 2px; border: 1px solid #555; font-weight: bold; min-width: 14px; text-align: center; }
        .tag-otc { color: #ff7fe5; border-color: #ff7fe5; }
        .tag-etf { color: #00e5ff; border-color: #00e5ff; }
        .price-val { font-weight: bold; font-family: monospace; font-size: 13px; color: #fff; }
        .fut-price-val { font-weight: bold; font-family: monospace; font-size: 13px; color: var(--accent); }
        .chg-val { font-size: 11px; font-family: monospace; font-weight: 800; }
        .score-val { font-weight: 700; font-family: monospace; font-size: 12px; }
        .score-bar { height: 2px; background: #222; margin-top: 2px; width: 100%; position: relative; }
        .score-fill { height: 100%; position: absolute; right: 0; }

        #timer-display { position: fixed; top: 12px; right: 10px; font-family: monospace; color: var(--accent); font-size: 10px; z-index: 101; pointer-events: none; }
        #ai-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center; }
        .modal-content { background: var(--surface); width: 85%; max-width: 350px; padding: 20px; border-radius: 12px; border: 1px solid var(--ai-gold); }
    </style>
</head>
<body>

<div id="timer-display">5.0s</div>

<div id="fab-ball">⚙️</div>

<div id="filter-popup" class="filter-popup">
    <div style="font-size: 13px; color: var(--text-dim); border-bottom: 1px solid #444; padding-bottom: 6px; margin-bottom: 4px;">🎯 過濾顯示設定</div>
    <label class="filter-item">上市股票 <input type="checkbox" id="show-tse" checked></label>
    <label class="filter-item">上櫃股票 <input type="checkbox" id="show-otc" checked></label>
    <label class="filter-item">ETF 標的 <input type="checkbox" id="show-etf"></label>
    <label class="filter-item">僅看小型 <input type="checkbox" id="mini-only"></label>
    <div style="margin-top: 4px;">
        <div id="rank-val" style="font-size:12px; margin-bottom:4px;">顯示數量: 10名</div>
        <input type="range" id="rank-slider" min="10" max="240" step="10" value="10" style="width:100%; accent-color:var(--accent);">
    </div>
</div>

<div id="ai-modal" onclick="closeAI()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 id="ai-title" style="color:var(--ai-gold); margin: 0 0 20px 0; text-align: center;">🤖 標題檢索</h3>
        <div style="display: flex; gap: 10px;">
            <a id="link-news" href="#" target="_blank" style="flex:1; padding: 12px; text-align:center; background:#4285f4; color:#fff; border-radius:8px; text-decoration:none; font-weight:bold;">題材新聞</a>
            <a id="link-wantgoo" href="#" target="_blank" style="flex:1; padding: 12px; text-align:center; background:#d32f2f; color:#fff; border-radius:8px; text-decoration:none; font-weight:bold;">主力籌碼</a>
        </div>
    </div>
</div>

<div class="app-wrapper">
    <div class="sticky-top">
        <div class="mode-header" id="mode-selector">
            <div class="mode-btn" data-mode="all">全部</div>
            <div class="mode-btn" data-mode="up">多頭</div>
            <div class="mode-btn" data-mode="down">空頭</div>
            <div class="mode-btn" data-mode="strong_buy">🔥強勢</div>
            <div class="mode-btn active" data-mode="ai_long">💎AI潛力</div>
            <div class="mode-btn" data-mode="fav">★自選股</div>
        </div>
        <input type="text" id="search-input" placeholder="搜尋代碼、名稱...">
    </div>

    <table>
        <thead>
            <tr>
                <th onclick="setSort('num')">代碼/名稱</th>
                <th onclick="setSort('chg')">現價/幅</th>
                <th onclick="setSort('fChg')">股期/幅</th>
                <th>近月</th>
                <th>遠月</th> 
                <th onclick="setSort('total')">總分 ▼</th>
            </tr>
        </thead>
        <tbody id="main-table"></tbody>
    </table>
</div>

    let cachedData = [];

    const mainTable = document.getElementById('main-table');

    // --- 吸附懸浮球邏輯 ---
    let isDragging = false;
    let startX, startY;

    fab.addEventListener('touchstart', (e) => {
        isDragging = true;
        startX = e.touches[0].clientX - fab.offsetLeft;
        startY = e.touches[0].clientY - fab.offsetTop;
        fab.style.transition = 'none';
    });

    document.addEventListener('touchmove', (e) => {
        if (!isDragging) return;
        let x = e.touches[0].clientX - startX;
        let y = e.touches[0].clientY - startY;
        // 限制在螢幕內
        x = Math.max(0, Math.min(window.innerWidth - 48, x));
        y = Math.max(0, Math.min(window.innerHeight - 48, y));
        fab.style.left = x + 'px';
        fab.style.top = y + 'px';
    });

    document.addEventListener('touchend', () => {
        if (!isDragging) return;
        isDragging = false;
        fab.style.transition = 'all 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28)';
        const centerX = window.innerWidth / 2;
        const currentX = parseInt(fab.style.left) + 24;
        
        if (currentX < centerX) {
            fab.style.left = '10px'; // 靠左
        } else {
            fab.style.left = (window.innerWidth - 58) + 'px'; // 靠右
        }
    });

    // 點擊懸浮球打開過濾器
    fab.addEventListener('click', (e) => {
        e.stopPropagation();
        if (popup.classList.contains('show')) {
            popup.classList.remove('show');
        } else {
            // 計算彈窗位置
            const rect = fab.getBoundingClientRect();
            popup.style.top = (rect.top - 200) + 'px';
            popup.style.left = (rect.left < window.innerWidth/2) ? '10px' : (window.innerWidth - 210) + 'px';
            popup.classList.add('show');
        }
    });

    // 點擊外部關閉
    document.addEventListener('click', (e) => {
        if (!popup.contains(e.target) && e.target !== fab) {
            popup.classList.remove('show');
        }
    });

    // --- 核心資料邏輯 ---
    async function fetchData() {
        try {
            const res = await fetch('https://market-data-api.futures-ai.com/stkfut_tradeinfo/');
            const data = await res.json();
            cachedData = Object.keys(data).filter(k => stockMap[k]).map(k => {
                const [num, name, mkt] = stockMap[k];
                const near = data[k].near_month || 0, far = data[k].next_month || 0, total = near + far;
                const prev = cachedData.find(o => o.id === k);
                return {
                    id: k, num, name, mkt, near, far, total,
                    isLong: total >= 15 && near >= 5 && far >= 0,
                    price: prev?.price || '--', chg: prev?.chg || '0.00%',
                    fPrice: prev?.fPrice || '--', fChg: prev?.fChg || '0.00%'
                };
            });
            render();
            updatePrices();
        } catch(e) {}
    }

    async function updatePrices() {
        const targets = [...cachedData].sort((a,b)=>b.total-a.total).slice(0, 240);
        await Promise.all(targets.map(async (item) => {
            try {
                const [hRes, fRes] = await Promise.all([
                    fetch(`https://tvapi.futures-op.com/v2/history?agent=futuresai&symbol=${item.num}&resolution=1m`),
                    fetch(`https://tvapi.futures-op.com/v2/history?agent=futuresai&symbol=${item.id}-1&resolution=1m`)
                ]);
                const h = await hRes.json();
                if(h.s === "ok") {
                    item.price = h.c[h.c.length-1];
                    item.chg = ((item.price - h.o[0])/h.o[0]*100).toFixed(2) + '%';
                }
                const f = await fRes.json();
                if(f.s === "ok") {
                    item.fPrice = f.c[f.c.length-1];
                    item.fChg = ((item.fPrice - f.o[0])/f.o[0]*100).toFixed(2) + '%';
                }
                refreshRow(item);
            } catch(e){}
        }));
    }

    function refreshRow(item) {
        const row = mainTable.querySelector(`tr[data-id="${item.id}"]`);
        if (!row) return;
        const pCell = row.cells[1], fCell = row.cells[2];
        const pChgV = parseFloat(item.chg), fChgV = parseFloat(item.fChg);
        pCell.style.backgroundColor = pChgV > 0 ? `rgba(255,59,48,${Math.min(pChgV/10, 0.4)})` : (pChgV < 0 ? `rgba(52,199,89,${Math.min(Math.abs(pChgV)/10, 0.4)})` : 'transparent');
        fCell.style.backgroundColor = fChgV > 0 ? `rgba(255,59,48,${Math.min(fChgV/10, 0.4)})` : (fChgV < 0 ? `rgba(52,199,89,${Math.min(Math.abs(fChgV)/10, 0.4)})` : 'transparent');
        row.querySelector('.price-val').innerText = item.price;
        row.querySelector('.p-chg').innerText = item.chg;
        row.querySelector('.fut-price-val').innerText = item.fPrice;
        row.querySelector('.f-chg').innerText = item.fChg;
    }

    function setSort(key) { currentSort = key; render(); }

    function render() {
        const q = document.getElementById('search-input').value.toLowerCase();
        const showTse = document.getElementById('show-tse').checked;
        const showOtc = document.getElementById('show-otc').checked;
        const showEtf = document.getElementById('show-etf').checked;
        const miniOnly = document.getElementById('mini-only').checked;
        const limit = parseInt(document.getElementById('rank-slider').value);

        let filtered = cachedData.filter(i => {
            if (i.mkt === '市' && !showTse) return false;
            if (i.mkt === '櫃' && !showOtc) return false;
            if (i.mkt === 'ETF' && !showEtf) return false;
            if (miniOnly && !i.name.includes('小型')) return false;
            if (q) return i.num.includes(q) || i.name.includes(q) || i.id.toLowerCase().includes(q);
            return true;
        });

        if (!q) {
            if (currentMode === 'ai_long') filtered = filtered.filter(i => i.isLong);
            else if (currentMode === 'up') filtered = filtered.filter(i => i.total > 0);
            else if (currentMode === 'down') filtered = filtered.filter(i => i.total < 0);
            else if (currentMode === 'strong_buy') filtered = filtered.filter(i => i.total >= 10);
            else if (currentMode === 'fav') filtered = filtered.filter(i => favList.includes(i.id));
        }

        filtered.sort((a,b) => {
            if (currentSort === 'num') return a.num.localeCompare(b.num);
            if (currentSort === 'chg') return parseFloat(b.chg) - parseFloat(a.chg);
            if (currentSort === 'fChg') return parseFloat(b.fChg) - parseFloat(a.fChg);
            return b.total - a.total;
        });

        const displayList = q ? filtered : filtered.slice(0, limit);
        const favs = displayList.filter(i => favList.includes(i.id));
        const nonFavs = displayList.filter(i => !favList.includes(i.id));

        let html = "";
        if (favs.length > 0) {
            html += `<tr><td colspan="6" class="section-header">★ 已收藏 (${favs.length})</td></tr>`;
            html += favs.map(i => rowHtml(i)).join('');
        }
        if (nonFavs.length > 0) {
            const title = q ? `🔍 搜尋結果 (${nonFavs.length})` : `📊 市場監控 (${nonFavs.length})`;
            html += `<tr><td colspan="6" class="section-header">${title}</td></tr>`;
            html += nonFavs.map(i => rowHtml(i)).join('');
        }
        mainTable.innerHTML = html;
    }

    function rowHtml(i) {
        const isFav = favList.includes(i.id), scoreColor = i.total >= 0 ? 'var(--up-red)' : 'var(--down-green)';
        const mktClass = i.mkt === '櫃' ? 'tag-otc' : (i.mkt === 'ETF' ? 'tag-etf' : '');
        const pChgV = parseFloat(i.chg), fChgV = parseFloat(i.fChg);
        const pBg = pChgV > 0 ? `rgba(255,59,48,${Math.min(pChgV/10, 0.4)})` : (pChgV < 0 ? `rgba(52,199,89,${Math.min(Math.abs(pChgV)/10, 0.4)})` : 'transparent');
        const fBg = fChgV > 0 ? `rgba(255,59,48,${Math.min(fChgV/10, 0.4)})` : (fChgV < 0 ? `rgba(52,199,89,${Math.min(Math.abs(fChgV)/10, 0.4)})` : 'transparent');

        return `<tr data-id="${i.id}">
            <td class="name-col">
                <div class="row-id"><span class="fav-star ${isFav?'active':''}" onclick="toggleFav('${i.id}', event)">${isFav?'★':'☆'}</span><span class="stock-num">${i.num}</span><span class="stock-id-tag">${i.id}</span></div>
                <div class="row-name"><span class="mkt-tag ${mktClass}">${i.mkt}</span><span class="stock-name" style="color:${i.isLong?'var(--aistock-gold)':'#fff'}" onclick="showAI('${i.num}','${i.name}')">${i.name}</span></div>
            </td>
            <td style="background-color:${pBg}"><div class="price-val">${i.price}</div><div class="chg-val p-chg" style="color:${Math.abs(pChgV)>0?'#fff':'#888'}">${i.chg}</div></td>
            <td style="background-color:${fBg}"><div class="fut-price-val">${i.fPrice}</div><div class="chg-val f-chg" style="color:${Math.abs(fChgV)>0?'#fff':'#888'}">${i.fChg}</div></td>
            <td><span class="score-val" style="color:${i.near>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(i.near)}</span></td>
            <td><span class="score-val" style="color:${i.far>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(i.far)}</span></td>
            <td><span class="score-val" style="color:${scoreColor}">${Math.round(i.total)}</span><div class="score-bar"><div class="score-fill" style="width:${Math.min(Math.abs(i.total)*4, 100)}%; background:${scoreColor}; ${i.total<0?'left:0;right:auto;':'right:0;'}"></div></div></td>
        </tr>`;
    }

    function toggleFav(id, e) {
        e.stopPropagation();
        const idx = favList.indexOf(id);
        idx > -1 ? favList.splice(idx, 1) : favList.push(id);
        localStorage.setItem('stk_favs_v2', JSON.stringify(favList));
        render();
    }

    function showAI(n, nm) {
        const pure = nm.replace('期','').replace('小型','').trim();
        document.getElementById('ai-title').innerText = `🤖 ${pure} (${n})`;
        document.getElementById('link-news').href = `https://www.google.com/search?q=${n}+${pure}+新聞`;

    setInterval(() => {
        refreshCounter--;
        document.getElementById('timer-display').innerText = (refreshCounter/10).toFixed(1) + 's';

"SYF": ["3680", "家登期", "櫃"], "SZF": ["3680", "小型家登期", "市"], "UAF": ["1503", "士電期", "市"], "UBF": ["6139", "亞翔期", "市"], "UCF": ["6188", "廣明期", "櫃"], "UEF": ["5876", "上海商銀期", "市"], "UFF": ["6505", "台塑化期", "市"], "UGF": ["6526", "達發期", "市"], "UIF": ["6526", "小型達發期", "市"], "UMF": ["3661", "世芯-KY期", "市"], "UOF": ["3661", "小型世芯-KY期", "市"], "UPF": ["6472", "保瑞期", "市"], "UQF": ["6472", "小型保瑞期", "市"], "UTF": ["2486", "一詮期", "市"], "UUF": ["6757", "台灣虎航期", "市"], "UVF": ["6223", "旺矽期", "櫃"], "UWF": ["6223", "小型旺矽期", "櫃"], "UXF": ["2329", "華泰期", "市"], "UYF": ["6290", "良維期", "櫃"], "VAF": ["1608", "華榮期", "市"], "VBF": ["2367", "燿華期", "市"], "VCF": ["2421", "建準期", "市"] }; 

    let cachedData = [];
    let favList = JSON.parse(localStorage.getItem('stk_favs_v2') || '[]');
    let currentMode = 'ai_long';
    let currentSort = 'total'; 
    let isFetching = false;
    let refreshCounter = 50;

    const mainTable = document.getElementById('main-table');

    async function fetchData() {
        if (isFetching) return;
        isFetching = true;
        try {
            const res = await fetch('https://market-data-api.futures-ai.com/stkfut_tradeinfo/');
            const data = await res.json();
            if (!data) return;

            const newList = Object.keys(data).filter(k => stockMap[k]).map(k => {
                const [num, name, mkt] = stockMap[k];
                const near = data[k].near_month || 0;
                const far = data[k].next_month || 0;
                const total = near + far;
                const prev = cachedData.find(o => o.id === k);
                return {
                    id: k, num, name, mkt, near, far, total,
                    isLong: total >= 15 && near >= 5 && far >= 0,
                    price: prev?.price || '--', chg: prev?.chg || '0.00%',
                    fPrice: prev?.fPrice || '--', fChg: prev?.fChg || '0.00%'
                };
            });

            cachedData = newList;
            render();
            updatePrices();
        } catch(e) { console.error(e); } finally { isFetching = false; }
    }

    async function updatePrices() {
        const targets = [...cachedData].sort((a,b)=>b.total-a.total).slice(0, 240);
        await Promise.all(targets.map(async (item) => {
            try {
                const [hRes, fRes] = await Promise.all([
                    fetch(`https://tvapi.futures-op.com/v2/history?agent=futuresai&symbol=${item.num}&resolution=1m`),
                    fetch(`https://tvapi.futures-op.com/v2/history?agent=futuresai&symbol=${item.id}-1&resolution=1m`)
                ]);
                const h = await hRes.json();
                if(h.s === "ok") {
                    item.price = h.c[h.c.length-1];
                    item.chg = ((item.price - h.o[0])/h.o[0]*100).toFixed(2) + '%';
                }
                const f = await fRes.json();
                if(f.s === "ok") {
                    item.fPrice = f.c[f.c.length-1];
                    item.fChg = ((item.fPrice - f.o[0])/f.o[0]*100).toFixed(2) + '%';
                }
                refreshRow(item);
            } catch(e){}
        }));
    }

    function refreshRow(item) {
        const row = mainTable.querySelector(`tr[data-id="${item.id}"]`);
        if (!row) return;
        
        const pCell = row.cells[1];
        const pChgVal = parseFloat(item.chg);
        pCell.style.backgroundColor = pChgVal > 0 ? `rgba(255,59,48,${Math.min(pChgVal/10, 0.4)})` : (pChgVal < 0 ? `rgba(52,199,89,${Math.min(Math.abs(pChgVal)/10, 0.4)})` : 'transparent');
        
        const fCell = row.cells[2];
        const fChgVal = parseFloat(item.fChg);
        fCell.style.backgroundColor = fChgVal > 0 ? `rgba(255,59,48,${Math.min(fChgVal/10, 0.4)})` : (fChgVal < 0 ? `rgba(52,199,89,${Math.min(Math.abs(fChgVal)/10, 0.4)})` : 'transparent');

        const pVal = row.querySelector('.price-val');
        const pChg = row.querySelector('.p-chg');
        const fVal = row.querySelector('.fut-price-val');
        const fChg = row.querySelector('.f-chg');

        if(pVal) pVal.innerText = item.price;
        if(pChg) pChg.innerText = item.chg;
        if(fVal) fVal.innerText = item.fPrice;
        if(fChg) fChg.innerText = item.fChg;
    }

    function setSort(key) {
        currentSort = key;
        render();
    }

    function render() {
        const q = document.getElementById('search-input').value.toLowerCase();
        const showTse = document.getElementById('show-tse').checked;
        const showOtc = document.getElementById('show-otc').checked;
        const showEtf = document.getElementById('show-etf').checked;
        const miniOnly = document.getElementById('mini-only').checked;
        const limit = parseInt(document.getElementById('rank-slider').value);

        let filtered = cachedData.filter(i => {
            if (i.mkt === '市' && !showTse) return false;
            if (i.mkt === '櫃' && !showOtc) return false;
            if (i.mkt === 'ETF' && !showEtf) return false;
            if (miniOnly && !i.name.includes('小型')) return false;
            if (q) return i.num.includes(q) || i.name.includes(q) || i.id.toLowerCase().includes(q);
            return true;
        });

        if (!q) {
            if (currentMode === 'ai_long') filtered = filtered.filter(i => i.isLong);
            else if (currentMode === 'up') filtered = filtered.filter(i => i.total > 0);
            else if (currentMode === 'down') filtered = filtered.filter(i => i.total < 0);
            else if (currentMode === 'strong_buy') filtered = filtered.filter(i => i.total >= 10);
            else if (currentMode === 'fav') filtered = filtered.filter(i => favList.includes(i.id));
        }

        filtered.sort((a,b) => {
            if (currentSort === 'num') return a.num.localeCompare(b.num);
            if (currentSort === 'chg') return parseFloat(b.chg) - parseFloat(a.chg);
            if (currentSort === 'fChg') return parseFloat(b.fChg) - parseFloat(a.fChg);
            return b.total - a.total;
        });

        const displayList = q ? filtered : filtered.slice(0, limit);
        
        // 渲染邏輯：區分自選與非自選
        const favs = displayList.filter(i => favList.includes(i.id));
        const nonFavs = displayList.filter(i => !favList.includes(i.id));

        let html = "";
        if (favs.length > 0) {
            html += `<tr><td colspan="6" class="section-header">★ 自選股 (${favs.length})</td></tr>`;
            html += favs.map(i => rowHtml(i)).join('');
        }
        if (nonFavs.length > 0) {
            const title = q ? `🔍 搜尋結果 (未收藏: ${nonFavs.length})` : `📊 監控清單 (${nonFavs.length})`;
            html += `<tr><td colspan="6" class="section-header">${title}</td></tr>`;
            html += nonFavs.map(i => rowHtml(i)).join('');
        }
        
        mainTable.innerHTML = html;
    }

    function rowHtml(i) {
        const isFav = favList.includes(i.id);
        const scoreColor = i.total >= 0 ? 'var(--up-red)' : 'var(--down-green)';
        const mktClass = i.mkt === '櫃' ? 'tag-otc' : (i.mkt === 'ETF' ? 'tag-etf' : '');
        const pChgV = parseFloat(i.chg);
        const fChgV = parseFloat(i.fChg);
        const pBg = pChgV > 0 ? `rgba(255,59,48,${Math.min(pChgV/10, 0.4)})` : (pChgV < 0 ? `rgba(52,199,89,${Math.min(Math.abs(pChgV)/10, 0.4)})` : 'transparent');
        const fBg = fChgV > 0 ? `rgba(255,59,48,${Math.min(fChgV/10, 0.4)})` : (fChgV < 0 ? `rgba(52,199,89,${Math.min(Math.abs(fChgV)/10, 0.4)})` : 'transparent');

        return `<tr data-id="${i.id}">
            <td class="name-col">
                <div class="row-id">
                    <span class="fav-star ${isFav?'active':''}" onclick="toggleFav('${i.id}', event)">${isFav?'★':'☆'}</span>
                    <span class="stock-num">${i.num}</span>
                    <span class="stock-id-tag">${i.id}</span>
                </div>
                <div class="row-name">
                    <span class="mkt-tag ${mktClass}">${i.mkt}</span>
                    <span class="stock-name" style="color:${i.isLong?'var(--aistock-gold)':'#fff'}" onclick="showAI('${i.num}','${i.name}')">${i.name}</span>
                </div>
            </td>
            <td style="background-color:${pBg}"><div class="price-val">${i.price}</div><div class="chg-val p-chg" style="color:${Math.abs(pChgV)>0?'#fff':'#888'}">${i.chg}</div></td>
            <td style="background-color:${fBg}"><div class="fut-price-val">${i.fPrice}</div><div class="chg-val f-chg" style="color:${Math.abs(fChgV)>0?'#fff':'#888'}">${i.fChg}</div></td>
            <td><span class="score-val" style="color:${i.near>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(i.near)}</span></td>
            <td><span class="score-val" style="color:${i.far>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(i.far)}</span></td>
            <td>
                <span class="score-val" style="color:${scoreColor}">${Math.round(i.total)}</span>
                <div class="score-bar"><div class="score-fill" style="width:${Math.min(Math.abs(i.total)*4, 100)}%; background:${scoreColor}; ${i.total<0?'left:0;right:auto;':'right:0;'}"></div></div>
            </td>
        </tr>`;
    }

    function toggleFav(id, e) {
        e.stopPropagation();
        const idx = favList.indexOf(id);
        idx > -1 ? favList.splice(idx, 1) : favList.push(id);
        localStorage.setItem('stk_favs_v2', JSON.stringify(favList));
        render();
    }

    function showAI(n, nm) {
        const pure = nm.replace('期','').replace('小型','').trim();
        document.getElementById('ai-title').innerText = `🤖 ${pure} (${n})`;
        document.getElementById('link-news').href = `https://www.google.com/search?q=${n}+${pure}+新聞`;
        document.getElementById('link-wantgoo').href = `https://www.wantgoo.com/stock/${n}`;
        document.getElementById('ai-modal').style.display = 'flex';
    }
    function closeAI() { document.getElementById('ai-modal').style.display = 'none'; }

    document.getElementById('mode-selector').onclick = e => { if(e.target.dataset.mode) { currentMode = e.target.dataset.mode; document.querySelectorAll('.mode-btn').forEach(b=>b.classList.toggle('active', b===e.target)); render(); }};
    document.getElementById('search-input').oninput = render;
    document.getElementById('rank-slider').oninput = function() { document.getElementById('rank-val').innerText = this.value + '名'; render(); };
    document.querySelectorAll('input[type=checkbox]').forEach(c => c.onchange = render);

    setInterval(() => {
        refreshCounter--;
        document.getElementById('timer-display').innerText = (refreshCounter/10).toFixed(1) + 's';
        if(refreshCounter <= 0) { refreshCounter = 50; fetchData(); }
    }, 100);

    fetchData();
</script>

            --ai-gold: #ffcc00;
            --aistock-gold: #ff0098;
            --surface: #1e1e1e;
            --fav-star: #ffcc00;
        }

        html, body {
            background-color: var(--bg-black);
            margin: 0; padding: 0;
            min-height: 100%;
            -webkit-overflow-scrolling: touch;
            color: var(--text-main);
            font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; justify-content: center;
        }

        .app-wrapper { 
            width: 100%; max-width: 550px; background: var(--bg-black); 
            min-height: 100vh; padding-bottom: 40px; box-sizing: border-box;
            position: relative;
        }

        .sticky-top {
            position: sticky; top: 0; background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px); z-index: 100; padding: 4px 2px;
            border-bottom: 1px solid #333;
        }

        .mode-header { display: flex; gap: 2px; margin-bottom: 4px; }
        .mode-btn {
            flex: 1; padding: 8px 1px; text-align: center; font-size: 11px;
            font-weight: bold; border-radius: 4px; border: 1px solid #333;
            cursor: pointer; background: #111; color: var(--text-dim);
            white-space: nowrap;
        }
        .mode-btn.active[data-mode="all"] { border-color: var(--accent); color: var(--accent); background: rgba(100, 255, 218, 0.1); }
        .mode-btn.active[data-mode="up"] { border-color: var(--up-red); color: var(--up-red); background: rgba(255, 59, 48, 0.1); }
        .mode-btn.active[data-mode="down"] { border-color: var(--down-green); color: var(--down-green); background: rgba(52, 199, 89, 0.1); }
        .mode-btn.active[data-mode="strong_buy"] { border-color: var(--strong-blue); color: var(--strong-blue); background: rgba(0, 229, 255, 0.1); }
        .mode-btn.active[data-mode="ai_long"] { border-color: var(--ai-gold); color: var(--ai-gold); background: rgba(255, 204, 0, 0.1); }
        .mode-btn.active[data-mode="fav"] { border-color: var(--fav-star); color: var(--fav-star); background: rgba(255, 204, 0, 0.1); }

        .search-row { padding: 4px; position: relative; display: flex; align-items: center; }
        #search-input {
            width: 100%; background: #222; border: 1px solid #444; border-radius: 4px;
            padding: 6px 8px; padding-right: 32px; color: #fff; font-size: 15px; 
            box-sizing: border-box; outline: none;
        }
        #clear-search {
            position: absolute; right: 12px; color: #888; cursor: pointer; 
            display: none; font-size: 18px; line-height: 1;
        }

        .fav-chips-wrapper {
            padding: 4px; overflow-x: auto; white-space: nowrap;
            display: none; border-bottom: 1px solid #222;
        }
        .chip {
            display: inline-block; padding: 3px 10px; margin-right: 6px;
            border-radius: 12px; background: #222; color: #888;
            font-size: 11px; border: 1px solid #333; cursor: pointer;
        }
        .chip.active { background: rgba(255, 204, 0, 0.15); color: var(--ai-gold); border-color: var(--ai-gold); }

        .controls-row { display: flex; align-items: center; gap: 3px; background: var(--surface); padding: 4px 6px; border-radius: 4px; overflow: hidden; }
        .filter-toggle { display: flex; align-items: center; gap: 2px; font-size: 10px; color: var(--accent); white-space: nowrap; cursor: pointer; }
        .slider-box { flex: 1; display: flex; align-items: center; gap: 4px; margin: 0 4px; }
        input[type=range] { width: 100%; height: 3px; accent-color: var(--accent); }
        #rank-val { color: #fff; min-width: 40px; font-size: 10px; font-weight: bold; }
        #timer-display { font-family: monospace; color: var(--accent); font-size: 9px; margin-left: auto; }
        #refresh-bar { position: absolute; bottom: 0; left: 0; height: 1.5px; background: var(--accent); width: 0%; }

        .heatmap-container { margin: 5px 0; }
        .heatmap-header {
            font-size: 12px; color: var(--ai-gold); background: #252525;
            padding: 8px 10px; border-radius: 4px; display: flex;
            justify-content: space-between; align-items: center;
            cursor: pointer; border: 1px solid #333;
        }
        .heatmap-grid {
            display: none; grid-template-columns: repeat(5, 1fr);
            gap: 3px; margin-top: 5px; padding: 2px;
        }
        .heatmap-container.open .heatmap-grid { display: grid; }
        .hm-box {
            height: 35px; border-radius: 3px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
        }
        .hm-name { font-size: 9px; color: #fff; font-weight: bold; }
        .hm-score { font-size: 9px; color: #fff; opacity: 0.9; }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { color: var(--text-dim); font-size: 10px; padding: 6px 2px; border-bottom: 1px solid #333; cursor: pointer; user-select: none; }
        th:nth-child(1) { text-align: left; width: 30%; padding-left: 6px; } 
        td { padding: 4px 2px; border-bottom: 1px solid #1a1a1a; text-align: right; }
        
        /* 名稱欄位緊湊結構 */
        .name-col { text-align: left; padding-left: 6px; }
        .row-top { display: flex; align-items: center; gap: 4px; line-height: 1.2; }
        .row-bottom { display: flex; align-items: center; gap: 4px; margin-top: 1px; line-height: 1.2; }

        .fav-star-btn { cursor: pointer; font-size: 15px; color: #444; user-select: none; }
        .fav-star-btn.active { color: var(--fav-star); }

        .stock-num { font-size: 12px; color: #fff; font-family: monospace; font-weight: bold; }
        .stock-id-tag { font-size: 9px; color: var(--accent); background: #222; padding: 0 2px; border-radius: 2px; }
        
        .stock-name { font-weight: 500; font-size: 12px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mkt-tag { font-size: 8px; padding: 0px 2px; border-radius: 2px; font-weight: bold; height: 12px; display: flex; align-items: center; }
        .tag-tse { color: #fff; border: 1px solid #555; }
        .tag-otc { color: #ff7fe5; border: 1px solid #ff7fe5; }

        .price-val { font-weight: bold; font-family: monospace; font-size: 13px; color: #fff; }
        .fut-price-val { font-weight: bold; font-family: monospace; font-size: 13px; color: var(--accent); }
        .chg-val { font-size: 10px; font-family: monospace; font-weight: bold; }
        .score-val { font-weight: 700; font-family: monospace; font-size: 11px; }
        
        .score-bar-bg { display: block; width: 100%; height: 2px; background: #222; margin-top: 2px; }
        .score-bar-fill { height: 100%; }
        .rank-strength-container { width: 90%; height: 6px; background: #000; border-radius: 3px; overflow: hidden; border: 1px solid #333; float: right; }
        .rank-strength-fill { height: 100%; }

        #ai-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content { background: var(--surface); width: 85%; max-width: 350px; padding: 20px; border-radius: 12px; border: 1px solid var(--ai-gold); }
    </style>
</head>
