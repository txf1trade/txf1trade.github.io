<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>期貨與股期雙區監控面板</title>
    <style>
        * { 
            box-sizing: border-box; 
        }
        body, html {
            margin: 0; 
            padding: 0; 
            height: 100%;
            overflow: hidden; 
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            background-color: #1a1a1a; 
            color: #eee;
        }

        /* 頂部頁簽按鈕容器 - 壓縮高度與邊距 */
        .nav-tabs {
            display: flex; 
            background-color: #2c2c2c;
            padding: 2px 6px 0 6px; 
            border-bottom: 2px solid #007bff;
            height: 30px;
            align-items: flex-end;
        }
        .tab-btn {
            padding: 3px 10px; 
            cursor: pointer; 
            border: none;
            background: #444; 
            color: #bbb; 
            border-radius: 4px 4px 0 0;
            margin-right: 3px; 
            font-size: 12px;
            line-height: 1.2;
            transition: 0.2s;
        }
        .tab-btn.active { 
            background: #007bff; 
            color: white; 
            font-weight: bold; 
        }

        /* 主內容區：扣除頁簽列 (30px) 的高度 */
        .content-wrapper {
            height: calc(100vh - 30px);
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* 極致壓縮型小標題欄：僅佔用極小垂直空間 */
        .section-header {
            background-color: #222222;
            color: #17a2b8;
            font-weight: bold;
            padding: 1px 6px;
            font-size: 10px;
            line-height: 1.2;
            border-bottom: 1px solid #333;
            flex-shrink: 0;
        }

        /* 上下面板 */
        .panel {
            position: relative;
            display: flex;
            flex-direction: column;
            width: 100%;
            overflow: hidden;
        }

        /* 上半部預設 50% 高度 */
        #topPanel {
            height: 50%;
            min-height: 40px;
        }

        /* 下半部自動填滿剩餘高度 */
        #bottomPanel {
            flex: 1;
            min-height: 40px;
        }

        /* iframe 填滿並無縫連結 */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background-color: #1a1a1a;
            flex-grow: 1;
            display: block;
        }

        /* 拖曳分隔線：縮至 3px */
        .resizer {
            height: 3px;
            background-color: #007bff;
            cursor: row-resize;
            transition: background-color 0.2s;
            z-index: 10;
            flex-shrink: 0;
        }
        .resizer:hover, .resizer.dragging {
            background-color: #3395ff;
        }
    </style>
</head>
<body>

    <!-- 頂部頁簽列 -->
    <div id="tabContainer" class="nav-tabs"></div>

    <!-- 下方主內容區 (上下分割) -->
    <div id="frameContainer" class="content-wrapper">
        <!-- 上半部：期貨資訊 -->
        <div class="panel" id="topPanel">
            <div class="section-header">期貨資訊</div>
            <iframe src="https://txf1trade.github.io/indexTab1.html" title="期貨資訊"></iframe>
        </div>

        <!-- 可拖曳調整高度的分隔線 -->
        <div class="resizer" id="dragBar"></div>

        <!-- 下半部：股期資訊 -->
        <div class="panel" id="bottomPanel">
            <div class="section-header">股期資訊</div>
            <iframe src="https://txf1trade.github.io/indexTab2.html" title="股期資訊"></iframe>
        </div>
    </div>

    <script>
        // 頁簽配置資料
        const config = [
            { name: "分割雙區", type: "split" },
            { name: "台指", url: "https://txf1trade.github.io/indexTab1.html" },
            { name: "股期", url: "https://txf1trade.github.io/indexTab2.html" },
            { name: "主力", url: "https://txf1trade.github.io/indexTab3.html" }
        ];

        const tabContainer = document.getElementById('tabContainer');
        const frameContainer = document.getElementById('frameContainer');

        // 初始化頂部頁簽
        function initTabs() {
            config.forEach((item, index) => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                btn.id = 'btn-' + index;
                btn.innerText = item.name;
                btn.onclick = () => switchTab(index);
                tabContainer.appendChild(btn);
            });

            // 預設選取第一個頁簽（分割雙區）
            switchTab(0);
        }

        // 切換頁簽邏輯
        function switchTab(index) {
            document.querySelectorAll('.tab-btn').forEach((b, i) => {
                b.classList.toggle('active', i === index);
            });

            const selected = config[index];

            if (selected.type === "split") {
                frameContainer.innerHTML = `
                    <div class="panel" id="topPanel">
                        <div class="section-header">期貨資訊</div>
                        <iframe src="https://txf1trade.github.io/indexTab1.html" title="期貨資訊"></iframe>
                    </div>
                    <div class="resizer" id="dragBar"></div>
                    <div class="panel" id="bottomPanel">
                        <div class="section-header">股期資訊</div>
                        <iframe src="https://txf1trade.github.io/indexTab2.html" title="股期資訊"></iframe>
                    </div>
                `;
                initResizer();
            } else {
                frameContainer.innerHTML = `
                    <iframe src="${selected.url}" style="width:100%; height:100%;"></iframe>
                `;
            }
        }

        // 滑鼠拖曳調整上下比例功能
        function initResizer() {
            const resizer = document.getElementById('dragBar');
            const topPanel = document.getElementById('topPanel');
            if (!resizer || !topPanel) return;

            let startY = 0;
            let startTopHeight = 0;

            const onMouseDown = (e) => {
                startY = e.clientY;
                startTopHeight = topPanel.getBoundingClientRect().height;

                resizer.classList.add('dragging');
                document.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = 'none');

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            };

            const onMouseMove = (e) => {
                const dy = e.clientY - startY;
                const containerHeight = frameContainer.getBoundingClientRect().height;
                let newTopHeight = startTopHeight + dy;

                const minHeight = 40;
                if (newTopHeight < minHeight) newTopHeight = minHeight;
                if (newTopHeight > containerHeight - minHeight) newTopHeight = containerHeight - minHeight;

                topPanel.style.height = `${newTopHeight}px`;
            };

            const onMouseUp = () => {
                resizer.classList.remove('dragging');
                document.querySelectorAll('iframe').forEach(ifr => ifr.style.pointerEvents = 'auto');

                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            };

            resizer.addEventListener('mousedown', onMouseDown);
        }

        initTabs();
    </script>
</body>
</html>
