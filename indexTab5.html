<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>AI期權戰情室-即時監控版</title>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22; --blue: #58a6ff;
            --red: #ff7b72; --green: #7ee787; --border: #30363d;
            --header: #21262d; --gold: #f1e05a;
            --ai-glow: rgba(88, 166, 255, 0.3);
            --vh: 1vh;
        }
        * { box-sizing: border-box; }
        html, body { 
            background: var(--bg);
            margin: 0; padding: 0; 
            min-height: 100vh;
            min-height: calc(var(--vh, 1vh) * 100);
            -webkit-overflow-scrolling: touch;
        }
        body { font-family: -apple-system, "Segoe UI", sans-serif; color: #c9d1d9; padding: 6px;
            line-height: 1.2; }
        
        .container { 
            max-width: 550px;
            margin: auto; 
            padding-bottom: calc(100px + env(safe-area-inset-bottom)); 
        }

        .index-grid { display: grid;
            grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; margin-top: 5px; }
        .index-card { background: var(--card);
            padding: 8px 2px; border-radius: 6px; border: 1px solid var(--border); text-align: center; transition: all 0.3s ease;
        }
        .index-name { font-size: 10px; color: #8b949e; margin-bottom: 4px;
        }
        .index-price { font-family: "Consolas", monospace; font-size: 15px; font-weight: 900; color: #fff;
        }
        .index-change { font-family: "Consolas", monospace; font-size: 11px; font-weight: bold; display: block;
            margin-top: 2px; }

        .basis-box { background: rgba(255,255,255,0.05); padding: 6px 10px; border-radius: 6px;
            margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border: 1px solid var(--border); font-size: 12px;
        }
        .basis-tag { padding: 2px 6px; border-radius: 4px; font-weight: bold; font-size: 11px;
        }

        table { width: 100%; border-collapse: collapse; margin-bottom: 8px; font-size: 11px; background: var(--card);
            border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
        th { background: var(--header);
            color: #8b949e; padding: 6px 2px; border: 1px solid var(--border); font-size: 10px; text-align: center;
        }
        td { padding: 8px 4px; border: 1px solid var(--border); text-align: center;
        }
        
        .section-title { 
            font-size: 14px;
            font-weight: bold; margin: 12px 0 6px 2px; color: var(--blue); 
            border-left: 4px solid var(--blue); padding-left: 8px; 
            display: flex; align-items: center;
            justify-content: space-between;
            cursor: pointer; user-select: none;
        }
        .section-title:hover { opacity: 0.9;
        }
        .toggle-arrow { font-size: 10px; margin-left: 6px; color: #8b949e; transition: transform 0.2s;
        }
        .unit-text { font-size: 10px; color: #8b949e; font-weight: normal; margin-left: auto; margin-right: 8px;
        }
        
        .collapse-content {
            max-height: 2000px;
            overflow: hidden;
            transition: max-height 0.3s ease-out, opacity 0.2s ease-out, margin-bottom 0.3s;
            margin-bottom: 8px;
        }
        .collapsed .collapse-content {
            max-height: 0 !important;
            opacity: 0;
            margin-bottom: 0 !important;
            pointer-events: none;
        }
        .collapsed .toggle-arrow { transform: rotate(-90deg);
        }
        
        .num-cell { font-family: "Consolas", "Monaco", monospace;
            font-weight: bold; }
        .pos { color: var(--red); } .neg { color: var(--green);
        }

        .retail-row { background: rgba(241, 224, 90, 0.03) !important;
        }
        .retail-text { color: var(--gold); font-weight: bold;
        }
        .retail-highlight { border: 1.5px solid var(--gold) !important; background: rgba(241, 224, 90, 0.15);
            font-size: 11px; color: var(--gold) !important; }
        
        .ai-tag { display: inline-block;
            padding: 2px 5px; border-radius: 3px; font-size: 9px; margin: 1px; font-weight: bold; color: #fff;
        }
        .tag-sell-exposure { background: var(--gold) !important; color: #000 !important; border: 1px solid #fff;
        }
        .exposure-text { color: var(--gold); font-weight: bold; font-size: 9px; margin-left: 2px;
        }
        .tag-bull { background: #da3633;
        } 
        .tag-bear { background: #238636;
        } 

        /* ===== AI 評級 UI ===== */
        .ai-box { background: linear-gradient(145deg, #1c2128, #161b22);
            border: 2px solid var(--blue); border-radius: 10px; padding: 12px; box-shadow: 0 4px 15px var(--ai-glow);
        }
        .trend-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;
            border-bottom: 1px solid var(--border); padding-bottom: 8px; }
        .trend-val { font-size: 20px; font-weight: 900;
            letter-spacing: 1px; }
        
        /* 籌碼訊號列表 */
        .signal-grid { display: grid;
            grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .signal-card { background: #0d1117;
            padding: 8px 10px; border-radius: 6px; border-left: 3px solid var(--border); }
        .signal-card.bull { border-left-color: var(--red);
        }
        .signal-card.bear { border-left-color: var(--green);
        }
        .signal-card.neutral { border-left-color: #8b949e;
        }
        .signal-card.warn { border-left-color: var(--gold);
        }
        .signal-label { font-size: 9px; color: #8b949e; margin-bottom: 3px; letter-spacing: 0.5px;
        }
        .signal-val { font-size: 11px; font-weight: bold; color: #fff; line-height: 1.4;
        }
        .signal-tag { display: inline-block; font-size: 9px; padding: 1px 5px; border-radius: 3px;
            font-weight: bold; margin-top: 2px; }
        .signal-tag.bull { background: rgba(218,54,51,0.2); color: var(--red);
        }
        .signal-tag.bear { background: rgba(35,134,54,0.2); color: var(--green);
        }
        .signal-tag.warn { background: rgba(241,224,90,0.2); color: var(--gold);
        }
        .signal-tag.neutral { background: rgba(88,166,255,0.15); color: var(--blue);
        }
        
        /* 主力行為判斷 */
        .behavior-row { display: flex;
            gap: 6px; margin-bottom: 2px; flex-wrap: wrap; }
        .behavior-badge { padding: 3px 8px;
            border-radius: 4px; font-size: 10px; font-weight: bold; }
        .behavior-badge.bull { background: rgba(218,54,51,0.25); color: var(--red);
            border: 1px solid rgba(218,54,51,0.4); }
        .behavior-badge.bear { background: rgba(35,134,54,0.25); color: var(--green);
            border: 1px solid rgba(35,134,54,0.4); }
        .behavior-badge.warn { background: rgba(241,224,90,0.2); color: var(--gold);
            border: 1px solid rgba(241,224,90,0.4); }
        .behavior-badge.neutral { background: rgba(88,166,255,0.1); color: var(--blue);
            border: 1px solid rgba(88,166,255,0.3); }
        
        /* 分數量表 */
        .score-bar-wrap { margin: 8px 0;
        }
        .score-bar-label { display: flex; justify-content: space-between; font-size: 10px; color: #8b949e; margin-bottom: 4px;
        }
        .score-bar-bg { height: 6px; background: #21262d; border-radius: 3px; overflow: hidden;
        }
        .score-bar-fill { height: 100%; border-radius: 3px; transition: width 1s ease;
        }
        
        .exposure-info { font-size: 10px;
            background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 4px; margin-bottom: 4px; display: flex; justify-content: space-between;
        }
        .sub-header { background: #1c2128 !important; color: var(--blue) !important; font-weight: bold;
            text-align: left !important; padding-left: 10px !important; }
        
        .settlement-warning { color: var(--gold);
            border: 1px solid var(--gold); padding: 1px 6px; border-radius: 4px; font-size: 10px; margin-left: 5px; animation: breathe 2s ease-in-out infinite;
        }
        @keyframes breathe { 0%, 100% { opacity: 1;
            } 50% { opacity: 0.4; } }
        
        .refresh-dot { width: 6px;
            height: 6px; background: var(--blue); border-radius: 50%; display: inline-block; margin-right: 5px; opacity: 0;
        }
        .refreshing .refresh-dot { animation: pulse 1s infinite;
        }
        @keyframes pulse { 0% { opacity: 1; transform: scale(1);
            } 100% { opacity: 0; transform: scale(2); } }
    </style>
</head>
<body>

<div class="container">
    <div class="index-grid">
        <div class="index-card" id="card-tsec" style="border-top: 3px solid var(--red);">
            <div class="index-name">加權指數</div>
            <div id="price-tsec" class="index-price">--</div>
            <div id="change-tsec" class="index-change">--</div>
        </div>
        <div class="index-card" id="card-otc" style="border-top: 3px solid var(--gold);">
            <div class="index-name">櫃買指數</div>
            <div id="price-otc" class="index-price">--</div>
            <div id="change-otc" class="index-change">--</div>
        </div>
        <div class="index-card" id="card-fitx" style="border-top: 3px solid var(--blue);">
            <div class="index-name">台指期貨</div>
            <div id="price-fitx" class="index-price">--</div>
            <div id="change-fitx" class="index-change">--</div>
        </div>
    </div>

    <div class="basis-box" id="basis-container">
        <span><span class="refresh-dot"></span>價差監控：<b id="basis-value" class="num-cell">--</b></span>
        <span id="basis-status" class="basis-tag" style="background: #30363d;">計算中</span>
    </div>

    <div class="collapsible-section">
        <div class="section-title" onclick="toggleSection(this)">
            <span>🏛️ 法人現貨買賣超 (<span id="spot-date">--/--</span>)</span>
            <span class="unit-text">單位: 億元</span>
            <span class="toggle-arrow">▼</span>
        </div>
        <div class="collapse-content">
            <table id="spot-table">
                <thead><tr><th>外資</th><th>投信</th><th>自營商</th><th>合計</th></tr></thead>
                <tbody id="spot-table-body"><tr><td colspan="4">正在對接交易所官方數據...</td></tr></tbody>
            </table>
        </div>
    </div>

    <div class="collapsible-section">
       <div class="section-title" onclick="toggleSection(this)">
            <span>📊 台指期沖銷動能</span>
            <span class="toggle-arrow">▼</span>
        </div>
        <div class="collapse-content">
            <div id="tx-table-container">載入中...</div>
        </div>
    </div>

    <div class="collapsible-section">
        <div class="section-title" onclick="toggleSection(this)">
             <span>📜 選擇權曝險診斷 <span id="settlement-ui"></span></span>
            <span class="toggle-arrow">▼</span>
        </div>
        <div class="collapse-content">
            <div id="exposure-summary" class="exposure-info">計算中...</div>
            <div id="opt-data-table">載入中...</div>
        </div>
    </div>

    <div class="collapsible-section">
        <div class="section-title" onclick="toggleSection(this)">
            <span>🤖 AI 主力籌碼戰略評級</span>
            <span class="toggle-arrow">▼</span>
        </div>
        <div class="collapse-content">
            <div class="ai-box">
                <div class="trend-header">
                    <div style="display:flex;align-items:center;">
                        <span class="ai-tag" style="background:var(--blue)">AI 多空評級</span>
                    </div>
                    <span id="trend-indicator" class="trend-val">--</span>
                </div>

                <div class="score-bar-wrap">
                    <div class="score-bar-label">
                        <span>空方 -10</span>
                        <span id="score-label" style="color:var(--blue);font-weight:bold;">評分中...</span>
                        <span>多方 +10</span>
                    </div>
                    <div class="score-bar-bg">
                        <div id="score-bar" class="score-bar-fill" style="width:50%;background:var(--blue);margin-left:0;"></div>
                    </div>
                </div>

                <div class="signal-grid">
                    <div class="signal-card" id="sig-foreign">
                        <div class="signal-label">外資動向</div>
                        <div class="signal-val" id="sig-foreign-val">--</div>
                        <div id="sig-foreign-tag"></div>
                    </div>
                    <div class="signal-card" id="sig-trust">
                        <div class="signal-label">投信動向</div>
                        <div class="signal-val" id="sig-trust-val">--</div>
                        <div id="sig-trust-tag"></div>
                    </div>
                    <div class="signal-card" id="sig-dealer">
                        <div class="signal-label">自營商動向</div>
                        <div class="signal-val" id="sig-dealer-val">--</div>
                        <div id="sig-dealer-tag"></div>
                    </div>
                    <div class="signal-card" id="sig-retail">
                        <div class="signal-label">散戶動向</div>
                        <div class="signal-val" id="sig-retail-val">--</div>
                        <div id="sig-retail-tag"></div>
                    </div>
                </div>

                <div>
                    <div style="font-size:10px;color:#8b949e;margin-bottom:4px;">主力行為識別</div>
                    <div class="behavior-row" id="behavior-badges">
                        <span class="behavior-badge neutral">分析中...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    function toggleSection(element) {
        const section = element.parentElement;
        section.classList.toggle('collapsed');
    }

    function updateHeight() {
        let vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--vh', `${vh}px`);
    }
    window.addEventListener('resize', updateHeight);
    updateHeight();
    
    const apiUrl = 'https://script.google.com/macros/s/AKfycbxs-H4wl6KsXP_TJ8xBmNR5Xp3vXr4mjb12PloSaux-5C5Qcb4hbQoyPmNoFWe_0fqtBg/exec';
    const twseUrl = 'https://corsproxy.io/?' + encodeURIComponent('https://www.twse.com.tw/rwd/zh/fund/BFI82U');
    let globalSpot = { foreign: 0, trust: 0, dealer: 0, total: 0 };
    let globalTX = { fTX: 0, retailMTX: 0, retailMicro: 0 };
    let globalOpt = { dc: 0, dp: 0, fc: 0, fp: 0, dAmtC: 0, dAmtP: 0, fAmtC: 0, fAmtP: 0 };
    let curTSEC = 0, curFITX = 0;

    async function fetchPrices() {
        const basisBox = document.getElementById('basis-container');
        if (basisBox) basisBox.classList.add('refreshing');
        const urls = {
            tsec: 'https://histock.tw/stock/module/function.aspx?m=stocktop2017&no=0000',
            otc: 'https://histock.tw/stock/module/function.aspx?m=stocktop2017&no=TWOI',
            fitx: 'https://histock.tw/stock/module/function.aspx?m=stocktop2017&no=FITXA'
        };
        const parseInfo = (h) => {
            const pMatch = h.match(/<div class="ci_value"><span[^>]*>([\d,.]+)<\/span>/);
            const cMatch = h.match(/<li><div class="ci_title">漲跌<\/div><div class="ci_value"><span[^>]*>([^<]+)<\/span>/);
            return { price: pMatch ? pMatch[1] : "--", change: cMatch ? cMatch[1].trim() : "--" };
        };

        const updateUI = (id, info) => {
            const pEl = document.getElementById(`price-${id}`);
            const cEl = document.getElementById(`change-${id}`);
            if(!pEl || !cEl) return;
            pEl.innerText = info.price;
            cEl.innerText = info.change;
            if (info.change.includes('▲')) {
                cEl.style.color = "var(--red)";
                pEl.style.color = "var(--red)";
            } else if (info.change.includes('▼')) {
                cEl.style.color = "var(--green)";
                pEl.style.color = "var(--green)";
            }
        };
        try {
            const results = await Promise.all(Object.keys(urls).map(k => 
                fetch(urls[k]).then(r => r.text()).then(h => ({k, info: parseInfo(h)}))
            ));
            results.forEach(item => {
                if(item.info) {
                    updateUI(item.k, item.info);
                    if (item.k === 'tsec') curTSEC = parseFloat(item.info.price.replace(/,/g, ''));
                    if (item.k === 'fitx') curFITX = parseFloat(item.info.price.replace(/,/g, ''));
                }
            });
            calcBasis();
        } catch (e) { console.warn("Update Failed"); }
        if (basisBox) setTimeout(() => basisBox.classList.remove('refreshing'), 1000);
    }

    setInterval(fetchPrices, 6000);

    async function fetchAllData() {
        fetchPrices();
        try {
            const [twseRes, txRes, optRes] = await Promise.all([
                fetch(twseUrl), fetch(`${apiUrl}?type=tx`), fetch(apiUrl)
            ]);
            const spotData = await twseRes.json();
            const txData = await txRes.json();
            const optData = await optRes.json();

            renderSpot(spotData);
            let fTX = 0, retailMTX = 0, retailMicro = 0;
            txData.forEach(r => {
                if(r[0] === '外資') fTX = parseFloat(String(r[1]).replace(/,/g,'')) || 0;
                if(r[0] && r[0].includes('散戶')) {
                    retailMTX = parseFloat(String(r[3]).replace(/,/g,'')) || 0;
                    retailMicro = parseFloat(String(r[4]).replace(/,/g,'')) || 0;
                }
            });
            globalTX = { fTX, retailMTX, retailMicro };

            renderTX(txData);
            renderOption(optData, fTX, retailMTX, retailMicro);
        } catch (e) { console.error("Data fetch error:", e); }
    }

    function calcBasis() {
        if (!curTSEC || !curFITX) return;
        const diff = (curFITX - curTSEC).toFixed(2);
        const elV = document.getElementById('basis-value');
        const elS = document.getElementById('basis-status');
        if(!elV || !elS) return;
        elV.innerText = (diff > 0 ? '+' : '') + diff;
        elV.className = 'num-cell ' + (diff >= 0 ? 'pos' : 'neg');
        elS.innerText = diff >= 0 ? "正價差" : "逆價差";
        elS.style.background = diff >= 0 ? "var(--red)" : "var(--green)";
        elS.style.color = "#000";
    }

    function renderSpot(jsonData) {
        if (jsonData.stat !== "OK") return;
        const d = jsonData.date;
        const dateEl = document.getElementById('spot-date');
        if (dateEl) dateEl.innerText = d.substring(4,6) + "/" + d.substring(6,8);
        const toBillion = (valStr) => {
            if (!valStr) return 0;
            let n = parseFloat(String(valStr).replace(/,/g, '')) || 0;
            return n / 100000000;
        };

        const d_self = toBillion(jsonData.data[0][3]); 
        const d_hedge = toBillion(jsonData.data[1][3]);
        globalSpot = { 
            dealer: d_self + d_hedge, 
            trust: toBillion(jsonData.data[2][3]),
            foreign: toBillion(jsonData.data[3][3]),
            total: toBillion(jsonData.data[5][3])
        };
        const getColor = (val) => val >= 0 ? 'pos' : 'neg';
        const format = (val) => (val >= 0 ? '+' : '') + val.toFixed(2);

        const bodyEl = document.getElementById('spot-table-body');
        if (bodyEl) {
            bodyEl.innerHTML = `<tr>
                <td class="num-cell ${getColor(globalSpot.foreign)}">${format(globalSpot.foreign)}</td>
                <td class="num-cell ${getColor(globalSpot.trust)}">${format(globalSpot.trust)}</td>
                <td class="num-cell ${getColor(globalSpot.dealer)}">${format(globalSpot.dealer)}</td>
                <td class="num-cell ${getColor(globalSpot.total)}">${format(globalSpot.total)}</td>
            </tr>`;
        }
    }

    function renderTX(data) {
        let html = `<table><thead><tr><th>身份</th><th>大台</th><th>小台</th><th>微台</th><th>成本</th></tr></thead><tbody>`;
        data.slice(1).forEach(r => {
            const [name, tx, cost, mtx, micro] = r;
            if(!name) return;
            const txV = parseFloat(String(tx).replace(/,/g,'')) || 0;
            const mtxV = parseFloat(String(mtx).replace(/,/g,'')) || 0;
            const microV = parseFloat(String(micro).replace(/,/g,'')) || 0;
            const isRetail = name.includes('散戶');
            html += `<tr class="${isRetail ? 'retail-row' : ''}">
                <td class="${isRetail ? 'retail-text' : ''}">${name}</td>
                <td class="num-cell ${txV >= 0 ? 'pos' : 'neg'}">${isRetail ? '--' : txV.toLocaleString()}</td>
                <td class="num-cell ${isRetail ? 'retail-highlight' : (mtxV >= 0 ? 'pos' : 'neg')}">${mtxV.toLocaleString()}</td>
                <td class="num-cell ${isRetail ? 'retail-highlight' : (microV >= 0 ? 'pos' : 'neg')}">${microV.toLocaleString()}</td>
                <td class="num-cell">${isRetail ? '--' : cost}</td>
            </tr>`;
        });
        const containerEl = document.getElementById('tx-table-container');
        if (containerEl) containerEl.innerHTML = html + "</tbody></table>";
    }

    function renderOption(opt, fTX, rMTX, rMicro) {
        let s = { dc: 0, dp: 0, fc: 0, fp: 0, dAmtC: 0, dAmtP: 0, fAmtC: 0, fAmtP: 0 };
        let dealerRowsCount = 0;
        let foreignRowsCount = 0;
        let dealerHtml = "";
        let foreignHtml = "";
        let lastT = "";

        opt.slice(1).forEach(r => {
            let [t, id, diff, oi, amt] = r; 
            if (t && t.trim() !== "") lastT = t; else t = lastT;
            if(!id || (id !== "自營商" && id !== "外資")) return;
            
            const oiV = parseFloat(String(oi).replace(/,/g, '')) || 0;
            const amtV = parseFloat(String(amt).replace(/,/g, '')) || 0;
            const isC = t.includes('買權');
            
            let actType = isC ? (oiV >= 0 ? "BC" : "SC") : (oiV >= 0 ? "BP" : "SP");
            let tagClass = (actType === "BC" || actType === "SP") ? "tag-bull" : "tag-bear";
            let isSell = (oiV < 0);
            if(isSell) tagClass = "tag-sell-exposure";
            let exposureTxt = isSell ? "<span class='exposure-text'>(曝險)</span>" : "";

            let rowStr = `<tr>
                <td style="color:${isC ? 'var(--red)' : 'var(--green)'}">${t.replace('臺指選擇權','')}</td>
                <td class="num-cell ${parseFloat(diff)>=0?'pos':'neg'}">${diff}</td>
                <td class="num-cell ${oiV>=0?'pos':'neg'}">${oi}</td>
                <td class="num-cell ${amtV>=0?'pos':'neg'}">${amtV.toLocaleString()}</td>
                <td><span class="ai-tag ${tagClass}">${actType}</span>${exposureTxt}</td>`;

            if(id === "自營商") {
                if(isC){s.dc=oiV; s.dAmtC=amtV;}else{s.dp=oiV; s.dAmtP=amtV;}
                dealerHtml += rowStr + "</tr>";
                dealerRowsCount++;
            } else {
                if(isC){s.fc=oiV; s.fAmtC=amtV;}else{s.fp=oiV; s.fAmtP=amtV;}
                foreignHtml += rowStr + "</tr>";
                foreignRowsCount++;
            }
        });

        globalOpt = s;
        const dNet = (s.dAmtC - s.dAmtP) / 10000;
        const fNet = (s.fAmtC - s.fAmtP) / 10000;
        
        const summaryEl = document.getElementById('exposure-summary');
        if (summaryEl) {
            summaryEl.innerHTML = `
                <span>自營淨曝險: <b class="${dNet>=0?'pos':'neg'}">${dNet.toFixed(2)} 億</b></span>
                <span>外資淨曝險: <b class="${fNet>=0?'pos':'neg'}">${fNet.toFixed(2)} 億</b></span>`;
        }

        const foreignScore = (s.fc - s.fp) + (s.fAmtC - s.fAmtP); 
        const dealerScore = (s.dc - s.dp) + (s.dAmtC - s.dAmtP);   

        const dealerTrendHtml = dealerScore >= 0 ? '<span class="up" style="font-weight:bold;">🚀 短線押多</span>' : '<span class="down" style="font-weight:bold;">⚠️ 短線避險</span>';
        const foreignTrendHtml = foreignScore >= 0 ? '<span class="up" style="font-weight:bold;">📈 長線偏多</span>' : '<span class="down" style="font-weight:bold;">📉 長線偏空</span>';

        const tableEl = document.getElementById('opt-data-table');
        if (tableEl) {
            let finalDealerRows = "";
            if(dealerHtml) {
                let firstIndex = dealerHtml.indexOf("</tr>");
                if(firstIndex !== -1) {
                    finalDealerRows = dealerHtml.substring(0, firstIndex) + 
                        `<td rowspan="${dealerRowsCount}" style="vertical-align: middle; background: rgba(255,255,255,0.015); border-left: 2px solid var(--border);" class="text-center"><div>${dealerTrendHtml}</div></td>` + 
                        dealerHtml.substring(firstIndex);
                } else { finalDealerRows = dealerHtml; }
            }

            let finalForeignRows = "";
            if(foreignHtml) {
                let firstIndex = foreignHtml.indexOf("</tr>");
                if(firstIndex !== -1) {
                    finalForeignRows = foreignHtml.substring(0, firstIndex) + 
                        `<td rowspan="${foreignRowsCount}" style="vertical-align: middle; background: rgba(255,255,255,0.015); border-left: 2px solid var(--border);" class="text-center"><div>${foreignTrendHtml}</div></td>` + 
                        foreignHtml.substring(firstIndex);
                } else { finalForeignRows = foreignHtml; }
            }

            tableEl.innerHTML = `<table>
                <thead><tr><th>權別</th><th>差額</th><th>OI</th><th>金額(千)</th><th>狀態</th><th>大戶</th></tr></thead>
                <tbody>
                    <tr>
                        <td colspan="6" class="sub-header">🟣 自營商 (周選短線/避險指標)</td>
                    </tr>
                    ${finalDealerRows}
                    <tr>
                        <td colspan="6" class="sub-header">🔵 外資 (月選中長線主導)</td>
                    </tr>
                    ${finalForeignRows}
                </tbody>
            </table>`;
        }

        runLocalAnalysis(s, fTX, rMTX, rMicro);
    }

    function runLocalAnalysis(s, fTX, rMTX, rMicro) {
        const fSpot = globalSpot.foreign;
        const tSpot = globalSpot.trust;
        const dSpot = globalSpot.dealer;
        const retailTotal = rMTX + (rMicro / 5);
        let fScore = 0;
        if (fSpot > 100) fScore += 3;
        else if (fSpot > 30) fScore += 2;
        else if (fSpot > 0) fScore += 1;
        else if (fSpot < -100) fScore -= 3;
        else if (fSpot < -30) fScore -= 2;
        else if (fSpot < 0) fScore -= 1;
        if (fTX > 3000) fScore += 2;
        else if (fTX > 500) fScore += 1;
        else if (fTX < -5000) fScore -= 2;
        else if (fTX < -1000) fScore -= 1;
        if (s.fc > 0 && s.fp < 0) fScore += 1;
        if (s.fc < 0 && s.fp > 0) fScore -= 1;

        let tScore = 0;
        if (tSpot > 20) tScore += 2;
        else if (tSpot > 5) tScore += 1;
        else if (tSpot < -20) tScore -= 2;
        else if (tSpot < -5) tScore -= 1;
        let dScore = 0;
        if (dSpot > 50) dScore += 2;
        else if (dSpot > 10) dScore += 1;
        else if (dSpot < -50) dScore -= 2;
        else if (dSpot < -10) dScore -= 1;
        if (s.dc < 0) dScore -= 1;
        if (s.dc > 0) dScore += 1;
        if (s.dp < 0) dScore += 1;
        if (s.dp > 0) dScore -= 1;

        let retailScore = 0;
        if (retailTotal > 8000) retailScore = -3;
        else if (retailTotal > 3000) retailScore = -2;
        else if (retailTotal > 1000) retailScore = -1;
        else if (retailTotal < -8000) retailScore = 3;
        else if (retailTotal < -3000) retailScore = 2;
        else if (retailTotal < -1000) retailScore = 1;

        const totalScore = fScore + tScore + dScore + retailScore;
        const clampedScore = Math.max(-10, Math.min(10, totalScore));

        renderSignal('foreign', fSpot, fScore, fTX);
        renderSignal('trust', tSpot, tScore, null);
        renderSignal('dealer', dSpot, dScore, null, s);
        renderRetailSignal(retailTotal, retailScore);
        const pct = ((clampedScore + 10) / 20 * 100).toFixed(1);
        const barEl = document.getElementById('score-bar');
        const labelEl = document.getElementById('score-label');
        if (barEl) {
            barEl.style.width = pct + '%';
            barEl.style.background = clampedScore >= 3 ? 'var(--red)' : clampedScore <= -3 ? 'var(--green)' : '#f0883e';
        }
        if (labelEl) labelEl.innerText = `量化評分 ${clampedScore > 0 ? '+' : ''}${clampedScore}`;
        const trendEl = document.getElementById('trend-indicator');
        let trendLabel = '⚖️ 中性整理';
        let trendColor = 'var(--blue)';
        if (clampedScore >= 6) { trendLabel = '🚀 極度樂觀'; trendColor = 'var(--red)'; }
        else if (clampedScore >= 3) { trendLabel = '↗️ 震盪偏多'; trendColor = '#ffab70'; }
        else if (clampedScore <= -6) { trendLabel = '📉 極度悲觀'; trendColor = 'var(--green)'; }
        else if (clampedScore <= -3) { trendLabel = '↘️ 震盪偏空'; trendColor = '#88d18d'; }
        if (trendEl) { trendEl.innerText = trendLabel; trendEl.style.color = trendColor; }

        renderBehaviorBadges(s, fSpot, tSpot, dSpot, fTX, retailTotal);
    }

    function renderSignal(id, spotVal, score, futVal, opt) {
        const card = document.getElementById(`sig-${id}`);
        const valEl = document.getElementById(`sig-${id}-val`);
        const tagEl = document.getElementById(`sig-${id}-tag`);
        if (!card || !valEl || !tagEl) return;
        let cls = score > 0 ? 'bull' : score < 0 ? 'bear' : 'neutral';
        card.className = `signal-card ${cls}`;
        let lines = [`現貨: ${spotVal >= 0 ? '+' : ''}${spotVal.toFixed(2)}億`];
        if (futVal !== null) lines.push(`期貨: ${futVal >= 0 ? '+' : ''}${futVal.toLocaleString()}`);
        if (opt) {
            const optDir = (opt.dc < 0 ? 'SC壓' : opt.dc > 0 ? 'BC多' : '') + (opt.dp < 0 ? '/SP撐' : opt.dp > 0 ? '/BP空' : '');
            if (optDir) lines.push(`選擇權: ${optDir}`);
        }
        valEl.innerHTML = lines.join('<br>');
        let tagText = score >= 2 ? '積極做多' : score === 1 ? '偏多布局' : score <= -2 ? '積極做空' : score === -1 ? '偏空避險' : '中性觀望';
        let tagCls = score > 0 ? 'bull' : score < 0 ? 'bear' : 'neutral';
        tagEl.innerHTML = `<span class="signal-tag ${tagCls}">${tagText}</span>`;
    }

    function renderRetailSignal(retailTotal, score) {
        const card = document.getElementById('sig-retail');
        const valEl = document.getElementById('sig-retail-val');
        const tagEl = document.getElementById('sig-retail-tag');
        if (!card || !valEl || !tagEl) return;
        let cls = retailTotal > 3000 ? 'warn' : retailTotal < -3000 ? 'bull' : 'neutral';
        card.className = `signal-card ${cls}`;
        valEl.innerHTML = `小台+微台：<br>${retailTotal >= 0 ? '+' : ''}${retailTotal.toFixed(0)}`;

        let tagText, tagCls;
        if (retailTotal > 8000) { tagText = '⚠ 極度追多（危）'; tagCls = 'warn'; }
        else if (retailTotal > 3000) { tagText = '散戶追多偏空訊'; tagCls = 'warn'; }
        else if (retailTotal < -8000) { tagText = '散戶極空（逆向多）'; tagCls = 'bull'; }
        else if (retailTotal < -3000) { tagText = '散戶偏空 留意反彈'; tagCls = 'bull'; }
        else { tagText = '散戶中性'; tagCls = 'neutral'; }
        tagEl.innerHTML = `<span class="signal-tag ${tagCls}">${tagText}</span>`;
    }

    function renderBehaviorBadges(s, fSpot, tSpot, dSpot, fTX, retailTotal) {
        const el = document.getElementById('behavior-badges');
        if (!el) return;
        let badges = [];

        if (fSpot > 50 && fTX > 500) badges.push({text: '外資現期同步做多', cls: 'bull'});
        else if (fSpot < -50 && fTX < -1000) badges.push({text: '外資現期同步撤退', cls: 'bear'});
        else if (fSpot > 30 && fTX < -1000) badges.push({text: '外資現多期空（避險）', cls: 'warn'});
        else if (fSpot < 0 && fTX > 1000) badges.push({text: '外資期貨超買（異常）', cls: 'warn'});
        else if (fSpot > 10) badges.push({text: '外資溫和布多', cls: 'bull'});
        else if (fSpot < -10) badges.push({text: '外資緩步調節', cls: 'bear'});

        if (tSpot > 20) badges.push({text: '投信積極承接', cls: 'bull'});
        else if (tSpot > 5) badges.push({text: '投信小幅加碼', cls: 'bull'});
        else if (tSpot < -10) badges.push({text: '投信賣超', cls: 'bear'});

        if (s.dc < 0 && s.dp < 0) badges.push({text: '自營SC+SP賣偏多撐', cls: 'bull'});
        else if (s.dc < 0 && s.dp > 0) badges.push({text: '自營SC+BP空頭掩護', cls: 'bear'});
        else if (s.dc > 0 && s.dp < 0) badges.push({text: '自營BC+SP積極做多', cls: 'bull'});
        else if (s.dc > 0 && s.dp > 0) badges.push({text: '自營BC+BP對敲觀望', cls: 'neutral'});

        if (retailTotal > 8000) badges.push({text: '⚠ 散戶極度超多（警示）', cls: 'warn'});
        else if (retailTotal < -8000) badges.push({text: '散戶極空（逆向機會）', cls: 'bull'});

        if (fSpot > 30 && fTX < -2000) badges.push({text: '現期背離 警戒', cls: 'warn'});
        if (badges.length === 0) badges.push({text: '市場訊號混沌', cls: 'neutral'});

        el.innerHTML = badges.map(b => `<span class="behavior-badge ${b.cls}">${b.text}</span>`).join('');
    }
    
    function updateSettlementUI() {
        const now = new Date();
        const date = now.getDate(); const day = now.getDay();
        let firstWed = new Date(now.getFullYear(), now.getMonth(), 1);
        while (firstWed.getDay() !== 3) { firstWed.setDate(firstWed.getDate() + 1); }
        const monthlyWed = firstWed.getDate() + 14;
        const ui = document.getElementById('settlement-ui');
        if (ui && day >= 1 && day <= 3) {
            let label = (day === 3) ? (date === monthlyWed ? "🔥 月結算" : "⚡ 週結算") : `⏳ 結算 D-${3-day}`;
            ui.innerHTML = `<span class="settlement-warning">${label}</span>`;
        }
    }
    
    updateSettlementUI(); fetchAllData();
</script>
