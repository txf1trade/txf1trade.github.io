<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>外資台指期成本 / 關鍵價</title>
<style>
  :root { --bg:#f6f6f4; --fg:#1d1d1b; --card:#fff; --line:#d8d8d2; --red:#d93025; --blue:#1a73e8; --muted:#6b6b66; --hl:#fff2cc; --shadow:rgba(0,0,0,.25); }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#161615; --fg:#ececea; --card:#222221; --line:#3a3a38; --red:#ff6b61; --blue:#6aa8ff; --muted:#a3a39d; --hl:#4a4020; --shadow:rgba(0,0,0,.6); }
  }
  :root[data-theme="dark"] { --bg:#161615; --fg:#ececea; --card:#222221; --line:#3a3a38; --red:#ff6b61; --blue:#6aa8ff; --muted:#a3a39d; --hl:#4a4020; --shadow:rgba(0,0,0,.6); color-scheme:dark; }
  :root[data-theme="light"] { color-scheme:light; }
  * { box-sizing:border-box; }
  html { touch-action:manipulation; -webkit-text-size-adjust:100%; }
  body { margin:0; padding:8px; background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif; }
  input, button { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); }
  button { cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  button.go { background:var(--blue); color:#fff; border-color:var(--blue); }
  button.on { background:var(--blue); color:#fff; border-color:var(--blue); }
  .head { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-bottom:6px; }
  .head h1 { font-size:18px; margin:0; }
  #tools { display:flex; gap:6px; align-items:center; flex-shrink:0; }
  #tools button { min-width:40px; min-height:38px; padding:4px 10px; font-size:16px; display:inline-flex; align-items:center; justify-content:center; }
  .in-shell #themeBtn { display:none; } /* 在 index 外殼裡：深淺模式由外殼統一控制 */
  .bar { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:4px 8px; margin-bottom:8px; }
  .bar label { grid-column:1; display:flex; align-items:center; gap:8px; min-width:0; font-size:15px; color:var(--muted); white-space:nowrap; }
  .bar label input { flex:1 1 0; width:0; min-width:0; min-height:36px; padding:3px 8px; font-size:16px; color:var(--fg); -webkit-appearance:none; appearance:none; text-align:left; }
  .bar input::-webkit-date-and-time-value { text-align:left; }
  .bar button.go { grid-column:2; grid-row:2; min-height:36px; padding:3px 14px; font-size:15px; }
  .msg { margin:6px 0; } .err { color:var(--red); }
  .sum { display:grid; grid-template-columns:repeat(auto-fit,minmax(100px,1fr)); gap:6px; margin-bottom:8px; }
  .sum > div { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:4px 10px; }
  .sum .t { font-size:12px; color:var(--muted); line-height:1.3; }
  .sum .v { font-size:18px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.3; }
  .kcard { position:relative; cursor:pointer; }
  .kcard .t::after { content:" ⓘ"; }
  .tip { display:none; position:absolute; left:0; top:100%; margin-top:4px; z-index:5; min-width:170px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:6px 10px; box-shadow:0 4px 14px var(--shadow); font-size:14px; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .kcard.pin .tip { display:block; }
  @media (hover:hover) { .kcard:hover .tip { display:block; } }
  .tip .r { display:flex; justify-content:space-between; gap:18px; }
  .tip .r span:first-child { color:var(--muted); }
  .seg { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .seg button { border:0; border-radius:0; padding:3px 9px; }
  .seg button + button { border-left:1px solid var(--line); }
  .wrap { overflow-x:auto; }
  table { border-collapse:collapse; width:100%; background:var(--card); font-variant-numeric:tabular-nums; }
  th, td { border:1px solid var(--line); padding:4px 8px; font-size:14px; text-align:right; white-space:nowrap; }
  th { background:var(--bg); position:sticky; top:0; } td:first-child, th:first-child { text-align:center; }
  tr.settle td { background:var(--hl); }
  .neg { color:var(--red); }
  .key { font-weight:700; }
  .pnlc { cursor:pointer; }
  th.pnlc { text-decoration:underline dotted; text-underline-offset:3px; }
  @media (max-width:560px) { th, td { padding:4px 5px; font-size:13px; } }
</style>
</head>
<body>
<div class="head">
  <h1>外資台指期成本 / 關鍵價</h1>
  <div id="tools"></div>
</div>
<div class="bar">
  <label>結算日<input type="date" id="settle"></label>
  <label>計算到<input type="date" id="end"></label>
  <button class="go" id="go" title="結算日預設最近一個第三個週三；遇休市順延請手動改">計算</button>
</div>
<div id="out"></div>

<script>
// 後端（Cloudflare Worker）網址；網頁和後端在同一個網址時可改成 ""
const API_BASE = "https://txf-key.wildvlogtw.workers.dev";
const $ = (id) => document.getElementById(id);
const p2 = (n) => String(n).padStart(2, "0");
const iso = (d) => d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
const num = (v) => (v == null ? "—" : Number(v).toLocaleString("en-US"));
const neg = (v) => (v < 0 ? "neg" : "");
const ICON_SUN = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg>', ICON_MOON = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>';

// ---- 顯示偏好（記在瀏覽器） ----
let prefs = { cols: "simple", showPnl: false, unit: "pt", theme: "auto" };
try { Object.assign(prefs, JSON.parse(localStorage.getItem("txfkey_prefs") || "{}")); } catch (e) {}
if (prefs.unit !== "twd") prefs.unit = "pt";
// ---- 在 index 外殼裡：深淺模式由外殼統一控制（本頁自己的切換鈕會隱藏） ----
if (window.parent !== window) {
  document.documentElement.classList.add("in-shell");
  let st = null;
  try { st = localStorage.getItem("shellTheme"); } catch (e) {}
  prefs.theme = st === "light" || st === "dark" ? st : (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  addEventListener("message", (e) => {
    const m = e.data;
    if (e.source !== parent || !m || m.type !== "shell-theme" || (m.theme !== "light" && m.theme !== "dark")) return;
    prefs.theme = m.theme; applyTheme(); renderTools();
  });
}
let DATA = null, pinned = false, shown = false, lastTap = 0;

const isDark = () => prefs.theme === "dark" || (prefs.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
function applyTheme() {
  const root = document.documentElement;
  if (prefs.theme === "auto") root.removeAttribute("data-theme"); else root.setAttribute("data-theme", prefs.theme);
}
function setPref(k, v) {
  prefs[k] = v;
  try { localStorage.setItem("txfkey_prefs", JSON.stringify(prefs)); } catch (e) {}
  applyTheme(); renderTools();
  if (DATA) render(DATA);
}
applyTheme();

// ---- 工具列（全是按鈕） ----
function renderTools() {
  const full = prefs.cols === "full";
  $("tools").innerHTML =
    `<button id="colsBtn" class="${full ? "on" : ""}" title="${full ? "完整欄位（點擊切換簡易）" : "簡易欄位（點擊切換完整）"}">${full ? "⊞" : "⊟"}</button>` +
    `<button id="pnlBtn" class="${prefs.showPnl ? "on" : ""}" title="顯示／隱藏沖銷盈虧">$</button>` +
    `<button id="themeBtn" title="切換深淺模式">${isDark() ? ICON_SUN : ICON_MOON}</button>`;
  $("colsBtn").onclick = () => setPref("cols", full ? "simple" : "full");
  $("pnlBtn").onclick = () => setPref("showPnl", !prefs.showPnl);
  $("themeBtn").onclick = () => setPref("theme", isDark() ? "light" : "dark");
}
renderTools();

function thirdWed(y, m) {
  const d = new Date(y, m, 1);
  d.setDate(1 + ((3 - d.getDay() + 7) % 7) + 14);
  return d;
}
function defaultSettle() {
  const now = new Date(); now.setHours(0, 0, 0, 0);
  let t = thirdWed(now.getFullYear(), now.getMonth());
  if (t > now) t = thirdWed(now.getFullYear(), now.getMonth() - 1);
  return t;
}
$("settle").value = iso(defaultSettle());
$("end").value = iso(new Date());

async function run() {
  const btn = $("go");
  btn.disabled = true; btn.textContent = "抓取中…";
  $("out").innerHTML = '<p class="msg">向期交所抓資料中（有限流，第一次會比較慢）…</p>';
  try {
    const q = new URLSearchParams({ settle: $("settle").value.replaceAll("-", "/"), end: $("end").value.replaceAll("-", "/") });
    const resp = await fetch(API_BASE + "/api/key?" + q);
    const text = await resp.text();
    let r;
    try { r = JSON.parse(text); }
    catch (_) { throw new Error("後端回應格式不對（HTTP " + resp.status + "：" + text.slice(0, 40) + "）"); }
    if (r.error) throw new Error(r.error);
    DATA = r;
    render(r);
  } catch (e) {
    DATA = null;
    $("out").innerHTML = '<p class="msg err">' + e.message + "</p>";
  } finally {
    btn.disabled = false; btn.textContent = "計算";
  }
}

const pnlVal = (r) => (prefs.unit === "twd" ? r.pnl * 200 : r.pnl);
const pnlTxt = (r) => (r.pnl ? num(pnlVal(r)) : "—");

function render(d) {
  const { settle: s, rows, skipped } = d;
  const last = rows[rows.length - 1];
  const sum = `<div class="sum">
    <div class="kcard ${shown ? "pin" : ""}" id="kcard">
      <div class="t">結算日關鍵價（${s.date.slice(5)}）</div><div class="v">${num(s.key)}</div>
      <div class="tip">
        <div class="r"><span>合約</span><span>${s.contract}</span></div>
        <div class="r"><span>最高</span><span>${num(s.high)}</span></div>
        <div class="r"><span>最低</span><span>${num(s.low)}</span></div>
        <div class="r"><span>收盤</span><span>${num(s.dayClose)}</span></div>
      </div>
    </div>
    <div><div class="t">最新 ${last.date.slice(5)} 關鍵位置</div><div class="v">${num(last.keyPrice)}</div></div>
    <div><div class="t">外資均成本</div><div class="v">${num(last.avgCost)}</div></div>
    <div><div class="t">留倉口數</div><div class="v ${neg(last.position)}">${num(last.position)}</div></div>
  </div>
  ${s.nightMissing ? '<div class="msg err">⚠ 抓不到夜盤資料，至高／至低只用日盤計算</div>' : ""}`;

  const yr = String(new Date().getFullYear());
  const fd = (x) => (x.slice(0, 4) === yr ? x.slice(5) : x); // 今年只顯示月/日，跨年顯示年/月/日
  $("out").innerHTML = sum + table(rows) +
    (skipped.length ? `<p class="msg"><small>休市：${skipped.map(fd).join("、")}</small></p>` : "");
  // 點一下：開啟；點其他地方：自動隱藏；點兩下：固定顯示／關閉
  $("kcard").onclick = (e) => {
    e.stopPropagation();
    const now = Date.now(), dbl = now - lastTap < 350;
    lastTap = dbl ? 0 : now;
    if (dbl) { pinned = !pinned; shown = pinned; } else shown = true;
    syncTip();
  };
  $("out").querySelectorAll(".pnlc").forEach((c) => (c.onclick = () => setPref("unit", prefs.unit === "pt" ? "twd" : "pt")));
}

// ---------- 表格 ----------
function table(list) {
  const full = prefs.cols === "full", pnl = prefs.showPnl;
  const unit = prefs.unit === "twd" ? "元" : "點";
  const head = ["日期"].concat(full ? ["買進口", "做多成本", "賣出口", "做空成本"] : [], ["沖銷口"], full ? ["沖銷後成本"] : [],
    ["關鍵位置", "留倉口數", "外資均成本"]).map((h) => "<th>" + h + "</th>").join("") +
    (pnl ? `<th class="pnlc" title="點擊切換 點／元">沖銷盈虧(${unit})</th>` : "");
  const body = list.map((r) => `<tr class="${r.isSettle ? "settle" : ""}">
    <td>${r.date.slice(5)}${r.isSettle ? " 結算" : ""}</td>` +
    (full ? `<td>${num(r.buyLots)}</td><td>${num(r.buyCost)}</td><td>${num(r.sellLots)}</td><td>${num(r.sellCost)}</td>` : "") +
    `<td class="${neg(r.net)}">${num(r.net)}</td>` + (full ? `<td>${num(r.afterCost)}</td>` : "") +
    `<td class="key">${num(r.keyPrice)}</td><td class="${neg(r.position)}">${num(r.position)}</td><td>${num(r.avgCost)}</td>` +
    (pnl ? `<td class="pnlc ${neg(r.pnl)}">${pnlTxt(r)}</td>` : "") + "</tr>").join("");
  return `<div class="wrap"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>`;
}

$("go").onclick = run;
// 點旁邊任何地方關閉關鍵價詳細資訊；禁止手機雙指縮放
function syncTip() { const k = $("kcard"); if (k) k.classList.toggle("pin", shown); }
document.addEventListener("click", () => { if (shown && !pinned) { shown = false; syncTip(); } });
["gesturestart", "gesturechange", "gestureend"].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
</script>
</body>
</html>
