<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微型黃金期貨 (MGC) 損益計算機 - 含台幣換算</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #ffffff;
            --gold-accent: #d4af37;
            --gold-hover: #f3e5ab;
            --buy-color: #ff4d4d;
            --sell-color: #00b359;
            --border-color: #404040;
            --twd-color: #4da6ff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .calculator-card {
            background-color: var(--card-bg);
            border: 1px solid var(--gold-accent);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 480px;
            padding: 25px;
        }

        h2 {
            text-align: center;
            color: var(--gold-accent);
            margin-bottom: 20px;
            font-size: 1.5rem;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 16px;
        }

        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.95rem;
            color: #ccc;
        }

        /* 多空切換按鈕 */
        .direction-group {
            display: flex;
            gap: 10px;
            margin-bottom: 18px;
        }

        .direction-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid var(--border-color);
            background: transparent;
            color: #aaa;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .direction-btn.buy.active {
            background-color: var(--buy-color);
            border-color: var(--buy-color);
            color: white;
            box-shadow: 0 0 10px rgba(255, 77, 77, 0.4);
        }

        .direction-btn.sell.active {
            background-color: var(--sell-color);
            border-color: var(--sell-color);
            color: white;
            box-shadow: 0 0 10px rgba(0, 179, 89, 0.4);
        }

        /* 輸入框樣式 */
        input[type="number"] {
            width: 100%;
            padding: 12px;
            background-color: #1a1a1a;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: white;
            font-size: 1.1rem;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--gold-accent);
        }

        .hint {
            font-size: 0.8rem;
            color: #888;
            margin-top: 4px;
        }

        /* 結果顯示區 */
        .result-container {
            margin-top: 22px;
            background-color: #1a1a1a;
            border-radius: 8px;
            padding: 18px;
            border: 1px solid var(--border-color);
        }

        .result-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .result-row.highlight-usd {
            padding-top: 6px;
        }

        .result-row.highlight-twd {
            margin-bottom: 0;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .result-value {
            font-weight: bold;
        }

        .pnl-usd {
            font-size: 1.3rem;
        }

        .pnl-twd {
            font-size: 1.5rem;
        }

        /* 顏色標記（亞洲習慣：紅賺綠賠） */
        .profit {
            color: #ff4d4d;
        }

        .loss {
            color: #00b359;
        }

        .neutral {
            color: white;
        }
    </style>
</head>
<body>

<div class="calculator-card">
    <h2>微型黃金 (MGC) 損益計算機</h2>
    
    <label>交易方向</label>
    <div class="direction-group">
        <button type="button" class="direction-btn buy active" onclick="setDirection('BUY')">做多 (Buy)</button>
        <button type="button" class="direction-btn sell" onclick="setDirection('SELL')">做空 (Sell)</button>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="entryPrice">進場成本價 (美元)</label>
            <input type="number" id="entryPrice" step="0.1" placeholder="例: 2050.5" oninput="calculatePnL()">
        </div>
        <div class="form-group">
            <label for="currentPrice">目前價格 / 出場價</label>
            <input type="number" id="currentPrice" step="0.1" placeholder="例: 2062.3" oninput="calculatePnL()">
        </div>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label for="quantity">交易口數</label>
            <input type="number" id="quantity" value="1" min="1" step="1" oninput="calculatePnL()">
        </div>
        <div class="form-group">
            <label for="exchangeRate">美金兌台幣匯率</label>
            <input type="number" id="exchangeRate" value="32.5" step="0.01" placeholder="例: 32.5" oninput="calculatePnL()">
        </div>
    </div>
    <div class="hint" style="margin-top: -8px; margin-bottom: 15px;">* 微型黃金每口 10 盎司 (每 1 美元點值 = $10 USD)</div>

    <div class="result-container">
        <div class="result-row">
            <span>價差點數：</span>
            <span id="pointDifference" class="result-value">0.0 美元</span>
        </div>
        <div class="result-row highlight-usd">
            <span>總損益 (USD)：</span>
            <span id="pnlUSD" class="result-value pnl-usd neutral">$0.00</span>
        </div>
        <div class="result-row highlight-twd">
            <span>估算損益 (TWD)：</span>
            <span id="pnlTWD" class="result-value pnl-twd neutral">NT$ 0</span>
        </div>
    </div>
</div>

<script>
    let currentDirection = 'BUY';

    function setDirection(direction) {
        currentDirection = direction;
        
        const buyBtn = document.querySelector('.direction-btn.buy');
        const sellBtn = document.querySelector('.direction-btn.sell');
        
        if (direction === 'BUY') {
            buyBtn.classList.add('active');
            sellBtn.classList.remove('active');
        } else {
            sellBtn.classList.add('active');
            buyBtn.classList.remove('active');
        }
        
        calculatePnL();
    }

    function calculatePnL() {
        // 取得輸入值
        const entryPrice = parseFloat(document.getElementById('entryPrice').value);
        const currentPrice = parseFloat(document.getElementById('currentPrice').value);
        const quantity = parseInt(document.getElementById('quantity').value);
        const exchangeRate = parseFloat(document.getElementById('exchangeRate').value);

        // 元素引用
        const pointDiffEl = document.getElementById('pointDifference');
        const pnlUSDEl = document.getElementById('pnlUSD');
        const pnlTWDEl = document.getElementById('pnlTWD');

        // 驗證輸入，若未輸入完整則清空結果
        if (isNaN(entryPrice) || !entryPrice || isNaN(currentPrice) || !currentPrice || isNaN(quantity) || quantity <= 0 || isNaN(exchangeRate) || exchangeRate <= 0) {
            pointDiffEl.innerText = "0.0 美元";
            pnlUSDEl.innerText = "$0.00";
            pnlTWDEl.innerText = "NT$ 0";
            pnlUSDEl.className = "result-value pnl-usd neutral";
            pnlTWDEl.className = "result-value pnl-twd neutral";
            return;
        }

        // 1. 計算價差點數
        let pointDiff = 0;
        if (currentDirection === 'BUY') {
            pointDiff = currentPrice - entryPrice;
        } else {
            pointDiff = entryPrice - currentPrice;
        }

        // 2. 計算美金總損益 (微型黃金合約乘數為 10)
        const contractSize = 10; 
        const totalPnLUSD = pointDiff * contractSize * quantity;

        // 3. 計算台幣總損益 (四捨五入至整數)
        const totalPnLTWD = Math.round(totalPnLUSD * exchangeRate);

        // 4. 渲染畫面
        pointDiffEl.innerText = (pointDiff > 0 ? '+' : '') + pointDiff.toFixed(1) + " 美元";
        
        // 格式化千分位用
        const formatterTWD = new Intl.NumberFormat('zh-TW');

        if (totalPnLUSD > 0) {
            pnlUSDEl.innerText = `+$${totalPnLUSD.toFixed(2)}`;
            pnlTWDEl.innerText = `+NT$ ${formatterTWD.format(totalPnLTWD)}`;
            
            pnlUSDEl.className = "result-value pnl-usd profit";
            pnlTWDEl.className = "result-value pnl-twd profit";
        } else if (totalPnLUSD < 0) {
            pnlUSDEl.innerText = `-$${Math.abs(totalPnLUSD).toFixed(2)}`;
            pnlTWDEl.innerText = `-NT$ ${formatterTWD.format(Math.abs(totalPnLTWD))}`;
            
            pnlUSDEl.className = "result-value pnl-usd loss";
            pnlTWDEl.className = "result-value pnl-twd loss";
        } else {
            pnlUSDEl.innerText = `$${totalPnLUSD.toFixed(2)}`;
            pnlTWDEl.innerText = `NT$ 0`;
            
            pnlUSDEl.className = "result-value pnl-usd neutral";
            pnlTWDEl.className = "result-value pnl-twd neutral";
        }
    }
</script>

</body>
</html>
