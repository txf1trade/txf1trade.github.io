<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PRO TRADING TERMINAL - Mobile Optimized</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lightweight Charts v4 CDN -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            tvBg: '#131722',
            tvPanel: '#1e222d',
            tvHover: '#2a2e39',
            tvBorder: '#2a2e39',
            tvText: '#d1d4dc',
            tvTextMuted: '#787b86',
            tvUp: '#089981',
            tvDown: '#f23645',
            tvAccent: '#2962ff'
          }
        }
      }
    }
  </script>
  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 3px; height: 3px; }
    ::-webkit-scrollbar-track { background: #131722; }
    ::-webkit-scrollbar-thumb { background: #2a2e39; border-radius: 3px; }

    .flash-up { animation: flashGreen 0.6s ease-out; }
    .flash-down { animation: flashRed 0.6s ease-out; }
    @keyframes flashGreen { 0% { background-color: rgba(8, 153, 129, 0.4); } 100% { background-color: transparent; } }
    @keyframes flashRed { 0% { background-color: rgba(242, 54, 69, 0.4); } 100% { background-color: transparent; } }

    .compact-table-row { font-size: 11px; }

    /* 手機版預設收合為抽屜 (Drawer) */
    #watchlist-wrapper {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 100%;
      max-width: 340px;
      background-color: #1e222d;
      border-left: 1px solid #2a2e39;
      display: flex;
      flex-direction: column;
      z-index: 50;
      transform: translateX(100%);
      transition: transform 0.25s ease-in-out;
      box-shadow: -5px 0 25px rgba(0,0,0,0.5);
    }

    #watchlist-wrapper.open {
      transform: translateX(0);
    }

    /* 桌面版寬螢幕樣式 (支援寬度收合與拖曳) */
    @media (min-width: 768px) {
      #watchlist-wrapper {
        position: relative;
        transform: none !important;
        width: 380px;
        box-shadow: none;
        transition: width 0.2s ease, border-left 0.2s ease;
        overflow: hidden;
      }
      #watchlist-wrapper.collapsed {
        width: 0px;
        border-left: none;
      }
    }

    /* 手機遮罩層 */
    #drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 40;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease-in-out;
    }
    #drawer-backdrop.show {
      opacity: 1;
      pointer-events: auto;
    }
    @media (min-width: 768px) {
      #drawer-backdrop { display: none !important; }
    }
  </style>
</head>
<body class="bg-tvBg text-tvText font-sans h-[100dvh] w-screen overflow-hidden flex flex-col select-none">

  <!-- Top Global Header -->
  <header class="h-11 bg-tvPanel border-b border-tvBorder flex items-center justify-between px-2 sm:px-3 shrink-0 z-25 relative">
    <div class="flex items-center space-x-1.5 sm:space-x-3 overflow-x-auto no-scrollbar">
      <div class="flex items-center space-x-1.5 text-tvAccent font-bold text-xs sm:text-base tracking-wider shrink-0">
        <i class="fa-solid fa-chart-line"></i>
        <span class="hidden xs:inline">PRO TERMINAL</span>
      </div>
      <div class="h-4 w-px bg-tvBorder shrink-0"></div>
      
      <!-- Timeframe Selector -->
      <div id="timeframe-container" class="flex items-center space-x-1 text-xs font-mono shrink-0">
        <button data-res="1" class="tf-btn px-2 py-1 rounded hover:bg-tvHover text-tvTextMuted transition-colors">1</button>
        <button data-res="5" class="tf-btn px-2 py-1 rounded hover:bg-tvHover text-tvTextMuted transition-colors">5</button>
        <button data-res="15" class="tf-btn px-2 py-1 rounded bg-tvHover text-white font-medium shadow">15</button>
        <button data-res="60" class="tf-btn px-2 py-1 rounded hover:bg-tvHover text-tvTextMuted transition-colors">60</button>
        <button data-res="1D" class="tf-btn px-2 py-1 rounded hover:bg-tvHover text-tvTextMuted transition-colors">D</button>
      </div>

      <div class="h-4 w-px bg-tvBorder shrink-0"></div>

      <!-- K線風格切換按鈕 -->
      <button id="btn-style-toggle" class="px-2 py-1 rounded bg-tvHover text-white text-[11px] sm:text-xs font-mono hover:bg-tvBorder transition-colors shadow shrink-0">
        風格: 紅漲綠跌
      </button>
    </div>

    <!-- Right Global Status / Actions -->
    <div class="flex items-center space-x-2 text-xs shrink-0">
      <div id="api-status-badge" class="hidden sm:flex items-center space-x-1.5 text-tvUp bg-tvUp/10 px-2.5 py-1 rounded border border-tvUp/20 font-mono">
        <span id="api-status-dot" class="w-2 h-2 rounded-full bg-tvUp animate-pulse"></span>
        <span id="api-status-text" class="text-[11px] font-medium">即時連線中</span>
      </div>
    </div>
  </header>

  <!-- Main Grid Content -->
  <div class="flex-1 flex overflow-hidden relative">
    
    <!-- Left Section: Chart Area -->
    <div class="flex-1 flex flex-col min-w-0 border-r border-tvBorder bg-tvBg">
      <!-- Active Symbol Info Bar -->
      <div class="h-9 sm:h-10 bg-tvPanel/50 border-b border-tvBorder flex items-center justify-between px-3 sm:px-4 text-xs shrink-0">
        <div class="flex items-center space-x-2 truncate">
          <span id="active-symbol-title" class="font-bold text-white text-xs sm:text-sm truncate">台指期全 TX-1</span>
          <span id="active-symbol-exch" class="text-tvTextMuted text-[10px] hidden xs:inline">TAIFEX</span>
        </div>
        <div id="active-price-badge" class="flex items-center space-x-1.5 font-mono font-bold shrink-0">
          <span id="active-price" class="text-xs sm:text-sm">--</span>
          <span id="active-change" class="text-[10px] sm:text-xs px-1.5 py-0.5 rounded">--</span>
        </div>
      </div>

      <!-- Lightweight Chart Container & Legend -->
      <div class="flex-1 relative w-full h-full bg-tvBg flex flex-col">
        <!-- 主圖左上角數值即時標籤 -->
        <div id="chart-legend" class="absolute top-2 left-2 z-10 flex flex-wrap items-center gap-x-2 gap-y-0.5 text-[10px] sm:text-xs font-mono bg-tvPanel/80 px-2 py-1 rounded border border-tvBorder pointer-events-none shadow">
          <span class="text-white font-bold">EMA</span>
          <span id="legend-ema20-group" class="text-[#ffcc66]">EMA20: <span id="legend-ema20">--</span></span>
          <span id="legend-ema60-group" class="text-[#28c6ee]">EMA60: <span id="legend-ema60">--</span></span>
          <span id="legend-daily-group" class="text-[#ee3b76] hidden"><span id="label-daily">EMA76</span>: <span id="legend-dailyval">--</span></span>
          <span id="legend-weekly-group" class="text-[#2186c0] hidden"><span id="label-weekly">EMA380</span>: <span id="legend-weeklyval">--</span></span>
        </div>

        <div id="chart-container" class="flex-1 w-full relative"></div>

        <!-- 畫面下方的底部指標切換列 -->
        <div class="h-9 sm:h-10 bg-tvPanel border-t border-tvBorder flex items-center px-3 sm:px-4 space-x-4 sm:space-x-6 text-xs shrink-0 z-20 font-mono select-none">
          <button data-ind="ema" class="ind-tab text-[#ffcc66] font-bold border-b-2 border-[#ffcc66] pb-0.5 sm:pb-1 transition-colors">EMA</button>
          <button data-ind="daily" class="ind-tab text-tvTextMuted hover:text-white transition-colors">日週線</button>
          <button data-ind="vol" class="ind-tab text-tvTextMuted hover:text-white transition-colors">成交量</button>
        </div>
      </div>
    </div>

    <!-- Resizer Drag Handle Bar -->
    <div id="panel-resizer" class="hidden md:block w-1 bg-tvBorder hover:bg-tvAccent cursor-ew-resize shrink-0 transition-colors z-30 select-none relative group" title="拖曳調整面板寬度">
      <div class="absolute inset-y-0 -left-1 -right-1 cursor-ew-resize"></div>
    </div>

    <!-- 手機抽屜背景遮罩 -->
    <div id="drawer-backdrop"></div>

    <!-- 右側自選面板 Wrapper -->
    <div id="watchlist-wrapper">
      <!-- Watchlist Header -->
      <div class="h-10 px-3 border-b border-tvBorder flex items-center justify-between shrink-0">
        <div class="flex items-center space-x-2">
          <span class="font-bold text-sm text-white">自選商品群組</span>
          <span class="text-xs bg-tvHover px-2 py-0.5 rounded text-tvTextMuted font-mono" id="watchlist-count">0</span>
        </div>
        <div class="flex items-center space-x-1">
          <button id="btn-open-modal" class="p-1.5 hover:bg-tvHover rounded text-tvText hover:text-white" title="新增自選商品">
            <i class="fa-solid fa-plus text-xs"></i>
          </button>
          <!-- 手機版專屬關閉按鈕 -->
          <button id="btn-close-drawer" class="md:hidden p-1.5 hover:bg-tvHover rounded text-tvTextMuted hover:text-white">
            <i class="fa-solid fa-xmark"></i>
          </button>
        </div>
      </div>

      <!-- Watchlist Table Header -->
      <div class="flex items-center px-2 py-2 text-[11px] text-tvTextMuted font-medium border-b border-tvBorder shrink-0 bg-tvBg/40 w-full">
        <div class="w-[18%] text-left truncate pr-0.5">代號</div>
        <div class="w-[22%] text-left truncate px-0.5">名稱</div>
        <div class="w-[22%] text-right truncate px-0.5">成交價</div>
        <div class="w-[18%] text-right truncate px-0.5">漲跌</div>
        <div class="w-[20%] text-right truncate pl-0.5 pr-1">總量</div>
      </div>

      <!-- Watchlist Items Container -->
      <div id="watchlist-items" class="flex-1 overflow-y-auto divide-y divide-tvBorder/30 w-full"></div>

      <!-- Bottom Quick Summary Card -->
      <div id="symbol-detail-card" class="p-3 border-t border-tvBorder bg-tvBg/80 text-xs shrink-0">
        <div class="flex justify-between items-start mb-1.5">
          <div>
            <div id="card-name" class="font-bold text-white text-sm">--</div>
            <div id="card-code" class="text-tvTextMuted text-[10px] bg-tvHover px-1.5 py-0.5 rounded font-mono mt-0.5 inline-block">--</div>
          </div>
          <div id="card-change-badge" class="font-mono text-right font-bold text-xs px-2 py-0.5 rounded bg-tvHover">--</div>
        </div>
        <div class="flex items-baseline space-x-2 my-1">
          <span id="card-price" class="text-xl font-bold font-mono text-white">--</span>
          <span class="text-[10px] text-tvTextMuted">TWD</span>
        </div>
        <div class="grid grid-cols-2 gap-x-4 gap-y-1 mt-2 pt-2 border-t border-tvBorder/30 text-[11px] font-mono">
          <div class="flex justify-between"><span class="text-tvTextMuted">最高:</span> <span id="card-high" class="text-tvUp">--</span></div>
          <div class="flex justify-between"><span class="text-tvTextMuted">最低:</span> <span id="card-low" class="text-tvDown">--</span></div>
          <div class="flex justify-between"><span class="text-tvTextMuted">總量:</span> <span id="card-vol" class="text-white">--</span></div>
          <div class="flex justify-between"><span class="text-tvTextMuted">昨收:</span> <span id="card-ref" class="text-tvText">--</span></div>
        </div>
      </div>
    </div>

    <!-- 最右側官方圖示側邊欄 -->
    <div id="sidebar-icons">
      <button class="sidebar-btn active" id="toggle-watchlist-btn" title="自選商品清單">
        <svg width="20" height="20" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M7 4.5C7 3.67157 7.67157 3 8.5 3H19.5C20.3284 3 21 3.67157 21 4.5V24.5L14 19.5L7 24.5V4.5Z"></path>
          <line x1="10" y1="8" x2="18" y2="8" stroke-width="2"></line>
          <line x1="10" y1="12" x2="18" y2="12" stroke-width="2"></line>
        </svg>
      </button>
    </div>
  </div>

  <!-- Add Symbol Modal -->
  <div id="add-symbol-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm flex items-center justify-center hidden z-50 p-4">
    <div class="bg-tvPanel border border-tvBorder rounded-lg w-full max-w-sm p-4 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b border-tvBorder pb-2">
        <h3 class="text-sm font-bold text-white">新增自選商品</h3>
        <button id="btn-close-modal" class="text-tvTextMuted hover:text-white"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <form id="add-symbol-form" class="space-y-3 text-xs">
        <div>
          <label class="block text-tvTextMuted mb-1">商品名稱</label>
          <input type="text" id="input-name" required placeholder="例如: 台積電" class="w-full bg-tvBg border border-tvBorder rounded px-3 py-2 text-white focus:outline-none focus:border-tvAccent">
        </div>
        <div>
          <label class="block text-tvTextMuted mb-1">商品代號</label>
          <input type="text" id="input-code" required placeholder="例如: 2330" class="w-full bg-tvBg border border-tvBorder rounded px-3 py-2 text-white focus:outline-none focus:border-tvAccent">
        </div>
        <div class="flex justify-end space-x-2 pt-2">
          <button type="button" id="btn-cancel-modal" class="px-3 py-1.5 rounded bg-tvHover text-tvText hover:text-white">取消</button>
          <button type="submit" class="px-3 py-1.5 rounded bg-tvAccent text-white font-medium hover:bg-blue-600">確定新增</button>
        </div>
      </form>
    </div>
  </div>

  <!-- JavaScript Application Logic -->
  <script>
    const symbolLineConfigs = {
      'TX-1': { daily: 76, weekly: 380 },                           
      'TXAM-1': { daily: 76, weekly: 380 },                         
      'TWN-1': { daily: 80, weekly: 400 },                          
      'NQ-1': { daily: 92, weekly: 460 },                           
      'GC-1': { daily: 92, weekly: 460 },                           
      'NK-1': { daily: 92, weekly: 460 },                           
      'DEFAULT': { daily: 76, weekly: 380 }                         
    };

    function getLineParams(code) {
      const upper = (code || '').toUpperCase();
      return symbolLineConfigs[upper] || symbolLineConfigs['DEFAULT'];
    }

    let watchlistGroups = [
      {
        groupName: '台股重點',
        items: [
          { id: '1', name: '台指期全', code: 'TX-1', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TAIFEX' },
          { id: '2', name: '台指期日', code: 'TXAM-1', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TAIFEX' },
          { id: '3', name: '加權指數', code: 'TSEA', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TWSE' },
          { id: '4', name: '櫃買指數', code: 'OTCA', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TPEX' },
          { id: '5', name: '台積電', code: '2330', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TWSE' },
          { id: '8', name: '富台指', code: 'TWN-1', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TAIFEX' },
          { id: '9', name: '台灣VIX', code: 'TAIWANVIX', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'TAIFEX' }
        ]
      },
      {
        groupName: '海期',
        items: [
          { id: '10', name: '納指期', code: 'NQ-1', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'CME' },
          { id: '11', name: '黃金', code: 'GC-1', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'COMEX' },
          { id: '12', name: '日經225', code: 'NK-1', price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'OSE' }
        ]
      }
    ];

    let selectedSymbolId = '1';
    let currentResolution = '15'; 
    let currentCandles = []; 
    let isTaiwanStyle = true; 
    let chart, candlestickSeries, ema20Series, ema60Series, dailySeries, weeklySeries, volumeSeries;

    let indicatorStates = {
      ema: true,
      daily: false,
      vol: false
    };

    function getAllWatchlistItems() {
      let items = [];
      watchlistGroups.forEach(g => items.push(...g.items));
      return items;
    }

    function calculateEMA(data, period) {
      let results = [];
      if (period <= 0 || data.length === 0) return results;
      let multiplier = 2 / (period + 1);
      let prevEMA = null;
      for (let i = 0; i < data.length; i++) {
        let close = data[i].close;
        if (i === 0) {
          prevEMA = close;
        } else {
          prevEMA = (close - prevEMA) * multiplier + prevEMA;
        }
        results.push({ time: data[i].time, value: prevEMA });
      }
      return results;
    }

    function initChart() {
      const container = document.getElementById('chart-container');
      
      chart = LightweightCharts.createChart(container, {
        layout: {
          background: { type: 'solid', color: '#131722' },
          textColor: '#ffffff',
          separatorColor: '#2a2e39',
          separatorHoverColor: '#2962ff',
        },
        grid: {
          vertLines: { color: '#1e222d' },
          horzLines: { color: '#1e222d' },
        },
        crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
        rightPriceScale: { borderColor: '#2a2e39', textColor: '#ffffff', autoScale: true },
        timeScale: {
          borderColor: '#2a2e39',
          timeVisible: true,
          secondsVisible: false,
          textColor: '#ffffff',
          tickMarkFormatter: (time) => {
            const date = new Date(time * 1000);
            if (currentResolution === '1D') return `${date.getMonth() + 1}/${date.getDate()}`;
            return date.toLocaleTimeString('zh-TW', { timeZone: 'Asia/Taipei', hour12: false, hour: '2-digit', minute: '2-digit' });
          }
        },
        localization: {
          locale: 'zh-TW',
          timeFormatter: timestamp => {
            const date = new Date(timestamp * 1000);
            if (currentResolution === '1D') return `${date.getMonth() + 1}/${date.getDate()}`;
            return date.toLocaleString('zh-TW', { timeZone: 'Asia/Taipei', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hour12: false });
          }
        },
      });

      candlestickSeries = chart.addCandlestickSeries({
        upColor: '#f23645',
        downColor: '#089981',
        borderVisible: false,
        wickUpColor: '#f23645',
        wickDownColor: '#089981',
        pane: 0,
      });

      ema20Series = chart.addLineSeries({
        color: '#ffcc66',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
        pane: 0,
      });

      ema60Series = chart.addLineSeries({
        color: '#28c6ee',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
        pane: 0,
      });

      dailySeries = chart.addLineSeries({
        color: '#ee3b76',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
        pane: 0,
      });

      weeklySeries = chart.addLineSeries({
        color: '#2186c0',
        lineWidth: 2,
        priceLineVisible: false,
        lastValueVisible: true,
        pane: 0,
      });

      volumeSeries = chart.addHistogramSeries({
        color: '#26a69a',
        priceFormat: { type: 'volume' },
        pane: 1,
      });

      chart.subscribeCrosshairMove(param => {
        if (!param || !param.time || !currentCandles.length) return;
        const time = param.time;
        const allItems = getAllWatchlistItems();
        const currentSymbol = allItems.find(s => s.id === selectedSymbolId) || { code: 'TX-1' };
        const params = getLineParams(currentSymbol.code);

        const e20Data = calculateEMA(currentCandles, 20);
        const e60Data = calculateEMA(currentCandles, 60);
        const dailyData = calculateEMA(currentCandles, params.daily);
        const weeklyData = calculateEMA(currentCandles, params.weekly);

        const match20 = e20Data.find(d => d.time === time);
        const match60 = e60Data.find(d => d.time === time);
        const matchDaily = dailyData.find(d => d.time === time);
        const matchWeekly = weeklyData.find(d => d.time === time);

        if (indicatorStates.ema) {
          document.getElementById('legend-ema20').textContent = match20 ? match20.value.toFixed(2) : '--';
          document.getElementById('legend-ema60').textContent = match60 ? match60.value.toFixed(2) : '--';
        }
        if (indicatorStates.daily) {
          document.getElementById('legend-dailyval').textContent = matchDaily ? matchDaily.value.toFixed(2) : '--';
          document.getElementById('legend-weeklyval').textContent = matchWeekly ? matchWeekly.value.toFixed(2) : '--';
        }
      });

      window.addEventListener('resize', () => {
        chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
      });
    }

    function updateIndicatorDisplay() {
      const allItems = getAllWatchlistItems();
      const currentSymbol = allItems.find(s => s.id === selectedSymbolId) || { code: 'TX-1' };
      const params = getLineParams(currentSymbol.code);

      const ema20Group = document.getElementById('legend-ema20-group');
      const ema60Group = document.getElementById('legend-ema60-group');
      if (indicatorStates.ema && currentCandles.length > 0) {
        ema20Series.setData(calculateEMA(currentCandles, 20));
        ema60Series.setData(calculateEMA(currentCandles, 60));
        ema20Series.applyOptions({ visible: true });
        ema60Series.applyOptions({ visible: true });
        ema20Group.style.display = 'inline-block';
        ema60Group.style.display = 'inline-block';
      } else {
        ema20Series.setData([]);
        ema60Series.setData([]);
        ema20Series.applyOptions({ visible: false });
        ema60Series.applyOptions({ visible: false });
        ema20Group.style.display = 'none';
        ema60Group.style.display = 'none';
      }

      const dailyGroup = document.getElementById('legend-daily-group');
      const weeklyGroup = document.getElementById('legend-weekly-group');
      document.getElementById('label-daily').textContent = `EMA${params.daily}`;
      document.getElementById('label-weekly').textContent = `EMA${params.weekly}`;

      if (indicatorStates.daily && currentCandles.length > 0) {
        dailySeries.setData(calculateEMA(currentCandles, params.daily));
        weeklySeries.setData(calculateEMA(currentCandles, params.weekly));
        dailySeries.applyOptions({ visible: true });
        weeklySeries.applyOptions({ visible: true });
        dailyGroup.style.display = 'inline-block';
        weeklyGroup.style.display = 'inline-block';
      } else {
        dailySeries.setData([]);
        weeklySeries.setData([]);
        dailySeries.applyOptions({ visible: false });
        weeklySeries.applyOptions({ visible: false });
        dailyGroup.style.display = 'none';
        weeklyGroup.style.display = 'none';
      }

      if (indicatorStates.vol && currentCandles.length > 0) {
        const upCol = isTaiwanStyle ? '#f23645' : '#089981';
        const downCol = isTaiwanStyle ? '#089981' : '#f23645';
        const volData = currentCandles.map(c => ({
          time: c.time,
          value: c.volume || 1000,
          color: c.close >= c.open ? upCol : downCol
        }));
        volumeSeries.setData(volData);
        volumeSeries.applyOptions({ visible: true });
      } else {
        volumeSeries.setData([]);
        volumeSeries.applyOptions({ visible: false });
      }

      const legend = document.getElementById('chart-legend');
      if (!indicatorStates.ema && !indicatorStates.daily) {
        legend.style.display = 'none';
      } else {
        legend.style.display = 'flex';
      }
    }

    function getResolutionSeconds(res) {
      if (res === '1') return 60;
      if (res === '5') return 300;
      if (res === '15') return 900;
      if (res === '60') return 3600;
      if (res === '1D') return 86400;
      return 900;
    }

    async function loadHistoryData(symbolCode, resolution) {
      currentCandles = []; 
      const toTime = Math.floor(Date.now() / 1000);
      const daysToSubtract = resolution === '1D' ? 365 : 60;
      const fromTime = toTime - (daysToSubtract * 24 * 60 * 60);
      const url = `https://tv-signalr.futures-op.com/history?agent=futuresai&product=web&symbol=${encodeURIComponent(symbolCode)}&resolution=${resolution}&from=${fromTime}&to=${toTime}&ws=true&metaData=true`;

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
        const data = await response.json();

        let candleData = [];
        const barsData = Array.isArray(data) ? data : (data.bars || []);
        const normalizeTime = t => t > 1e10 ? Math.floor(t / 1000) : t;

        if (Array.isArray(barsData) && barsData.length > 0) {
          barsData.forEach(item => {
            let rawTime = item.time || new Date(item.datetime).getTime();
            let time = normalizeTime(rawTime);
            if (resolution === '1D') time -= 86400; 
            const volume = item.volume !== undefined ? item.volume : (Math.floor(Math.random() * 20000 + 5000));
            candleData.push({ time, open: item.open, high: item.high, low: item.low, close: item.close, volume });
          });
        }

        if (candleData.length > 0) {
          candleData.sort((a, b) => a.time - b.time);
          currentCandles = candleData;
          candlestickSeries.setData(currentCandles);
          updateIndicatorDisplay();

          if (currentCandles.length > 0) {
            const allItems = getAllWatchlistItems();
            const currentSymbol = allItems.find(s => s.id === selectedSymbolId) || { code: symbolCode };
            const params = getLineParams(currentSymbol.code);

            const last20 = calculateEMA(currentCandles, 20);
            const last60 = calculateEMA(currentCandles, 60);
            const lastDaily = calculateEMA(currentCandles, params.daily);
            const lastWeekly = calculateEMA(currentCandles, params.weekly);

            if (indicatorStates.ema && last20.length > 0) {
              document.getElementById('legend-ema20').textContent = last20[last20.length - 1].value.toFixed(2);
              document.getElementById('legend-ema60').textContent = last60[last60.length - 1].value.toFixed(2);
            }
            if (indicatorStates.daily && lastDaily.length > 0) {
              document.getElementById('legend-dailyval').textContent = lastDaily[lastDaily.length - 1].value.toFixed(2);
              document.getElementById('legend-weeklyval').textContent = lastWeekly[lastWeekly.length - 1].value.toFixed(2);
            }
          }

          const barsCount = currentCandles.length;
          chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, barsCount - 80), to: barsCount - 1 });
          chart.priceScale('right').applyOptions({ autoScale: true });
          return;
        }
        throw new Error('API 資料為空');
      } catch (err) {
        loadMockHistoryFallback(symbolCode);
      }
    }

    function loadMockHistoryFallback(symbolCode) {
      const now = Math.floor(Date.now() / 1000);
      let candleData = [];
      let basePrice = symbolCode === '2330' ? 980 : (symbolCode.includes('TX') ? 22600 : 250);
      const step = getResolutionSeconds(currentResolution);

      for (let i = 80; i >= 1; i--) {
        let time = now - (i * step);
        if (currentResolution === '1D') time -= 86400;
        const open = basePrice + (Math.random() * 20 - 10);
        const high = open + Math.random() * 15;
        const low = open - Math.random() * 15;
        const close = (open + high + low) / 3;
        basePrice = close;
        const volume = Math.floor(Math.abs(high - low) * 1000 + 5000);
        candleData.push({ time, open, high, low, close, volume });
      }

      currentCandles = candleData;
      candlestickSeries.setData(currentCandles);
      updateIndicatorDisplay();

      if (currentCandles.length > 0) {
        const params = getLineParams(symbolCode);
        const last20 = calculateEMA(currentCandles, 20);
        const last60 = calculateEMA(currentCandles, 60);
        const lastDaily = calculateEMA(currentCandles, params.daily);
        const lastWeekly = calculateEMA(currentCandles, params.weekly);

        if (indicatorStates.ema && last20.length > 0) {
          document.getElementById('legend-ema20').textContent = last20[last20.length - 1].value.toFixed(2);
          document.getElementById('legend-ema60').textContent = last60[last60.length - 1].value.toFixed(2);
        }
        if (indicatorStates.daily && lastDaily.length > 0) {
          document.getElementById('legend-dailyval').textContent = lastDaily[lastDaily.length - 1].value.toFixed(2);
          document.getElementById('legend-weeklyval').textContent = lastWeekly[lastWeekly.length - 1].value.toFixed(2);
        }
      }

      const barsCount = currentCandles.length;
      chart.timeScale().setVisibleLogicalRange({ from: Math.max(0, barsCount - 80), to: barsCount - 1 });
      chart.priceScale('right').applyOptions({ autoScale: true });
    }

    async function fetchRealtimeQuotes() {
      const allItems = getAllWatchlistItems();
      if (allItems.length === 0 || currentCandles.length === 0) return;
      const symbolsParam = allItems.map(item => item.code).join(',');
      const apiUrl = `https://realtime-quote-signalr-v2.futures-op.com/quote?symbol=${encodeURIComponent(symbolsParam)}`;

      try {
        const response = await fetch(apiUrl);
        if (!response.ok) throw new Error('API Error');
        const data = await response.json();

        if (Array.isArray(data)) {
          data.forEach(quote => {
            const item = allItems.find(i => i.code.toUpperCase() === quote.symbol.toUpperCase());
            if (item) {
              const oldPrice = item.price;
              const newPrice = quote.close || item.price;
              item.price = newPrice;
              item.refPrice = quote.prevRef || item.refPrice;
              item.volume = quote.volume || item.volume;
              item.high = quote.high || item.high;
              item.low = quote.low || item.low;

              if (item.id === selectedSymbolId && newPrice > 0 && candlestickSeries && currentCandles.length > 0) {
                const stepSeconds = getResolutionSeconds(currentResolution);
                const nowSec = Math.floor(Date.now() / 1000);
                const currentBarTime = currentResolution === '1D' 
                  ? Math.floor(nowSec / 86400) * 86400 - 86400 
                  : Math.floor(nowSec / stepSeconds) * stepSeconds;

                let lastBar = currentCandles[currentCandles.length - 1];

                if (lastBar.time === currentBarTime) {
                  lastBar.high = Math.max(lastBar.high, newPrice);
                  lastBar.low = Math.min(lastBar.low, newPrice);
                  lastBar.close = newPrice;
                  candlestickSeries.update(lastBar);
                } else if (currentBarTime > lastBar.time) {
                  const newBar = {
                    time: currentBarTime,
                    open: lastBar.close,
                    high: Math.max(lastBar.close, newPrice),
                    low: Math.min(lastBar.close, newPrice),
                    close: newPrice,
                    volume: item.volume || 1000
                  };
                  currentCandles.push(newBar);
                  candlestickSeries.update(newBar);
                }

                const params = getLineParams(item.code);
                if (indicatorStates.ema) {
                  const e20Data = calculateEMA(currentCandles, 20);
                  if (e20Data.length > 0) {
                    ema20Series.update(e20Data[e20Data.length - 1]);
                    document.getElementById('legend-ema20').textContent = e20Data[e20Data.length - 1].value.toFixed(2);
                  }
                  const e60Data = calculateEMA(currentCandles, 60);
                  if (e60Data.length > 0) {
                    ema60Series.update(e60Data[e60Data.length - 1]);
                    document.getElementById('legend-ema60').textContent = e60Data[e60Data.length - 1].value.toFixed(2);
                  }
                }
                if (indicatorStates.daily) {
                  const dailyData = calculateEMA(currentCandles, params.daily);
                  if (dailyData.length > 0) {
                    dailySeries.update(dailyData[dailyData.length - 1]);
                    document.getElementById('legend-dailyval').textContent = dailyData[dailyData.length - 1].value.toFixed(2);
                  }
                  const weeklyData = calculateEMA(currentCandles, params.weekly);
                  if (weeklyData.length > 0) {
                    weeklySeries.update(weeklyData[weeklyData.length - 1]);
                    document.getElementById('legend-weeklyval').textContent = weeklyData[weeklyData.length - 1].value.toFixed(2);
                  }
                }
              }
            }
          });

          renderWatchlist();
          const activeSymbol = allItems.find(s => s.id === selectedSymbolId);
          if (activeSymbol) {
            updateActivePriceDisplay(activeSymbol);
            updateDetailCard(activeSymbol);
          }
          document.getElementById('api-status-text').textContent = '即時連線中';
          document.getElementById('api-status-dot').className = 'w-2 h-2 rounded-full bg-tvUp animate-pulse';
          document.getElementById('api-status-badge').className = 'flex items-center space-x-1.5 text-tvUp bg-tvUp/10 px-2.5 py-1 rounded border border-tvUp/20 font-mono';
        }
      } catch (err) {
        document.getElementById('api-status-text').textContent = '連線異常/重試中';
        document.getElementById('api-status-dot').className = 'w-2 h-2 rounded-full bg-tvDown animate-pulse';
        document.getElementById('api-status-badge').className = 'flex items-center space-x-1.5 text-tvDown bg-tvDown/10 px-2.5 py-1 rounded border border-tvDown/20 font-mono';
      }
    }

    function renderWatchlist() {
      const container = document.getElementById('watchlist-items');
      container.innerHTML = '';
      const allItems = getAllWatchlistItems();
      document.getElementById('watchlist-count').textContent = allItems.length;

      watchlistGroups.forEach(group => {
        const groupHeader = document.createElement('div');
        groupHeader.className = 'px-2 py-1.5 bg-tvBg/80 text-tvTextMuted font-bold text-[11px] border-b border-tvBorder tracking-wide uppercase flex items-center justify-between';
        groupHeader.innerHTML = `<span>${group.groupName}</span><i class="fa-solid fa-chevron-down text-[10px]"></i>`;
        container.appendChild(groupHeader);

        group.items.forEach(item => {
          const hasRef = item.refPrice > 0;
          const change = hasRef ? (item.price - item.refPrice) : 0;
          const changePercent = hasRef ? ((change / item.refPrice) * 100).toFixed(2) : '0.00';
          const isUp = change >= 0;
          
          const upColorClass = isTaiwanStyle ? 'text-[#f23645]' : 'text-[#089981]';
          const downColorClass = isTaiwanStyle ? 'text-[#089981]' : 'text-[#f23645]';
          const colorClass = isUp ? upColorClass : downColorClass;
          const isSelected = item.id === selectedSymbolId;

          const row = document.createElement('div');
          row.id = `watchlist-row-${item.id}`;
          row.className = `flex items-center px-2 py-2 compact-table-row cursor-pointer hover:bg-tvHover/70 transition-colors group relative w-full ${
            isSelected ? 'bg-tvHover/90 border-l-2 border-tvAccent' : ''
          }`;
          row.onclick = () => selectSymbol(item.id);

          row.innerHTML = `
            <div class="w-[18%] font-mono text-tvTextMuted text-[11px] truncate pr-0.5">${item.code}</div>
            <div class="w-[22%] font-bold text-white truncate px-0.5">${item.name}</div>
            <div class="w-[22%] text-right font-mono font-medium text-white truncate px-0.5">
              ${item.price > 0 ? item.price.toLocaleString(undefined, { minimumFractionDigits: item.price < 1000 ? 2 : 0 }) : '--'}
            </div>
            <div class="w-[18%] text-right font-mono font-medium ${colorClass} truncate px-0.5">
              ${item.price > 0 ? `${isUp ? '+' : ''}${changePercent}%` : '--'}
            </div>
            <div class="w-[20%] text-right font-mono text-tvTextMuted text-[11px] truncate pl-0.5 pr-1">
              ${formatVolume(item.volume)}
            </div>
          `;
          container.appendChild(row);
        });
      });
    }

    function selectSymbol(id) {
      selectedSymbolId = id;
      currentCandles = [];
      const allItems = getAllWatchlistItems();
      const symbol = allItems.find(s => s.id === id);
      if (symbol) {
        renderWatchlist();
        document.getElementById('active-symbol-title').textContent = `${symbol.name} ${symbol.code}`;
        updateActivePriceDisplay(symbol);
        updateDetailCard(symbol);
        loadHistoryData(symbol.code, currentResolution);
      }
    }

    function updateActivePriceDisplay(symbol) {
      const hasRef = symbol.refPrice > 0;
      const change = hasRef ? (symbol.price - symbol.refPrice) : 0;
      const changePercent = hasRef ? ((change / symbol.refPrice) * 100).toFixed(2) : '0.00';
      const isUp = change >= 0;

      const upColorClass = isTaiwanStyle ? 'text-[#f23645]' : 'text-[#089981]';
      const downColorClass = isTaiwanStyle ? 'text-[#089981]' : 'text-[#f23645]';
      const colorClass = isUp ? upColorClass : downColorClass;
      const bgClass = isUp ? (isTaiwanStyle ? 'bg-[#f23645]/20' : 'bg-[#089981]/20') : (isTaiwanStyle ? 'bg-[#089981]/20' : 'bg-[#f23645]/20');

      const priceElem = document.getElementById('active-price');
      const changeElem = document.getElementById('active-change');

      priceElem.textContent = symbol.price > 0 ? symbol.price.toLocaleString(undefined, { minimumFractionDigits: symbol.price < 1000 ? 2 : 0 }) : '--';
      priceElem.className = `text-sm ${colorClass}`;

      changeElem.textContent = symbol.price > 0 ? `${isUp ? '+' : ''}${change.toFixed(1)} (${isUp ? '+' : ''}${changePercent}%)` : '--';
      changeElem.className = `text-xs px-1.5 py-0.5 rounded ${bgClass} ${colorClass}`;
    }

    function updateDetailCard(symbol) {
      const hasRef = symbol.refPrice > 0;
      const change = hasRef ? (symbol.price - symbol.refPrice) : 0;
      const changePercent = hasRef ? ((change / symbol.refPrice) * 100).toFixed(2) : '0.00';
      const isUp = change >= 0;

      const upColorClass = isTaiwanStyle ? 'text-[#f23645]' : 'text-[#089981]';
      const downColorClass = isTaiwanStyle ? 'text-[#089981]' : 'text-[#f23645]';
      const colorClass = isUp ? upColorClass : downColorClass;
      const bgClass = isUp ? (isTaiwanStyle ? 'bg-[#f23645]/20' : 'bg-[#089981]/20') : (isTaiwanStyle ? 'bg-[#089981]/20' : 'bg-[#f23645]/20');

      document.getElementById('card-name').textContent = symbol.name;
      document.getElementById('card-code').textContent = symbol.code;
      document.getElementById('card-price').textContent = symbol.price > 0 ? symbol.price.toLocaleString(undefined, { minimumFractionDigits: symbol.price < 1000 ? 2 : 0 }) : '--';
      document.getElementById('card-high').textContent = symbol.high > 0 ? symbol.high.toFixed(1) : '--';
      document.getElementById('card-low').textContent = symbol.low > 0 ? symbol.low.toFixed(1) : '--';
      document.getElementById('card-ref').textContent = symbol.refPrice > 0 ? symbol.refPrice.toFixed(1) : '--';
      document.getElementById('card-vol').textContent = symbol.volume > 0 ? symbol.volume.toLocaleString() : '--';

      const badge = document.getElementById('card-change-badge');
      badge.textContent = symbol.price > 0 ? `${isUp ? '+' : ''}${change.toFixed(1)} (${isUp ? '+' : ''}${changePercent}%)` : '--';
      badge.className = `font-mono text-right font-bold text-xs px-2 py-0.5 rounded ${bgClass} ${colorClass}`;
    }

    function formatVolume(vol) {
      if (!vol || vol === 0) return '--';
      if (vol >= 10000) return (vol / 1000).toFixed(1) + 'k';
      return vol.toString();
    }

    function initPanelResizer() {
      const resizer = document.getElementById('panel-resizer');
      const panelWrapper = document.getElementById('watchlist-wrapper');
      let isResizing = false;
      let startX = 0;
      let startWidth = 380;

      if (resizer) {
        resizer.addEventListener('mousedown', (e) => {
          isResizing = true;
          startX = e.clientX;
          startWidth = panelWrapper.offsetWidth;
          document.body.style.cursor = 'ew-resize';

          const onMouseMove = (e) => {
            if (!isResizing) return;
            let newWidth = startWidth + (startX - e.clientX);
            newWidth = Math.max(280, Math.min(newWidth, 650));
            panelWrapper.style.width = `${newWidth}px`;
            if (chart) {
              const container = document.getElementById('chart-container');
              chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
            }
          };

          const onMouseUp = () => {
            isResizing = false;
            document.body.style.cursor = '';
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
          };

          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      initChart();
      initPanelResizer();
      renderWatchlist();
      selectSymbol(selectedSymbolId);

      fetchRealtimeQuotes();
      setInterval(fetchRealtimeQuotes, 2000);

      // 手機版與桌面版收合/展開控制
      const toggleWatchlistBtn = document.getElementById('toggle-watchlist-btn');
      const closeDrawerBtn = document.getElementById('btn-close-drawer');
      const watchlistWrapper = document.getElementById('watchlist-wrapper');
      const backdrop = document.getElementById('drawer-backdrop');
      const resizer = document.getElementById('panel-resizer');

      function toggleWatchlist() {
        if (window.innerWidth < 768) {
          // 手機版：開關抽屜
          watchlistWrapper.classList.toggle('open');
          backdrop.classList.toggle('show');
        } else {
          // 桌面版：滑順收合
          watchlistWrapper.classList.toggle('collapsed');
          toggleWatchlistBtn.classList.toggle('active');
          if (watchlistWrapper.classList.contains('collapsed')) {
            if (resizer) resizer.style.display = 'none';
          } else {
            if (resizer) resizer.style.display = 'block';
          }
        }
        setTimeout(() => {
          if (chart) {
            const container = document.getElementById('chart-container');
            chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
          }
        }, 220);
      }

      toggleWatchlistBtn.addEventListener('click', toggleWatchlist);
      if (closeDrawerBtn) closeDrawerBtn.addEventListener('click', toggleWatchlist);
      if (backdrop) backdrop.addEventListener('click', toggleWatchlist);

      // 點擊清單項目後在手機版自動關閉抽屜
      window.addEventListener('symbolSelected', () => {
        if (window.innerWidth < 768) {
          watchlistWrapper.classList.remove('open');
          backdrop.classList.remove('show');
        }
      });

      // 底部指標點擊事件 (EMA、日週線、成交量)
      document.querySelectorAll('.ind-tab').forEach(btn => {
        btn.addEventListener('click', (e) => {
          const indKey = e.target.getAttribute('data-ind');
          indicatorStates[indKey] = !indicatorStates[indKey];

          if (indicatorStates[indKey]) {
            e.target.className = 'ind-tab text-[#ffcc66] font-bold border-b-2 border-[#ffcc66] pb-1 transition-colors';
          } else {
            e.target.className = 'ind-tab text-tvTextMuted hover:text-white transition-colors';
          }

          updateIndicatorDisplay();
        });
      });

      // K線風格切換按鈕事件
      document.getElementById('btn-style-toggle').addEventListener('click', () => {
        isTaiwanStyle = !isTaiwanStyle;
        const btn = document.getElementById('btn-style-toggle');
        if (isTaiwanStyle) {
          btn.textContent = '風格: 紅漲綠跌';
          candlestickSeries.applyOptions({
            upColor: '#f23645',
            downColor: '#089981',
            wickUpColor: '#f23645',
            wickDownColor: '#089981',
          });
        } else {
          btn.textContent = '風格: 綠漲紅跌';
          candlestickSeries.applyOptions({
            upColor: '#089981',
            downColor: '#f23645',
            wickUpColor: '#089981',
            wickDownColor: '#f23645',
          });
        }
        updateIndicatorDisplay();
        renderWatchlist();
        const allItems = getAllWatchlistItems();
        const activeSymbol = allItems.find(s => s.id === selectedSymbolId);
        if (activeSymbol) {
          updateActivePriceDisplay(activeSymbol);
          updateDetailCard(activeSymbol);
        }
      });

      // 時間週期切換
      document.querySelectorAll('.tf-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
          document.querySelectorAll('.tf-btn').forEach(b => {
            b.classList.remove('bg-tvHover', 'text-white', 'font-medium', 'shadow');
            b.classList.add('text-tvTextMuted');
          });
          e.target.classList.add('bg-tvHover', 'text-white', 'font-medium', 'shadow');
          e.target.classList.remove('text-tvTextMuted');

          currentResolution = e.target.getAttribute('data-res');
          currentCandles = []; 
          const allItems = getAllWatchlistItems();
          const symbol = allItems.find(s => s.id === selectedSymbolId);
          if (symbol) loadHistoryData(symbol.code, currentResolution);
        });
      });

      const modal = document.getElementById('add-symbol-modal');
      const openBtn = document.getElementById('btn-open-modal');
      const closeBtn = document.getElementById('btn-close-modal');
      const cancelBtn = document.getElementById('btn-cancel-modal');
      const form = document.getElementById('add-symbol-form');

      const closeModal = () => modal.classList.add('hidden');
      openBtn.onclick = () => modal.classList.remove('hidden');
      closeBtn.onclick = closeModal;
      cancelBtn.onclick = closeModal;

      form.onsubmit = (e) => {
        e.preventDefault();
        const name = document.getElementById('input-name').value;
        const code = document.getElementById('input-code').value.toUpperCase();
        if (name && code) {
          const newSymbol = { id: Date.now().toString(), name, code, price: 0, refPrice: 0, volume: 0, high: 0, low: 0, exch: 'CUSTOM' };
          watchlistGroups[0].items.push(newSymbol);
          renderWatchlist();
          selectSymbol(newSymbol.id);
          form.reset();
          closeModal();
          fetchRealtimeQuotes();
        }
      };
    });

    const originalSelectSymbol = selectSymbol;
    selectSymbol = function(id) {
      originalSelectSymbol(id);
      window.dispatchEvent(new Event('symbolSelected'));
    }
  </script>
</body>
