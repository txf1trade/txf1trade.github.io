<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股期監控 - 完整功能版</title>
    <style>
        :root {
            --bg-black: #000000;
            --text-main: #ffffff;
            --text-dim: #888; 
            --up-red: #ff3b30;
            --down-green: #34c759;
            --accent: #ffcc00;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-main);
            font-family: "PingFang TC", "SF Pro HK", sans-serif;
            margin: 0; padding: 5px;
            -webkit-font-smoothing: antialiased;
        }

        .sticky-top {
            position: sticky; top: 0; background: var(--bg-black); z-index: 10;
            padding-bottom: 5px; border-bottom: 1px solid #333;
        }

        .mode-header { display: flex; gap: 5px; padding: 8px 0; }
        .mode-btn {
            flex: 1; padding: 10px; text-align: center; font-size: 14px;
            font-weight: bold; border-radius: 4px; border: 1px solid #333;
            cursor: pointer; background: #111; color: var(--text-dim);
            transition: all 0.2s;
        }
        .mode-btn.active[data-mode="strong"] { border-color: var(--accent); color: var(--accent); background: rgba(255, 204, 0, 0.1); }
        .mode-btn.active[data-mode="up"] { border-color: var(--up-red); color: var(--up-red); background: rgba(255, 59, 48, 0.1); }
        .mode-btn.active[data-mode="down"] { border-color: var(--down-green); color: var(--down-green); background: rgba(52, 199, 89, 0.1); }

        .filter-container {
            padding: 8px 10px; display: flex; align-items: center; gap: 10px;
            background: #111; border-radius: 4px; margin-bottom: 5px;
            position: relative;
        }
        .filter-label { font-size: 12px; color: var(--text-dim); white-space: nowrap; }
        #rank-val { color: #fff; font-weight: bold; }
        #timer-display { font-family: 'Consolas', monospace; color: var(--accent); font-size: 12px; min-width: 45px; text-align: right; }
        input[type=range] { flex-grow: 1; cursor: pointer; accent-color: var(--accent); }
        
        #refresh-bar {
            position: absolute; bottom: 0; left: 0; height: 2px;
            background: var(--accent); width: 0%; transition: width 0.1s linear;
        }

        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { color: var(--text-dim); font-size: 11px; padding: 8px 5px; text-align: right; cursor: pointer; }
        th:first-child { text-align: left; width: 35%; }
        .sort-icon { font-size: 10px; margin-left: 2px; color: #58a6ff; }

        td { padding: 10px 5px; border-bottom: 1px solid #111; text-align: right; font-size: 14px; position: relative; }
        .name-col { text-align: left; line-height: 1.1; }
        .stock-name { font-weight: 600; color: #fff; font-size: 14px; }
        .stock-id { font-size: 10px; color: var(--text-dim); font-family: 'Consolas', monospace; margin-left: 4px; }

        .score-bar-bg {
            position: absolute; bottom: 4px; right: 5px;
            width: 60px; height: 3px; background: #222; border-radius: 2px; overflow: hidden;
        }
        .score-bar-fill {
            height: 100%; border-radius: 2px; transition: width 0.3s ease;
        }
        .score-val { font-weight: 700; font-family: 'Consolas', monospace; font-size: 14px; display: block; margin-bottom: 2px; }
    </style>
</head>
<body>

    <div class="sticky-top">
        <div class="mode-header">
            <div class="mode-btn active" data-mode="strong" onclick="setMode('strong')">最強動能</div>
            <div class="mode-btn" data-mode="up" onclick="setMode('up')">多頭熱門</div>
            <div class="mode-btn" data-mode="down" onclick="setMode('down')">空頭熱門</div>
        </div>

        <div class="filter-container">
            <span class="filter-label">顯示範圍: <span id="rank-val">前 10 名</span></span>
            <input type="range" id="rank-slider" min="10" max="240" step="10" value="10">
            <span id="timer-display">(5.0s)</span>
            <div id="refresh-bar"></div>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th onclick="handleSort('name')">商品<span id="sort-name" class="sort-icon"></span></th>
                <th onclick="handleSort('near')">近月<span id="sort-near" class="sort-icon">▼</span></th>
                <th onclick="handleSort('far')">遠月<span id="sort-far" class="sort-icon"></span></th>
            </tr>
        </thead>
        <tbody id="main-table"></tbody>
    </table>

    <script>
        const stockMap = {"CAF":"南亞期","CBF":"中鋼期","CCF":"聯電期","CDF":"台績電期","QFF":"小型台績電期","CEF":"富邦金期","CFF":"台塑期","CGF":"仁寶期","CHF":"友達期","CJF":"華南金期","CKF":"國泰金期","CLF":"兆豐金期","CMF":"台新金期","CNF":"中信金期","CQF":"統一期","CRF":"遠東新期","CSF":"華新期","CUF":"中環期","CWF":"佳世達期","CXF":"大同期","CYF":"南亞科期","CZF":"長榮期","DAF":"陽明期","DBF":"華航期","DCF":"彰銀期","DDF":"新光金期","DEF":"永豐金期","DFF":"台泥期","DGF":"台化期","DHF":"鴻海期","DIF":"旺宏期","DJF":"華碩期","QRF":"小型華碩期","DKF":"廣達期","DLF":"中華電期","DNF":"玉山金期","DOF":"元大金期","DPF":"第一金期","DQF":"群創期","DSF":"宏碁期","DVF":"聯發科期","PUF":"小型聯發科期","DWF":"潤泰全期","DXF":"緯創期","DYF":"亞泥期","DZF":"大成期","EEF":"國喬期","EGF":"中石化期","EHF":"東陽期","EKF":"南紡期","EMF":"東元期","EPF":"亞德客-KY期","EYF":"中纖期","EZF":"台肥期","FBF":"東和鋼鐵期","FCF":"中鴻期","FEF":"大成鋼期","FFF":"上銀期","QMF":"小型上銀期","FGF":"川湖期","SVF":"小型川湖期","FKF":"正新期","FNF":"裕隆期","FQF":"光寶科期","FRF":"台達電期","RVF":"小型台達電期","FSF":"金寶期","FTF":"華通期","FVF":"精英期","FWF":"友訊期","FYF":"台亞期","FZF":"華邦電期","GAF":"聯強期","GCF":"鴻準期","GHF":"技嘉期","SLF":"小型技嘉期 ","GIF":"微星期","GJF":"瑞昱期","QGF":"小型瑞昱期","GKF":"群光期","GLF":"正崴期","GMF":"億光期","GNF":"凌陽期","GOF":"漢唐期","UZF":"小型漢唐期","GRF":"京元電子期","GUF":"全新期","GVF":"飛宏期","GWF":"義隆期","COF":"可成期","GXF":"可成期","GYF":"強茂期","GZF":"兆赫期","HAF":"瑞軒期","HBF":"華新科期","HCF":"宏達電期","HHF":"中工期","HIF":"冠德期","HLF":"興富發期","HOF":"華固期","HQF":"新興期","HSF":"長榮航期","IAF":"臺企銀期","IHF":"農林期","IIF":"晶豪科期","IJF":"大立光期","OLF":"小型大立光期","IMF":"亞光期","IOF":"聯詠期","QHF":"小型聯詠期","IPF":"智原期","IQF":"文曄期","IRF":"欣興期","ITF":"晶技期","IXF":"景碩期","IYF":"新日興期","IZF":"明泰期","JBF":"創意期","RWF":"小型創意期","JFF":"嘉澤期","RFF":"小型嘉澤期","JMF":"健策期","RGF":"小型健策期","JNF":"TPK-KY期","JPF":"大聯大期","JSF":"和碩期","JWF":"長虹期","JXF":"群益證期","JZF":"嘉聯益期","KAF":"瑞儀期","KBF":"聯茂期","KCF":"力成期","KDF":"同欣電期","KEF":"台表科期","KFF":"開舒期","KGF":"啟碁期","KIF":"台虹期","KKF":"達方期","KLF":"寶成期","KOF":"宏全期","KPF":"潤泰新期","KSF":"聚陽期","KUF":"台玻期","KWF":"廣宇期","LBF":"健鼎期","LCF":"台灣大期","LEF":"玉晶光期","QJF":"小型玉晶光期","LIF":"台郡期","LMF":"美利達期","LOF":"合庫金期","LQF":"英業達期","LRF":"凱基金期","LTF":"遠傳期","LUF":"臻鼎-KY期","LVF":"中租-KY期","LWF":"儒鴻期","LXF":"國巨期","QEF":"小型國巨期","LYF":"南電期","QSF":"小型南電期","MAF":"葡萄王期","MBF":"敬鵬期","MJF":"致茂期","VDF":"小型致茂期","MKF":"美律期","MQF":"矽格期","MVF":"百和期","MYF":"精華期","OMF":"小型精華期","NAF":"穩懋期","QIF":"小型穩懋期","NBF":"璟德期","NDF":"威剛期","NEF":"欣銓期","NGF":"碩禾期","NIF":"晟德期","NJF":"榮剛期","NLF":"世界期","NMF":"中光電期","NOF":"中美晶期","NQF":"新普期","NSF":"頎邦期","NUF":"網家期","NVF":"元大期","NWF":"群聯期","QNF":"小型群聯期","ODF":"為升期","OEF":"彩晶期","OHF":"胡連期","OPF":"智邦期","SEF":"小型智邦期","OQF":"樺漢期","ORF":"和大期","OSF":"榮成期","OTF":"聯亞期","OUF":"同致期","OVF":"台燿期","OWF":"環球晶期","PBF":"小型環球晶期","OXF":"精測期","OYF":"小型精測期","OZF":"日月光投控期","PAF":"原相期","PCF":"智擎期","PDF":"泰博期","PEF":"台半期","PGF":"台灣高鐵期","PHF":"祥碩期","PNF":"小型祥碩期","PIF":"力旺期","PJF":"台光電期","SFF":"小型台光電期","PKF":"信昌電期","PLF":"合晶期","PMF":"大江期","PPF":"宣德期","PQF":"金居期","PRF":"宏捷科期","PSF":"神達期","PTF":"雙鴻期","ULF":"小型雙鴻期","PVF":"緯穎期","PWF":"小型緯穎期","PXF":"鈊象期","PYF":"小型鈊象期","PZF":"信驊期","QAF":"小型信驊期","QBF":"富采期","QCF":"裕民期","QDF":"台勝科期","QKF":"永豐餘期","QLF":"精材期","QOF":"長興期","QPF":"正隆期","QQF":"僑威期","QTF":"超豐期","QUF":"南茂期","QVF":"光罩期","QWF":"威盛期","QXF":"萬海期","QYF":"高端疫苗期","QZF":"力積電期","RAF":"奇鋐期","UHF":"小型奇鋐期","RBF":"中磊期","RCF":"漢翔期","RDF":"中天期","REF":"新唐期","RJF":"大亞期","RKF":"金像電期","RLF":"元晶期","RMF":"富邦媒期","RQF":"小型富邦媒期","RNF":"合一期","ROF":"立端期","RPF":"寶雅期","RRF":"小型寶雅期","RUF":"世紀鋼期","SWF":"小型世紀鋼期","SAF":"美時期","SBF":"華紙期","SDF":"中興電期","SJF":"神基期","SKF":"至上期","SYF":"家登期","SZF":"小型家登期","UAF":"士電期","UBF":"亞翔期","UCF":"廣明期","UEF":"上海商銀期","UFF":"台塑化期","UGF":"達發期","UIF":"小型達發期","UMF":"世芯-KY期","UOF":"小型世芯-KY期","UPF":"保瑞期","UQF":"小型保瑞期","UUF":"台灣虎航期","UVF":"旺矽期","UWF":"小型旺矽期","UXF":"華泰期","UYF":"良維期","VAF":"華榮期","VBF":"燿華期","VCF":"建準期"};

        let cachedData = [];
        let sortConfig = { key: 'near', direction: 'desc' };
        let currentRankLimit = 10;
        let currentMode = 'strong'; 
        let isFetching = false;
        let refreshTimer = 0;
        const REFRESH_INTERVAL = 5000;

        async function fetchData() {
            if (isFetching) return;
            isFetching = true;
            try {
                const response = await fetch('https://market-data-api.futures-ai.com/stkfut_tradeinfo/');
                const data = await response.json();
                if (data && Object.keys(data).length > 0) {
                    // 過濾掉 stockMap 沒定義的標的
                    cachedData = Object.keys(data)
                        .filter(key => stockMap.hasOwnProperty(key)) 
                        .map(key => ({
                            id: key,
                            name: stockMap[key],
                            near: data[key].near_month,
                            far: data[key].next_month,
                            absNear: Math.abs(data[key].near_month)
                        }));
                    render();
                    refreshTimer = 0; 
                }
            } catch (e) { console.error("API Error", e); }
            finally { isFetching = false; }
        }

        function setMode(mode) {
            currentMode = mode;
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === mode));
            sortConfig = { key: 'near', direction: 'desc' };
            updateSortIcons();
            render();
        }

        const slider = document.getElementById('rank-slider');
        const rankVal = document.getElementById('rank-val');
        slider.oninput = function() {
            currentRankLimit = parseInt(this.value);
            rankVal.innerText = currentRankLimit >= 240 ? "全部" : `前 ${currentRankLimit} 名`;
            render();
        };

        function handleSort(key) {
            if (sortConfig.key === key) sortConfig.direction = sortConfig.direction === 'desc' ? 'asc' : 'desc';
            else { sortConfig.key = key; sortConfig.direction = 'desc'; }
            updateSortIcons();
            render();
        }

        function updateSortIcons() {
            ['name', 'near', 'far'].forEach(key => {
                const el = document.getElementById(`sort-${key}`);
                if (sortConfig.key === key) el.innerText = sortConfig.direction === 'desc' ? '▼' : '▲';
                else el.innerText = '';
            });
        }

        function render() {
            const tbody = document.getElementById('main-table');
            let workingList = [...cachedData];

            if (currentMode === 'up') {
                workingList = workingList.filter(item => item.near > 0);
                workingList.sort((a, b) => b.near - a.near);
            } else if (currentMode === 'down') {
                workingList = workingList.filter(item => item.near < 0);
                workingList.sort((a, b) => a.near - b.near);
            } else {
                workingList.sort((a, b) => b.absNear - a.absNear);
            }

            if (currentRankLimit < 240) workingList = workingList.slice(0, currentRankLimit);

            workingList.sort((a, b) => {
                let valA = a[sortConfig.key], valB = b[sortConfig.key];
                if (sortConfig.key === 'name') return sortConfig.direction === 'asc' ? valA.localeCompare(valB, 'zh-Hant') : valB.localeCompare(valA, 'zh-Hant');
                return sortConfig.direction === 'asc' ? valA - valB : valB - valA;
            });

            tbody.innerHTML = '';
            workingList.forEach(item => {
                const row = `
                    <tr>
                        <td class="name-col"><span class="stock-name">${item.name}</span><span class="stock-id">${item.id}</span></td>
                        <td><span class="score-val">${item.near}</span><div class="score-bar-bg"><div class="score-bar-fill" style="width: ${Math.min((Math.abs(item.near)/20)*100, 100)}%; background-color: ${item.near >= 0 ? 'var(--up-red)' : 'var(--down-green)'};"></div></div></td>
                        <td><span class="score-val">${item.far}</span><div class="score-bar-bg"><div class="score-bar-fill" style="width: ${Math.min((Math.abs(item.far)/20)*100, 100)}%; background-color: ${item.far >= 0 ? 'var(--up-red)' : 'var(--down-green)'};"></div></div></td>
                    </tr>`;
                tbody.insertAdjacentHTML('beforeend', row);
            });
        }

        function updateTimer() {
            refreshTimer += 100;
            const remaining = Math.max(0, (REFRESH_INTERVAL - refreshTimer) / 1000);
            document.getElementById('timer-display').innerText = `(${remaining.toFixed(1)}s)`;
            const percentage = (refreshTimer / REFRESH_INTERVAL) * 100;
            document.getElementById('refresh-bar').style.width = Math.min(percentage, 100) + '%';
            if (refreshTimer >= REFRESH_INTERVAL) fetchData();
        }

        fetchData();
        setInterval(updateTimer, 100);
    </script>
</body>
</html>
