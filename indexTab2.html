<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>股期監控-極簡自選版</title>
    <style>
        :root {
            --bg-black: #121212;
            --text-main: #e0e0e0;
            --text-dim: #f3e859; 
            --up-red: #ff3b30;
            --down-green: #34c759;
            --accent: #64ffda;
            --strong-blue: #00e5ff;
            --ai-gold: #ffcc00;
            --surface: #1e1e1e;
            --fav-star: #ffcc00;
        }

        html, body {
            background-color: var(--bg-black);
            margin: 0; padding: 0;
            min-height: 100%;
            -webkit-overflow-scrolling: touch;
            color: var(--text-main);
            font-family: -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex; justify-content: center;
        }

        .app-wrapper { 
            width: 98%; 
            max-width: 550px; 
            background: var(--bg-black); 
            min-height: 100vh;
            padding-bottom: 40px; 
            box-sizing: border-box;
            position: relative;
        }

        .sticky-top {
            position: sticky; top: 0; background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px); z-index: 100; padding: 4px 2px;
            border-bottom: 1px solid #333;
        }

        /* 模式按鈕 */
        .mode-header { display: flex; gap: 4px; margin-bottom: 4px; }
        .mode-btn {
            flex: 1; padding: 10px 2px; text-align: center; font-size: 11px;
            font-weight: bold; border-radius: 4px; border: 1px solid #333;
            cursor: pointer; background: #111; color: var(--text-dim);
            white-space: nowrap;
        }
        .mode-btn.active[data-mode="all"] { border-color: var(--accent); color: var(--accent); background: rgba(100, 255, 218, 0.1); }
        .mode-btn.active[data-mode="up"] { border-color: var(--up-red); color: var(--up-red); background: rgba(255, 59, 48, 0.1); }
        .mode-btn.active[data-mode="down"] { border-color: var(--down-green); color: var(--down-green); background: rgba(52, 199, 89, 0.1); }
        .mode-btn.active[data-mode="strong_buy"] { border-color: var(--strong-blue); color: var(--strong-blue); background: rgba(0, 229, 255, 0.1); }
        .mode-btn.active[data-mode="ai_long"] { border-color: var(--ai-gold); color: var(--ai-gold); background: rgba(255, 204, 0, 0.1); }
        .mode-btn.active[data-mode="fav"] { border-color: var(--fav-star); color: var(--fav-star); background: rgba(255, 204, 0, 0.1); }

        /* 搜尋欄 */
        .search-row { padding: 4px 2px; position: relative; display: flex; align-items: center; }
        #search-input {
            width: 100%; background: #222; border: 1px solid #444; border-radius: 4px;
            padding: 8px; padding-right: 32px; color: #fff; font-size: 14px; box-sizing: border-box;
            outline: none;
        }
        #clear-search {
            position: absolute; right: 10px; color: #888; cursor: pointer; 
            display: none; font-size: 20px; padding: 0 5px; line-height: 1;
        }

        /* 動態標籤列 */
        .fav-chips-wrapper {
            padding: 6px 2px;
            overflow-x: auto;
            white-space: nowrap;
            display: none; /* 預設隱藏，有資料才顯示 */
            -webkit-overflow-scrolling: touch;
            border-bottom: 1px solid #222;
        }
        .fav-chips-wrapper::-webkit-scrollbar { display: none; }
        .chip {
            display: inline-block;
            padding: 4px 12px;
            margin-right: 8px;
            border-radius: 15px;
            background: #222;
            color: #888;
            font-size: 11px;
            border: 1px solid #333;
            cursor: pointer;
            transition: all 0.2s;
        }
        .chip.active {
            background: rgba(255, 204, 0, 0.15);
            color: var(--ai-gold);
            border-color: var(--ai-gold);
        }

        /* 控制列 */
        .controls-row { display: flex; align-items: center; gap: 4px; background: var(--surface); padding: 6px 8px; border-radius: 4px; position: relative; overflow: hidden; flex-wrap: nowrap; }
        .filter-toggle { display: flex; align-items: center; gap: 3px; font-size: 11px; color: var(--accent); white-space: nowrap; cursor: pointer; }
        .slider-box { flex: 1 1 auto; min-width: 50px; display: flex; align-items: center; gap: 4px; margin: 0 4px; }
        input[type=range] { width: 100%; height: 3px; accent-color: var(--accent); }
        #rank-val { color: #fff; min-width: 45px; font-size: 11px; font-weight: bold; }
        #timer-display { font-family: monospace; color: var(--accent); font-size: 10px; margin-left: auto; }
        #refresh-bar { position: absolute; bottom: 0; left: 0; height: 1.5px; background: var(--accent); width: 0%; }

        /* 熱力圖 */
        .heatmap-container { margin: 10px 0; }
        .heatmap-header {
            font-size: 13px; color: var(--ai-gold); background: #252525;
            padding: 10px 12px; border-radius: 6px; display: flex;
            justify-content: space-between; align-items: center;
            cursor: pointer; border: 1px solid #333;
        }
        .heatmap-grid {
            display: none; grid-template-columns: repeat(5, 1fr);
            gap: 4px; margin-top: 8px; padding: 4px;
        }
        .heatmap-container.open .heatmap-grid { display: grid; }
        .hm-box {
            height: 40px; border-radius: 4px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; cursor: pointer;
            border: 1.5px solid transparent; transition: transform 0.1s;
        }
        .hm-name { font-size: 10px; color: #fff; font-weight: bold; text-align: center; }
        .hm-score { font-size: 9px; color: #fff; opacity: 0.9; }

        /* 表格樣式 */
        table { width: 100%; border-collapse: collapse; table-layout: fixed; margin-top: 5px; }
        th { color: var(--text-dim); font-size: 10px; padding: 8px 2px; border-bottom: 1px solid #333; }
        th:nth-child(1) { text-align: left; width: 45%; } 
        td { padding: 8px 2px; border-bottom: 1px solid #1a1a1a; text-align: right; }
        
        /* 股票名稱與星號 */
        .name-col { text-align: left; overflow: hidden; }
        .stock-info-line { display: flex; align-items: center; gap: 3px; flex-wrap: nowrap; }
        .fav-star-btn { 
            cursor: pointer; font-size: 16px; color: #444; 
            padding-right: 2px; user-select: none;
            transition: transform 0.1s;
        }
        .fav-star-btn.active { color: var(--fav-star); }
        .fav-star-btn:active { transform: scale(1.3); }

        .stock-num { font-size: 10px; color: var(--text-dim); font-family: monospace; }
        .stock-name { font-weight: 500; color: #fff; font-size: 13px; cursor: pointer; text-decoration: underline dotted #444; white-space: nowrap; }
        .stock-id-tag { font-size: 10px; color: var(--accent); font-weight: bold; background: #222; padding: 0 3px; border-radius: 2px; }
        .ai-badge { font-size: 9px; background: var(--ai-gold); color: #000; padding: 1px 3px; border-radius: 3px; font-weight: bold; }
        .mkt-tag { font-size: 8px; padding: 1px 2px; border-radius: 3px; font-weight: bold; }
        .tag-tse { color: #fff; border: 1px solid #555; }
        .tag-otc { color: #ff7fe5; border: 1px solid #ff7fe5; }

        .score-val { font-weight: 700; font-family: 'JetBrains Mono', monospace; font-size: 13px; }
        .score-bar-bg { display: block; width: 100%; height: 2px; background: #222; margin-top: 2px; }
        .score-bar-fill { height: 100%; }
        .rank-strength-container { width: 100%; height: 8px; background: #000; border-radius: 4px; overflow: hidden; border: 1px solid #333; }
        .rank-strength-fill { height: 100%; }

        /* 彈窗 */
        #ai-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); z-index: 2000; justify-content: center; align-items: center;
        }
        .modal-content { background: var(--surface); width: 85%; max-width: 350px; padding: 20px; border-radius: 12px; border: 1px solid var(--ai-gold); }
        .link-btn-group { display: flex; gap: 10px; margin-top: 15px; }
        .link-btn { flex: 1; padding: 12px 5px; text-align: center; border-radius: 8px; text-decoration: none; font-size: 14px; font-weight: bold; color: #fff; }
        .link-news { background: #4285f4; }
        .link-wantgoo { background: #d32f2f; }
    </style>
</head>
<body>

<div id="ai-modal" onclick="closeAI()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h3 id="ai-title" style="color:var(--ai-gold); margin: 0 0 20px 0; text-align: center;">🤖 標題檢索</h3>
        <div class="link-btn-group">
            <a id="link-news" href="#" target="_blank" class="link-btn link-news">題材新聞</a>
            <a id="link-wantgoo" href="#" target="_blank" class="link-btn link-wantgoo">主力籌碼</a>
        </div>
    </div>
</div>

<div class="app-wrapper">
    <div class="sticky-top">
        <div class="mode-header">
            <div class="mode-btn" data-mode="all" onclick="setMode('all')">全部</div>
            <div class="mode-btn" data-mode="up" onclick="setMode('up')">多頭</div>
            <div class="mode-btn" data-mode="down" onclick="setMode('down')">空頭</div>
            <div class="mode-btn" data-mode="strong_buy" onclick="setMode('strong_buy')">🔥強強滾</div>
            <div class="mode-btn" data-mode="ai_long" onclick="setMode('ai_long')">💎AI精選</div>
            <div class="mode-btn" data-mode="fav" onclick="setMode('fav')">★自選股</div>
        </div>
        
        <div class="search-row">
            <input type="text" id="search-input" placeholder="🔍 搜尋代碼、名稱、股期代碼..." oninput="render()">
            <span id="clear-search" onclick="clearSearch()">&times;</span>
        </div>

        <div class="fav-chips-wrapper" id="fav-chips-bar">
            <div id="chips-list">
                <span class="chip active" id="chip-all" onclick="setMode('all')">全部</span>
                <span class="chip" id="chip-fav" onclick="setMode('fav')">⭐ 自選 (<span id="fav-count-text">0</span>)</span>
            </div>
        </div>

        <div class="controls-row">
            <label class="filter-toggle"><input type="checkbox" id="show-tse" checked onchange="render()"> 市</label>
            <label class="filter-toggle"><input type="checkbox" id="show-otc" checked onchange="render()"> 櫃</label>
            <label class="filter-toggle"><input type="checkbox" id="mini-only" onchange="render()"> 小型</label>
            <label class="filter-toggle"><input type="checkbox" id="show-etf" onchange="render()"> ETF</label>
            <label class="filter-toggle" style="border-right: 1px solid #444; padding-right: 6px;">
                <input type="checkbox" id="sort-by-id" onchange="render()"> 股排 </label>
            <div class="slider-box">
                <span id="rank-val">10 名</span>
                <input type="range" id="rank-slider" min="10" max="240" step="10" value="10">
            </div>
            <span id="timer-display">5.0s</span>
            <div id="refresh-bar"></div>
        </div>
    </div>

    <div class="heatmap-container" id="hm-container">
        <div class="heatmap-header" onclick="toggleHeatmap()">
            <span>🔥 市場前 20 強矩陣熱力圖 <small id="hm-count" style="color: var(--text-dim); margin-left: 5px;"></small></span>
            <span class="arrow-icon">▼</span>
        </div>
        <div id="heatmap-grid" class="heatmap-grid"></div>
    </div>

    <table>
        <thead>
            <tr>
                <th onclick="toggleIdSortClick()">市/櫃 代碼/名稱/期</th>
                <th>近月</th>
                <th>遠月</th>
                <th id="th-total" onclick="handleSortClick()">總分 ▼</th>
                <th>排行強弱</th>
            </tr>
        </thead>
        <tbody id="main-table"></tbody>
    </table>

    <div class="bottom-spacer" style="height: 100px;"></div>
</div>

    let currentMode = 'ai_long'; 
    let sortOrder = 'desc'; 
    let isFetching = false;
    let refreshTimer = 0;
    const REFRESH_INTERVAL = 5000;

    async function fetchData() {
        if (isFetching) return;
        isFetching = true;
        try {
            const response = await fetch('https://market-data-api.futures-ai.com/stkfut_tradeinfo/');
            const data = await response.json();
            if (data) {
                cachedData = Object.keys(data).filter(k => stockMap[k]).map(k => {
                    const info = stockMap[k];
                    const total = data[k].near_month + data[k].next_month;
                    return { 
                        id: k, stockNum: info[0], name: info[1], market: info[2] || '市',
                        near: data[k].near_month, far: data[k].next_month, total: total,
                        isLong: total >= 15 && data[k].near_month >= 5 && data[k].next_month >= 0
                    };
                });
                render();
                refreshTimer = 0; 
            }
        } catch (e) { console.error(e); } finally { isFetching = false; }
    }

    function toggleHeatmap() {
        document.getElementById('hm-container').classList.toggle('open');
    }

    function toggleFav(stkId, event) {
        if (event) event.stopPropagation();
        const index = favList.indexOf(stkId);
        if (index > -1) {
            favList.splice(index, 1);
        } else {
            favList.push(stkId);
        }
        localStorage.setItem('my_stkfut_favs', JSON.stringify(favList));
        render();
    }

    function clearSearch() {
        const input = document.getElementById('search-input');
        input.value = '';
        render();
        input.focus();
    }

    function render() {
        const tbody = document.getElementById('main-table');
        const hmGrid = document.getElementById('heatmap-grid');
        const isMiniOnly = document.getElementById('mini-only').checked;
        const isShowEtf = document.getElementById('show-etf').checked;
        const isShowTse = document.getElementById('show-tse').checked;
        const isShowOtc = document.getElementById('show-otc').checked;
        const isSortById = document.getElementById('sort-by-id').checked;
        const searchQuery = document.getElementById('search-input').value.toLowerCase();
        
        document.getElementById('clear-search').style.display = searchQuery ? 'block' : 'none';

        // 更新動態標籤列
        const favBar = document.getElementById('fav-chips-bar');
        const favCountTxt = document.getElementById('fav-count-text');
        if (favList.length > 0) {
            favBar.style.display = 'block';
            favCountTxt.innerText = favList.length;
        } else {
            favBar.style.display = 'none';
        }

        let baseList = [...cachedData];

        // 模式過濾
        if (currentMode === 'ai_long') {
            baseList = baseList.filter(i => i.isLong);
        } else if (currentMode === 'strong_buy') {
            baseList = baseList.filter(i => i.total >= 10 && i.near > 0 && i.far > 0);
        } else if (currentMode === 'up') {
            baseList = baseList.filter(i => i.total > 0);
        } else if (currentMode === 'down') {
            baseList = baseList.filter(i => i.total < 0);
        } else if (currentMode === 'fav') {
            baseList = baseList.filter(i => favList.includes(i.id));
        }

        let filteredList = baseList.filter(i => {
            if (i.market === '市' && !isShowTse) return false;
            if (i.market === '櫃' && !isShowOtc) return false;
            if (!isShowEtf && i.stockNum.startsWith('00')) return false;
            return true;
        });

        // 熱力圖
        let hmFinalList = [];
        if (currentMode === 'all') {
            const topLong = filteredList.filter(i => i.total > 0).sort((a,b) => b.total - a.total).slice(0, 10);
            const topShort = filteredList.filter(i => i.total < 0).sort((a,b) => a.total - b.total).slice(0, 10);
            hmFinalList = [...topLong, ...topShort];
        } else {
            hmFinalList = filteredList.sort((a, b) => Math.abs(b.total) - Math.abs(a.total)).slice(0, 20);
        }

        document.getElementById('hm-count').innerText = `(${hmFinalList.length} 標的)`;
        hmGrid.innerHTML = hmFinalList.map(item => {
            const intensity = Math.min(Math.abs(item.total) / 35, 1);
            let bgColor = item.total >= 0 
                ? `rgba(255, 59, 48, ${0.2 + intensity * 0.8})` 
                : `rgba(52, 199, 89, ${0.2 + intensity * 0.8})`;
            const goldBorder = item.isLong ? 'border-color: var(--ai-gold); border-width: 2px;' : '';
            return `<div class="hm-box" style="background: ${bgColor}; ${goldBorder}" onclick="showAI('${item.stockNum}', '${item.name}')">
                <div class="hm-name">${item.name.replace('期','').replace('小型','小')}</div>
                <div class="hm-score">${Math.round(item.total)}</div>
            </div>`;
        }).join('');

        // 表格
        let tableList = filteredList;
        if (isMiniOnly) tableList = tableList.filter(item => item.name.includes('小型'));
        if (searchQuery) {
            tableList = tableList.filter(i => 
                i.stockNum.includes(searchQuery) || 
                i.name.includes(searchQuery) || 
                i.id.toLowerCase().includes(searchQuery)
            );
        }

        if (isSortById) {
            tableList.sort((a, b) => a.stockNum.localeCompare(b.stockNum));
        } else {
            tableList.sort((a, b) => {
                if (currentMode === 'down') return sortOrder === 'desc' ? a.total - b.total : b.total - a.total;
                return sortOrder === 'desc' ? b.total - a.total : a.total - b.total;
            });
        }

        const displayList = tableList.slice(0, currentRankLimit);
        const currentMax = displayList.length > 0 ? Math.max(...displayList.map(i => Math.abs(i.total))) : 1;
        
        tbody.innerHTML = displayList.map(item => {
            const themeColor = item.total >= 0 ? 'var(--up-red)' : 'var(--down-green)';
            const marketTag = item.market === '櫃' ? `<span class="mkt-tag tag-otc">櫃</span>` : `<span class="mkt-tag tag-tse">市</span>`;
            const isFaved = favList.includes(item.id);
            
            return `<tr>
                <td class="name-col">
                    <div class="stock-info-line">
                        <span class="fav-star-btn ${isFaved?'active':''}" onclick="toggleFav('${item.id}', event)">${isFaved?'★':'☆'}</span>
                        ${marketTag} <span class="stock-num">${item.stockNum}</span>
                        <span class="stock-name" onclick="showAI('${item.stockNum}', '${item.name}')">${item.name}</span>
                        <span class="stock-id-tag">${item.id}</span>
                        ${item.isLong?'<span class="ai-badge">精選</span>':''}
                    </div>
                </td>
                <td><span class="score-val" style="color:${item.near>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(item.near)}</span></td>
                <td><span class="score-val" style="color:${item.far>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(item.far)}</span></td>
                <td>
                    <span class="score-val" style="color:${themeColor}">${Math.round(item.total)}</span>
                    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.min((Math.abs(item.total)/30)*100, 100)}%; background:${themeColor}"></div></div>
                </td>
                <td><div class="rank-strength-container"><div class="rank-strength-fill" style="width:${(Math.abs(item.total)/currentMax)*100}%; background:${themeColor};"></div></div></td>
            </tr>`;
        }).join('');

        // 更新標籤啟動狀態
        document.getElementById('chip-all').classList.toggle('active', currentMode === 'all');
        document.getElementById('chip-fav').classList.toggle('active', currentMode === 'fav');
    }

    function setMode(mode) { 
        currentMode = mode; 
        updateUI(); 
        render(); 
    }
    
    function handleSortClick() { 
        document.getElementById('sort-by-id').checked = false;
        sortOrder = (sortOrder === 'desc' ? 'asc' : 'desc'); 
        updateUI(); render(); 
    }
    function toggleIdSortClick() {
        const c = document.getElementById('sort-by-id');
        c.checked = !c.checked;
        render(); updateUI();
    }
    function updateUI() { 
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
        document.getElementById('th-total').innerText = `總分 ${sortOrder === 'desc' ? '▼' : '▲'}`;
    }
    function showAI(num, name) {
        const pure = name.replace('期','').replace('小型','').trim();
        document.getElementById('ai-title').innerText = `🤖 ${pure} (${num})`;
        document.getElementById('link-news').href = `https://www.google.com/search?q=${num}+${pure}+題材+新聞`;
        document.getElementById('link-wantgoo').href = `https://www.wantgoo.com/stock/${num}`;
        document.getElementById('ai-modal').style.display = 'flex';
    }
    function closeAI() { document.getElementById('ai-modal').style.display = 'none'; }
    document.getElementById('rank-slider').oninput = function() { 
        currentRankLimit = parseInt(this.value); 
        document.getElementById('rank-val').innerText = this.value + ' 名'; 
        render(); 
    };
    setInterval(() => { 
        refreshTimer += 100; 
        document.getElementById('timer-display').innerText = ((REFRESH_INTERVAL - refreshTimer)/1000).toFixed(1) + 's'; 
        document.getElementById('refresh-bar').style.width = (refreshTimer/REFRESH_INTERVAL)*100 + '%'; 
        if (refreshTimer >= REFRESH_INTERVAL) fetchData(); 
    }, 100);
    fetchData();
</script>

    let cachedData = [];
    let currentRankLimit = 10; 
    let currentMode = 'ai_long'; 
    let sortOrder = 'desc'; 
    let isFetching = false;
    let refreshTimer = 0;
    const REFRESH_INTERVAL = 5000;

    async function fetchData() {
        if (isFetching) return;
        isFetching = true;
        try {
            const response = await fetch('https://market-data-api.futures-ai.com/stkfut_tradeinfo/');
            const data = await response.json();
            if (data) {
                cachedData = Object.keys(data).filter(k => stockMap[k]).map(k => {
                    const info = stockMap[k];
                    const total = data[k].near_month + data[k].next_month;
                    return { 
                        id: k, stockNum: info[0], name: info[1], market: info[2] || '市',
                        near: data[k].near_month, far: data[k].next_month, total: total,
                        isLong: total >= 15 && data[k].near_month >= 5 && data[k].next_month >= 0
                    };
                });
                render();
                refreshTimer = 0; 
            }
        } catch (e) { console.error(e); } finally { isFetching = false; }
    }

    function toggleHeatmap() {
        document.getElementById('hm-container').classList.toggle('open');
    }

    function clearSearch() {
        const input = document.getElementById('search-input');
        input.value = '';
        render();
        input.focus();
    }

    function render() {
        const tbody = document.getElementById('main-table');
        const hmGrid = document.getElementById('heatmap-grid');
        const isMiniOnly = document.getElementById('mini-only').checked;
        const isShowEtf = document.getElementById('show-etf').checked;
        const isShowTse = document.getElementById('show-tse').checked;
        const isShowOtc = document.getElementById('show-otc').checked;
        const isSortById = document.getElementById('sort-by-id').checked;
        const searchQuery = document.getElementById('search-input').value.toLowerCase();
        
        document.getElementById('clear-search').style.display = searchQuery ? 'block' : 'none';

        let baseList = [...cachedData];

        if (currentMode === 'ai_long') {
            baseList = baseList.filter(i => i.isLong);
        } else if (currentMode === 'strong_buy') {
            baseList = baseList.filter(i => i.total >= 10 && i.near > 0 && i.far > 0);
        } else if (currentMode === 'up') {
            baseList = baseList.filter(i => i.total > 0);
        } else if (currentMode === 'down') {
            baseList = baseList.filter(i => i.total < 0);
        }

        let filteredList = baseList.filter(i => {
            if (i.market === '市' && !isShowTse) return false;
            if (i.market === '櫃' && !isShowOtc) return false;
            if (!isShowEtf && i.stockNum.startsWith('00')) return false;
            return true;
        });

        // 熱力圖
        let hmFinalList = [];
        if (currentMode === 'all') {
            const topLong = filteredList.filter(i => i.total > 0).sort((a,b) => b.total - a.total).slice(0, 10);
            const topShort = filteredList.filter(i => i.total < 0).sort((a,b) => a.total - b.total).slice(0, 10);
            hmFinalList = [...topLong, ...topShort];
        } else {
            hmFinalList = filteredList.sort((a, b) => Math.abs(b.total) - Math.abs(a.total)).slice(0, 20);
        }

        document.getElementById('hm-count').innerText = `(${hmFinalList.length} 標的)`;
        hmGrid.innerHTML = hmFinalList.map(item => {
            const intensity = Math.min(Math.abs(item.total) / 35, 1);
            let bgColor;
            if (currentMode === 'down') {
                bgColor = `rgba(52, 199, 89, ${0.2 + intensity * 0.8})`; 
            } else if (currentMode === 'up' || currentMode === 'ai_long' || currentMode === 'strong_buy') {
                bgColor = `rgba(255, 59, 48, ${0.2 + intensity * 0.8})`; 
            } else {
                bgColor = item.total >= 0 ? `rgba(255, 59, 48, ${0.2 + intensity * 0.8})` : `rgba(52, 199, 89, ${0.2 + intensity * 0.8})`;
            }

            const goldBorder = item.isLong ? 'border-color: var(--ai-gold); border-width: 2px;' : '';
            return `<div class="hm-box" style="background: ${bgColor}; ${goldBorder}" onclick="showAI('${item.stockNum}', '${item.name}')">
                <div class="hm-name">${item.name.replace('期','').replace('小型','小')}</div>
                <div class="hm-score">${Math.round(item.total)}</div>
            </div>`;
        }).join('');

        // 表格渲染
        let tableList = filteredList;
        if (isMiniOnly) tableList = tableList.filter(item => item.name.includes('小型'));
        if (searchQuery) {
            tableList = tableList.filter(i => 
                i.stockNum.includes(searchQuery) || 
                i.name.includes(searchQuery) || 
                i.id.toLowerCase().includes(searchQuery)
            );
        }

        if (isSortById) {
            tableList.sort((a, b) => a.stockNum.localeCompare(b.stockNum));
        } else {
            tableList.sort((a, b) => {
                if (currentMode === 'down') return sortOrder === 'desc' ? a.total - b.total : b.total - a.total;
                return sortOrder === 'desc' ? b.total - a.total : a.total - b.total;
            });
        }

        const displayList = tableList.slice(0, currentRankLimit);
        const currentMax = displayList.length > 0 ? Math.max(...displayList.map(i => Math.abs(i.total))) : 1;
        
        tbody.innerHTML = displayList.map(item => {
            const themeColor = item.total >= 0 ? 'var(--up-red)' : 'var(--down-green)';
            const marketTag = item.market === '櫃' ? `<span class="mkt-tag tag-otc">櫃</span>` : `<span class="mkt-tag tag-tse">市</span>`;
            return `<tr>
                <td class="name-col">
                    <div class="stock-info-line">
                        ${marketTag} <span class="stock-num">${item.stockNum}</span>
                        <span class="stock-name" onclick="showAI('${item.stockNum}', '${item.name}')">${item.name}</span>
                        <span class="stock-id-tag">${item.id}</span>
                        ${item.isLong?'<span class="ai-badge">精選</span>':''}
                    </div>
                </td>
                <td><span class="score-val" style="color:${item.near>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(item.near)}</span></td>
                <td><span class="score-val" style="color:${item.far>=0?'var(--up-red)':'var(--down-green)'}">${Math.round(item.far)}</span></td>
                <td>
                    <span class="score-val" style="color:${themeColor}">${Math.round(item.total)}</span>
                    <div class="score-bar-bg"><div class="score-bar-fill" style="width:${Math.min((Math.abs(item.total)/30)*100, 100)}%; background:${themeColor}"></div></div>
                </td>
                <td><div class="rank-strength-container"><div class="rank-strength-fill" style="width:${(Math.abs(item.total)/currentMax)*100}%; background:${themeColor};"></div></div></td>
            </tr>`;
        }).join('');
    }

    function setMode(mode) { currentMode = mode; updateUI(); render(); }
    function handleSortClick() { 
        document.getElementById('sort-by-id').checked = false;
        sortOrder = (sortOrder === 'desc' ? 'asc' : 'desc'); 
        updateUI(); render(); 
    }
    function toggleIdSortClick() {
        const c = document.getElementById('sort-by-id');
        c.checked = !c.checked;
        render(); updateUI();
    }
    function updateUI() { 
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === currentMode));
        document.getElementById('th-total').innerText = `總分 ${sortOrder === 'desc' ? '▼' : '▲'}`;
    }
